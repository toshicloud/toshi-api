name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.14
          install_args: --locked
          cache: false

      - name: Generated code is up to date
        run: scripts/check-generated.sh

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Typecheck the TypeScript
        run: |
          cd ts
          npm ci
          npm run typecheck

      - name: Committed lockfiles are up to date
        run: |
          mise lock
          npm --prefix ts install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code
