syntax = "proto3";

// Package toshi.githubcore.v1 is the core's side of the GitHub product's
// calls, for the product's adapter when it runs outside the control plane:
// the store reads and writes the adapter makes for one call it was passed.
package toshi.githubcore.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/githubcorev1";

// GitHubCoreService is served by the control plane to the GitHub product's
// adapter. Every call carries three credentials: the adapter's product
// token as its bearer token; the control plane's forward assertion for the
// call it passed to the adapter, in the Toshi-Forward-Assertion header; and
// the adapter process's instance nonce, in the Toshi-Adapter-Nonce header.
// The assertion's id names the grant the control plane wrote for that
// call, and the grant decides what the adapter may do.
//
// A call fails with PERMISSION_DENIED unless: the token is a live product
// token of the product runners; the assertion verifies, was issued by this
// control plane for the GitHub product's audience and names the product
// runners; the grant is of runners, open, and of the assertion's call; the
// core call is one the grant's call allows; for every call but AdmitGrant,
// the grant was admitted with the call's nonce; and every argument the
// grant binds equals the grant's. The arguments a grant binds are the
// product's: Runners encodes them, and the core reads them only to compare
// them with the call's. The error does not say which rule refused. A
// refusal with a valid product token is recorded in the audit log as
// product.call_refused, with the call and the reason.
//
// Each product call allows AdmitGrant and:
//   - GetJobFailure: GetJob and FillJobFailingStep, for the grant's job;
//   - ListOpenSourceRepos: ListOpenSourceRepositories, for the
//     grant's workspace or none;
//   - SetOpenSourceApproval: SetOpenSourceApproval, for the grant's
//     repository and decision;
//   - MapInstallation: MapInstallation, for the grant's installation and
//     workspace;
//   - CheckSecretDelivery: PublishJobDeliveryCheck, for the grant's check
//     generation.
//
// A write (FillJobFailingStep, SetOpenSourceApproval, MapInstallation,
// PublishJobDeliveryCheck) is done at most once per grant: a repeat
// answers as the first did and changes nothing. A repeat that arrives
// while the first is still running fails with ABORTED. The core records
// the audit events of each write with the grant's caller as actor and
// "product": "runners" in the details.
service GitHubCoreService {
  // AdmitGrant admits the grant to the adapter process whose nonce the
  // call carries, and returns what the grant allows. A grant is admitted
  // once: a second AdmitGrant is refused, whatever its nonce.
  rpc AdmitGrant(AdmitGrantRequest) returns (AdmitGrantResponse) {
    option (toshi.audit) = {action: "none", reason: "It admits an internal grant and changes no state of the workspace."};
  }

  // GetJob returns the job the grant names when the grant's caller may
  // see it. A workspace caller sees only its own workspaces' jobs, of workspaces
  // with at least one GitHub App installation; the operator sees every
  // job. Any other job, or one that does not exist, fails with NOT_FOUND.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // FillJobFailingStep stores the failing step the adapter read from
  // GitHub for the grant's job, a job GetJob shows: only when the job has
  // ended, did not succeed and has no step stored.
  rpc FillJobFailingStep(FillJobFailingStepRequest) returns (FillJobFailingStepResponse) {
    option (toshi.audit) = {action: "none", reason: "It stores a value derived from a job the host already reported; the host's report is the audited change."};
  }

  // ListOpenSourceRepositories lists the open-source gate's rows: for a workspace
  // caller, only rows of its workspaces that have at least one GitHub App
  // installation, and of the named workspace when one is named; for the
  // operator, every row, or the named workspace's, and the kept approvals
  // when no workspace is named. Rows are ordered by workspace, then repository.
  //
  // A page holds 100 repositories when page_size is zero, and 1000 at most.
  rpc ListOpenSourceRepositories(ListOpenSourceRepositoriesRequest) returns (ListOpenSourceRepositoriesResponse);

  // SetOpenSourceApproval approves or revokes a repository on every
  // workspace's row of it, or keeps the decision when no workspace has a row.
  // Revoking a repository that has neither a row nor a kept decision fails
  // with NOT_FOUND. The operator's only.
  rpc SetOpenSourceApproval(SetOpenSourceApprovalRequest) returns (SetOpenSourceApprovalResponse);

  // MapInstallation maps a GitHub App installation to a workspace. An unknown
  // workspace fails with NOT_FOUND and a deleted one with
  // FAILED_PRECONDITION. The operator's only.
  rpc MapInstallation(MapInstallationRequest) returns (MapInstallationResponse) {
    option (toshi.audit) = {action: "installation.mapped"};
  }

  // PublishJobDeliveryCheck publishes the result of the delivery check
  // the grant began. The check's start is the grant's creation. A grant
  // that closed is refused, and a failed close of the grant replaces a
  // result published before it. The operator's only.
  rpc PublishJobDeliveryCheck(PublishJobDeliveryCheckRequest) returns (PublishJobDeliveryCheckResponse) {
    option (toshi.audit) = {action: "secret_delivery.check_published"};
  }
}

// AdmitGrantRequest is empty: the adapter's nonce and its credentials
// travel in the call's headers.
message AdmitGrantRequest {}

// AdmitGrantResponse is what the grant allows: the product call it was
// written for, its caller, and the arguments it binds.
message AdmitGrantResponse {
  // call is the full procedure name of the product call, for example
  // "/toshi.github.v1.GitHubService/GetJobFailure".
  string call = 1;
  // actor_kind and actor_id are the caller as the control plane
  // authenticated it: "operator", "session" or "token", and its id.
  string actor_kind = 2;
  // actor_id is that caller's id: the operator's, a session's or a token's.
  string actor_id = 3;
  // workspaces are the caller's workspaces; empty for the operator.
  repeated string workspaces = 4;
  reserved 5 to 9;
  reserved "job_id", "tenant", "repository", "approved", "installation_id";
  // generation is the delivery check the grant began; 0 for none.
  int64 generation = 10;
  // created_at is when the core wrote the grant, as it passed the call to
  // the adapter.
  google.protobuf.Timestamp created_at = 11;
  // expires_at is when the grant stops being open, a minute after
  // created_at.
  google.protobuf.Timestamp expires_at = 12;
  // args are the call's arguments the grant binds, as the product encoded
  // them: for Runners a GrantArgs in its JSON form, with the
  // proto field names as keys.
  bytes args = 13;
}

// GrantArgs are the arguments a Runners grant binds. The product
// encodes them in a grant's args as JSON with the proto field names as keys,
// and the core decodes them to compare each with the call's; a field the
// call does not bind is left at its zero value.
message GrantArgs {
  // job_id is the job GetJob reads and FillJobFailingStep fills.
  string job_id = 1;
  // workspace is the workspace ListOpenSourceRepositories lists and
  // MapInstallation maps to.
  string workspace = 2;
  // repo is the repository SetOpenSourceApproval sets, as owner/name.
  string repo = 3;
  // approved is the approval SetOpenSourceApproval sets.
  bool approved = 4;
  // installation_id is the installation MapInstallation maps.
  int64 installation_id = 5;
}

// GetJobRequest names the job GetJob reads.
message GetJobRequest {
  // job_id is the Toshi job's ID.
  string job_id = 1;
}

// GetJobResponse holds the job GetJob read.
message GetJobResponse {
  // job is that job.
  Job job = 1;
}

// Job is what the adapter reads of a job.
message Job {
  // id is the Toshi job's ID.
  string id = 1;
  // workspace is the job's workspace id.
  string workspace = 2;
  // repository is the workflow job's repository, owner/name; empty when the
  // job has none recorded.
  string repository = 3;
  // installation_id is the GitHub App installation the workflow job belongs
  // to; 0 when none is recorded.
  int64 installation_id = 4;
  // workflow_job_id is GitHub's id of the workflow job; 0 when none is
  // recorded.
  int64 workflow_job_id = 5;
  // state is the job's state: queued, assigned, starting, running, stopping,
  // debugging, completed, failed or cancelled.
  string state = 6;
  // conclusion is GitHub's conclusion of the job, such as "success",
  // "failure" or "cancelled"; empty until the job ends.
  string conclusion = 7;
  // error is Toshi's reason on a job it refused or stopped, such as
  // "plan_refused: ..."; empty otherwise.
  string error = 8;
  // failing_step is the step that failed: the first GitHub concluded
  // "failure", else "timed_out", else "cancelled"; empty when none did or
  // GitHub has not been read.
  string failing_step = 9;
}

// FillJobFailingStepRequest carries the failing step the adapter read from
// GitHub.
message FillJobFailingStepRequest {
  // job_id is the Toshi job's ID.
  string job_id = 1;
  // step is the failing step's name, as GitHub gives it.
  string step = 2;
}

// FillJobFailingStepResponse is empty: a stored step is the whole answer.
message FillJobFailingStepResponse {}

// ListOpenSourceRepositoriesRequest asks for the open-source gate's rows and
// the approval decisions kept without a row.
message ListOpenSourceRepositoriesRequest {
  // workspace is the workspace whose rows to list; empty for every workspace the
  // caller may see.
  string workspace = 1;
  // The most repositories in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

// ListOpenSourceRepositoriesResponse holds one page of the open-source gate's
// rows, with the kept approvals.
message ListOpenSourceRepositoriesResponse {
  // repositories are the page's rows, ordered by workspace, then
  // repository.
  repeated OpenSourceRepository repositories = 1;
  // Every page holds all of them.
  repeated OpenSourceKeptApproval kept = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// OpenSourceRepository is one workspace's row of the open-source gate.
message OpenSourceRepository {
  // workspace is the workspace the row belongs to.
  string workspace = 1;
  // repository is the repository, owner/name.
  string repository = 2;
  // installation_id is the App installation the last read used; 0 when none
  // was ever read.
  int64 installation_id = 3;
  // found reports whether GitHub returned the repository at the last read.
  bool found = 4;
  // private reports whether GitHub returned the repository as private at the
  // last read.
  bool private = 5;
  // spdx_id is GitHub's licence id; empty when GitHub finds none.
  string spdx_id = 6;
  // repo_created_at is when GitHub created the repository; unset when never
  // read.
  google.protobuf.Timestamp repo_created_at = 7;
  // checked_at is when the repository was last read successfully; unset when
  // never.
  google.protobuf.Timestamp checked_at = 8;
  // attempted_at is when a read was last tried, successful or not; unset
  // when never.
  google.protobuf.Timestamp attempted_at = 9;
  // error is the last read's error; empty when it succeeded or none was
  // tried.
  string error = 10;
  // approval is the operator's decision through the API: "approved",
  // "revoked", or empty while the configuration's approved list decides.
  string approval = 11;
  // approval_changed_at is when approval last changed; unset when never.
  google.protobuf.Timestamp approval_changed_at = 12;
  // fork_pr_approval is the repository's setting for workflows of pull
  // requests from forks, GitHub's approval_policy as last read (such as
  // "all_external_contributors"); empty when never read.
  string fork_pr_approval = 13;
}

// OpenSourceKeptApproval is an approval of a repository no workspace has a
// row of yet.
message OpenSourceKeptApproval {
  // repository is the repository, as owner/name, as the operator gave it.
  string repository = 1;
  // approved_at is when the operator approved it.
  google.protobuf.Timestamp approved_at = 2;
}

// SetOpenSourceApprovalRequest approves or revokes a repository on every
// workspace's row of it.
message SetOpenSourceApprovalRequest {
  // repository is the repository as owner/name, compared without regard to
  // case.
  string repository = 1;
  // approved approves the repository when true and revokes it when false.
  bool approved = 2;
}

// SetOpenSourceApprovalResponse holds the repository's rows, or its kept
// approval, after the change.
message SetOpenSourceApprovalResponse {
  // repositories are the repository's rows after the change; kept is set
  // instead when no workspace has a row and the decision was kept.
  repeated OpenSourceRepository repositories = 1;
  // kept is the approval kept for a repository no workspace had a row of
  // when the call approved it; unset otherwise.
  OpenSourceKeptApproval kept = 2;
}

// MapInstallationRequest maps a GitHub App installation to a workspace.
message MapInstallationRequest {
  // installation_id is the GitHub App installation to map.
  int64 installation_id = 1;
  // workspace is the workspace it is mapped to.
  string workspace = 2;
}

// MapInstallationResponse is empty: the stored mapping is the whole answer.
message MapInstallationResponse {}

// PublishJobDeliveryCheckRequest carries the result of the delivery check the
// grant began.
message PublishJobDeliveryCheckRequest {
  // generation is the check generation the grant began; a call naming
  // another fails with PERMISSION_DENIED.
  int64 generation = 1;
  // result is "ready", "lacking" or "unavailable".
  string result = 2;
  // lacking are the installations without Contents read, for the result
  // "lacking".
  repeated int64 lacking = 3;
}

// PublishJobDeliveryCheckResponse says whether the result was stored.
message PublishJobDeliveryCheckResponse {
  // published is false when a later check began a newer generation,
  // which this result does not replace.
  bool published = 1;
}
