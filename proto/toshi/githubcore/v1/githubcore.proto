syntax = "proto3";

// Package toshi.githubcore.v1 is the core's side of the GitHub product's
// calls, for the product's adapter when it runs outside the control plane:
// the store reads and writes the adapter makes for one call it was passed.
package toshi.githubcore.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/toshicloud/toshi-api/githubcorev1";

// GitHubCoreService is served by the control plane to the GitHub product's
// adapter. Every call carries three credentials: the adapter's product
// token as its bearer token; the control plane's forward assertion for the
// call it passed to the adapter, in the Toshi-Forward-Assertion header; and
// the adapter process's instance nonce, in the Toshi-Adapter-Nonce header.
// The assertion's id names the grant the control plane wrote for that
// call, and the grant decides what the adapter may do.
//
// A call fails with PERMISSION_DENIED unless: the token is a live product
// token of the product github; the assertion verifies, was issued by this
// control plane for the GitHub product's audience and names the product
// github; the grant is of github, open, and of the assertion's call; the
// core call is one the grant's call allows; for every call but AdmitGrant,
// the grant was admitted with the call's nonce; and every argument the
// grant binds equals the grant's. The error does not say which rule
// refused. A refusal with a valid product token is recorded in the audit
// log as product.call_refused, with the call and the reason.
//
// Each product call allows AdmitGrant and:
//   - GetJobFailure: GetJob and FillJobFailingStep, for the grant's job;
//   - ListOpenSourceRepositories: ListOpenSourceRepositories, for the
//     grant's tenant or none;
//   - SetOpenSourceApproval: SetOpenSourceApproval, for the grant's
//     repository and decision;
//   - MapInstallation: MapInstallation, for the grant's installation and
//     tenant;
//   - CheckSecretDelivery: PublishJobDeliveryCheck, for the grant's check
//     generation.
//
// A write (FillJobFailingStep, SetOpenSourceApproval, MapInstallation,
// PublishJobDeliveryCheck) is done at most once per grant: a repeat
// answers as the first did and changes nothing. A repeat that arrives
// while the first is still running fails with ABORTED. The core records
// the audit events of each write with the grant's caller as actor and
// "product": "github" in the details.
service GitHubCoreService {
  // AdmitGrant admits the grant to the adapter process whose nonce the
  // call carries, and returns what the grant allows. A grant is admitted
  // once: a second AdmitGrant is refused, whatever its nonce.
  rpc AdmitGrant(AdmitGrantRequest) returns (AdmitGrantResponse);

  // GetJob returns the job the grant names when the grant's caller may
  // see it. A tenant caller sees only its own tenants' jobs, of tenants
  // with at least one GitHub App installation; the operator sees every
  // job. Any other job, or one that does not exist, fails with NOT_FOUND.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // FillJobFailingStep stores the failing step the adapter read from
  // GitHub for the grant's job, a job GetJob shows: only when the job has
  // ended, did not succeed and has no step stored.
  rpc FillJobFailingStep(FillJobFailingStepRequest) returns (FillJobFailingStepResponse);

  // ListOpenSourceRepositories lists the open-source gate's rows: for a tenant
  // caller, only rows of its tenants that have at least one GitHub App
  // installation, and of the named tenant when one is named; for the
  // operator, every row, or the named tenant's, and the kept approvals
  // when no tenant is named. Rows are ordered by tenant, then repository.
  //
  // A page holds 100 repositories when page_size is zero, and 1000 at most.
  rpc ListOpenSourceRepositories(ListOpenSourceRepositoriesRequest) returns (ListOpenSourceRepositoriesResponse);

  // SetOpenSourceApproval approves or revokes a repository on every
  // tenant's row of it, or keeps the decision when no tenant has a row.
  // The operator's only.
  rpc SetOpenSourceApproval(SetOpenSourceApprovalRequest) returns (SetOpenSourceApprovalResponse);

  // MapInstallation maps a GitHub App installation to a tenant. An unknown
  // tenant fails with NOT_FOUND and a deleted one with
  // FAILED_PRECONDITION. The operator's only.
  rpc MapInstallation(MapInstallationRequest) returns (MapInstallationResponse);

  // PublishJobDeliveryCheck publishes the result of the delivery check
  // the grant began. The check's start is the grant's creation. A grant
  // that closed is refused, and a failed close of the grant replaces a
  // result published before it. The operator's only.
  rpc PublishJobDeliveryCheck(PublishJobDeliveryCheckRequest) returns (PublishJobDeliveryCheckResponse);
}

message AdmitGrantRequest {}

message AdmitGrantResponse {
  // call is the full procedure name of the product call, for example
  // "/toshi.github.v1.GitHubService/GetJobFailure".
  string call = 1;
  // actor_kind and actor_id are the caller as the control plane
  // authenticated it: "operator", "session" or "token", and its id.
  string actor_kind = 2;
  string actor_id = 3;
  // tenants are the caller's tenants; empty for the operator.
  repeated string tenants = 4;
  // job_id, tenant, repository, approved and installation_id are the call's
  // arguments the grant binds.
  string job_id = 5;
  string tenant = 6;
  string repository = 7;
  bool approved = 8;
  int64 installation_id = 9;
  // generation is the delivery check the grant began; 0 for none.
  int64 generation = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp expires_at = 12;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

// Job is what the adapter reads of a job.
message Job {
  string id = 1;
  string tenant = 2;
  string repository = 3;
  int64 installation_id = 4;
  int64 workflow_job_id = 5;
  string state = 6;
  string conclusion = 7;
  string error = 8;
  string failing_step = 9;
}

message FillJobFailingStepRequest {
  string job_id = 1;
  string step = 2;
}

message FillJobFailingStepResponse {}

message ListOpenSourceRepositoriesRequest {
  // tenant is the tenant whose rows to list; empty for every tenant the
  // caller may see.
  string tenant = 1;
  // The most repositories in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListOpenSourceRepositoriesResponse {
  repeated OpenSourceRepository repositories = 1;
  // Every page holds all of them.
  repeated OpenSourceKeptApproval kept = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// OpenSourceRepository is one tenant's row of the open-source gate.
message OpenSourceRepository {
  string tenant = 1;
  string repository = 2;
  int64 installation_id = 3;
  bool found = 4;
  bool private = 5;
  string spdx_id = 6;
  google.protobuf.Timestamp repo_created_at = 7;
  google.protobuf.Timestamp checked_at = 8;
  google.protobuf.Timestamp attempted_at = 9;
  string error = 10;
  string approval = 11;
  google.protobuf.Timestamp approval_changed_at = 12;
  string fork_pr_approval = 13;
}

// OpenSourceKeptApproval is an approval of a repository no tenant has a
// row of yet.
message OpenSourceKeptApproval {
  string repository = 1;
  google.protobuf.Timestamp approved_at = 2;
}

message SetOpenSourceApprovalRequest {
  string repository = 1;
  bool approved = 2;
}

message SetOpenSourceApprovalResponse {
  // repositories are the repository's rows after the change; kept is set
  // instead when no tenant has a row and the decision was kept.
  repeated OpenSourceRepository repositories = 1;
  OpenSourceKeptApproval kept = 2;
}

message MapInstallationRequest {
  int64 installation_id = 1;
  string tenant = 2;
}

message MapInstallationResponse {}

message PublishJobDeliveryCheckRequest {
  int64 generation = 1;
  // result is "ready", "lacking" or "unavailable".
  string result = 2;
  // lacking are the installations without Contents read, for the result
  // "lacking".
  repeated int64 lacking = 3;
}

message PublishJobDeliveryCheckResponse {
  // published is false when a later check began a newer generation,
  // which this result does not replace.
  bool published = 1;
}
