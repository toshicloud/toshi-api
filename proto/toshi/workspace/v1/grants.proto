syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// GrantService keeps the grants between workspaces: one workspace, the
// owner, lets another, the grantee, reach one of its environments,
// sandboxes or previews at a level. The owner offers a grant to the
// grantee's workspace id, and nothing is shared until a person of the
// grantee accepts it. Either side ends it at once: the owner revokes it,
// the grantee leaves it. An offer not answered lapses, and a grant with
// an expiry expires when it passes.
//
// The caller's credential names the workspace, as for WorkloadService.
// Each call answers for the caller's side only: a grant the workspace
// neither gave nor received, or one the call does not act on from the
// caller's side, is NOT_FOUND. Offering, accepting, declining and
// changing the expiry take a person's session: an API token is refused
// with PERMISSION_DENIED, as only a person may open a workspace to
// another. A workspace that is not active can neither offer nor be
// offered a grant (FAILED_PRECONDITION).
//
// Every change writes an audit event into both workspaces' logs, with the
// same request id; each names the other workspace in its details.
service GrantService {
  // CreateGrant offers a grant on the caller's workspace to the workspace
  // grantee_workspace names, and returns it in the state OFFERED. A
  // sandbox with bindings or a state volume is offered at VIEW only:
  // CONNECT or OPERATE for it is FAILED_PRECONDITION. A grantee that is
  // the caller's own workspace is INVALID_ARGUMENT, an environment or
  // sandbox the workspace does not have NOT_FOUND, and an offer on a plan
  // with no grants, or past the plan's grants at once or offers a day,
  // RESOURCE_EXHAUSTED.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "grant.offered"};
  }

  // GetGrant returns one grant the workspace gave or received.
  rpc GetGrant(GetGrantRequest) returns (GetGrantResponse) {
    option (toshi.permission) = "grants.read";
    option (toshi.scope) = "workspace";
  }

  // ListGrants returns the grants the workspace gave, received, or both,
  // newest offered first, in the states the request names (all when it
  // names none).
  //
  // A page holds 100 grants when page_size is zero, and 1000 at most.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse) {
    option (toshi.permission) = "grants.read";
    option (toshi.scope) = "workspace";
  }

  // AcceptGrant accepts an offer the workspace received: the grant becomes
  // ACTIVE. An offer no longer OFFERED is FAILED_PRECONDITION.
  rpc AcceptGrant(AcceptGrantRequest) returns (AcceptGrantResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "grant.accepted"};
  }

  // DeclineGrant declines an offer the workspace received: the grant
  // becomes DECLINED. An offer no longer OFFERED is FAILED_PRECONDITION.
  rpc DeclineGrant(DeclineGrantRequest) returns (DeclineGrantResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "grant.declined"};
  }

  // UpdateGrant sets the fields of grant.id's grant that update_mask
  // names, on a grant the workspace gave that is OFFERED or ACTIVE. The
  // one field it sets is expires_at: a time in the future, or unset for
  // no expiry. An unset update_mask names the fields grant carries. An
  // empty one, an unset one with no expires_at, "*" and a path of another
  // field are INVALID_ARGUMENT. A grant that has ended is FAILED_PRECONDITION.
  rpc UpdateGrant(UpdateGrantRequest) returns (UpdateGrantResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "grant.expiry_changed"
      target: "grant:grant.id"
    };
  }

  // RevokeGrant ends a grant the workspace gave, OFFERED or ACTIVE: it
  // becomes REVOKED, and nothing reaches the target through it again. A
  // token limited to a project or an environment may revoke a grant whose
  // target lies inside its limit. A grant that has ended is returned as it
  // is.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "environment";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Revoke this grant? The access it gives ends now."};
  }

  // LeaveGrant ends a grant the workspace received and accepted: it
  // becomes REVOKED, recorded as ended by the grantee. A grant that has
  // ended is returned as it is; an offer is declined, not left
  // (FAILED_PRECONDITION).
  rpc LeaveGrant(LeaveGrantRequest) returns (LeaveGrantResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "grants.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "grant.revoked"};
    option (toshi.mcp) = {destructive: true};
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Leave this grant? You lose the access it gives, and only its owner can give it back."};
  }
}

// GrantLevel is what a grant lets the grantee do; each level includes the
// one before.
enum GrantLevel {
  // Not a level: a request names VIEW, CONNECT or OPERATE.
  GRANT_LEVEL_UNSPECIFIED = 0;
  // List, get and watch the sandboxes the grant covers; sign in to their
  // previews.
  GRANT_LEVEL_VIEW = 1;
  // Also connect to their endpoints, open forwards and display sessions.
  GRANT_LEVEL_CONNECT = 2;
  // Also run and cancel executions, raise a sandbox's cap within the
  // owner's plan, and expose endpoints and delete the ones it exposed.
  GRANT_LEVEL_OPERATE = 3;
}

// GrantState is where a grant is in its life. OFFERED and ACTIVE are
// live; every other state is final.
enum GrantState {
  // Not a state: a grant is always in one of the others.
  GRANT_STATE_UNSPECIFIED = 0;
  // Offered and not yet answered.
  GRANT_STATE_OFFERED = 1;
  // Accepted: the grantee reaches the target.
  GRANT_STATE_ACTIVE = 2;
  // The grantee declined the offer.
  GRANT_STATE_DECLINED = 3;
  // The offer was not answered in time, or a side stopped being active
  // while it was open.
  GRANT_STATE_LAPSED = 4;
  // The owner revoked it, or the grantee left it.
  GRANT_STATE_REVOKED = 5;
  // Its expiry passed.
  GRANT_STATE_EXPIRED = 6;
  // One of the two workspaces was deleted.
  GRANT_STATE_ENDED = 7;
}

// GrantSide is which of a workspace's grants a list returns.
enum GrantSide {
  // Both the grants it gave and those it received.
  GRANT_SIDE_UNSPECIFIED = 0;
  // The grants it gave, as the owner.
  GRANT_SIDE_GIVEN = 1;
  // The grants it received, as the grantee.
  GRANT_SIDE_RECEIVED = 2;
}

// Grant is one workspace's grant to another. Both sides read the same
// message.
message Grant {
  // Assigned by the server.
  string id = 1;
  // The workspace that gave it.
  GrantWorkspace owner = 2;
  // The workspace it was given to.
  GrantWorkspace grantee = 3;
  // What it covers, in the owner's workspace.
  oneof target {
    // Every sandbox of one environment.
    GrantEnvironmentTarget environment = 4;
    // One sandbox.
    GrantSandboxTarget sandbox = 5;
    // One preview of one sandbox, at VIEW only.
    GrantPreviewTarget preview = 6;
  }
  // The level it is granted at.
  GrantLevel level = 7;
  // Where it is in its life.
  GrantState state = 8;
  // Who offered it, as the audit log names them.
  string offered_by = 9;
  // When it was offered.
  google.protobuf.Timestamp offered_at = 10;
  // When an offer not answered lapses.
  google.protobuf.Timestamp lapses_at = 11;
  // Unset until it is accepted.
  google.protobuf.Timestamp accepted_at = 12;
  // Unset until something reaches the target through it.
  google.protobuf.Timestamp last_used_at = 13;
  // Unset when it has no expiry.
  google.protobuf.Timestamp expires_at = 14;
  // Unset while it is live.
  google.protobuf.Timestamp ended_at = 15;
  // Who ended it: "owner", "grantee" or "system"; empty while it is live.
  string ended_by = 16;
}

// SharedAccess is what a grant gives the grantee on one sandbox.
message SharedAccess {
  // The grant the sandbox was read through.
  string grant_id = 1;
  // The grant's level.
  GrantLevel grant_level = 2;
  // The level on this sandbox: the grant's, or VIEW for a sandbox with
  // bindings or a state volume, or while the owner's workspace is
  // suspended.
  GrantLevel level = 3;
  // The workspace that owns the sandbox.
  GrantWorkspace owner = 4;
}

// GrantWorkspace is one side of a grant.
message GrantWorkspace {
  // The workspace's id.
  string id = 1;
  // Empty once the workspace is deleted.
  string name = 2;
}

// GrantEnvironmentTarget covers every sandbox of one environment.
message GrantEnvironmentTarget {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
}

// GrantSandboxTarget covers one sandbox.
message GrantSandboxTarget {
  // The sandbox's id.
  string sandbox_id = 1;
  // The sandbox's project and environment, set by the server.
  string project = 2;
  // The sandbox's environment, set by the server.
  string environment = 3;
}

// GrantPreviewTarget covers one preview of one sandbox.
message GrantPreviewTarget {
  // The sandbox's id.
  string sandbox_id = 1;
  // The endpoint whose preview it covers: `preview` for the sandbox's own
  // hostname, or another of its http endpoints.
  string endpoint = 2;
  // The sandbox's project and environment, set by the server.
  string project = 3;
  // The sandbox's environment, set by the server.
  string environment = 4;
}

// CreateGrantRequest offers a grant on the caller's workspace.
message CreateGrantRequest {
  // The id of the workspace the grant is offered to.
  string grantee_workspace = 1;
  // What it covers, in the caller's workspace.
  oneof target {
    // Every sandbox of one environment.
    GrantEnvironmentTarget environment = 2;
    // One sandbox.
    GrantSandboxTarget sandbox = 3;
    // One preview of one sandbox, at VIEW only.
    GrantPreviewTarget preview = 4;
  }
  // VIEW for a preview.
  GrantLevel level = 5;
  // Unset for no expiry.
  google.protobuf.Timestamp expires_at = 6;
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the first answer; a different request with the
  // same key is refused. Keys are kept for 30 days by default.
  string request_key = 7;
}

// CreateGrantResponse carries the grant CreateGrant offered.
message CreateGrantResponse {
  // The grant, in OFFERED.
  Grant grant = 1;
}

// GetGrantRequest names the grant GetGrant returns.
message GetGrantRequest {
  // The grant's id.
  string id = 1;
}

// GetGrantResponse carries the grant GetGrant returned.
message GetGrantResponse {
  // The grant, of either side.
  Grant grant = 1;
}

// ListGrantsRequest selects the grants ListGrants returns.
message ListGrantsRequest {
  // Which grants to list: given, received or both.
  GrantSide side = 1;
  // The states to list; empty lists every state.
  repeated GrantState states = 2;
  // The most grants in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

// ListGrantsResponse carries one page of grants, newest offered first.
message ListGrantsResponse {
  // The grants of the page.
  repeated Grant grants = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// AcceptGrantRequest names the offer AcceptGrant accepts.
message AcceptGrantRequest {
  // The grant's id.
  string id = 1;
}

// AcceptGrantResponse carries the grant AcceptGrant accepted.
message AcceptGrantResponse {
  // The grant, now ACTIVE.
  Grant grant = 1;
}

// DeclineGrantRequest names the offer DeclineGrant declines.
message DeclineGrantRequest {
  // The grant's id.
  string id = 1;
}

// DeclineGrantResponse carries the grant DeclineGrant declined.
message DeclineGrantResponse {
  // The grant, now DECLINED.
  Grant grant = 1;
}

// UpdateGrantRequest sets a grant's expiry.
message UpdateGrantRequest {
  // id names the grant; expires_at is the one field set.
  Grant grant = 1;
  // The fields to set: expires_at, and no other. An unset mask sets
  // expires_at when grant carries it.
  google.protobuf.FieldMask update_mask = 2;
}

// UpdateGrantResponse carries the grant UpdateGrant changed.
message UpdateGrantResponse {
  // The grant, with its new expiry.
  Grant grant = 1;
}

// RevokeGrantRequest names the grant RevokeGrant ends.
message RevokeGrantRequest {
  // The grant's id.
  string id = 1;
}

// RevokeGrantResponse carries the grant RevokeGrant ended.
message RevokeGrantResponse {
  // The grant, now REVOKED and ended by the owner, or as it was if it had
  // already ended.
  Grant grant = 1;
}

// LeaveGrantRequest names the grant LeaveGrant ends.
message LeaveGrantRequest {
  // The grant's id.
  string id = 1;
}

// LeaveGrantResponse carries the grant LeaveGrant ended.
message LeaveGrantResponse {
  // The grant, now REVOKED and ended by the grantee, or as it was if it
  // had already ended.
  Grant grant = 1;
}
