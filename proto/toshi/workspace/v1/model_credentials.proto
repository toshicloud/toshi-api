syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// ModelCredentialService keeps the workspace's model credentials: what its
// workloads use to reach a model provider. A credential is a key or a
// subscription sign-in. A key credential is a key of a project's secrets,
// an environment's or the shared set's, marked with its provider. A sign-in
// credential is a provider subscription the control plane holds and renews
// for a person. Neither kind's value ever enters a guest: no workload
// receives it in its environment, and no call returns it.
//
// A credential is the workspace's or one person's own. The workspace's
// serve every workload its key's place reaches; a person's own serve only
// the workloads that person starts, while the person holds a role in the
// workspace, as a person's own secret does. A key credential is the
// workspace's unless the request asks for the caller's own; a sign-in is
// the caller's own unless the request asks for the workspace's.
//
// A member makes these calls for their own credentials with membership
// alone. A workspace credential needs model_credentials.read to be seen
// and model_credentials.write to be created, changed or deleted; without
// the permission, a call on a workspace credential fails with
// PERMISSION_DENIED and the reason PERMISSION_MISSING. No caller sees
// another person's own credential: it is NOT_FOUND.
service ModelCredentialService {
  // CreateModelCredential adds a key credential for one provider. The
  // request names the key's place, its project and either its environment
  // or shared, and the key's name. With value, the call writes the value
  // as the key's next version first, as PutSecret does; without it, the
  // key must exist. A key that already serves a credential fails with
  // ALREADY_EXISTS, and so does a second credential of the same name and
  // owner.
  rpc CreateModelCredential(CreateModelCredentialRequest) returns (CreateModelCredentialResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }
  // GetModelCredential returns one credential, never its value.
  rpc GetModelCredential(GetModelCredentialRequest) returns (GetModelCredentialResponse) {
    option (toshi.permission) = "model_credentials.read";
    option (toshi.own) = true;
  }
  // ListModelCredentials returns the caller's own credentials and, with
  // model_credentials.read, the workspace's, by name.
  //
  // A page holds 100 credentials when page_size is zero, and 1000 at most.
  rpc ListModelCredentials(ListModelCredentialsRequest) returns (ListModelCredentialsResponse) {
    option (toshi.permission) = "model_credentials.read";
    option (toshi.own) = true;
  }
  // UpdateModelCredential sets the fields update_mask names: name, owner,
  // or both. owner is the caller's user id, to make the credential the
  // caller's own, or empty, to make it the workspace's; any other person
  // is INVALID_ARGUMENT. Changing the owner moves the key to the matching
  // keys of the same place, in one write. "*" and a path of any other
  // field are INVALID_ARGUMENT.
  rpc UpdateModelCredential(UpdateModelCredentialRequest) returns (UpdateModelCredentialResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.audit) = {target: "model_credential:model_credential.id"};
  }
  // DeleteModelCredential signs the credential out: it removes the
  // credential and its key, with every version, in one write.
  rpc DeleteModelCredential(DeleteModelCredentialRequest) returns (DeleteModelCredentialResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this model credential? Its key is deleted with every version."};
  }
  // ListModelSignInProviders returns every provider a credential may serve,
  // in a stable order, with how the deployment offers its sign-in:
  // "held" when the control plane keeps and renews the grant, "volume" when
  // the person's own login stays on their volume, or "key" when only an API
  // key is offered. available is true only for a provider whose sign-in the
  // deployment holds.
  rpc ListModelSignInProviders(ListModelSignInProvidersRequest) returns (ListModelSignInProvidersResponse) {
    option (toshi.permission) = "model_credentials.read";
    option (toshi.own) = true;
  }
  // StartModelSignIn signs a person in to a provider's subscription and
  // streams what the sign-in asks of them: the prompt to show, progress
  // while it waits, and last either the signed-in credential or the reason
  // it failed. The request names the credential as CreateModelCredential
  // does; signing in with the name of an existing credential replaces its
  // grant and keeps its id. A provider whose sign-in the deployment does
  // not hold fails with FAILED_PRECONDITION, whatever the reason.
  rpc StartModelSignIn(StartModelSignInRequest) returns (stream StartModelSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.scope) = "environment";
    option (toshi.audit) = {action: "model_credential.sign_in_started", target: "none"};
    option (toshi.mcp) = {idempotent: false, exclude: true};
  }
  // CompleteModelSignIn answers a sign-in whose prompt asks for a code, as a
  // paste-code provider does. The id is the one the prompt carried and the
  // code is the one the provider's page showed.
  rpc CompleteModelSignIn(CompleteModelSignInRequest) returns (CompleteModelSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.audit) = {action: "model_credential.sign_in_completed", target: "model_sign_in:sign_in_id"};
    option (toshi.mcp) = {exclude: true};
  }
  // CancelModelSignIn ends a sign-in whose prompt it has shown.
  rpc CancelModelSignIn(CancelModelSignInRequest) returns (CancelModelSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.audit) = {action: "model_credential.sign_in_cancelled", target: "model_sign_in:sign_in_id"};
    option (toshi.mcp) = {exclude: true};
  }
}

// ModelCredentialKind is what a model credential holds.
enum ModelCredentialKind {
  MODEL_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // A provider's API key, kept as a key of a project's secrets.
  MODEL_CREDENTIAL_KIND_KEY = 1;
  // A provider subscription sign-in the control plane holds and renews.
  MODEL_CREDENTIAL_KIND_SIGN_IN = 2;
}

// ModelCredentialState is where a sign-in credential stands. Unset for a key.
enum ModelCredentialState {
  MODEL_CREDENTIAL_STATE_UNSPECIFIED = 0;
  // The credential holds a grant the control plane can use.
  MODEL_CREDENTIAL_STATE_SIGNED_IN = 1;
  // The provider refused the grant, or it expired: the person signs in
  // again.
  MODEL_CREDENTIAL_STATE_NEEDS_SIGN_IN = 2;
}

// ModelCredential is a credential as anyone may see it: never its value.
message ModelCredential {
  // "mcr-" and 26 characters, given by the control plane.
  string id = 1;
  // 1 to 64 characters: lowercase letters, digits and "-", starting with
  // a letter. Unique among the workspace's credentials, and among each
  // person's own.
  string name = 2;
  // The model provider: "anthropic", "openai", "kimi", "mistral", "xai" or
  // "gemini".
  string provider = 3;
  ModelCredentialKind kind = 4;
  // The user id of the person whose own credential it is; empty for the
  // workspace's.
  string owner = 5;
  // The credential is the caller's own.
  bool mine = 6;
  // The credential's owner holds no role in the workspace any more: no
  // workload receives it, and it stays until it is deleted.
  bool owner_left = 7;
  // The key's place: its project and either its environment or shared.
  string project = 8;
  // Empty for the shared set.
  string environment = 9;
  bool shared = 10;
  // The key's name in that place.
  string secret = 11;
  google.protobuf.Timestamp created_at = 12;
  // The user id of the person who added it.
  string created_by = 13;
  // A sign-in's state; unset for a key.
  ModelCredentialState state = 14;
  // Why a sign-in needs a new sign-in, such as "refresh_refused"; empty
  // otherwise.
  string state_reason = 15;
  // When the state last changed; unset for a key.
  google.protobuf.Timestamp state_at = 16;
  // When the provider's access token expires; unset when it does not, and
  // for a key.
  google.protobuf.Timestamp token_expires_at = 17;
  // When a workload last used the credential; unset when none has, and for
  // a key.
  google.protobuf.Timestamp last_used_at = 18;
  // A display label of the signed-in account, such as its address; empty
  // for a key.
  string account = 19;
}

// ModelCredentialDefault names the workspace credential a workload gets for
// a provider when it binds none and its starter has no own credential for
// that provider.
message ModelCredentialDefault {
  // "anthropic", "openai", "kimi", "mistral", "xai" or "gemini"; one default
  // per provider.
  string provider = 1;
  // The credential's ID. Only a workspace credential may be a default.
  string model_credential = 2;
}

message CreateModelCredentialRequest {
  string name = 1;
  string provider = 2;
  // The key's place: the project and either environment or shared. A
  // request that names both, or neither, is INVALID_ARGUMENT.
  string project = 3;
  string environment = 4;
  bool shared = 5;
  // The key's name, as PutSecret takes it.
  string secret = 6;
  // When set, the key's next version; never returned.
  bytes value = 7;
  // The credential is the caller's own; a call that acts for no person
  // fails with FAILED_PRECONDITION.
  bool own = 8;
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the first answer; a different request with the
  // same key is refused. Keys are kept for 30 days by default.
  string request_key = 9;
}

message CreateModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message GetModelCredentialRequest {
  string id = 1;
}

message GetModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message ListModelCredentialsRequest {
  // Only this provider's credentials when set.
  string provider = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListModelCredentialsResponse {
  repeated ModelCredential model_credentials = 1;
  string next_page_token = 2;
}

message UpdateModelCredentialRequest {
  // id names the credential; the fields update_mask names carry the new
  // values.
  ModelCredential model_credential = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message DeleteModelCredentialRequest {
  string id = 1;
}

message DeleteModelCredentialResponse {}

message ListModelSignInProvidersRequest {}

// ModelSignInProvider is how a deployment offers one provider's sign-in.
message ModelSignInProvider {
  // "anthropic", "openai", "kimi", "mistral", "xai" or "gemini".
  string provider = 1;
  // "held", "volume" or "key".
  string mechanism = 2;
  // The deployment offers a held sign-in for this provider.
  bool available = 3;
  // The provider's own product name as it writes it, for example "OpenAI";
  // set for every listed provider, whether or not it has a sign-in.
  string display_name = 4;
}

message ListModelSignInProvidersResponse {
  // Every provider a credential may serve, in a stable order.
  repeated ModelSignInProvider providers = 1;
}

message StartModelSignInRequest {
  // The provider to sign in to, one of the six a credential may serve.
  string provider = 1;
  // The credential's name. Signing in again with the name of an existing
  // credential replaces its grant and keeps its id.
  string name = 2;
  // The credential's place: the project and exactly one of environment or
  // shared, as CreateModelCredential takes them.
  string project = 3;
  string environment = 4;
  bool shared = 5;
  // The credential is the caller's own; true when unset.
  optional bool own = 6;
}

// StartModelSignInResponse is one sign-in's stream: the prompt, progress
// while it waits, and last either the signed-in credential or the failure.
message StartModelSignInResponse {
  oneof event {
    // What to show the person: the page to open and, when the provider
    // asks for one, the code to enter there.
    Prompt prompt = 1;
    // The sign-in is still waiting, or the provider asked it to slow down.
    Progress progress = 2;
    // Last, when the sign-in succeeded: the credential, signed in.
    ModelCredential done = 3;
    // Last, when it failed.
    Failure failed = 4;
  }
}

// Prompt is what a sign-in asks the person to open and enter.
message Prompt {
  // The sign-in's id, for CompleteModelSignIn and CancelModelSignIn.
  string sign_in_id = 1;
  // The page to open in a browser.
  string url = 2;
  // The code to enter on that page, for a provider whose sign-in shows one.
  string user_code = 3;
  // When the prompt stops working.
  google.protobuf.Timestamp expires_at = 4;
  // The provider needs a code from that page, entered with
  // CompleteModelSignIn.
  bool needs_code = 5;
}

// Progress reports a sign-in that is still under way.
message Progress {
  // "waiting" or "slow_down", the provider's answer to the latest poll.
  string status = 1;
}

// Failure is why a sign-in ended without a credential.
message Failure {
  // "denied", "expired", "provider_error" or "not_offered".
  string reason = 1;
  // One line of detail from the provider; never a token.
  string detail = 2;
}

message CompleteModelSignInRequest {
  // From the sign-in's prompt.
  string sign_in_id = 1;
  // The code the provider's page showed.
  string code = 2;
}

message CompleteModelSignInResponse {}

message CancelModelSignInRequest {
  // From the sign-in's prompt.
  string sign_in_id = 1;
}

message CancelModelSignInResponse {}
