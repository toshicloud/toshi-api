syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// ModelCredentialService keeps the workspace's model credentials: the keys
// its workloads use to reach a model provider. A key credential is a key
// of a project's secrets, an environment's or the shared set's, marked
// with its provider. A marked key never enters a guest: no workload
// receives it in its environment, and no call returns its value.
//
// A credential is the workspace's or one person's own. The workspace's
// serve every workload its key's place reaches; a person's own serve only
// the workloads that person starts, while the person holds a role in the
// workspace, as a person's own secret does. A key credential is the
// workspace's unless the request asks for the caller's own.
//
// A member makes these calls for their own credentials with membership
// alone. A workspace credential needs model_credentials.read to be seen
// and model_credentials.write to be created, changed or deleted; without
// the permission, a call on a workspace credential fails with
// PERMISSION_DENIED and the reason PERMISSION_MISSING. No caller sees
// another person's own credential: it is NOT_FOUND.
service ModelCredentialService {
  // CreateModelCredential adds a key credential for one provider. The
  // request names the key's place, its project and either its environment
  // or shared, and the key's name. With value, the call writes the value
  // as the key's next version first, as PutSecret does; without it, the
  // key must exist. A key that already serves a credential fails with
  // ALREADY_EXISTS, and so does a second credential of the same name and
  // owner.
  rpc CreateModelCredential(CreateModelCredentialRequest) returns (CreateModelCredentialResponse) {
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }
  // GetModelCredential returns one credential, never its value.
  rpc GetModelCredential(GetModelCredentialRequest) returns (GetModelCredentialResponse) {
    option (toshi.permission) = "model_credentials.read";
    option (toshi.own) = true;
  }
  // ListModelCredentials returns the caller's own credentials and, with
  // model_credentials.read, the workspace's, by name.
  //
  // A page holds 100 credentials when page_size is zero, and 1000 at most.
  rpc ListModelCredentials(ListModelCredentialsRequest) returns (ListModelCredentialsResponse) {
    option (toshi.permission) = "model_credentials.read";
    option (toshi.own) = true;
  }
  // UpdateModelCredential sets the fields update_mask names: name, owner,
  // or both. owner is the caller's user id, to make the credential the
  // caller's own, or empty, to make it the workspace's; any other person
  // is INVALID_ARGUMENT. Changing the owner moves the key to the matching
  // keys of the same place, in one write. "*" and a path of any other
  // field are INVALID_ARGUMENT.
  rpc UpdateModelCredential(UpdateModelCredentialRequest) returns (UpdateModelCredentialResponse) {
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
    option (toshi.audit) = {target: "model_credential:model_credential.id"};
  }
  // DeleteModelCredential signs the credential out: it removes the
  // credential and its key, with every version, in one write.
  rpc DeleteModelCredential(DeleteModelCredentialRequest) returns (DeleteModelCredentialResponse) {
    option (toshi.permission) = "model_credentials.write";
    option (toshi.own) = true;
  }
}

// ModelCredentialKind is what a model credential holds.
enum ModelCredentialKind {
  MODEL_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // A provider's API key, kept as a key of a project's secrets.
  MODEL_CREDENTIAL_KIND_KEY = 1;
}

// ModelCredential is a credential as anyone may see it: never its value.
message ModelCredential {
  // "mcr-" and 26 characters, given by the control plane.
  string id = 1;
  // 1 to 64 characters: lowercase letters, digits and "-", starting with
  // a letter. Unique among the workspace's credentials, and among each
  // person's own.
  string name = 2;
  // The model provider: "anthropic", "openai", "kimi", "mistral", "xai" or
  // "gemini".
  string provider = 3;
  ModelCredentialKind kind = 4;
  // The user id of the person whose own credential it is; empty for the
  // workspace's.
  string owner = 5;
  // The credential is the caller's own.
  bool mine = 6;
  // The credential's owner holds no role in the workspace any more: no
  // workload receives it, and it stays until it is deleted.
  bool owner_left = 7;
  // The key's place: its project and either its environment or shared.
  string project = 8;
  // Empty for the shared set.
  string environment = 9;
  bool shared = 10;
  // The key's name in that place.
  string secret = 11;
  google.protobuf.Timestamp created_at = 12;
  // The user id of the person who added it.
  string created_by = 13;
}

// ModelCredentialDefault names the workspace credential a workload gets for
// a provider when it binds none and its starter has no own credential for
// that provider.
message ModelCredentialDefault {
  // "anthropic", "openai", "kimi", "mistral", "xai" or "gemini"; one default
  // per provider.
  string provider = 1;
  // The credential's ID. Only a workspace credential may be a default.
  string model_credential = 2;
}

message CreateModelCredentialRequest {
  string name = 1;
  string provider = 2;
  // The key's place: the project and either environment or shared. A
  // request that names both, or neither, is INVALID_ARGUMENT.
  string project = 3;
  string environment = 4;
  bool shared = 5;
  // The key's name, as PutSecret takes it.
  string secret = 6;
  // When set, the key's next version; never returned.
  bytes value = 7;
  // The credential is the caller's own; a call that acts for no person
  // fails with FAILED_PRECONDITION.
  bool own = 8;
}

message CreateModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message GetModelCredentialRequest {
  string id = 1;
}

message GetModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message ListModelCredentialsRequest {
  // Only this provider's credentials when set.
  string provider = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListModelCredentialsResponse {
  repeated ModelCredential model_credentials = 1;
  string next_page_token = 2;
}

message UpdateModelCredentialRequest {
  // id names the credential; the fields update_mask names carry the new
  // values.
  ModelCredential model_credential = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateModelCredentialResponse {
  ModelCredential model_credential = 1;
}

message DeleteModelCredentialRequest {
  string id = 1;
}

message DeleteModelCredentialResponse {}
