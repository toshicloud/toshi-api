syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// AuditEventService reads the workspace's audit log: what its members, its
// tokens, the operator and the control plane did in it.
//
// A workspace's API token acts on its own workspace; a dashboard session
// names one of its workspaces in the Toshi-Workspace header. A
// token limited to a project or an environment is refused with
// PERMISSION_DENIED. A suspended workspace reads its audit log, and so does
// a closed one during its read-only period.
service AuditEventService {
  // ListAuditEvents returns the workspace's audit events that match every
  // filter field that is set, newest first.
  //
  // A page holds 100 events when page_size is zero, and 1000 at most.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option (toshi.permission) = "audit.read";
  }

  // ExportAuditEvents streams the audit log as JSON lines, oldest first,
  // without a row cap. The first line is {"header":{"since":...,"until":...,
  // "retention_boundary":...|null,"crossed":true|false}}, followed by one
  // AuditEvent per line. The plan must include audit export or the call fails
  // with PERMISSION_DENIED.
  //
  // Since is required; until defaults to now. Since must be before until,
  // else INVALID_ARGUMENT. A cursor from a previous response resumes after
  // its last row, sending the header again. A malformed cursor or one from
  // another range fails with INVALID_ARGUMENT; a resume cursor at or behind
  // the retention boundary fails with OUT_OF_RANGE. When resuming without an
  // until, the cursor keeps the original range's until.
  rpc ExportAuditEvents(ExportAuditEventsRequest) returns (stream ExportAuditEventsResponse) {
    option (toshi.permission) = "audit.read";
    option (toshi.audit) = {
      action: "audit_events.exported"
      target: "workspace:workspace"
    };
  }
}

// AuditEvent is one append-only audit log entry.
message AuditEvent {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // operator, session, token, workload, product, system or webhook.
  string actor_kind = 3;
  // The session's user id, which stays the same across renames and identity
  // providers; the API or product token's id (never its value); the workload
  // as "<kind>:<id>"; or a system or webhook source name.
  string actor_id = 4;
  string action = 5;
  // A "<kind>:<id>" string such as job:..., host:..., token:... or
  // filler:....
  string target = 6;
  // A JSON object whose keys depend on the action.
  string details_json = 7;
  string request_id = 8;
  // The permission the call needed, for an event a Workspace API call
  // records; empty otherwise.
  string permission = 9;
  // Where the call acted, as "project:<id>" or
  // "project:<id>/environment:<id>"; empty for the whole workspace and for
  // an event no call records.
  string scope = 10;
  // "ok", or the reason the call was refused: PERMISSION_MISSING,
  // OUTSIDE_LIMIT or PRODUCT_UNAVAILABLE.
  // Empty for an event no call records.
  string outcome = 11;
  // The id of the token the call was made with (never its value); empty for
  // a session and for an event no call records.
  string token_id = 12;
  // A session actor's login or name as it was when the event was recorded;
  // empty for the other actors, and once the workspace is purged.
  string actor_name = 13;
}

// ListAuditEventsRequest selects the audit events to return.
message ListAuditEventsRequest {
  // Only this action; empty matches every action.
  string action = 1;
  // Only events at or after this time; unset is unbounded.
  google.protobuf.Timestamp since = 2;
  // The most events in one page; zero lets the server choose.
  int32 page_size = 3;
  // Only events whose actor_id is exactly this: the id without the kind (a
  // token id, a GitHub login or user id, a source name). Empty matches
  // every actor.
  string actor = 4;
  // Only events whose action is one of these; empty matches every action.
  // Setting both action and actions fails with INVALID_ARGUMENT, and so do
  // an empty entry and more than 100 entries.
  repeated string actions = 5;
  // Only events whose target is exactly this, in full: "<kind>:<id>", for
  // example "job:<id>". Empty matches every target.
  string target = 6;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 7;
  // Only the events of calls with this outcome: "ok", or the reason a call
  // was refused, such as PERMISSION_MISSING. Empty matches every event, a
  // call's or not.
  string outcome = 8;
}

message ListAuditEventsResponse {
  // Newest first.
  repeated AuditEvent events = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message ExportAuditEventsRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  string cursor = 3;
}

message ExportAuditEventsResponse {
  bytes data = 1;
  string cursor = 2;
}
