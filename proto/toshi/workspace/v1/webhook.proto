syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// WebhookService manages a workspace's webhooks: the URLs its
// events are POSTed to, signed per Standard Webhooks. The caller's credential
// names the workspace, as for WorkloadService. A webhook belongs to the
// workspace, not to an environment, and is owed the events of every
// project unless its project names one. A webhook of another workspace
// is NOT_FOUND.
//
// Every mutating call takes a request_key, with WorkloadService's rule: a
// retry with the same key and the same payload returns what the first
// call returned and changes nothing; the same key with a different payload
// fails with FAILED_PRECONDITION; an empty key means no retry protection.
//
// A webhook's signing secret is in the answer to the call that made it,
// CreateWebhook or RotateWebhookSecret, and in no other
// answer. A retry of that call returns the same secret while it is the
// webhook's newest; once the webhook is rotated again or deleted, the
// retry fails with FAILED_PRECONDITION and changes nothing.
service WebhookService {
  // CreateWebhook makes a webhook and its signing secret. The
  // webhook is owed the events written after it, from its cursor on. The
  // control plane must hold a keyring to seal the secret; without one the
  // call fails with FAILED_PRECONDITION.
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "webhooks.write";
    option (toshi.scope) = "workspace";
  }

  // GetWebhook returns one webhook. An unknown ID fails with
  // NOT_FOUND.
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse) {
    option (toshi.permission) = "webhooks.read";
  }

  // ListWebhooks returns the workspace's webhooks in ID order.
  //
  // A page holds 100 webhooks when page_size is zero, and 1000 at most.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (toshi.permission) = "webhooks.read";
  }

  // UpdateWebhook sets the fields update_mask names: url, events,
  // project, enabled, cursor. A cursor must be at or after the retention boundary's
  // sequence and at or before the workspace's newest event sequence.
  // A disabled webhook is owed no new event and no try starts;
  // the events written before the disable stay owed, enabling it again
  // owes none written while it was disabled, and a try already under way
  // finishes within its claim, which holds a delivery for one minute.
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "webhooks.write";
  }

  // DeleteWebhook deletes a webhook and its deliveries.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "webhooks.write";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this webhook? No more deliveries go to it, and its queued deliveries, their history and its secrets are deleted."};
  }

  // RotateWebhookSecret makes the webhook a new signing secret and
  // returns it. For the next 24 hours each try that starts after the
  // rotation is signed with the new secret and the one it replaced, so a
  // receiver can move to the new one in that window; after it, with the
  // new one only. A try under way when the rotation is made is signed with
  // the replaced secret alone. A rotation while the
  // previous secret's window is still open fails with FAILED_PRECONDITION.
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "webhooks.write";
    option (toshi.audit) = {action: "webhook.secret_rotated"};
    option (toshi.mcp) = {destructive: true};
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Rotate this webhook's secret? The current secret signs beside the new one for 24 hours, then only the new one does."};
  }

  // ListWebhookDeliveries returns a webhook's deliveries in event order,
  // a page at a time.
  //
  // A page holds 50 deliveries when page_size is zero, and 500 at most.
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse) {
    option (toshi.permission) = "webhooks.read";
  }

  // ReplayWebhookEvents makes the webhook owed again the events after
  // cursor that its filter keeps now, up to its own cursor, at most 500 per
  // call. That includes events delivered or given up before, events written
  // while it was disabled and events written before it was made. Each is
  // due now and tried on the retry schedule from its first try; an event
  // still pending at the webhook is left as it is. A workload's events stay
  // one at a time at the webhook: an older event sent again is not due
  // before the latest next try among the newer ones that have been tried
  // and are still pending, the end of that try under way or backoff, and
  // then goes before it; it does not wait for the newer ones to be
  // delivered. A disabled webhook fails with FAILED_PRECONDITION.
  rpc ReplayWebhookEvents(ReplayWebhookEventsRequest) returns (ReplayWebhookEventsResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "webhooks.write";
    option (toshi.audit) = {action: "webhook.events_replayed"};
    option (toshi.mcp) = {destructive: true};
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Replay these webhook events? Each is delivered again now under its own event id with a new message id, and pending ones are left alone."};
  }
}

// Webhook is one URL a workspace's events are POSTed to, with the events
// its filter keeps and the project it is limited to.
message Webhook {
  // Assigned by the server; unique within the workspace.
  string id = 1;
  // An https URL with a host and no user or password, at most 2048 bytes.
  string url = 2;
  // The event names the webhook is owed, each a name (job.state_changed)
  // or a prefix ending in ".*" (job.*); at most 64. Empty keeps every
  // event but those a connection received, which only a name or prefix
  // that matches them keeps.
  repeated string events = 3 [(toshi.bound) = {name: "webhook_filter_entries", unit: UNIT_COUNT, max: 64}];
  // Whether it is owed new events; a disabled webhook is owed none, and no
  // try of it starts. A create sets it from its disabled field, an update
  // through enabled, and the sender turns it off after a 410 answer.
  bool enabled = 4;
  // The position in the workspace's event log the webhook has read up to,
  // an Event's cursor.
  string cursor = 5;
  // When the secret the last rotation replaced stops signing; unset when
  // no such secret signs.
  google.protobuf.Timestamp previous_secret_expires_at = 6;
  // When the webhook was made; set by the server.
  google.protobuf.Timestamp created_at = 7;
  // When the webhook last changed; set by the server.
  google.protobuf.Timestamp updated_at = 8;
  // Set when events after the webhook's cursor were removed by retention.
  // The webhook is owed nothing until its cursor is moved.
  bool cursor_expired = 9;
  // The latest time of an event the log removed; unset when none.
  google.protobuf.Timestamp retention_boundary = 10;
  // The name of a project in the workspace: the webhook is owed only that
  // project's events, those of its workloads and those its connections
  // received. Empty keeps the events of every project.
  string project = 11;
}

enum WebhookDeliveryState {
  // Never set; a delivery is pending, delivered or dead.
  WEBHOOK_DELIVERY_STATE_UNSPECIFIED = 0;
  // Owed: waiting for its next try, or being tried.
  WEBHOOK_DELIVERY_STATE_PENDING = 1;
  // A try had a 2xx answer.
  WEBHOOK_DELIVERY_STATE_DELIVERED = 2;
  // Every try failed until the sender gave up.
  WEBHOOK_DELIVERY_STATE_DEAD = 3;
}

// WebhookDelivery is one event owed to one webhook.
message WebhookDelivery {
  // The event's ID, the same on every try of every webhook.
  string event_id = 1;
  // The event's cursor.
  string cursor = 2;
  // The ID of the workload whose event it is; empty when a connection
  // received the event.
  string workload_id = 3;
  // Where the delivery stands.
  WebhookDeliveryState state = 4;
  // Tries since the delivery was last due.
  int32 tries = 5;
  // When it may next be tried; set while it is pending.
  google.protobuf.Timestamp next_try_at = 6;
  // The last try's HTTP status; 0 when no answer came or none was tried.
  int32 last_status = 7;
  // The last try's error, which never carries the URL.
  string last_error = 8;
  // When it became due: when the event was owed to the webhook, or when a
  // replay made it due again.
  google.protobuf.Timestamp due_at = 9;
  // When it was delivered or given up.
  google.protobuf.Timestamp done_at = 10;
  // The ID used in the post and webhook-id header.
  string message_id = 11;
  // The ID of the post replayed, set only on a replay.
  optional string replay_of = 12;
}

// CreateWebhookRequest makes a webhook and its signing secret.
message CreateWebhookRequest {
  // The URL to POST to; checked as Webhook.url. Required.
  string url = 1;
  // The event names or prefixes it is owed, as Webhook.events; empty keeps
  // every event.
  repeated string events = 2;
  // Set to make the webhook disabled.
  bool disabled = 3;
  // A key of the caller's choice; empty means no retry protection. A retry
  // with the same key and request answers as the first call did, with the
  // same secret while it is the newest; another request fails with
  // FAILED_PRECONDITION.
  string request_key = 4;
  // The name of a project in the workspace; see Webhook.project.
  string project = 5;
}

// CreateWebhookResponse is the webhook made, with its signing secret.
message CreateWebhookResponse {
  // The webhook as stored.
  Webhook webhook = 1;
  // whsec_ and the base64 of 32 random bytes. No other answer carries it.
  string secret = 2;
}

// GetWebhookRequest asks for one webhook of the workspace.
message GetWebhookRequest {
  // The webhook's id.
  string id = 1;
}

// GetWebhookResponse is the webhook asked for.
message GetWebhookResponse {
  // The webhook.
  Webhook webhook = 1;
}

// ListWebhooksRequest asks for a page of the workspace's webhooks, in ID
// order.
message ListWebhooksRequest {
  // The most webhooks in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListWebhooksResponse is a page of webhooks, in ID order.
message ListWebhooksResponse {
  // The page's webhooks, in ID order.
  repeated Webhook webhooks = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// UpdateWebhookRequest changes the fields update_mask names.
message UpdateWebhookRequest {
  // The webhook's id.
  string id = 1;
  // Carries the new values of the fields update_mask names.
  Webhook webhook = 2;
  // One or more of url, events, project, enabled and cursor.
  google.protobuf.FieldMask update_mask = 3;
  // A key of the caller's choice; empty means no retry protection. A retry
  // with the same key and request answers as the first call did; another
  // request fails with FAILED_PRECONDITION.
  string request_key = 4;
}

// UpdateWebhookResponse is the webhook as stored.
message UpdateWebhookResponse {
  // The webhook as stored.
  Webhook webhook = 1;
}

// DeleteWebhookRequest deletes one webhook and its deliveries.
message DeleteWebhookRequest {
  // The webhook's id.
  string id = 1;
  // A key of the caller's choice; empty means no retry protection. A retry
  // with the same key and request answers as the first call did; another
  // request fails with FAILED_PRECONDITION.
  string request_key = 2;
}

// DeleteWebhookResponse is empty.
message DeleteWebhookResponse {}

// RotateWebhookSecretRequest makes a webhook a new signing secret.
message RotateWebhookSecretRequest {
  // The webhook's id.
  string id = 1;
  // A key of the caller's choice; empty means no retry protection. A retry
  // with the same key and request answers as the first call did, with the
  // same secret while it is the newest; another request, or one whose
  // secret a later rotation or the delete replaced, fails with
  // FAILED_PRECONDITION.
  string request_key = 2;
}

// RotateWebhookSecretResponse is the webhook and its new secret.
message RotateWebhookSecretResponse {
  // The webhook after the rotation; previous_secret_expires_at says when
  // the replaced secret stops signing.
  Webhook webhook = 1;
  // The new secret, as CreateWebhookResponse's.
  string secret = 2;
}

// ListWebhookDeliveriesRequest asks for a page of a webhook's deliveries.
message ListWebhookDeliveriesRequest {
  // The webhook's id.
  string webhook_id = 1;
  // From an earlier response's next_page_token, or a delivery's cursor:
  // the deliveries of the events after that position. Empty starts at the
  // oldest.
  string page_token = 2;
  // The most deliveries in one page; zero lets the server choose.
  int32 page_size = 3;
}

// ListWebhookDeliveriesResponse is a page of deliveries, in event order.
message ListWebhookDeliveriesResponse {
  // The page's deliveries, in event order.
  repeated WebhookDelivery deliveries = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// ReplayWebhookEventsRequest makes a webhook owed again the events after a
// cursor.
message ReplayWebhookEventsRequest {
  // The webhook's id.
  string webhook_id = 1;
  // Events after this cursor; empty starts at the oldest event the log
  // keeps. A cursor older than that event fails with OUT_OF_RANGE.
  string cursor = 2;
  // A key of the caller's choice; empty means no retry protection. A retry
  // with the same key and request answers as the first call did; another
  // request fails with FAILED_PRECONDITION.
  string request_key = 3;
}

// ReplayWebhookEventsResponse says what a replay made due again.
message ReplayWebhookEventsResponse {
  // How many deliveries were made due again.
  int32 replayed = 1;
  // The cursor of the last event looked at, or the cursor asked for when
  // there were none: pass it to the next call while more is set.
  string cursor = 2;
  // Set when events up to the webhook's own cursor remain after cursor.
  bool more = 3;
}
