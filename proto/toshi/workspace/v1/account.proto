syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// AccountService reads and changes the caller's own Toshi user: who they
// are, the identities they sign in with, and the workspaces they are a
// member of. Its calls are a person's: a dashboard session or a person's
// access token makes them, without the Toshi-Workspace header and without
// any role; a workspace token and the operator cannot. The permissions
// named here are not checked.
//
// An identity is added only by signing in through it while signed in, at
// POST /auth/<name>/link on the control plane, never by a
// call here and never by a matching email.
service AccountService {
  // GetAccount returns the caller's user, its identities, oldest first,
  // the workspaces it is a member of, sorted, the sign-ins the calling
  // session or access token holds, and where a person installs the app
  // that makes a workspace.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }

  // ListIdentities returns the caller's identities, oldest first, in
  // pages.
  //
  // A page holds 100 identities when page_size is zero, and 1000 at most.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }

  // UnlinkIdentity removes one of the caller's identities, so it no longer
  // signs in as the caller, and ends what was opened through it: its
  // dashboard sessions, and its access tokens with their grants. The
  // caller's other identities and their sessions are kept, and so are the
  // caller's memberships and roles. An identity the caller does not have
  // fails with NOT_FOUND; the caller's last identity with
  // FAILED_PRECONDITION and the reason LAST_IDENTITY in a
  // google.rpc.ErrorInfo detail. A session or token opened through the
  // identity, the calling one included, stops working at its next call.
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "members.write";
    // members.write only files a person's own call; it is not checked.
    option (toshi.mcp) = {destructive: true};
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "identity.unlinked"
      target: "none"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Unlink this sign-in? It can no longer be used to sign in."};
  }

  // ListSessions returns the caller's own sign-in sessions that have not
  // expired, newest first, in pages. A session opened by another person is
  // never listed. The one making the call is marked current.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }

  // EndSession ends one of the caller's own sign-in sessions, and the
  // access tokens and grants it refreshes through, so it cannot be
  // refreshed back. A session that is not the caller's, or does not exist,
  // fails with NOT_FOUND. The session ended stops working at its next
  // call, the calling one included.
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "members.write";
    // members.write only files a person's own call; it is not checked.
    option (toshi.mcp) = {destructive: true};
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "session.ended"
      target: "none"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "End this session? It signs out now, and signing in again starts a new one."};
  }

  // DeleteAccount erases the caller's user and ends its sessions. Confirm
  // must be the caller's user id. A last Owner cannot be erased until
  // another Owner is granted; the refusal carries reason LAST_OWNER. The
  // calling session stops working at its next call.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "members.write";
    // members.write only files a person's own call; it is not checked.
    option (toshi.mcp) = {destructive: true};
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "user.erased" target: "none"};
  }
}

// Account is a Toshi user: a person who signs in through one or more
// identities.
message Account {
  // The user's id: the person a role grant names.
  string user_id = 1;
  // The name and email the user's latest sign-in reported; shown, never
  // matched.
  string name = 2;
  // The email the user's latest sign-in reported; shown, never used to
  // add an identity.
  string email = 3;
  // When the user was created: their first sign-in.
  google.protobuf.Timestamp created_at = 4;
}

// Identity is a user's account at an identity provider.
message Identity {
  // "github", "local" for the control plane's local admin, or the OpenID
  // Connect issuer URL. GET /auth/providers lists it as each sign-in
  // provider entry's identity_provider, which joins an identity to the
  // entries that sign it in, and WorkspaceSignIn.issuer is the same value.
  string provider = 1;
  // The account's stable id at the provider.
  string subject = 2;
  // The name the provider shows the account by, as of its latest sign-in.
  string login = 3;
  // When the identity was added: its first sign-in.
  google.protobuf.Timestamp created_at = 4;
  // When this identity last signed in.
  google.protobuf.Timestamp last_sign_in_at = 5;
}

// GetAccountRequest has no fields: the caller's own user is the subject.
message GetAccountRequest {}

// GetAccountResponse is the caller's user, its identities, the workspaces
// it is a member of, the sign-ins the call holds and its requests to
// join.
message GetAccountResponse {
  // The caller's user.
  Account account = 1;
  // The user's identities, oldest first.
  repeated Identity identities = 2;
  // The workspaces the user is a member of, sorted.
  repeated string workspaces = 3;
  // The sign-ins the calling session or access token holds, oldest first:
  // the one that opened it, then each step-up sign-in a session adds. GET
  // /auth/session answers the same rows as signed_in_with.
  repeated SignInProof signed_in_with = 4;
  // The page where a person installs the control plane's app on an
  // organisation or user account at the code host. The install makes a
  // workspace for that account; the person's next sign-in opens it, as its
  // owner when they administer the account. This is how a person with no
  // workspace gets one: no call here creates a workspace. Empty when the
  // control plane has no app to install. GET /auth/session answers the same
  // page as install_url.
  string install_url = 5;
  // The user's requests to join a workspace they are not a member of that
  // wait for one of its admins, or that an admin declined less than a day
  // ago, oldest first. A workspace admin finds the pending ones with
  // RoleService.ListMembers at state PENDING and answers them with
  // ApproveMember or DeclineMember. GET /auth/session answers the same rows
  // as pending.
  repeated JoinRequest pending = 6;
}

// JoinRequest is a person's request to join a workspace, made when a
// sign-in finds them in the workspace's account at the code host.
message JoinRequest {
  // The workspace's id and, when it has one, its name; else its id again.
  string workspace = 1;
  // The workspace's name, or its id when it has none.
  string name = 2;
  // "pending" while it waits for an admin, "declined" once one declined it.
  string state = 3;
  // When a declined request may be asked again: the person's next sign-in
  // after it asks again. Unset while pending.
  google.protobuf.Timestamp retry_after = 4;
}

// SignInProof is one sign-in a session or access token holds.
message SignInProof {
  // The identity that signed in, as Identity names it.
  string provider = 1;
  // The account's stable id at the provider, as Identity names it.
  string subject = 2;
  // How it signed in: "github", "oidc" for an OpenID Connect issuer, or
  // "local" for the control plane's local admin.
  string method = 3;
  // When the sign-in happened; a session's first is when it was opened.
  google.protobuf.Timestamp authenticated_at = 4;
}

// ListIdentitiesRequest asks for one page of the caller's identities: the
// caller's own are the subject.
message ListIdentitiesRequest {
  // The most identities in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListIdentitiesResponse is one page of the caller's identities.
message ListIdentitiesResponse {
  // The caller's identities on this page, oldest first.
  repeated Identity identities = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// UnlinkIdentityRequest names the identity to remove.
message UnlinkIdentityRequest {
  // The identity, as Identity names it.
  string provider = 1;
  // The account's stable id at the provider, as Identity names it.
  string subject = 2;
}

// UnlinkIdentityResponse is the identity as it was when it was removed,
// and what ended with it.
message UnlinkIdentityResponse {
  // The identity as it was when it was removed.
  Identity identity = 1;
  // How many dashboard sessions ended, and how many access-token grants
  // were revoked with it.
  int32 sessions_ended = 2;
  // How many access-token grants, with their tokens, were revoked with it.
  int32 grants_revoked = 3;
}

// ListSessionsRequest asks for one page of the caller's sign-in sessions.
message ListSessionsRequest {
  // Sessions per page; the server picks a default and a maximum.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListSessionsResponse is one page of the caller's sign-in sessions.
message ListSessionsResponse {
  // The sessions on this page, newest first.
  repeated SignInSession sessions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// SignInSession is one sign-in session of the caller: a browser session, or
// one sign-in of an OAuth client, such as the dashboard, for as long as its
// grant lasts. Refreshing the client's tokens keeps the same session.
message SignInSession {
  // An opaque id, stable for the session's life, that EndSession takes. It
  // is not the cookie and cannot be used to sign in.
  string id = 1;
  // When the session was opened: a browser session's sign-in, or the
  // grant an OAuth client's session lives by.
  google.protobuf.Timestamp created_at = 2;
  // When the session ends: a browser session's lifetime from its sign-in,
  // or the end of the grant an OAuth client's session lives by. A session
  // past it is not listed and no longer works.
  google.protobuf.Timestamp expires_at = 3;
  // The identity provider the session was opened through.
  string provider = 4;
  // The sign-ins the session holds, the one that opened it first.
  repeated SignInProof signed_in_with = 5;
  // True for the session making this call.
  bool current = 6;
  // The name of the OAuth client the session was signed in to, as the
  // client was registered when the person approved it. Empty for a browser
  // session.
  string client_name = 7;
  // When an OAuth client's session last refreshed its tokens, or signed in
  // if it has not refreshed them yet. It moves at each refresh, not at each
  // call. Unset for a browser session.
  google.protobuf.Timestamp last_seen_at = 8;
}

// EndSessionRequest names the session to end.
message EndSessionRequest {
  // The session's id, as SignInSession names it.
  string id = 1;
}

// EndSessionResponse is empty: the session is ended when the call returns.
message EndSessionResponse {}

// DeleteAccountRequest confirms the erasure of the caller's own user.
message DeleteAccountRequest {
  // The caller's own user id.
  string confirm = 1;
}

// DeleteAccountResponse is empty: the caller's user is erased.
message DeleteAccountResponse {}
