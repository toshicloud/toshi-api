syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// HostJobService reads and stops the workspace's host jobs: each run of a
// runner or a workload on a host, as the scheduler placed it. A host job of
// another workspace is NOT_FOUND.
//
// A workspace's API token acts on its own workspace; a dashboard session
// names one of its workspaces in the Toshi-Workspace header. A
// token limited to a project or an environment is refused with
// PERMISSION_DENIED: these calls act in the whole workspace. A suspended
// workspace reads its host jobs, and every other call is refused for it
// with FAILED_PRECONDITION.
service HostJobService {
  // ListHostJobs returns the host jobs that match every filter field that
  // is set, oldest queued first.
  //
  // A page holds 100 host jobs when page_size is zero, and 1000 at most.
  rpc ListHostJobs(ListHostJobsRequest) returns (ListHostJobsResponse) {
    option (toshi.permission) = "hosts.read";
  }
  // GetHostJob returns one host job. An unknown ID fails with NOT_FOUND.
  rpc GetHostJob(GetHostJobRequest) returns (GetHostJobResponse) {
    option (toshi.permission) = "hosts.read";
  }
  // CancelHostJob cancels a queued host job at once. An assigned, starting
  // or running host job moves to HOST_JOB_STATE_STOPPING: its host stops
  // the runner after a grace period, destroys the VM and reports the host
  // job HOST_JOB_STATE_CANCELLED. A stopping host job is returned
  // unchanged; a finished one fails with FAILED_PRECONDITION.
  rpc CancelHostJob(CancelHostJobRequest) returns (CancelHostJobResponse) {
    option (toshi.permission) = "hosts.write";
  }
  // GetHostJobFailure says why a host job ended the way it did and what to
  // do next, from what Toshi stored. An empty ID fails with
  // INVALID_ARGUMENT; an unknown ID fails with NOT_FOUND.
  rpc GetHostJobFailure(GetHostJobFailureRequest) returns (GetHostJobFailureResponse) {
    option (toshi.permission) = "hosts.read";
  }
  // GetHostJobTelemetry returns the resource samples of one host job's VM
  // and their summary. An unknown ID fails with NOT_FOUND; a host job
  // without samples returns none.
  rpc GetHostJobTelemetry(GetHostJobTelemetryRequest) returns (GetHostJobTelemetryResponse) {
    option (toshi.permission) = "hosts.read";
  }
  // GetHostJobDebugAccess returns the key that opens a debugging host job's
  // guest ssh through the control plane's relay. The host job's host makes
  // the key and gives it out once per session; the control plane does not
  // keep it. A host job that is not debugging fails with
  // FAILED_PRECONDITION, a key already issued with ALREADY_EXISTS, and a
  // host that does not answer with UNAVAILABLE. It is not a read: a
  // suspended workspace is refused it.
  rpc GetHostJobDebugAccess(GetHostJobDebugAccessRequest) returns (GetHostJobDebugAccessResponse) {
    option (toshi.permission) = "debug.connect";
    option (toshi.audit) = {action: "host_job.debug_access_issued"};
  }
  // StopHostJobDebug ends a host job's debug session before its expiry: the
  // host job moves to HOST_JOB_STATE_STOPPING with stop_reason debug_ended,
  // its host destroys the kept VM and the host job finishes completed with
  // its conclusion unchanged. A host job that is not debugging fails with
  // FAILED_PRECONDITION; one already stopping is returned unchanged.
  rpc StopHostJobDebug(StopHostJobDebugRequest) returns (StopHostJobDebugResponse) {
    option (toshi.permission) = "debug.write";
    option (toshi.audit) = {action: "host_job.debug_stopped"};
  }
}

message ListHostJobsRequest {
  // Host jobs in any of these states; empty for every state.
  repeated HostJobState states = 1;
  // Host jobs of this repository, as "owner/name"; empty for every one.
  string repository = 2;
  // The host jobs of this workload: a job's, a sandbox's or a service's id.
  // Empty for every host job.
  string workload_id = 3;
  // The most host jobs in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
}
message ListHostJobsResponse {
  repeated HostJob host_jobs = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetHostJobRequest {
  string id = 1;
}
message GetHostJobResponse {
  HostJob host_job = 1;
  // The job's attempts, oldest first: one for each assignment to a host,
  // the current one last while the job holds it.
  repeated HostJobAttempt attempts = 2;
}

message CancelHostJobRequest {
  string id = 1;
}
message CancelHostJobResponse {
  HostJob host_job = 1;
}

message GetHostJobFailureRequest {
  string id = 1;
}
message GetHostJobFailureResponse {
  // Toshi's cause in one word, such as "out_of_memory", "time_limit",
  // "vm_died" or "step_failed"; "none" for a host job that succeeded and
  // "not_ended" for one that has not ended. The full list: "none",
  // "not_ended", "out_of_memory", "refused", "time_limit", "cancelled",
  // "cancelled_by_tenant", "cancelled_by_operator", "cancelled_by_uninstall",
  // "vm_died", "host_lost", "host_revoked", "stop_unconfirmed",
  // "runner_not_started", "runner_exited", "failed", "too_small",
  // "throttled", "step_failed", "timed_out", "cancelled_on_github" and
  // "unknown".
  string cause = 1;
  // The cause in one sentence. Where the dashboard's Jobs table shows why
  // the host job ended, this is the same text. A host job that ran out of
  // time with a cold cache or without its cache disk gets a second sentence
  // saying so.
  string explanation = 2;
  // GitHub's conclusion for the host job, such as "success" or "failure".
  // Empty when GitHub has not concluded it.
  string conclusion = 3;
  // The same as HostJobTelemetrySummary.verdict and verdict_reason.
  string verdict = 4;
  string verdict_reason = 5;
  // One line on what to do next.
  string what_to_do = 6;
  // The host job's page on GitHub, and its page on the dashboard. Each is
  // empty when Toshi does not know it.
  string github_url = 7;
  string dashboard_url = 8;
  // How earlier failures of the same job went when they were re-run on
  // GitHub. Unset for a host job that succeeded, has not ended or was
  // refused, and for one without a name.
  HostJobFailureHistory history = 9;
  // The host job's cache line, as HostJob.cache.line. Empty when its host
  // reported nothing about a cache disk.
  string cache = 10;
  // The host job's tier line, as HostJob.tier_line. Empty for one that ran
  // in a VM.
  string tier_line = 11;
  // The host job's id.
  string job_id = 12;
}

message GetHostJobTelemetryRequest {
  string id = 1;
}
message GetHostJobTelemetryResponse {
  // The host job's runner size and its VM's vCPUs and memory, to scale the
  // samples by.
  string size = 1;
  int32 vcpus = 2;
  int64 memory_mib = 3;
  // Unset when the host job has no samples.
  HostJobTelemetrySummary summary = 4;
  // Oldest first.
  repeated HostJobTelemetrySample samples = 5;
}

message GetHostJobDebugAccessRequest {
  string id = 1;
}
message GetHostJobDebugAccessResponse {
  // The guest's login user.
  string user = 1;
  // The session's ed25519 private key in OpenSSH format. It is returned
  // only here, once per session.
  bytes private_key = 2;
  // The relay's path on the control plane, "/debug/<host job id>/ssh". A
  // GET with "Connection: Upgrade" and "Upgrade: toshi-debug-ssh", carrying
  // the same token or session as this call, becomes a byte stream to the
  // guest's ssh server.
  string relay_path = 3;
  // When the session ends.
  google.protobuf.Timestamp expires_at = 4;
}

message StopHostJobDebugRequest {
  string id = 1;
}
message StopHostJobDebugResponse {
  HostJob host_job = 1;
}

// HostJob is one run on a host: a GitHub Actions workflow job, or the run of
// a workload's job, sandbox or service, in a VM or on a container tier
// host. A timestamp the host job has not reached yet is unset.
message HostJob {
  string id = 1;
  // The repository as "owner/name".
  string repository = 2;
  int64 workflow_job_id = 3;
  int64 run_id = 4;
  // The GitHub App installation that the job came from.
  int64 installation_id = 5;
  // The runs-on labels.
  repeated string labels = 6;
  string os = 7;
  string size = 8;
  HostJobState state = 9;
  // The host the job is assigned to, when it is one of the workspace's own
  // hosts. Empty while the job is queued, and for a host Toshi runs for
  // many workspaces.
  string host_id = 10;
  // The VM the job runs in; empty until the host starts one.
  string instance_id = 11;
  google.protobuf.Timestamp queued_at = 12;
  google.protobuf.Timestamp assigned_at = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp finished_at = 15;
  // GitHub's conclusion for a completed job, such as "success".
  string conclusion = 16;
  // Why Toshi could not run the job, for a failed job.
  string error = 17;
  // Why the job was stopped: github_cancelled, max_duration, operator,
  // github_completed, runner_not_started, runner_unconfirmed, debug_ended,
  // ran_elsewhere, or for a sandbox spend_cap, tenant_suspended or
  // tenant_deleted. Empty if it never was.
  string stop_reason = 18;
  // When the control plane asked the host to stop the job. Unset if it
  // never did.
  google.protobuf.Timestamp stop_requested_at = 19;
  // Why the scheduler last held the job while it was queued:
  // tenant_suspended, tenant_cap, tenant_vcpu, free_allowance, spend_cap,
  // jobs_per_hour, burst_guard, plan_os, installation_suspended,
  // overflow_wait, no_own_capacity or no_capacity. Empty when the job was
  // never held. It is kept after the job starts.
  string hold_reason = 20;
  // Whether the job was placed on a host its workspace owns. Such a job sends no
  // meter event.
  bool own_host = 21;
  // The debug session the job asked for with a toshi-debug-<minutes> label,
  // in minutes; 0 when it asked for none.
  int32 debug_requested_minutes = 22;
  // The minutes the plan granted: the request clamped to the plan's
  // debug_minutes; 0 when none.
  int32 debug_minutes = 23;
  // Why a request was ignored or clamped; empty otherwise.
  string debug_note = 24;
  // When the debug session started and when it expires; unset for a job
  // that never had one.
  google.protobuf.Timestamp debug_started_at = 25;
  google.protobuf.Timestamp debug_until = 26;
  // What the job's resource samples add up to; unset when it has none.
  HostJobTelemetrySummary telemetry = 27;
  // Why the latest runner started for the job exited without running it,
  // as its listener's log says: "listener exit code 0: Acknowledge returned
  // job-not-found ...". Empty when none did or its guest did not say.
  string runner_exit_reason = 28;
  // The job is assigned to, or ran on, an overflow host.
  bool overflow = 29;
  // Since when the control plane has been waiting for GitHub to answer the
  // request for this job's runner. Unset when no request is in
  // flight. Kept in memory: unset after a restart of the control plane.
  google.protobuf.Timestamp runner_request_since = 30;
  // Toshi's own word for a job Toshi ended itself: time_limit,
  // cancelled_by_tenant, cancelled_by_operator, cancelled_by_uninstall,
  // cancelled or failed. Empty for every other job. The conclusion stays
  // GitHub's word.
  string outcome = 31;
  // The kind of the job's host when it is not a host agent's machine: "cloud"
  // for a cloud host or a cloud pool. Empty otherwise,
  // and for a job without a host.
  string host_kind = 32;
  // The cloud pool's name when the job started on a warm instance of the
  // pool's previous image or runner, because the cloud refused a launch on
  // the current one. Empty otherwise. Set by GetHostJob only.
  string previous_pool_image = 33;
  // The whole minutes the job counts in the usage report: from started_at
  // to stop_requested_at when the job was asked to stop, else to
  // finished_at, rounded up. 0 for a job that has not ended or never started,
  // a job on its workspace's own host and a dispatch filler's job, which are not
  // billed.
  int64 billable_minutes = 34;
  // The job's page on GitHub, on the configured GitHub web URL. Empty when
  // the job has no repository, run or workflow job id.
  string github_url = 35;
  // The name of the job's workflow, from the workflow_job webhook Toshi
  // made the job from. Empty when the webhook did not carry it, for a job
  // Toshi did not make from a webhook, and for one stored before the name
  // was recorded.
  string workflow_name = 36;
  // What the job's cache disk did, as its host reported it.
  // Unset when the host reported nothing, as for a job without a cache.
  HostJobCache cache = 37;
  // When the host reported that the job's runner exited before GitHub
  // reported the job in progress; the job then waits for GitHub.
  // Unset when the runner exited after that, or has not exited.
  google.protobuf.Timestamp runner_exited_at = 38;
  // The conclusion the host reported with that exit, such as "success".
  // Set only with runner_exited_at. Kept in memory: empty after a restart
  // of the control plane.
  string runner_conclusion = 39;
  // The tier of the host the job was assigned to: "container"
  // for a container tier host, empty for a VM. The job keeps it after its
  // host is removed; a requeue clears it.
  string tier = 40;
  // The memory limit the job's host gave it in MiB, when that is not its
  // runner size's memory: on a container tier host, its share of the host by
  // CPUs: the host's memory less the agent's memory reserve, times the size's
  // CPUs over the host's CPUs. A host that reports no CPUs, or no more memory
  // than that reserve, keeps each size's configured memory. 0 means the
  // size's memory, and for a tier job that its host has not reported the
  // limit yet.
  int64 memory_limit_mib = 41;
  // The tier in one line, as the dashboard's job page and
  // GetHostJobFailure show it, such as "ran on a container tier
  // host, which isolates less than a VM (the job shares the host's
  // kernel); memory limit 6971 MiB". Empty for a job that ran in a VM.
  string tier_line = 42;
  // The job's kind: HOST_JOB_KIND_SANDBOX for a Workspace API sandbox's job,
  // HOST_JOB_KIND_SERVICE for a run of a Workspace API service, HOST_JOB_KIND_JOB
  // for every other. Set when the job is made; it never changes.
  HostJobKind kind = 43;
  // The Workspace API workload the job runs: a sandbox's or a service's
  // id, or the id of a job workload run on a host. Empty for a
  // CI job.
  string workload_id = 44;
  // The project the job belongs to, by name: the project that
  // claimed the job's repository when the job was stored, else the
  // workspace's default project; a Workspace API job's is its workload's.
  // Empty for a job stored before projects.
  string project = 45;
  // The job's environment, by name. A CI job's is empty until the job's
  // assignment mints a workload token or receives secrets, and a new
  // assignment re-resolves it; a Workspace API job's is its
  // workload's.
  string environment = 46;
  // The kind of provider that created instance_id, as the host's agent
  // reported it with the instance: "container", "fake", "qemu" or "vz".
  // It stays with the attempt when the host's agent later reports another
  // kind. Empty while the job has no instance, for a job whose agent sent
  // none or recorded before the field, and for a cloud host's job.
  string provider = 47;
  // The state in GitHub's words: "queued" while queued, assigned or
  // starting, "in_progress" while running, debugging or stopping once its
  // attempt started, "completed" once completed, failed or cancelled. A
  // Workspace API job's attempt starts when its host's start of the
  // command is admitted: until then it is queued.
  string status = 48;
  // The runner that runs, or ran, the job's current attempt: for a GitHub
  // job GitHub's runner id in decimal and the name it was registered
  // with, for a Workspace API job its attempt's name as both. Unset until
  // the attempt started, and for a job that ended before any did; the
  // host it was assigned to is host_id.
  string runner_id = 49;
  string runner_name = 50;
  // The current attempt once it started, counting from 1: each assignment
  // of the job is one, and a requeue makes the next. 0 until it started,
  // and for a job that ended before any attempt did; attempts on the get
  // answer list every assignment.
  int32 attempt = 51;
  // GitHub's attempt of the workflow run the job is part of, as the
  // workflow_job webhook Toshi made the job from said: 1 for a run's first
  // attempt, 2 for its first re-run. 0 when it was not recorded, as for a
  // job that is not a GitHub job or one stored before the field.
  int32 run_attempt = 52;
  // TOSHI_LICENSED_WINDOWS when the job runs on a cloud pool's Windows: no
  // one sees its screen, so it opens no display session, takes no takeover
  // and records no screen. DESKTOP_SEAT_REQUIRED when it runs on a host
  // whose pool has licence = "toshi": only a person who holds a desktop seat
  // in the workspace opens a display session on it, and it records no
  // screen. Empty when its screen is available, and for a job without a
  // host. A workspace's own hosts and its own cloud account show the screen.
  string screen_unavailable_reason = 53;
}

// HostJobAttempt is one attempt of a host job: one assignment to a host
// and its runner, and why it ended.
message HostJobAttempt {
  // Counting from 1.
  int32 attempt = 1;
  // As HostJob.runner_id and HostJob.runner_name; empty when no runner was
  // named for the assignment.
  string runner_id = 2;
  string runner_name = 3;
  string host_id = 4;
  string instance_id = 5;
  string provider = 6;
  google.protobuf.Timestamp assigned_at = 7;
  // Unset when the attempt was assigned and never started.
  google.protobuf.Timestamp started_at = 8;
  // When the attempt ended; unset for the current attempt until the job
  // finished.
  google.protobuf.Timestamp finished_at = 9;
  // The job's conclusion as GitHub or its runner reported it in the
  // attempt, such as "success"; empty when none was.
  string conclusion = 10;
  // Why an attempt that was queued again ended, such as "requeued: its
  // assignment timed out"; empty for the current attempt.
  string end = 11;
}

// HostJobState is where a host job is in its life cycle.
enum HostJobState {
  HOST_JOB_STATE_UNSPECIFIED = 0;
  // Waiting for a host.
  HOST_JOB_STATE_QUEUED = 1;
  // Assigned to a host that has not started its VM yet.
  HOST_JOB_STATE_ASSIGNED = 2;
  // The host is starting the VM.
  HOST_JOB_STATE_STARTING = 3;
  // The runner in the VM is running the job.
  HOST_JOB_STATE_RUNNING = 4;
  // The job finished; conclusion says how.
  HOST_JOB_STATE_COMPLETED = 5;
  // Toshi could not run the job; error says why.
  HOST_JOB_STATE_FAILED = 6;
  // The job was cancelled before it finished.
  HOST_JOB_STATE_CANCELLED = 7;
  // The job is being stopped: its host destroys the VM after a grace period.
  HOST_JOB_STATE_STOPPING = 8;
  // GitHub concluded the job failed and its host keeps the VM for a debug
  // session until debug_until. It counts as running.
  HOST_JOB_STATE_DEBUGGING = 9;
}

// HostJobKind is the kind of workload a host job runs.
enum HostJobKind {
  HOST_JOB_KIND_UNSPECIFIED = 0;
  // A job: it ends when its runner exits or at its time limit.
  HOST_JOB_KIND_JOB = 1;
  // A Workspace API sandbox's job: it runs until its owner stops it or
  // Toshi stops it. Its workload_id is the sandbox.
  HOST_JOB_KIND_SANDBOX = 2;
  // A run of a Workspace API service: it runs until it exits
  // or its service stops it. Its workload_id is the service.
  HOST_JOB_KIND_SERVICE = 3;
}

// HostJobTelemetrySummary sums up a job VM's resource samples.
message HostJobTelemetrySummary {
  // Whether the guest kernel's out-of-memory killer killed a process
  // during the job.
  bool oom_killed = 1;
  // How long the VM's threads waited for a host CPU, as a percentage of the
  // CPU time they used plus that wait. 0 when they never waited.
  double cpu_throttled_pct = 2;
  // The most memory in use inside the guest, in MiB; the host's resident
  // memory of the VM when the guest does not report it.
  int64 peak_memory_mib = 3;
  // CPU time used as a percentage of the VM's vCPUs over the sampled time.
  double cpu_utilisation_pct = 4;
  // How many samples the job has.
  int32 samples = 5;
  // The job's memory limit in MiB: the memory its runner size gives its VM,
  // or on a container tier host the limit the host gave it, its share of
  // the host; 0 when neither is known.
  int64 memory_limit_mib = 6;
  // The CPU time the VM used, in milliseconds: the sum of the job's stored
  // samples.
  int64 cpu_ms = 7;
  // Why the job ran out of memory, when it ended without succeeding and its
  // samples counted a kill: "out of memory (peak X MiB of limit Y MiB)",
  // without the limit when the size is unknown. Empty otherwise.
  string oom_reason = 8;
  // Whether the runner size suited the job: "fits", "too big", "too small",
  // "throttled" or "out of memory". Empty for a job that has not ended, and
  // for a size this release does not know unless the job ran out of memory
  // or was throttled.
  string verdict = 9;
  // The verdict in one sentence with its numbers, such as "used 20 % of 4
  // vCPUs and 4 GiB of 16 GiB: a size smaller, toshi-linux-2x, would fit".
  // Empty when the verdict is.
  string verdict_reason = 10;
}

// HostJobCache is what a job's cache disk did.
message HostJobCache {
  // "attached", or "not_attached" when the disk never reached the job's VM
  // and the job ran without it.
  string attach = 1;
  // The generation the disk was attached from; 0 is the blank disk.
  int64 base_generation = 2;
  // "committed" or "skipped"; empty until the host reports the write-back,
  // after the job's VM is gone, and when the disk was not attached.
  string write_back = 3;
  // Why the write-back was skipped: "untrusted", "failed", "job_failed",
  // "no_result", "unclean", "stale", "size_cap", "host_disk" or "error",
  // or a reason this control plane does not know, from a newer agent, as
  // the agent sent it.
  string skip_reason = 4;
  // The size of the committed generation in bytes, and how long the
  // write-back took in milliseconds.
  int64 generation_bytes = 5;
  int64 write_back_ms = 6;
  // The fields above in one line, as the dashboard's job page and
  // GetHostJobFailure show it, such as "warm
  // from generation 3 on host h1; wrote generation 4 (1.2 GiB in 14 s)".
  string line = 7;
}

// HostJobTelemetrySample is the same as toshi.agent.v1.TelemetrySample: one
// window of a job VM's resource use.
message HostJobTelemetrySample {
  google.protobuf.Timestamp at = 1;
  int32 window_ms = 2;
  int64 cpu_ms = 3;
  int64 cpu_wait_ms = 4;
  optional int64 guest_memory_mib = 5;
  int64 host_memory_mib = 6;
  int64 disk_read_bytes = 7;
  int64 disk_write_bytes = 8;
  optional int64 net_rx_bytes = 9;
  optional int64 net_tx_bytes = 10;
  optional int32 oom_kills = 11;
}

// HostJobFailureHistory counts the failures of the jobs with the same
// repository and job name, in the last `days` days, whose re-run on
// GitHub passed or failed again. A failure that passed on any re-run
// counts as passed; one with a failed re-run and none passed counts as
// failed again. Toshi re-runs and hides nothing for it.
message HostJobFailureHistory {
  int32 days = 1;
  int32 passed_on_rerun = 2;
  int32 failed_again = 3;
  // The job's failing step, and the counts of the failures at a step of
  // the same name. Empty and 0 when Toshi knows no failing step.
  string step = 4;
  int32 step_passed_on_rerun = 5;
  int32 step_failed_again = 6;
  // The counts in a sentence or two; it says the failure is likely a
  // flake only when the job failed on its own and passed on re-run at
  // least twice. Empty when every count is 0.
  string sentence = 7;
}
