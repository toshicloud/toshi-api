syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";
import "toshi/workspace/v1/model_credentials.proto";
import "toshi/workspace/v1/volumes.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// ProjectService reads a workspace's projects and the repositories they
// claim, creates a project, creates or deletes an environment of one, moves a
// repository's claim, sets the branch rules that choose a CI job's
// environment, sets the network policies a project's workloads connect out
// under, sets how long an environment keeps its jobs and artifacts, and sets
// the rules a project's volumes follow. A workspace holds projects, and a
// project holds environments.
//
// The caller's credential names the workspace, as for WorkloadService.
// Nothing of another workspace is visible.
service ProjectService {
  // ListProjects returns the workspace's projects by name, each with its
  // environments by name.
  //
  // A page holds 100 projects when page_size is zero, and 1000 at most.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // GetProject returns one project with its environments by name. A
  // project the workspace does not have is NOT_FOUND. A token limited to
  // a project gets only that project, and PERMISSION_DENIED for any other
  // name; a token limited to an environment gets the project with that
  // environment only.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // ListRepositories returns the repositories the workspace's projects
  // claim, by repository. A project the workspace does not have is
  // NOT_FOUND.
  //
  // A page holds 100 repositories when page_size is zero, and 1000 at most.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // CreateProject makes a project with its three environments,
  // development, preview and production. A name the workspace's projects
  // already have is ALREADY_EXISTS. A token limited to a project is
  // PERMISSION_DENIED: the new project is not its own.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "projects.write";
    option (toshi.audit) = {target: "project:project"};
  }
  // UpdateProject sets the fields of project.name's project that
  // update_mask names. The fields it sets are admission, the project's
  // admission webhook: its url and secret, both required, or an empty url
  // to remove it; recording_defaults, the project's recording
  // defaults, either whole or by its sub-paths
  // recording_defaults.sandbox_recording_policy,
  // recording_defaults.job_recording_policy, recording_defaults.human_spans,
  // recording_defaults.recording_segment_minutes and
  // recording_defaults.recording_max_mib; volume_rules, the project's
  // volume rules, replaced whole by the value the call carries, an empty
  // one clearing them; compatibility_flags, the project's compatibility
  // flags, replaced whole by the value the call carries, an empty one
  // clearing them, each flag checked against the dated changes Toshi lists
  // and an unknown one INVALID_ARGUMENT; branch_rules, the project's branch
  // rules, replaced whole by the list the call carries, which has at most
  // 100 rules, a known match on each, a pattern on exactly the pattern
  // rules, no two rules matching the same way, the fallback rule exactly
  // once and last, each environment one of the project's or none, and the
  // fallback rule's environment not a production one, any other list
  // INVALID_ARGUMENT, and a job already assigned keeps the environment it
  // got; and network, the project's network policy, replaced whole by the
  // value the call carries, which has at most 100 rules, each an allow or a
  // deny of an address, a CIDR prefix or a DNS name, with an optional port
  // or port range and protocol, any other policy INVALID_ARGUMENT, and a
  // workload keeps the policy it was admitted with. An unset update_mask
  // names the fields project carries. An empty one, an unset one with no
  // admission, no recording_defaults, no volume_rules, no compatibility_flags,
  // no branch_rules and no network, "*" and a path of another field are
  // INVALID_ARGUMENT. The secret is sealed under the workspace's data key
  // and never returned; a deployment with no keyring refuses it with
  // FAILED_PRECONDITION. A token limited to environments is
  // PERMISSION_DENIED.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {target: "project:project"};
  }
  // ClaimRepository puts a repository in a project: it claims a repository
  // no project claims, or moves the claim from another project. A CI job
  // whose repository's claim was read before the move keeps its project,
  // and its credentials are refused; a job whose claim is read after it
  // lands in the new project. A project the workspace does not have is NOT_FOUND. A token
  // limited to a project claims only for that project, and only a
  // repository no other project claims.
  rpc ClaimRepository(ClaimRepositoryRequest) returns (ClaimRepositoryResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {target: "project:project"};
  }
  // CreateEnvironment adds the environment of a kind a project lacks,
  // named after its kind, such as preview for a project made with
  // production only. A kind the project has is ALREADY_EXISTS; a project
  // the workspace does not have is NOT_FOUND. A token limited to a project
  // creates only in that project, and a token limited to an environment
  // is PERMISSION_DENIED.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {target: "project:project"};
  }
  // DeleteEnvironment deletes a project's environment by name. A project's
  // production environment is FAILED_PRECONDITION, and so is an
  // environment that anything live still refers to, with each kind and
  // its count in the message: secret sets, API tokens that are neither
  // revoked nor expired, unfinished jobs, workloads that are not deleted,
  // artifacts still being uploaded, the project's branch rules that choose
  // it and its triggers that are not deleted. Finished jobs and complete
  // artifacts keep the environment as history. A project or environment
  // the workspace does not have is NOT_FOUND. A token limited to a
  // project deletes only in that project, and a token limited to an
  // environment is PERMISSION_DENIED.
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {target: "project:project"};
  }
  // ListBranchRules returns a project's branch rules in order, the
  // fallback rule last: the first that matches a CI job's run chooses the
  // job's environment. The fallback rule takes every other run and never
  // chooses an environment of kind production. A project the workspace does
  // not have is NOT_FOUND. A token limited to a project reads only that
  // project's rules, and a token limited to an environment is
  // PERMISSION_DENIED.
  //
  // A page holds 100 rules when page_size is zero, and 1000 at most.
  rpc ListBranchRules(ListBranchRulesRequest) returns (ListBranchRulesResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // GetProjectNetwork returns a project's network policy: where its
  // workloads may connect outbound. A project that never set one allows
  // every destination. A project the workspace does not have is NOT_FOUND.
  // A token limited to a project reads only that project's policy, and a
  // token limited to an environment is PERMISSION_DENIED.
  rpc GetProjectNetwork(GetProjectNetworkRequest) returns (GetProjectNetworkResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // GetEnvironmentNetwork returns an environment's network policy, which
  // narrows its project's: a destination is reached only when both allow
  // it. An environment that never set one allows every destination its
  // project allows. A project or environment the workspace does not have is
  // NOT_FOUND. A token limited to an environment reads only that
  // environment's policy.
  rpc GetEnvironmentNetwork(GetEnvironmentNetworkRequest) returns (GetEnvironmentNetworkResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "environment";
  }
  // GetEnvironmentRetention returns an environment's retention override,
  // as stored, and the retention that applies to it: the override where it
  // shortens the workspace's, else the workspace's. An environment that
  // never set one follows its workspace. A project or environment the
  // workspace does not have is NOT_FOUND. A token limited to an
  // environment reads only that environment's.
  rpc GetEnvironmentRetention(GetEnvironmentRetentionRequest) returns (GetEnvironmentRetentionResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "environment";
  }
  // UpdateEnvironment sets the fields update_mask names on an environment:
  // retention replaces its retention override whole, which may only shorten
  // the workspace's: history_days above the workspace's period, or a keep
  // longer than the workspace's keep of that kind, is INVALID_ARGUMENT
  // naming the field and the limit, and so is a recording-signed-in keep
  // longer than the recording keep that applies after it; an empty
  // retention clears it. volumes replaces the list of the project's
  // volumes its services and sandboxes may attach; an empty list lets them
  // attach any, and a name that is no volume of the project is
  // INVALID_ARGUMENT naming it. network replaces the environment's network
  // policy whole, checked as UpdateProject checks a project's; it can only
  // narrow the project's policy: an allow the project denies stays denied,
  // and a workload keeps the policy it was admitted with.
  // model_credential_defaults replaces the environment's default model
  // credentials, which also needs model_credentials.write, and
  // compatibility_date sets the environment's override of the project's
  // date, an empty one clearing it. Each is checked before anything is
  // written, and the other overrides are written together or not at all.
  // An omitted mask means the fields the request sets; clearing the
  // override or the list needs its path in the mask. "*" and a path of any
  // other field are INVALID_ARGUMENT. A project or environment the
  // workspace does not have is NOT_FOUND. A token limited to an environment
  // updates only that environment.
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "project:project"};
  }
  // RaiseCompatibilityDate moves a project's compatibility date, or one
  // environment's override of it, to date, a YYYY-MM-DD date. With
  // environment empty it raises the project's date; with it set it raises
  // that environment's override. The date must be one Toshi serves: older
  // than the oldest is FAILED_PRECONDITION with an ErrorInfo, reason
  // COMPATIBILITY_DATE_TOO_OLD, and newer than the newest is
  // FAILED_PRECONDITION with reason COMPATIBILITY_DATE_TOO_NEW; each names
  // the date, the oldest and the newest in its metadata. A date that is not
  // YYYY-MM-DD is INVALID_ARGUMENT. A member raises the date and never
  // lowers it: a date earlier than the one the project or environment runs
  // under is FAILED_PRECONDITION with reason COMPATIBILITY_DATE_LOWER and
  // the same metadata plus the current date. The operator's call, made
  // under the operator grant, may lower, never below the oldest date Toshi
  // serves. Raising to the date already stored succeeds with changed false,
  // writes nothing and records no event. The answer's changes are the dated
  // changes the raise took, as ListCompatibilityChanges lists them.
  //
  // A project or environment the workspace does not have is NOT_FOUND. A
  // token limited to an environment raises only that environment and is
  // PERMISSION_DENIED for the project or another environment.
  rpc RaiseCompatibilityDate(RaiseCompatibilityDateRequest) returns (RaiseCompatibilityDateResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "project.compatibility_raised"
      target: "project:project"
    };
  }
  // ListCompatibilityChanges returns the dated changes between the date a
  // project, or one environment of it, runs under and to_date: the changes
  // it has not taken yet, each with its date, its flag and a summary. With
  // to_date empty it lists them up to the newest date Toshi serves, and a
  // to_date Toshi does not serve is refused as RaiseCompatibilityDate
  // refuses a date. An environment's flags are the project's; its date is
  // its own override when it has one, else the project's. A project or
  // environment the workspace does not have is NOT_FOUND.
  rpc ListCompatibilityChanges(ListCompatibilityChangesRequest) returns (ListCompatibilityChangesResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "environment";
  }
  // CreateEmbedToken mints an embed token for a project: a credential for
  // a web page on one of the token's origins, which spends it once to
  // fetch one of the project's ready recordings. It expires in minutes. A
  // project the workspace does not have is NOT_FOUND. A token limited to a
  // project mints only for that project, and a token limited to an
  // environment is PERMISSION_DENIED.
  rpc CreateEmbedToken(CreateEmbedTokenRequest) returns (CreateEmbedTokenResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {action: "embed_token.issued"};
  }
  // ListEmbedTokens returns a project's embed tokens, oldest first, without
  // the tokens themselves.
  //
  // A page holds 100 embed tokens when page_size is zero, and 1000 at most.
  rpc ListEmbedTokens(ListEmbedTokensRequest) returns (ListEmbedTokensResponse) {
    option (toshi.permission) = "projects.read";
    option (toshi.scope) = "project";
  }
  // RevokeEmbedToken refuses an embed token before it expires. A token
  // already revoked is returned as it is.
  rpc RevokeEmbedToken(RevokeEmbedTokenRequest) returns (RevokeEmbedTokenResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "projects.write";
    option (toshi.scope) = "project";
  }
}

// Project is one of a workspace's projects.
message Project {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  repeated ProjectEnvironment environments = 3;
  // admission is the project's admission webhook; unset when it has none.
  // GetProject and UpdateProject return it; ListProjects does not.
  ProjectAdmission admission = 4;
  // recording_defaults is the project's recording defaults. GetProject and
  // UpdateProject return it; ListProjects does not. A project that set none
  // has every field of it unspecified.
  ProjectRecordingDefaults recording_defaults = 5;
  // volume_rules is the project's rules for the volumes its runs create.
  // GetProject and UpdateProject return it; ListProjects does not. A
  // project that set none has no rules. A rule bounds the volumes created
  // after it is set and never changes a volume that exists.
  ProjectVolumeRules volume_rules = 6;
  // volume_caps_in_use_bytes is the sum, in bytes, of the size caps of the
  // project's volumes that are not deleted. GetProject returns it;
  // ListProjects leaves it 0. Output only.
  int64 volume_caps_in_use_bytes = 7;
  // compatibility_date is the date whose defaults the project's workloads
  // get, a YYYY-MM-DD date. It is at or after initial_compatibility_date
  // for a member, who raises it with RaiseCompatibilityDate and never
  // lowers it. ListProjects returns it.
  string compatibility_date = 8;
  // compatibility_flags are the dated changes a flag turns on before its
  // date, or off after it (no_<flag>), sorted and without duplicates. Set
  // with UpdateProject; ListProjects returns them.
  repeated string compatibility_flags = 9;
  // initial_compatibility_date is the date the project was created at.
  // Output only.
  string initial_compatibility_date = 10;
  // branch_rules is the project's branch rules in order, the fallback rule
  // last, each environment by name: the first that matches a CI job's run
  // chooses the job's environment. GetProject and UpdateProject return
  // them; ListProjects does not. A token limited to an environment gets
  // them unset, as ListBranchRules refuses it. Set with UpdateProject.
  repeated BranchRule branch_rules = 11;
  // network is the project's network policy: where its workloads may
  // connect outbound, as GetProjectNetwork returns it. A project that never
  // set one allows every destination. GetProject and UpdateProject return
  // it; ListProjects does not. A token limited to an environment gets it
  // unset, as GetProjectNetwork refuses it. Set with UpdateProject.
  NetworkPolicy network = 12;
}

// ProjectVolumeRules bounds the volumes a project's runs create.
message ProjectVolumeRules {
  // modes are the volume modes the project allows. Empty allows all four:
  // cache, seed, state and artifact. UNSPECIFIED is INVALID_ARGUMENT.
  repeated VolumeMode modes = 1;
  // default_size_cap_bytes is the size cap, in bytes, a create that names
  // none gets; 0 is the built default of 10 GiB.
  int64 default_size_cap_bytes = 2;
  // size_cap_total_bytes is the most the size caps of the project's
  // volumes that are not deleted may total, 0 for the workspace's ceiling.
  int64 size_cap_total_bytes = 3;
}

// ProjectAdmission is a project's admission webhook. At each admission
// point of the project, once Toshi's own checks have passed, the control
// plane posts the admission document to url, signed under Standard Webhooks
// with secret, and waits at most 2 seconds for {"allow": true} or
// {"allow": false, "reason": "..."}. No answer, an error, a status other
// than 2xx or another body is a deny. A refused workload's error is
// FAILED_PRECONDITION with an ErrorInfo, reason ADMISSION_DENIED, whose
// metadata names the module and the reason.
message ProjectAdmission {
  // url is the https URL the document is posted to.
  string url = 1;
  // secret is the signing secret: "whsec_" and the base64 of 24 to 64
  // bytes. Input only: no call returns it.
  string secret = 2;
  // updated_by is who set it last, as the audit log names them.
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// ProjectRecordingDefaults is what a project's workloads record when their
// create names no policy, and how the project's human control is captured.
// A workload records under the first of these that applies: the
// workspace's recording setting, when it is off; the policy the workload's
// create names; the project's default for its kind; the plan's default.
// Human control follows the workspace's setting when that setting does not
// capture, and the project's setting otherwise: a project can opt out of the
// capture but never opt in while the workspace does not capture.
message ProjectRecordingDefaults {
  // sandbox_recording_policy is what a sandbox of the project records when
  // its create names no policy. PROJECT_RECORDING_POLICY_UNSPECIFIED
  // follows the plan's sandbox default. PROJECT_RECORDING_POLICY_VIDEO is
  // INVALID_ARGUMENT.
  ProjectRecordingPolicy sandbox_recording_policy = 1;
  // job_recording_policy is what a job of the project records when its
  // create names no policy, PROJECT_RECORDING_POLICY_VIDEO included.
  // PROJECT_RECORDING_POLICY_UNSPECIFIED follows the plan's default.
  ProjectRecordingPolicy job_recording_policy = 2;
  // human_spans is what Toshi captures of the project's human control.
  ProjectHumanSpans human_spans = 3;
  // updated_by is who set the defaults last, as the audit log names them.
  string updated_by = 4;
  google.protobuf.Timestamp updated_at = 5;
  // recording_segment_minutes limits a sandbox strip's duration. Zero
  // follows the plan; positive values are capped by the plan and frame limit.
  // Negative values are INVALID_ARGUMENT.
  int32 recording_segment_minutes = 6;
  // recording_max_mib limits one recording's size. Zero follows the plan;
  // positive values are capped by the plan. Negative values are INVALID_ARGUMENT.
  int32 recording_max_mib = 7;
}

// ProjectRecordingPolicy is what a project's workload records of its runs
// when its create names no policy. It has the values RecordingPolicy has,
// and a workload records what its create names instead when it names one.
enum ProjectRecordingPolicy {
  // The plan's default for the workload's kind applies.
  PROJECT_RECORDING_POLICY_UNSPECIFIED = 0;
  // No capture. A file the run uploads as its test framework's recording
  // is still one of its recordings.
  PROJECT_RECORDING_POLICY_OFF = 1;
  // A screenshot strip of each run, unless a video or trace the run
  // uploaded as its test framework's recording is ready when its strip is
  // finished. Jobs and sandboxes only.
  PROJECT_RECORDING_POLICY_STRIP = 2;
  // A video of each run's screen, recorded by its host, on the same terms
  // as STRIP. A job only.
  PROJECT_RECORDING_POLICY_VIDEO = 3;
}

// ProjectHumanSpans is what Toshi captures of a project's human control.
enum ProjectHumanSpans {
  // The workspace's setting applies.
  PROJECT_HUMAN_SPANS_UNSPECIFIED = 0;
  // This project's human control is never captured.
  PROJECT_HUMAN_SPANS_OFF = 1;
}

// ProjectEnvironment is one of a project's environments.
message ProjectEnvironment {
  string name = 1;
  // development, preview or production.
  string kind = 2;
  // The names of the project's volumes the environment's services and
  // sandboxes may attach, sorted; empty when any of them may. Set with
  // UpdateEnvironment.
  repeated string volumes = 3;
  // Who manages this object: "manifest" when the project manifest declares
  // it, empty when nothing does. A manifest apply sets managed_by,
  // manifest_digest, manifest_origin and managed_fields together.
  string managed_by = 4;
  // The SHA-256 of the manifest file that last set this object, as 64
  // lowercase hex characters. Empty when managed_by is empty.
  string manifest_digest = 5;
  // The fields of this object the manifest declares, as update mask paths.
  // Empty when managed_by is empty.
  repeated string managed_fields = 6;
  // How the manifest came to manage this object: "created" when a manifest
  // apply created it, "adopted" when an apply took over an object that
  // already existed. Empty when managed_by is empty.
  string manifest_origin = 7;
  // The environment's retention override as stored; empty when it
  // follows the workspace. Set with UpdateEnvironment.
  EnvironmentRetention retention = 8;
  // The environment's default model credential per provider, before the
  // workspace's. Each names a workspace credential whose key serves this
  // environment. Set with UpdateEnvironment.
  repeated ModelCredentialDefault model_credential_defaults = 9;
  // compatibility_date is the environment's override of the project's
  // date, a YYYY-MM-DD date; empty means the project's date applies. Set
  // with RaiseCompatibilityDate or UpdateEnvironment.
  string compatibility_date = 10;
  // effective_compatibility_date is the date workloads in the environment
  // run under: compatibility_date when it is set, else the project's.
  // Output only.
  string effective_compatibility_date = 11;
  // network is the environment's network policy, which narrows its
  // project's: a destination is reached only when both allow it, as
  // GetEnvironmentNetwork returns it. An environment that never set one
  // allows every destination its project allows. GetProject,
  // UpdateProject and UpdateEnvironment return it; ListProjects does not.
  // Set with UpdateEnvironment.
  NetworkPolicy network = 12;
}

// Repository is a repository a project claims: a CI job of the repository
// runs in that project.
message Repository {
  // "owner/name".
  string repository = 1;
  // The claiming project's name.
  string project = 2;
  google.protobuf.Timestamp claimed_at = 3;
}

message ListProjectsRequest {
  // The most projects in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  // The limit of the token that made the call. A server that has this
  // field always sets it; both its fields are empty for a caller that
  // covers the whole workspace.
  TokenLimit token_limit = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// TokenLimit names the project and the environment an API token is
// limited to.
message TokenLimit {
  // The project's name; empty when the token covers the whole workspace.
  string project = 1;
  // The environment's name; empty when the token covers every
  // environment of its project, or the whole workspace.
  string environment = 2;
}

message ListRepositoriesRequest {
  // Only this project's repositories; empty lists every project's.
  string project = 1;
  // The most repositories in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message CreateProjectRequest {
  string name = 1;
  string request_key = 2;
}

message CreateProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  // name names the project; the fields update_mask names carry the new
  // values.
  Project project = 1;
  // update_mask names the fields to set: "admission",
  // "recording_defaults" or one of its sub-paths, "volume_rules",
  // "compatibility_flags", "branch_rules" and "network". An unset mask
  // names the fields project carries.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateProjectResponse {
  Project project = 1;
}

message ClaimRepositoryRequest {
  // "owner/name".
  string repository = 1;
  // The name of the project that is to claim it.
  string project = 2;
}

message ClaimRepositoryResponse {
  Repository repository = 1;
  // The name of the project that claimed the repository before the call;
  // empty when no project did.
  string previous_project = 2;
}

message GetProjectRequest {
  // The project's name.
  string name = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message CreateEnvironmentRequest {
  // The name of the project that is to have the environment.
  string project = 1;
  // development, preview or production; the environment is named after
  // it.
  string kind = 2;
  string request_key = 3;
  // The management mark goes together: all four fields or none; managed_by
  // "manifest" needs the digest, an origin and at least one field path.
  string managed_by = 4;
  string manifest_digest = 5;
  repeated string managed_fields = 6;
  string manifest_origin = 7;
}

message CreateEnvironmentResponse {
  ProjectEnvironment environment = 1;
}

message DeleteEnvironmentRequest {
  // The name of the project that has the environment.
  string project = 1;
  // The environment's name.
  string name = 2;
}

message DeleteEnvironmentResponse {}

// BranchRule is one of a project's branch rules: it chooses the
// environment of a CI job whose run it matches.
message BranchRule {
  // default_branch matches a run of its repository's default branch,
  // pattern a run of a branch the pattern matches, and fallback every run
  // no earlier rule matched. Only a push, schedule or workflow_dispatch
  // run of a repository that is not a fork, at a commit on its branch,
  // can match a rule other than fallback; every other run, a pull
  // request's included, goes to the fallback rule.
  string match = 1;
  // A pattern rule's branch name or glob, and empty for the other
  // matches. * matches any run of characters within one /-separated
  // segment and ** any run across segments; every other character matches
  // itself, case-sensitively.
  string pattern = 2;
  // The name of the project's environment the rule chooses; empty chooses
  // none: a job the rule matches gets no workload token and no secrets.
  string environment = 3;
}

message ListBranchRulesRequest {
  // The project's name.
  string project = 1;
  // The most rules in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListBranchRulesResponse {
  repeated BranchRule rules = 1;
  // Empty on the last page.
  string next_page_token = 2;
}


// NetworkPolicy is where a project's or an environment's workloads may
// connect outbound. The first rule that matches a destination decides;
// one no rule matches gets default_action.
message NetworkPolicy {
  // "allow" or "deny".
  string default_action = 1;
  // At most 100 rules, read in order.
  repeated EgressRule egress = 2;
}

// EgressRule allows or denies outbound connections to one destination.
message EgressRule {
  // "allow" or "deny".
  string action = 1;
  // An IPv4 or IPv6 address, a CIDR prefix, or a DNS name such as
  // "api.example.com". A name is resolved by the host that runs the
  // workload, so it matches the addresses the name had when last
  // resolved; it does not check a TLS server name. Stored in canonical
  // form: a prefix masked, a name in lower case.
  string destination = 2;
  // A port such as "443", a range such as "8000-8100", or empty for every
  // port.
  string ports = 3;
  // "tcp", "udp", or empty for both; empty with no ports covers every
  // protocol, ICMP included.
  string protocol = 4;
}

message GetProjectNetworkRequest {
  // The project's name.
  string project = 1;
}

message GetProjectNetworkResponse {
  NetworkPolicy network = 1;
  // The audit actor that last set it, "<kind>:<id>"; empty when it was
  // never set.
  string updated_by = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message GetEnvironmentNetworkRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
}

message GetEnvironmentNetworkResponse {
  NetworkPolicy network = 1;
  // The audit actor that last set it, "<kind>:<id>"; empty when it was
  // never set.
  string updated_by = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// RetentionKeep is how long one kind of artifact is kept after it
// completes.
message RetentionKeep {
  // The artifact kind: recording, recording-signed-in, trace or report.
  string kind = 1;
  // At least one hour.
  google.protobuf.Duration keep = 2;
}

// EnvironmentRetention is how long an environment keeps its finished jobs
// and its artifacts. As an override, what it leaves out follows the
// workspace, and what it sets may only shorten the workspace's.
message EnvironmentRetention {
  // Days the environment keeps its finished jobs. In an override, unset
  // follows the workspace and the value is at least 1 and at most the
  // workspace's period: an override cannot keep forever. In the retention
  // that applies, 0 keeps forever.
  optional int32 history_days = 1;
  // Each kind's keep, by kind. In an override, a kind left out follows the
  // workspace. In the retention that applies, a kind left out is kept
  // forever.
  repeated RetentionKeep keeps = 2;
}

message GetEnvironmentRetentionRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
}

message GetEnvironmentRetentionResponse {
  // The override as stored; empty when none is set.
  EnvironmentRetention retention = 1;
  // What applies to the environment's jobs and artifacts: each value of the
  // override that is shorter than the workspace's, else the workspace's.
  EnvironmentRetention effective = 2;
  // The audit actor that last set it, "<kind>:<id>"; empty when it was
  // never set.
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message UpdateEnvironmentRequest {
  // The project's name.
  string project = 1;
  // name names the environment; the fields update_mask names carry the
  // new values.
  ProjectEnvironment environment = 2;
  // retention, volumes, network, model_credential_defaults,
  // compatibility_date, or several. The paths managed_by, manifest_digest,
  // manifest_origin and managed_fields set the management mark and go
  // together: all four or none, and on their own; managed_by "manifest"
  // needs the digest, an origin and at least one field path, and an empty
  // managed_by clears all four. An unset mask never sets the mark.
  google.protobuf.FieldMask update_mask = 3;
}
message UpdateEnvironmentResponse {
  // The environment as stored.
  ProjectEnvironment environment = 1;
}

message RaiseCompatibilityDateRequest {
  // The name of the project whose date to raise.
  string project = 1;
  // The environment whose override to raise; empty raises the project's
  // date.
  string environment = 2;
  // The YYYY-MM-DD date to move to.
  string date = 3;
}

message RaiseCompatibilityDateResponse {
  // The project with its environments as ListProjects renders them, after
  // the raise, showing the environment's override when one was raised.
  Project project = 1;
  // The dated changes the raise took, in date order.
  repeated CompatibilityChange changes = 2;
  // Whether the stored date changed; false when it was already date.
  bool changed = 3;
}

// CompatibilityChange is one dated change to a default.
message CompatibilityChange {
  // The change's date, YYYY-MM-DD.
  string date = 1;
  // The change's flag: setting it turns the change on before its date, and
  // no_<flag> turns it off after.
  string flag = 2;
  // What the change does, in one sentence.
  string summary = 3;
}

message ListCompatibilityChangesRequest {
  // The name of the project whose changes to list.
  string project = 1;
  // The environment whose date to list them from; empty uses the
  // project's date.
  string environment = 2;
  // The last date to list, YYYY-MM-DD; empty is the newest date Toshi
  // serves.
  string to_date = 3;
}

message ListCompatibilityChangesResponse {
  // The changes not taken by to_date, in date order.
  repeated CompatibilityChange changes = 1;
  // The date the project or environment runs under, YYYY-MM-DD.
  string from_date = 2;
  // The last date listed, YYYY-MM-DD.
  string to_date = 3;
}

// EmbedTokenState is where an embed token is in its life.
enum EmbedTokenState {
  EMBED_TOKEN_STATE_UNSPECIFIED = 0;
  // Not yet spent: a page on one of its origins can spend it.
  EMBED_TOKEN_STATE_ACTIVE = 1;
  // A page spent it on a recording.
  EMBED_TOKEN_STATE_USED = 2;
  EMBED_TOKEN_STATE_REVOKED = 3;
  EMBED_TOKEN_STATE_EXPIRED = 4;
}

// EmbedToken is one of a project's embed tokens, without the token itself.
message EmbedToken {
  // Assigned by the server.
  string id = 1;
  // The project's name.
  string project = 2;
  // The origins of the pages that may spend it, such as
  // https://app.example.com.
  repeated string origins = 3;
  EmbedTokenState state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Unset until a page spends it.
  google.protobuf.Timestamp used_at = 7;
  // The recording it was spent on; empty until then.
  string recording_id = 8;
  // Unset unless it was revoked.
  google.protobuf.Timestamp revoked_at = 9;
  // Who minted it: a person's sign-in or an API token, as in the audit.
  string created_by = 10;
  // Where the recording it was spent on lives, copied from the recording
  // when it was spent, so they stay after the recording is deleted: its
  // workload, as ListRecordings takes it, that workload's kind ("job",
  // "sandbox" or "service") and its environment, as Recording names them.
  // Empty until spent.
  string workload_id = 11;
  string workload_kind = 12;
  string environment_id = 13;
}

message CreateEmbedTokenRequest {
  // The project's name.
  string project = 1;
  // The origins of the pages that may spend it, each a scheme and a host
  // with an optional port: https, or http for localhost, 127.0.0.1 or ::1.
  // At least one and at most 10; more is INVALID_ARGUMENT.
  repeated string origins = 2 [(toshi.bound) = {name: "embed_token_origins", unit: UNIT_COUNT, max: 10, http_hosts: ["localhost", "127.0.0.1", "::1"]}];
  // How long the token stays valid; unset is the server's default of 10
  // minutes, or the workspace's plan's maximum when that is shorter, and
  // more than the plan's maximum is RESOURCE_EXHAUSTED with the reason PLAN_LIMIT.
  google.protobuf.Duration expires_in = 3 [(toshi.bound) = {name: "embed_token_expires_in", unit: UNIT_SECONDS, default: 600}];
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the first answer; a different request with the
  // same key is refused. Keys are kept for 30 days by default.
  string request_key = 4;
}

message CreateEmbedTokenResponse {
  EmbedToken embed_token = 1;
  // The token to hand to the page. It is in this answer only.
  string token = 2;
}

message ListEmbedTokensRequest {
  // The project's name.
  string project = 1;
  // The most embed tokens in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListEmbedTokensResponse {
  repeated EmbedToken embed_tokens = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message RevokeEmbedTokenRequest {
  // The project's name.
  string project = 1;
  string embed_token_id = 2;
}

message RevokeEmbedTokenResponse {
  EmbedToken embed_token = 1;
}
