syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";
import "toshi/workspace/v1/roles.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// HookService keeps a workspace's hooks: WebAssembly modules the control
// plane runs to answer a question, such as whether to admit a workload. A
// hook is a WASI preview 1 command that reads one JSON document on stdin
// and writes one JSON object on stdout, with no host functions beyond WASI,
// within 16 MiB of memory and 100 ms per call. A module is at most 8 MiB
// and an input document at most 1 MiB and 64 KiB. A hook that fails in any
// way gives no answer, and the question is answered as a refusal: an
// admission hook's workload is refused, a transform's delivery dropped.
//
// The caller's credential names the workspace, as for WorkloadService.
// Each upload of a module is a version of its type, numbered from 1, and
// never changes. A workspace keeps 20 versions of a type, and an upload
// past that fails with RESOURCE_EXHAUSTED until DeleteHookVersion frees a
// place. Each project runs at most one admission version, which
// ActivateHook sets; each webhook connection at most one transform
// version, which ConnectionService.SetConnectionTransform sets.
service HookService {
  // UploadHookVersion stores a module as the type's next version. A module
  // that does not compile, imports anything beyond WASI or is not a WASI
  // command fails with INVALID_ARGUMENT. A module the type already has
  // returns that version, with created false.
  rpc UploadHookVersion(UploadHookVersionRequest) returns (UploadHookVersionResponse) {
    option (toshi.permission) = "hooks.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "hook.version_created"
      target: "hook:response.version.sha256"
    };
  }

  // ActivateHook sets the version of a type the project runs; version 0
  // leaves it running none. A version the workspace does not have is
  // NOT_FOUND.
  rpc ActivateHook(ActivateHookRequest) returns (ActivateHookResponse) {
    option (toshi.permission) = "hooks.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {
      action: "hook.version_activated"
      target: "project:project"
    };
  }

  // ListHooks returns the workspace's versions, without their modules,
  // ordered by type then version, each saying whether the project runs it.
  //
  // A page holds 100 versions when page_size is zero, and 1000 at most.
  rpc ListHooks(ListHooksRequest) returns (ListHooksResponse) {
    option (toshi.permission) = "hooks.read";
    option (toshi.scope) = "project";
  }

  // DeleteHookVersion deletes a version no project runs, freeing its place
  // among the 20 a workspace keeps; its number is not given again. A version
  // a project runs fails with FAILED_PRECONDITION, and one the workspace
  // does not have with NOT_FOUND.
  rpc DeleteHookVersion(DeleteHookVersionRequest) returns (DeleteHookVersionResponse) {
    option (toshi.permission) = "hooks.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "hook.version_deleted"
      target: "hook:response.deleted.sha256"
    };
  }

  // TestHook runs a stored version, or a module that is not uploaded, on a
  // sample document under the same limits, and activates nothing. A hook
  // that gives no answer is a refusal in the response, not an error; one
  // whose output is no answer of its type has the problem in the answer.
  rpc TestHook(TestHookRequest) returns (TestHookResponse) {
    option (toshi.permission) = "hooks.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "hook.tested"
      target: "none"
    };
  }
}

// HookType is the question a hook answers.
enum HookType {
  HOOK_TYPE_UNSPECIFIED = 0;
  // Whether a workload may be created.
  HOOK_TYPE_ADMISSION = 1;
  // What a webhook connection's received request becomes: it reshapes the
  // request into the event the connection delivers, or drops it. A
  // connection names the version it runs (SetConnectionTransform); no
  // project activates one.
  HOOK_TYPE_TRANSFORM = 2;
}

// HookVersion is one version of a workspace's hook of a type.
message HookVersion {
  HookType type = 1;
  // Its number among the type's versions, from 1.
  int32 version = 2;
  // The module's sha256, in lower-case hex.
  string sha256 = 3;
  // The module's size in bytes.
  int64 size_bytes = 4;
  Subject created_by = 5;
  google.protobuf.Timestamp create_time = 6;
  // Whether the request's project runs this version. Only ListHooks and
  // ActivateHook set it.
  bool active = 7;
}

message UploadHookVersionRequest {
  HookType type = 1;
  // The WebAssembly module, at most 8 MiB.
  bytes module = 2;
}

message UploadHookVersionResponse {
  HookVersion version = 1;
  // False when the type already had the module, as this version.
  bool created = 2;
}

message ActivateHookRequest {
  // The project; empty is the default project.
  string project = 1;
  HookType type = 2;
  // The version the project runs from now on; 0 for none.
  int32 version = 3;
}

message ActivateHookResponse {
  // The version the project runs; unset when it runs none.
  HookVersion active = 1;
}

message ListHooksRequest {
  // The project whose active versions are marked; empty is the default
  // project.
  string project = 1;
  // The type to list; unspecified lists every type.
  HookType type = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListHooksResponse {
  repeated HookVersion versions = 1;
  string next_page_token = 2;
}

message DeleteHookVersionRequest {
  HookType type = 1;
  int32 version = 2;
}

message DeleteHookVersionResponse {
  // The version deleted.
  HookVersion deleted = 1;
}

message TestHookRequest {
  HookType type = 1;
  // What to run: a stored version of the type, or a module, at most 8 MiB.
  oneof hook {
    int32 version = 2;
    bytes module = 3;
  }
  // The sample document, JSON, at most 1 MiB and 64 KiB.
  string document = 4;
}

message TestHookResponse {
  oneof result {
    // The JSON object the hook wrote.
    string output = 1;
    // Why the hook gave no answer.
    HookRefusal refusal = 2;
  }
  // How long the call took, compiling the module excluded.
  google.protobuf.Duration duration = 3;
  // What the output means for the hook's type, read as the platform reads
  // it; set with output.
  HookAnswer answer = 4;
}

// HookAnswer is a hook's output read as an answer of its type.
message HookAnswer {
  oneof answer {
    AdmissionAnswer admission = 1;
    TransformAnswer transform = 2;
    // Why the output is no answer of the type, which the platform treats
    // as a failure: an admission hook's workload is refused, and a
    // transform's delivery dropped as transform_invalid_output.
    string problem = 3;
  }
}

// AdmissionAnswer is an admission hook's answer.
message AdmissionAnswer {
  bool allow = 1;
  // The deny's message, at most 1 KiB.
  string message = 2;
}

// TransformAnswer is a transform hook's answer: the event the delivery
// becomes, or why it is dropped.
message TransformAnswer {
  oneof answer {
    TransformEvent event = 1;
    TransformDrop drop = 2;
  }
}

message TransformEvent {
  // The event's type, such as order.paid.
  string type = 1;
  // The event's data, a JSON object.
  string data = 2;
}

message TransformDrop {
  string reason = 1;
}

// HookRefusal is why a hook gave no answer.
message HookRefusal {
  // The reason class: "module", "input", "trap", "timeout", "memory" or
  // "output".
  string reason = 1;
  string message = 2;
}
