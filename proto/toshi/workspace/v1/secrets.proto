syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// SecretService keeps a workspace's secrets: a project's sets,
// their write-only keys and their grants. Each value is sealed with
// AES-256-GCM under the workspace's data key before the store sees it, and
// every version of a key is kept until the key or its set is deleted.
//
// The caller's credential names the workspace, as for WorkloadService.
// Every request names a set by its project and either its environment or
// shared, which is the project's shared set; a request that names both, or
// neither, fails with INVALID_ARGUMENT. A project or environment the
// workspace does not have is NOT_FOUND.
//
// No call returns a value: a key is answered with its name, version, size
// and time. CreateSecretSet takes a request_key; the other calls take none:
// a retried PutSecret makes one more version.
//
// A key can be one person's own: only the workloads that person starts
// receive it, beside the keys of the environment's set, while the person
// holds a role in the workspace. A sandbox's commands receive it only when
// that person runs them, and CI jobs never. A workspace token starts
// workloads as the person who created it. The calls on keys take own, for
// the caller's own key, or owner, a person's user id, for that person's.
service SecretService {
  // CreateSecretSet creates the set. A second set of the same environment,
  // or a second shared set, fails with ALREADY_EXISTS.
  rpc CreateSecretSet(CreateSecretSetRequest) returns (CreateSecretSetResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "none"};
  }
  // ListSecretSets returns the project's sets, the shared set first.
  //
  // A page holds 100 sets when page_size is zero, and 1000 at most.
  rpc ListSecretSets(ListSecretSetsRequest) returns (ListSecretSetsResponse) {
    option (toshi.permission) = "secrets.read";
    option (toshi.scope) = "project";
  }
  // DeleteSecretSet removes the set with its keys, versions and grants.
  rpc DeleteSecretSet(DeleteSecretSetRequest) returns (DeleteSecretSetResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "none"};
  }
  // PutSecret makes the key's next version, holding value, and returns the
  // key without it. A name is either shared or set per environment: a
  // shared name set in an environment's set, or an environment's name set
  // in the shared set, fails with FAILED_PRECONDITION. Two environments'
  // sets may hold the same name.
  //
  // With own the key is the caller's own, set apart from the environment's
  // set, which need not exist; a call that acts for no person fails with
  // FAILED_PRECONDITION. A person's own names follow the same rule among
  // themselves, and a name may not be both someone's own and not: either
  // fails with FAILED_PRECONDITION. Two people may own the same name.
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "secret.set"
      target: "none"
    };
  }
  // DeleteSecret removes the key and every version of it: with own the
  // caller's own key, with owner that person's.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "none"};
  }
  // ListSecrets returns the set's keys by name, each with its newest
  // version, and every person's own keys of the same place beside them,
  // each with its owner.
  //
  // A page holds 100 keys when page_size is zero, and 1000 at most.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (toshi.permission) = "secrets.read";
    option (toshi.scope) = "environment";
  }
  // ListSecretVersions returns the key's versions, oldest first: with own
  // the caller's own key's, with owner that person's.
  //
  // A page holds 100 versions when page_size is zero, and 1000 at most.
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse) {
    option (toshi.permission) = "secrets.read";
    option (toshi.scope) = "environment";
  }
  // GrantSecretSet lets VMs of a kind, of an image or of one service use an
  // environment's set. The shared set takes no grants, and a set granted to
  // a service has no other grantee: both fail with FAILED_PRECONDITION.
  rpc GrantSecretSet(GrantSecretSetRequest) returns (GrantSecretSetResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "none"};
  }
  // RevokeSecretSet removes a grant.
  rpc RevokeSecretSet(RevokeSecretSetRequest) returns (RevokeSecretSetResponse) {
    option (toshi.permission) = "secrets.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {target: "none"};
  }
  // ListSecretSetGrants returns the set's grants by kind and grantee.
  //
  // A page holds 100 grants when page_size is zero, and 1000 at most.
  rpc ListSecretSetGrants(ListSecretSetGrantsRequest) returns (ListSecretSetGrantsResponse) {
    option (toshi.permission) = "secrets.read";
    option (toshi.scope) = "environment";
  }
}

// SecretSet is a project's set: an environment's, or the shared one.
message SecretSet {
  string project = 1;
  // Empty for the shared set.
  string environment = 2;
  bool shared = 3;
  google.protobuf.Timestamp created_at = 4;
}

// Secret is a key as anyone may see it: never its value.
message Secret {
  string name = 1;
  // The newest version, from 1.
  int64 version = 2;
  // The newest version's size in bytes.
  int64 size = 3;
  google.protobuf.Timestamp updated_at = 4;
  // The user id of the person whose own key it is; empty for a key of the
  // set.
  string owner = 5;
  // The key is the caller's own.
  bool mine = 6;
  // The key's owner holds no role in the workspace any more: no workload
  // receives it, and it stays until it is deleted.
  bool owner_left = 7;
}

// SecretVersion is one stored version of a key, without its value.
message SecretVersion {
  int64 version = 1;
  int64 size = 2;
  google.protobuf.Timestamp created_at = 3;
}

// SecretGranteeKind is what a set is granted to.
enum SecretGranteeKind {
  SECRET_GRANTEE_KIND_UNSPECIFIED = 0;
  // VMs of a workload kind: grantee is job, sandbox or service.
  SECRET_GRANTEE_KIND_KIND = 1;
  // VMs of an image: grantee is the image's name.
  SECRET_GRANTEE_KIND_IMAGE = 2;
  // One service: grantee is its name.
  SECRET_GRANTEE_KIND_SERVICE = 3;
  // The builds of an image: grantee is the image's name. Its values reach
  // the build's setup command only, never a VM started from the image.
  SECRET_GRANTEE_KIND_IMAGE_BUILD = 4;
}

message SecretGrant {
  SecretGranteeKind kind = 1;
  string grantee = 2;
  google.protobuf.Timestamp created_at = 3;
}

message CreateSecretSetRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  string request_key = 4;
}

message CreateSecretSetResponse {
  SecretSet set = 1;
}

message ListSecretSetsRequest {
  string project = 1;
  // The most sets in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListSecretSetsResponse {
  repeated SecretSet sets = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message DeleteSecretSetRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
}

message DeleteSecretSetResponse {}

message PutSecretRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  // An environment variable's name: a letter or _, then letters, digits or
  // _, at most 128 characters.
  string name = 4;
  bytes value = 5;
  // The key is the caller's own.
  bool own = 6;
}

message PutSecretResponse {
  Secret secret = 1;
}

message DeleteSecretRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  string name = 4;
  // The caller's own key; not with owner.
  bool own = 5;
  // The own key of the person with this user id; not with own.
  string owner = 6;
}

message DeleteSecretResponse {}

message ListSecretsRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  // The most keys in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message ListSecretVersionsRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  string name = 4;
  // The most versions in one page; zero lets the server choose.
  int32 page_size = 5;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 6;
  // The caller's own key; not with owner.
  bool own = 7;
  // The own key of the person with this user id; not with own.
  string owner = 8;
}

message ListSecretVersionsResponse {
  repeated SecretVersion versions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GrantSecretSetRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  SecretGranteeKind kind = 4;
  string grantee = 5;
}

message GrantSecretSetResponse {
  SecretGrant grant = 1;
}

message RevokeSecretSetRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  SecretGranteeKind kind = 4;
  string grantee = 5;
}

message RevokeSecretSetResponse {}

message ListSecretSetGrantsRequest {
  string project = 1;
  string environment = 2;
  bool shared = 3;
  // The most grants in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
}

message ListSecretSetGrantsResponse {
  repeated SecretGrant grants = 1;
  // Empty on the last page.
  string next_page_token = 2;
}
