// ServiceRevision is one recipe of a service. Its recipe and image digest
// never change once made; selecting one runs its recipe from the service's
// next run.
message ServiceRevision {
  // Counts from 1 in the order the service's revisions were made.
  int64 number = 1;
  ServiceRevisionReason reason = 2;
  // The revision's recipe, resolved, in TOML.
  string recipe = 3;
  // The secret a SECRET revision was made for; never its value.
  string secret = 4;
  google.protobuf.Timestamp created_at = 5;
  // The recipe's container image as submitted, a registry reference;
  // empty for a service that runs in a VM.
  string container_image = 6;
  // The digest, sha256:<hex>, container_image named when the revision was
  // made. Every run of the revision pulls it; a rollback never resolves
  // the reference again.
  string container_image_digest = 7;
  // Whether a rollback may select the revision: it is one of the service's
  // 10 newest revisions, or in use, selected or the revision of a queued
  // or running run, and its registry did not last answer that it does not
  // serve the revision's image (image_check). Toshi keeps no copy of a
  // registry's image.
  bool eligible = 8;
  // Why a rollback may not select the revision; empty when eligible. It is
  // one of two reasons: the window ("revision N is older than the
  // service's 10 newest revisions and no run uses it"), or the registry's
  // last answer ("the registry answered <status> for <digest> at <time>:
  // it does not serve the revision's image (<message>)").
  string ineligible_reason = 9;
  // The last answer of the registry of container_image to a rollback's
  // check that it serves container_image_digest; unset until a rollback
  // selects the revision. Reading a revision asks no registry: the next
  // rollback to the revision checks again and replaces it.
  ServiceRevisionImageCheck image_check = 10;
  // The watch of the upgrade a deploy to a started service made to this
  // revision; unset for a revision no such deploy made.
  ServiceUpgrade upgrade = 11;
}

// ServiceUpgrade is the watch of a deploy to a started service. When the
// service has a state volume, the revision does not start until the run the
// deploy stopped has saved a version of the volume (SAVING), within the
// upgrade window; a save that is refused or does not finish in time rolls
// the upgrade back before the revision starts, unless the deploy allowed it
// to start without a saved version (allow_unsaved_volume). Its window, the
// recipe's upgrade_window (5 minutes unless set, at most 30), counts from
// the start of the revision's first run, and again from the next run's
// start after the run's host was lost. A run that fails inside the window,
// or a run not ready when the window ends, fails the upgrade: Toshi stops
// the run, restores the state volume's version the save pinned, selects
// from_revision again and starts it.
message ServiceUpgrade {
  ServiceUpgradeState state = 1;
  // The revision the deploy replaced.
  int64 from_revision = 2;
  google.protobuf.Duration window = 3;
  // When the window started; unset until the revision's first run starts.
  google.protobuf.Timestamp window_start_time = 4;
  // When the window ends; unset until it starts.
  google.protobuf.Timestamp window_end_time = 5;
  // The state volume's version a rollback restores: the one saved when the
  // deploy stopped the run before; 0 when none was saved.
  int64 volume_version = 6;
  // Why the upgrade failed, and whether the state volume was restored; set
  // once it is ROLLING_BACK, or ROLLED_BACK when the state volume was not
  // saved.
  string rollback_reason = 7;
  // When it passed, was rolled back or ended; unset while it is saving,
  // watched or rolling back.
  google.protobuf.Timestamp finish_time = 8;
  // When the deploy started the state volume's save; unset when the
  // service has no state volume or the save was skipped.
  google.protobuf.Timestamp volume_save_start_time = 9;
  // When the save ended; unset while it is SAVING.
  google.protobuf.Timestamp volume_save_finish_time = 10;
  // How the save ended: "saved as version N", "nothing to save; version N
  // pinned", "nothing to save; the volume has no saved version", or "not
  // saved: <why>; started without a saved version as the deploy allowed". Empty while it is SAVING, and when the save was
  // refused (rollback_reason says why).
  string volume_save_message = 11;
  // Whether the deploy let the revision start without a saved version of
  // the state volume (UpdateServiceRequest.allow_unsaved_volume).
  bool allow_unsaved_volume = 12;
}

// ServiceUpgradeState is where an upgrade's watch is.
enum ServiceUpgradeState {
  SERVICE_UPGRADE_STATE_UNSPECIFIED = 0;
  // Its window has not started or not ended yet.
  SERVICE_UPGRADE_STATE_WATCHING = 1;
  // Its run was ready when the window ended.
  SERVICE_UPGRADE_STATE_PASSED = 2;
  // It failed: from_revision is selected again and the state volume is
  // being restored.
  SERVICE_UPGRADE_STATE_ROLLING_BACK = 3;
  // It failed and was rolled back, or the state volume was not saved and
  // from_revision was selected again before the revision started.
  SERVICE_UPGRADE_STATE_ROLLED_BACK = 4;
  // A deploy, a rollback or a stop of the service ended the watch first.
  SERVICE_UPGRADE_STATE_ENDED = 5;
  // The revision waits for the state volume's save before it starts.
  SERVICE_UPGRADE_STATE_SAVING = 6;
}

// ServiceRevisionImageCheck is one answer of a revision's registry to the
// check a rollback makes before it selects the revision: a request for the
// manifest by digest, with the recipe's registry login, reading no image.
message ServiceRevisionImageCheck {
  ServiceRevisionImageOutcome outcome = 1;
  // The registry's HTTP status, such as "404 Not Found"; empty when no
  // answer came.
  string status = 2;
  // The registry's answer, or why it could not be asked.
  string message = 3;
  google.protobuf.Timestamp checked_at = 4;
}

// ServiceRevisionImageOutcome is what a rollback's check of a revision's
// image found.
enum ServiceRevisionImageOutcome {
  SERVICE_REVISION_IMAGE_OUTCOME_UNSPECIFIED = 0;
  // The registry serves the revision's digest.
  SERVICE_REVISION_IMAGE_OUTCOME_SERVED = 1;
  // The registry answered that it holds no such manifest or repository:
  // the revision is not eligible until a rollback finds it again.
  SERVICE_REVISION_IMAGE_OUTCOME_NOT_SERVED = 2;
  // The registry could not be reached, refused the login or failed. That
  // is no evidence the image is gone, and the revision stays as eligible
  // as the window makes it.
  SERVICE_REVISION_IMAGE_OUTCOME_CHECK_FAILED = 3;
}

// ServiceRevisionReason is why a revision was made.
enum ServiceRevisionReason {
  SERVICE_REVISION_REASON_UNSPECIFIED = 0;
  // A deploy of a recipe: the service's create, or an UpdateService of
  // spec.recipe.
  SERVICE_REVISION_REASON_DEPLOY = 1;
  // A secret set on the service: the recipe of the revision before.
  SERVICE_REVISION_REASON_SECRET = 2;
}

message RollbackServiceRequest {
  string project = 1;
  string environment = 2;
  // The service's workload id.
  string id = 3;
  // The revision to select.
  int64 revision = 4;
  // The revision the caller saw selected; 0 checks nothing.
  int64 expected_revision = 5;
  string request_key = 6;
}

message RollbackServiceResponse {
  // The service after the rollback.
  Service service = 1;
  // The rollback's activation.
  ServiceActivation activation = 2;
}

message ListServiceActivationsRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
}

message ListServiceActivationsResponse {
  // The service's activations, oldest first.
  repeated ServiceActivation activations = 1;
}

// ServiceActivation is one selection of a service's revision and what came
// of it: the outcome follows the first run of the revision.
message ServiceActivation {
  // Counts from 1 in the order the service's activations were made.
  int64 sequence = 1;
  ServiceActivationKind kind = 2;
  // Who asked for it.
  string actor = 3;
  // The request key of the call that asked for it, if it had one.
  string request_key = 4;
  // The revision selected before; 0 for the create.
  int64 from_revision = 5;
  // The revision selected.
  int64 to_revision = 6;
  google.protobuf.Timestamp requested_at = 7;
  // The run the outcome follows; empty until the revision's run is
  // queued.
  string run_id = 8;
  ServiceActivationOutcome outcome = 9;
  // A FAILED outcome's error: the run's.
  string error = 10;
  // The secrets' names and versions the run's start fixed; never a value.
  repeated ServiceSecretVersion secret_versions = 11;
}

// ServiceActivationKind is what selected a revision.
enum ServiceActivationKind {
  SERVICE_ACTIVATION_KIND_UNSPECIFIED = 0;
  SERVICE_ACTIVATION_KIND_CREATE = 1;
  // An UpdateService of spec.recipe.
  SERVICE_ACTIVATION_KIND_DEPLOY = 2;
  // A RollbackService.
  SERVICE_ACTIVATION_KIND_ROLLBACK = 3;
}

// ServiceActivationOutcome is what came of an activation. READY and FAILED
// are final.
enum ServiceActivationOutcome {
  SERVICE_ACTIVATION_OUTCOME_UNSPECIFIED = 0;
  // Selected; its run has not been ready yet, or the service is not
  // running.
  SERVICE_ACTIVATION_OUTCOME_SELECTED = 1;
  // Its run was ready.
  SERVICE_ACTIVATION_OUTCOME_READY = 2;
  // Its run ended with an error before it was ready.
  SERVICE_ACTIVATION_OUTCOME_FAILED = 3;
  // Its run is queued, held for capacity.
  SERVICE_ACTIVATION_OUTCOME_HELD = 4;
}

// ServiceSecretVersion is a secret's name and the version a run used.
message ServiceSecretVersion {
  string name = 1;
  int64 version = 2;
}

// ServiceRun is one run of a service: a job on a host.
message ServiceRun {
  // The run's job id.
  string id = 1;
  // The service revision it runs.
  int64 revision = 2;
  ServiceRunState state = 3;
  // Why a queued run waits, for example "service_quota" past the plan's
  // shared services, "no_own_capacity" while the workspace's own host is
  // full, or "volume_claimed" while the run before it still holds the
  // service's state volume; empty when it does not wait.
  string held = 4;
  google.protobuf.Timestamp queued_at = 5;
  // When its process started; unset before.
  google.protobuf.Timestamp started_at = 6;
  // When its health check last began to pass; unset while it is not
  // ready.
  google.protobuf.Timestamp ready_at = 7;
  // When it ended; unset while it is live.
  google.protobuf.Timestamp ended_at = 8;
  // Its process's exit code, when it exited.
  optional int32 exit_code = 9;
  // Why it ended, for a run that failed or was lost.
  string error = 10;
}

// ServiceRunState is where a service's run is.
enum ServiceRunState {
  SERVICE_RUN_STATE_UNSPECIFIED = 0;
  // Waiting for a host.
  SERVICE_RUN_STATE_QUEUED = 1;
  // Placed on a host, its VM booting.
  SERVICE_RUN_STATE_STARTING = 2;
  SERVICE_RUN_STATE_RUNNING = 3;
  // Asked to stop; its VM is being stopped.
  SERVICE_RUN_STATE_STOPPING = 4;
  // Its process exited 0.
  SERVICE_RUN_STATE_COMPLETED = 5;
  // Its process exited non-zero, or the run was lost with its host.
  SERVICE_RUN_STATE_FAILED = 6;
  // Stopped by a stop of its service or by a new revision.
  SERVICE_RUN_STATE_STOPPED = 7;
  // Stopped because its on-demand service went to sleep; not a failure.
  SERVICE_RUN_STATE_SLEPT = 8;
}
