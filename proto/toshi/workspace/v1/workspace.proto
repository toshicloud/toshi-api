syntax = "proto3";

// Package toshi.workspace.v1 is the Workspace API: WorkloadService's jobs,
// sandboxes and services, the executions and operations under them and the
// event log every change is written to, and the services of the workspace's
// other resources.
package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "toshi/workspace/v1/projects.proto";
import "toshi/workspace/v1/recordings.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// EndReason says how a workload ended.
enum EndReason {
  END_REASON_UNSPECIFIED = 0;
  // A job's command, or a sandbox's process, exited; the status's
  // exit_code says with what, 0 being success.
  END_REASON_EXITED = 1;
  // A sandbox or service was stopped.
  END_REASON_STOPPED = 2;
  // A job was cancelled before its command exited.
  END_REASON_CANCELLED = 3;
  // Toshi could not run or keep running it; the status's last_error says
  // why.
  END_REASON_FAILED = 4;
}

// StopReason is why a sandbox was stopped.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // Its owner stopped it: deleted it, or cancelled its job.
  STOP_REASON_OWNER = 1;
  // Its max_duration, or the plan's sandbox cap, passed.
  STOP_REASON_MAX_DURATION = 2;
  // The workspace's spend this month reached its spending cap.
  STOP_REASON_SPEND_CAP = 3;
  // The workspace was suspended.
  STOP_REASON_TENANT_SUSPENDED = 4;
  // The workspace's deletion was scheduled.
  STOP_REASON_TENANT_DELETED = 5;
  // An operator cancelled its job.
  STOP_REASON_OPERATOR = 6;
}

// Job runs one command once and ends.
message Job {
  // Assigned by the server; unique within the workspace, among its jobs,
  // sandboxes and services.
  string id = 1;
  string project = 2;
  string environment = 3;
  // Free-form labels, set at create and changed by UpdateJob.
  map<string, string> labels = 4;
  // The job as created.
  JobSpec spec = 5;
  JobStatus status = 6;
  // What it records of its runs, fixed at create: never UNSPECIFIED.
  RecordingPolicy recording = 7;
  // Whether the job is an agent: the image version it runs declares an
  // [agent] table in its recipe. Fixed at create; set by Toshi.
  bool agent = 8;
  // The prompts the job's agent waits on, oldest first: each is removed
  // when AnswerPrompt answers it, and all of them when the job's run ends.
  // Set by Toshi.
  repeated AgentPrompt waiting = 9;
  // The network policy the job was admitted with, its layers in order, and
  // whether its host enforces network rules at assignment. Unset for a job
  // recorded before workloads kept one.
  WorkloadNetwork network = 10;
}

// JobStatus is a job's state and when it got there.
message JobStatus {
  JobState state = 1;
  // Set once the state is ENDED: EXITED, CANCELLED or FAILED.
  EndReason end_reason = 2;
  // The most recent error Toshi met running the job.
  Error last_error = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  // When anything in the job last changed.
  google.protobuf.Timestamp updated_at = 8;
  // The command's exit status, set when end_reason is EXITED.
  optional int32 exit_code = 9;
  // The state in GitHub's words: "queued" while CREATED or QUEUED,
  // "in_progress" while RUNNING, "completed" once ENDED. A job being
  // prepared or placed is queued.
  string status = 10;
  // How the job completed in GitHub's words, empty until the status is
  // completed: "success" when its command exited 0, "failure" when it
  // exited with another status or Toshi could not run it (last_error says
  // why), "cancelled" when it was cancelled. "timed_out" is kept for a
  // job a time limit ends.
  string conclusion = 11;
  // When the job completed: the same instant as ended_at, under the name
  // GitHub gives it.
  google.protobuf.Timestamp completed_at = 12;
  // When the current attempt was assigned its runner, once the attempt
  // started. Unset while the job waits for a runner, and for a job that
  // ended before any attempt started.
  google.protobuf.Timestamp assigned_at = 13;
  // The runner that runs, or ran, the current attempt: its id and its
  // name, which for a job are the same. Unset until the attempt started:
  // a runner that was only assigned is in GetJobResponse.attempts.
  string runner_id = 14;
  string runner_name = 15;
  // The attempt that last started, counting from 1: each assignment to a
  // runner is one. 0 until an attempt started, and for a job that ended
  // before any did.
  int32 attempt = 16;
}

// JobAttempt is one attempt of a job: one assignment to a runner, and how
// it ended.
message JobAttempt {
  // Counting from 1.
  int32 attempt = 1;
  string runner_id = 2;
  string runner_name = 3;
  google.protobuf.Timestamp assigned_at = 4;
  // Unset when the attempt was assigned and never started.
  google.protobuf.Timestamp started_at = 5;
  // When the attempt ended; unset for the current attempt until the job
  // completed.
  google.protobuf.Timestamp completed_at = 6;
  // The attempt's conclusion in GitHub's words once the job completed in
  // it; empty for an attempt that was queued again.
  string conclusion = 7;
  // Why an attempt that was queued again ended, such as "requeued: its
  // assignment timed out"; empty for the current attempt.
  string end = 8;
}

// JobState is where a job is in its life. A job can skip a state: one
// cancelled while queued ends without running.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // Recorded, not yet waiting for capacity.
  JOB_STATE_CREATED = 1;
  // Waiting for capacity.
  JOB_STATE_QUEUED = 2;
  // Its VM is up and its command is running.
  JOB_STATE_RUNNING = 3;
  // It ended; the status's end_reason says how. An ended job does not run
  // again.
  JOB_STATE_ENDED = 4;
}

// Sandbox runs until it is stopped, deleted or its time limit passes.
message Sandbox {
  // Assigned by the server; unique within the workspace, among its jobs,
  // sandboxes and services.
  string id = 1;
  string project = 2;
  string environment = 3;
  // Free-form labels, set at create and changed by UpdateSandbox.
  map<string, string> labels = 4;
  // The sandbox as created, with max_duration as UpdateSandbox last raised
  // it.
  SandboxSpec spec = 5;
  SandboxStatus status = 6;
  // What it records of its runs, fixed at create: never UNSPECIFIED.
  RecordingPolicy recording = 7;
  // Whether the sandbox is an agent: the image version it runs declares an
  // [agent] table in its recipe. Fixed at create; set by Toshi.
  bool agent = 8;
  // The prompts the sandbox's agent waits on, oldest first: each is
  // removed when AnswerPrompt answers it, and all of them when the
  // sandbox's run ends. Set by Toshi.
  repeated AgentPrompt waiting = 9;
  // The network policy the sandbox was admitted with, its layers in order,
  // and whether its host enforces network rules at assignment. Unset for a
  // sandbox recorded before workloads kept one.
  WorkloadNetwork network = 10;
}

// SandboxStatus is a sandbox's state and when it got there.
message SandboxStatus {
  SandboxState state = 1;
  // Set once the state is ENDED: STOPPED or FAILED, or EXITED when its
  // spec's process exited.
  EndReason end_reason = 2;
  // The most recent error Toshi met running the sandbox.
  Error last_error = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  // When anything in the sandbox last changed.
  google.protobuf.Timestamp updated_at = 8;
  // Why it was stopped, set once it has ended: with STOPPED, and with
  // FAILED when it failed after a stop was asked.
  StopReason stop_reason = 9;
  // While it runs, its previews: one for each of its http channels served
  // at a hostname of its own, the channel `preview` among them. Empty
  // while the control plane serves no previews. Making or deleting such a
  // channel changes the sandbox, so WatchSandboxes sends it again.
  repeated SandboxPreview previews = 10;
  // When its spec's process started. Unset while it runs with a process
  // not started yet: its setup still runs. Never set for a sandbox without
  // a process.
  google.protobuf.Timestamp process_started_at = 11;
  // The exit code of its spec's process, set with end_reason EXITED: 0 is
  // success, any other code a failure, and -1 a process a signal ended.
  optional int32 exit_code = 12;
  // Set while a sandbox with keep_vm is stopped in CREATED; unset otherwise.
  google.protobuf.Timestamp stopped_at = 13;
}

// SandboxState is where a sandbox is in its life. A sandbox can skip a
// state: one deleted while queued ends without running.
enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  // Recorded, not yet waiting for capacity, or stopped with keep_vm.
  SANDBOX_STATE_CREATED = 1;
  // Waiting for capacity.
  SANDBOX_STATE_QUEUED = 2;
  // Its VM is up and serving.
  SANDBOX_STATE_RUNNING = 3;
  // It ended; the status's end_reason says how. An ended sandbox does not
  // run again.
  SANDBOX_STATE_ENDED = 4;
}

// Service is a long-running service, started, stopped, woken and held.
message Service {
  // Assigned by the server; unique within the workspace, among its jobs,
  // sandboxes and services.
  string id = 1;
  string project = 2;
  string environment = 3;
  // Free-form labels, set at create and changed by UpdateService.
  map<string, string> labels = 4;
  // The service as ServiceSpec describes its answers.
  ServiceSpec spec = 5;
  ServiceStatus status = 6;
  // Whether the service is an agent: the image version of its current
  // revision declares an [agent] table in its recipe. A deploy or a rollback
  // changes it; set by Toshi.
  bool agent = 7;
  // The prompts the service's agent waits on, oldest first: each is
  // removed when AnswerPrompt answers it, and all of them when the
  // service's run ends. Set by Toshi.
  repeated AgentPrompt waiting = 8;
  // The network policy the service was admitted with, its layers in order,
  // and whether its host enforces network rules at assignment. Unset for a
  // service recorded before workloads kept one.
  WorkloadNetwork network = 9;
}

// WorkloadNetwork is the network policy a workload was admitted with: its
// layers in order, and whether the host it was assigned to enforces network
// rules.
message WorkloadNetwork {
  // The layers in the order a connection is checked: operator, workspace,
  // environment, then request when the workload asked for one.
  repeated NetworkLayer layers = 1;
  // Whether the workload's host enforces network rules at assignment. An
  // unplaced workload is not enforced, with not_enforced_reason "not placed
  // yet".
  bool enforced = 2;
  // Why the host does not enforce network rules, when enforced is false.
  string not_enforced_reason = 3;
  // The most recent denials kept on the workload, newest first, at most 20;
  // absent from a workload stored before the field.
  repeated EgressDenial last_denials = 4;
}

// NetworkLayer is one named policy of a workload's network policy.
message NetworkLayer {
  // Its name: "operator", "workspace", "environment" or "request".
  string name = 1;
  NetworkPolicy policy = 2;
}

// ServiceStatus is a service's state and when it got there.
message ServiceStatus {
  ServiceState state = 1;
  // Set once the state is ENDED: STOPPED or FAILED.
  EndReason end_reason = 2;
  // The most recent error Toshi met running the service.
  Error last_error = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp queued_at = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  // When anything in the service last changed.
  google.protobuf.Timestamp updated_at = 8;
  // The service's live run: its revision, which is spec.revision once a
  // run of the selected revision is opened, and whether it is ready.
  // Unset while no run is live.
  ServiceRun live_run = 9;
  // The names visitors reach the service's http channels at, one per
  // channel of its current revision's recipe that has one: the front
  // channel at "<service>.<workspace>.svc.<domain>", every other at
  // "<port>-<service>.<workspace>.svc.<domain>". Empty while the
  // deployment hosts no names. Set by Toshi on GetService; ignored in a
  // request.
  repeated ProvidedName provided_names = 10;
  // Why a service with an http channel has no provided names, such as a
  // name that does not start with a letter; empty otherwise. Set by Toshi
  // on GetService.
  string provided_names_reason = 11;
}

// ProvidedName is the name one http channel of a service is reached at.
message ProvidedName {
  // The channel's name in the service's recipe.
  string channel = 1;
  // The full name, without a scheme or a port.
  string host = 2;
}

// ServiceState is where a service is in its life. Unlike a job or a
// sandbox, a service moves back: StopService returns it to CREATED, and an
// on-demand service that sleeps returns to CREATED until it is woken.
enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  // Recorded, and not started or asleep.
  SERVICE_STATE_CREATED = 1;
  // A run is waiting for capacity.
  SERVICE_STATE_QUEUED = 2;
  // A run's VM is up and serving.
  SERVICE_STATE_RUNNING = 3;
  // It ended; the status's end_reason says how. An ended service does not
  // run again.
  SERVICE_STATE_ENDED = 4;
}

// RecordingPolicy is what a workload records of its runs.
enum RecordingPolicy {
  // At create: the workspace plan's default for a job, and OFF for another
  // kind.
  RECORDING_POLICY_UNSPECIFIED = 0;
  // No capture. A file the run uploads as its test framework's recording
  // is still one of its recordings.
  RECORDING_POLICY_OFF = 1;
  // A screenshot strip of each run (RecordingService), unless a video or
  // trace the run uploaded as its test framework's recording is ready when
  // its strip is finished, after the run ended: the run then keeps that
  // recording and no strip. A job only: set for another kind it fails with
  // INVALID_ARGUMENT.
  RECORDING_POLICY_STRIP = 2;
  // A video of each run's screen, recorded by its host, on the same terms
  // as STRIP. A host that cannot record a video, because it has no encoder
  // or all its encoders are busy, takes a strip instead, and that
  // recording's reason says why. A job only: set for another kind it
  // fails with INVALID_ARGUMENT.
  RECORDING_POLICY_VIDEO = 3;
}

// JobSpec is a job: one command, run once.
message JobSpec {
  Command command = 1;
  // What in its workspace the job uses. Checked at create
  // against the job's project and environment, and fixed when the job
  // starts; GetJobResponse.bound shows what each was fixed to.
  repeated Binding bindings = 2;
  // The runner size the job runs at, a Linux size such as
  // "toshi-linux-2x": jobs run on Linux guests only. Empty in a create
  // takes the configured default size. Another value fails the create with
  // INVALID_ARGUMENT.
  string size = 3;
  // The image the job runs in, as a registry reference such as
  // "ghcr.io/example/app:1.4" or "ghcr.io/example/app@sha256:<hex>"; a
  // name without a registry is on docker.io. The job's command, its
  // executions and its file calls then run in a container of it, as the
  // image's user, with the VM's network, and with the run's home, its
  // working directory and its cache at their own paths; a command without
  // cwd starts in the home, not in the image's working directory. The pull
  // is part of the job's start. Empty: the job runs in its VM itself.
  //
  // A tag is resolved to a digest at create, and every run of the job pulls
  // that digest (container_image_digest); a digest is kept as given and
  // checked by the pull. The registry must be public. The resolve and the
  // pull are anonymous unless container_registry_secret names a login. A
  // create whose image cannot be resolved records nothing: it
  // fails with UNAVAILABLE when the registry cannot be reached in time,
  // FAILED_PRECONDITION when the registry refuses the image or holds no
  // such repository or tag, and INVALID_ARGUMENT for a reference that is
  // not one, a registry at an address that is not public, or an image
  // without the platform of the job's size (linux/amd64).
  string container_image = 4;
  // The digest container_image named at create, "sha256:<hex>": an index's
  // when the tag names one. Set by the server; ignored in a request.
  string container_image_digest = 5;
  // The key of the job's environment's secret set, its own or the
  // project's shared, whose value is the registry login for
  // container_image: a Docker config.json with an "auths" entry for the
  // image's registry (a config that names a credential store or helper
  // is refused). The create resolves the tag with it and each pull reads
  // the key's value as it is then, while the digest stays the one the
  // create resolved; each read is recorded as a read of the set. It needs
  // container_image and a secrets binding, else the create fails with
  // INVALID_ARGUMENT; a key the set does not hold, or a set not granted to
  // jobs, fails it with FAILED_PRECONDITION. A config with no entry for
  // the registry leaves the pull anonymous. Empty: no login.
  string container_registry_secret = 6;
  // The name of an image of the workspace to boot the job's VM from.
  // Its newest ready version is fixed at create; it cannot be combined
  // with container_image.
  string image = 7;
  // The image version fixed at create. Set by the server; ignored in a
  // request.
  string image_version_id = 8;
}

// Binding is one binding a workload declares.
message Binding {
  // Names the binding in the workload: a lowercase DNS label, unique in
  // the workload.
  string name = 1;
  // What the binding is to. Set exactly one.
  oneof target {
    // A channel of a service of the workload's project and environment.
    ServiceChannel service = 2;
    // The secret set of the workload's environment.
    EnvironmentSecrets secrets = 3;
    // The deployment's mail listener, which sends the workload's messages
    // through its mail provider. At most one per workload.
    Mail mail = 4;
  }
}

// ServiceChannel is a channel of a service, by the service's name and the
// channel's name in its recipe, as a recipe's uses names it:
// "<service>.<channel>".
message ServiceChannel {
  string service = 1;
  string channel = 2;
}

// EnvironmentSecrets binds the secret set of the workload's environment,
// with the project's shared keys. The set must grant the workload's kind.
message EnvironmentSecrets {}

// Mail binds the deployment's mail listener: the command gets the
// listener's host and port and a credential it authenticates with, and
// sends as a service of its workspace. The workspace's plan must allow mail
// (mail_messages_per_day above 0).
message Mail {}

// BoundBinding is a binding as it was fixed when its workload started.
// A later change or delete of the target leaves it as it is.
message BoundBinding {
  string name = 1;
  oneof target {
    BoundService service = 2;
    BoundSecrets secrets = 3;
    BoundMail mail = 5;
  }
  google.protobuf.Timestamp taken_at = 4;
}

// BoundService is a service channel as it was when the workload started.
message BoundService {
  string service = 1;
  // The service's workload ID.
  string service_id = 2;
  // The service's revision that was current.
  int64 revision = 3;
  string channel = 4;
  // The channel's shape and, for an http channel, its guest port.
  string shape = 5;
  int32 port = 6;
  // What the channel accepts from the caller: "workload_identity", a
  // connect credential signed by the workload identity issuer
  // naming audience and this binding. Minted when the job's command
  // starts, and passed only to that command.
  string credential = 7;
  string audience = 8;
  // The id (jti) of the connect credential minted for this binding. Never
  // the credential.
  string credential_id = 9;
}

// BoundMail is a mail binding as it was fixed when the workload started:
// the credential the mail listener accepts, "workload_identity", the
// audience it names and its id (jti). Never the credential.
message BoundMail {
  string credential = 1;
  string audience = 2;
  string credential_id = 3;
}

// BoundSecrets is the environment's secret set as it was when the
// workload started: which keys, from which set, at which version. Never
// a value.
message BoundSecrets {
  string set_id = 1;
  repeated BoundKey keys = 2;
}

message BoundKey {
  // The set the key is in: the environment's set or the project's shared
  // set.
  string set_id = 1;
  string name = 2;
  int64 version = 3;
}

// RequestNetwork is what a sandbox asks to reach: the request layer of its
// network policy.
message RequestNetwork {
  // Each entry is a destination the sandbox may reach, "DEST[:PORTS][/tcp|/udp]"
  // as the project network rules write it.
  repeated string egress = 1;
}

// SandboxSpec is a sandbox: a VM that runs until its owner
// deletes it or Toshi stops it.
message SandboxSpec {
  // The runner size of its VM, as a job's runs-on label names one, for
  // example "toshi-linux-2x". Required.
  string size = 1;
  // How long it may run, in whole minutes. Unset, it runs until the plan's
  // sandbox cap passes, or until it is stopped when the plan sets none. It
  // cannot be longer than the plan's cap. Its owner can raise it while the
  // sandbox runs (UpdateSandbox).
  google.protobuf.Duration max_duration = 2;
  // What in its workspace the sandbox uses: the secret set of its
  // environment and the channels of its project's and environment's
  // services. Checked at create and fixed when the sandbox starts; each
  // Execute gets the secret set's fixed values in its command's
  // environment, and reaches a bound http channel by the service's name,
  // <service>.toshi, at the channel's port.
  repeated Binding bindings = 3;
  // Create only: the id of a state volume of the sandbox's project to
  // attach to it, which it mounts when it starts. A volume of another
  // project, or one attached or held elsewhere, fails the create with
  // FAILED_PRECONDITION. Answers carry the id the create named, even after
  // a detach; VolumeService answers what a volume is attached to now.
  string state_volume_id = 4;
  // The image the sandbox's executions and file calls run in, as
  // JobSpec.container_image says for a job's, resolved at create the same
  // way. A sandbox of a size that is not Linux fails the create
  // with INVALID_ARGUMENT.
  string container_image = 5;
  // As JobSpec.container_image_digest. Set by the server; ignored in a
  // request.
  string container_image_digest = 6;
  // As JobSpec.container_registry_secret, for the sandbox's image.
  string container_registry_secret = 7;
  // Create only: a command the sandbox's host runs once in it after it
  // starts running, before process. It must exit 0: any other exit ends
  // the sandbox FAILED with last_error.code "setup_failed", the exit code
  // and the end of its output in the message. It runs where an Execute
  // runs, in container_image when one is set, with the environment an
  // Execute gets. Unset: none.
  Command setup = 8;
  // Create only: a command the sandbox's host starts in it once setup
  // exited 0 (at once without setup) and keeps running for the sandbox's
  // run; status.process_started_at says when it started. Its exit ends the
  // sandbox EXITED with the exit code in
  // status.exit_code, 0 being success. Another code also sets
  // last_error.code "process_exited", with the code and the end of its
  // output in the message; a process that could not start ends the sandbox
  // FAILED with that code. A stop or the time limit ends it with the
  // sandbox. It runs where and with the environment setup does. Unset:
  // none.
  Command process = 9;
  // As JobSpec.image, for the sandbox's VM.
  string image = 10;
  // As JobSpec.image_version_id. Set by the server; ignored in a request.
  string image_version_id = 11;
  // Create only: a commit the sandbox's host clones into the directory
  // `source` of the home directory once it runs, before setup; setup and
  // process then start in it, or in their cwd taken as a path inside it.
  // The clone uses a token that reads only that repository's contents,
  // made for the clone alone: setup and process never see it, and no copy
  // is kept in the sandbox. It runs where setup does, so the VM, or
  // container_image when one is set, needs `sh` and `git`. A clone that
  // fails, or that finds another commit at ref, ends the sandbox FAILED
  // with last_error.code "setup_failed". Unset: nothing is cloned.
  SandboxSource source = 12;
  // Create only: the destinations the sandbox may reach, each an entry as
  // RequestNetwork.egress writes one. With it set the sandbox reaches only
  // those entries, and only where the project's and environment's policies
  // allow them. Unset means no request layer.
  RequestNetwork network = 13;
  // Create only: keep the VM on one of the workspace's own hosts while the
  // sandbox is stopped. StopSandbox and StartSandbox keep its disk. The
  // workspace must enable keep_vm, hold fewer than keep_vm.max VMs, and have
  // an own host whose agent keeps VMs; otherwise create fails with
  // FAILED_PRECONDITION and reason KEEP_VM_UNAVAILABLE.
  bool keep_vm = 14;
}

// SandboxSource is a commit of a repository that one of the workspace's
// connections reaches.
message SandboxSource {
  // The id of the GITHUB connection that reaches the repository.
  string connection = 1;
  // The repository, as owner/name; one the sandbox's project holds.
  string repository = 2;
  // The ref the commit is fetched by, for example `refs/pull/42/head`.
  string ref = 3;
  // The commit's full SHA, which ref must point at.
  string commit = 4;
}

// ServiceSpec is a service. Its fields are set wherever a service's
// workload is answered: every workload and service call's answer, the
// workload events and the webhook deliveries. A create sets name, size,
// mode, recipe, state_volume and bindings and ignores revision and
// template; answers leave recipe, state_volume and bindings empty. An
// event carries the spec as of its own write; an event written before
// events carried it has none.
message ServiceSpec {
  // The runner size its runs are placed by, for example "toshi-linux-2x".
  // Empty in a create takes the configured default size.
  string size = 1;
  // How it runs; set in a create, where UNSPECIFIED is always-on, and
  // with SetServiceMode.
  ServiceMode mode = 2;
  // The number of its current revision: its next run runs that recipe.
  int64 revision = 3;
  // Its name, a lower-case DNS label, unique among the workspace's services
  // that are not deleted, whatever their project or environment. Set in
  // a create; answers carry it.
  string name = 4;
  // The template its recipe starts from: "agent", "mcp-server",
  // "model-server", "database", "browser", "dev-server", "media-server",
  // "proxy" or "custom". Set by the server; ignored in a request.
  string template = 5;
  // The recipe of revision 1 in a create, and the recipe to deploy in an
  // UpdateService of spec.recipe, in TOML. Answers leave it empty.
  string recipe = 6;
  // Create only: a state volume made with the service. Answers leave it
  // unset.
  StateVolumeSpec state_volume = 7;
  // Create only: the service's bindings, a secret set or its project's
  // and environment's services' channels. Answers leave them empty.
  repeated Binding bindings = 8;
  // Whether a started on-demand service is asleep: no run is live, and
  // nothing keeps it awake. Set by the server; ignored in a request.
  bool sleeping = 9;
  // Until when a started on-demand service stays awake with no hold;
  // unset for an always-on service. Set by the server; ignored in a
  // request.
  google.protobuf.Timestamp awake_until = 10;
  // The digest the current revision's container_image named when the
  // revision was made, "sha256:<hex>", and empty for a recipe without one:
  // every run of the revision pulls it, a retry, a wake and a new VM
  // included. Set by the server; ignored in a request.
  string container_image_digest = 11;
}

// StateVolumeSpec is the state volume a service is created with: it is
// named after the service.
message StateVolumeSpec {
  // The volume's size cap, in bytes.
  int64 size_cap_bytes = 1;
}

// ServiceMode is how a service runs.
enum ServiceMode {
  SERVICE_MODE_UNSPECIFIED = 0;
  // Runs while it is started, and runs again after each run ends.
  SERVICE_MODE_ALWAYS_ON = 1;
  // Runs while it is awake: woken by WakeService, a hold or a connect on
  // one of its channels, and asleep again after its recipe's idle period
  // with no hold.
  SERVICE_MODE_ON_DEMAND = 2;
}

// Command is a program to run in a workload's VM. argv is not passed
// through a shell.
message Command {
  // The program and its arguments; argv[0] is looked up on the PATH.
  repeated string argv = 1;
  // Added to the environment the command starts with.
  map<string, string> env = 2;
  // The working directory; empty means the VM's default.
  string cwd = 3;
}

// SandboxPreview is where a browser opens one http channel of a sandbox.
message SandboxPreview {
  // The channel's name; `preview` for the port the sandbox's image
  // declares.
  string channel = 1;
  // The guest port the channel reaches.
  int32 port = 2;
  // The preview's origin, a scheme and a hostname without a path.
  string url = 3;
}

// Error is a failure carried in a resource rather than returned by a call.
message Error {
  // A Connect error code name, such as "unavailable". A sandbox ended by
  // its own commands has "setup_failed" or "process_exited" instead.
  string code = 1;
  string message = 2;
}

// Output is what a job's command wrote, returned with the call that waited
// for it.
message Output {
  bytes stdout = 1;
  bytes stderr = 2;
  // True when the server kept only the start of a stream.
  bool truncated = 3;
}

message WatchOutputRequest {
  string project = 1;
  string environment = 2;
  // The job's ID.
  string id = 3;
  // Where each stream starts: a byte position in what the server holds of
  // that stream, counted from its first byte, so zero starts at the start.
  // A negative position fails with INVALID_ARGUMENT, and one past the bytes
  // the server holds when the call starts fails with OUT_OF_RANGE; both are
  // checked before anything is sent. A client that reconnects passes how
  // many bytes of each stream it has received.
  int64 stdout_offset = 4;
  int64 stderr_offset = 5;
}

// WatchOutputResponse is one message of a WatchOutput stream. The bytes of
// each stream arrive in order; the order between the two is not kept.
message WatchOutputResponse {
  oneof message {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last message, sent once every byte held has been sent.
    OutputEnd end = 3;
  }
}

// OutputEnd is how a job ended.
message OutputEnd {
  // Unset when the job was cancelled, or failed before its command ran
  // because a binding's target was gone (its status's last_error says so).
  optional int32 exit_code = 1;
  bool cancelled = 2;
  // True when the server kept only the start of a stream.
  bool truncated = 3;
}

message WatchTelemetryRequest {
  string project = 1;
  string environment = 2;
  // The sandbox's ID.
  string id = 3;
  // Samples stored after this position: a cursor from an earlier
  // WatchTelemetry message for the same sandbox; empty starts at the oldest
  // sample kept. A malformed cursor fails with INVALID_ARGUMENT.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30 seconds by
  // default). Without it the stream sends samples and the end only.
  bool keepalive = 5;
}

// WatchTelemetryResponse is one message of a WatchTelemetry stream.
message WatchTelemetryResponse {
  oneof message {
    TelemetrySample sample = 1;
    // Its cursor is that of the last sample sent; before the first, the
    // request's cursor (empty when the request had none).
    Keepalive keepalive = 2;
    // The last message.
    TelemetryEnd end = 3;
  }
}

// TelemetrySample is one window of a sandbox VM's resource use, as its host
// measured it. Every field but cursor, at, window_ms and the memory fields
// is the amount used within the window.
message TelemetrySample {
  // The position to resume after this sample.
  string cursor = 1;
  // The end of the window, on the host's clock.
  google.protobuf.Timestamp at = 2;
  // The window's length in milliseconds.
  int32 window_ms = 3;
  // CPU time the VM used in the window, in milliseconds.
  int64 cpu_ms = 4;
  // Time the VM's threads were ready to run but waited for a host CPU, in
  // milliseconds.
  int64 cpu_wait_ms = 5;
  // Memory in use inside the guest at its highest in the window, in MiB.
  // Unset when the guest does not report it.
  optional int64 guest_memory_mib = 6;
  // Host memory the VM held (resident) at its highest in the window, in MiB.
  int64 host_memory_mib = 7;
  // Bytes the VM read from and wrote to its disks.
  int64 disk_read_bytes = 8;
  int64 disk_write_bytes = 9;
  // Bytes the guest received and sent on its network interfaces. Unset when
  // the guest does not report them.
  optional int64 net_rx_bytes = 10;
  optional int64 net_tx_bytes = 11;
  // Processes the guest kernel's out-of-memory killer killed. Unset when the
  // guest does not report it.
  optional int32 oom_kills = 12;
}

// TelemetryEnd ends a WatchTelemetry stream: the sandbox has ended.
message TelemetryEnd {}

message WatchGuestLogRequest {
  string project = 1;
  string environment = 2;
  // The sandbox's ID.
  string id = 3;
  // Where to start: a cursor from an earlier WatchGuestLog message for the
  // same sandbox; empty starts at the oldest byte the host keeps. A
  // malformed cursor fails with INVALID_ARGUMENT. A cursor from an earlier
  // start of the sandbox's VM starts at the oldest byte of the current
  // start, whatever its offset. A cursor of the current start past the
  // bytes written when the watch reaches the console, after any wait for
  // the sandbox to start, fails with OUT_OF_RANGE. Both errors come before
  // any message.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30 seconds by
  // default). Without it the stream sends chunks and the end only.
  bool keepalive = 5;
}

// WatchGuestLogResponse is one message of a WatchGuestLog stream.
message WatchGuestLogResponse {
  oneof message {
    GuestLogChunk chunk = 1;
    // Its cursor is where the stream would resume: after the last byte
    // sent, or before the first chunk the position it started from, in the
    // VM's current start.
    Keepalive keepalive = 2;
    // The last message.
    GuestLogEnd end = 3;
  }
}

// GuestLogChunk is a run of console bytes in the order the VM wrote them.
message GuestLogChunk {
  // The position of the first byte: the number of bytes the VM wrote to
  // its console before it, in this start. An offset past the end of the
  // previous chunk means the bytes between are no longer kept.
  int64 offset = 1;
  bytes data = 2;
  // Names the VM start the offset counts in. A new start counts from zero
  // again and has a different start.
  string start = 3;
  // The position to resume after this chunk.
  string cursor = 4;
}

// GuestLogEnd ends a WatchGuestLog stream: the sandbox has ended.
message GuestLogEnd {}

message ExecuteRequest {
  oneof message {
    // First and only once.
    ExecuteStart start = 1;
    // Bytes for the command's standard input.
    bytes stdin = 2;
    // Closes the command's standard input.
    bool close_stdin = 3;
  }
}

// ExecuteStart starts an execution.
message ExecuteStart {
  string project = 1;
  string environment = 2;
  // The sandbox the command runs in.
  string sandbox_id = 3;
  Command command = 4;
  // A retry with the same key does not start a second command: its stream
  // carries the first execution's started message and, once it has ended,
  // its exit. Output already sent is not sent again.
  string request_key = 5;
}

message ExecuteResponse {
  oneof message {
    // First and only once.
    ExecutionStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    // Last.
    ExecutionExit exit = 4;
  }
}

// ExecuteCommandRequest starts an execution whose standard input is closed.
message ExecuteCommandRequest {
  string project = 1;
  string environment = 2;
  // The sandbox the command runs in.
  string sandbox_id = 3;
  Command command = 4;
  // A retry with the same key does not start a second command: its stream
  // carries the first execution's started message and, once it has ended,
  // its exit. Output already sent is not sent again.
  string request_key = 5;
}

message ExecuteCommandResponse {
  oneof message {
    // First and only once.
    ExecutionStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    // Last.
    ExecutionExit exit = 4;
  }
}

// ExecutionStarted names an execution.
message ExecutionStarted {
  string execution_id = 1;
}

// ExecutionExit is how an execution ended.
message ExecutionExit {
  // Unset when the execution was cancelled.
  optional int32 exit_code = 1;
  bool cancelled = 2;
}

message CancelExecutionRequest {
  string project = 1;
  string environment = 2;
  string execution_id = 3;
  string request_key = 4;
}

message CancelExecutionResponse {}

// Operation is an action that takes long. Its caller waits on it for a
// bounded time and asks again while it is not done.
message Operation {
  string id = 1;
  // The workload it acts on.
  string workload_id = 2;
  bool done = 3;
  // Set when the operation is done and failed.
  Error error = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp done_at = 6;
}

message GetOperationRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
}

message GetOperationResponse {
  Operation operation = 1;
}

message WaitOperationRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // The longest to block.
  google.protobuf.Duration timeout = 4;
}

message WaitOperationResponse {
  Operation operation = 1;
}

// EventType is the closed set of event types. Built-in event names are
// reserved: job.*, sandbox.*, run.*, service.*, recording.*, agent.*,
// takeover.*, spend.*, egress.*, host.*, github.*, webhook.* and mail.*.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // A workload was created. Name: "<kind>.created".
  EVENT_TYPE_WORKLOAD_CREATED = 1;
  // A workload's state changed. Name: "<kind>.state_changed".
  EVENT_TYPE_WORKLOAD_STATE_CHANGED = 2;
  // A workload's labels changed. Name: "<kind>.updated".
  EVENT_TYPE_WORKLOAD_UPDATED = 3;
  // A workload was removed. Name: "<kind>.deleted".
  EVENT_TYPE_WORKLOAD_DELETED = 4;
  // An execution started. Name: "<kind>.execution_started".
  EVENT_TYPE_EXECUTION_STARTED = 5;
  // An execution ended. Name: "<kind>.execution_ended".
  EVENT_TYPE_EXECUTION_ENDED = 6;
  // An event a guest emitted under its own name, delivered as sent.
  EVENT_TYPE_EMITTED = 7;
  // A run's recording is ready. Name: "recording.ready".
  EVENT_TYPE_RECORDING_READY = 8;
  // An event a connection received, about no workload. Name:
  // "<kind>.<event>.<action>", the connection's kind and what the sender
  // said happened, such as "github.pull_request.opened", or
  // "<kind>.<event>" for an event with no action, such as "github.push".
  EVENT_TYPE_CONNECTION = 9;
  // A release of a workload's secrets withheld keys: its starter's own,
  // while the starter holds no role in the workspace. Name:
  // "<kind>.secret_withheld".
  EVENT_TYPE_SECRET_WITHHELD = 10;
  // A workload a trigger made is ready, with the link of its channel. Name:
  // "trigger.ready".
  EVENT_TYPE_TRIGGER_READY = 11;
  // A workload a trigger made failed, with why. Name: "trigger.failed".
  EVENT_TYPE_TRIGGER_FAILED = 12;
  // A workload a trigger made was removed, with why. Name:
  // "trigger.removed".
  EVENT_TYPE_TRIGGER_REMOVED = 13;
  // A service's upgrade failed in its window and was rolled back to the
  // revision it replaced, with why. Name: "service.upgrade_rolled_back".
  EVENT_TYPE_UPGRADE_ROLLED_BACK = 14;
  // A person answered a prompt an agent waits on, with the answer and who
  // gave it. Name: "agent.answered". AnswerPrompt writes it; a workload
  // cannot emit it.
  EVENT_TYPE_AGENT_ANSWERED = 15;
  // The connections a host's firewall refused the workload since its last
  // such event. Name: "<kind>.egress_denied". Payload: EgressDeniedEvent.
  EVENT_TYPE_EGRESS_DENIED = 16;
  // The mail listener handed a message the workload sent to the mail
  // provider, which accepted it. Name: "mail.sent".
  EVENT_TYPE_MAIL_SENT = 17;
}

// Event is one entry of the event log. Every state change and every event a
// workload emits is written to the durable log before it is delivered. Delivery is
// at least once: a receiver drops a repeat by its id. The events of one
// workload are delivered in the order they were written.
message Event {
  // Unique; the same on every delivery of this event.
  string id = 1;
  EventType type = 2;
  // A built-in name such as "job.state_changed", or the name a guest gave.
  string name = 3;
  // The workload the event is about; empty for CONNECTION.
  string workload_id = 4;
  google.protobuf.Timestamp time = 5;
  // Resume after this event.
  string cursor = 6;
  reserved 7;
  reserved "workload";
  oneof payload {
    // The job after the change, for the WORKLOAD_* types of a job.
    Job job = 13;
    // The sandbox after the change, for the WORKLOAD_* types of a sandbox.
    Sandbox sandbox = 14;
    // The service after the change, for the WORKLOAD_* types of a service.
    Service service = 15;
    // For the EXECUTION_* types.
    ExecutionEvent execution = 8;
    // For EMITTED.
    EmittedEvent emitted = 9;
    // For RECORDING_READY.
    RecordingEvent recording = 10;
    // For CONNECTION.
    ConnectionEvent connection = 17;
    // For SECRET_WITHHELD.
    SecretWithheldEvent secret_withheld = 18;
    // For the TRIGGER_* types.
    TriggerResult trigger = 19;
    // For UPGRADE_ROLLED_BACK.
    UpgradeRolledBackEvent upgrade_rolled_back = 20;
    // For AGENT_ANSWERED.
    AgentAnswerEvent agent_answer = 21;
    // For EGRESS_DENIED.
    EgressDeniedEvent egress_denied = 22;
    // For MAIL_SENT.
    MailSentEvent mail_sent = 23;
  }
  // The project the workload or the connection's event belongs to; set on
  // every event.
  string project = 11;
  // The environment the workload or the connection's event belongs to; set
  // on every event.
  string environment = 12;
  // The connection that received a CONNECTION event; empty for the others.
  string connection_id = 16;
}

// UpgradeRolledBackEvent is a service upgrade that failed in its window and
// was rolled back.
message UpgradeRolledBackEvent {
  // The revision whose upgrade failed.
  int64 revision = 1;
  // The revision rolled back to, selected again.
  int64 from_revision = 2;
  // Why the upgrade failed, and whether the state volume was restored.
  string reason = 3;
  // The state volume's version restored; 0 when none was.
  int64 volume_version = 4;
}

// SecretWithheldEvent names the keys one release of a workload's secrets
// withheld, never a value. A start writes it once; a release a later answer
// or an execution makes writes one each time it withholds a key.
message SecretWithheldEvent {
  // The run the release was for: a service's run at its start, or the run
  // a later answer released; empty for a job's or a sandbox's start.
  string run_id = 1;
  // The execution the release was for, for a sandbox's execution.
  string execution_id = 2;
  repeated WithheldSecret keys = 3;
}

// WithheldSecret is one key a release withheld.
message WithheldSecret {
  // The key's name.
  string name = 1;
  // The person whose own key it is: their user id.
  string owner = 2;
  // Why it was withheld: "owner_has_no_role", the owner holds no role in
  // the workspace.
  string reason = 3;
}

// EgressDeniedEvent is the connections a host's firewall refused a
// workload's run since its last such event, newest first.
message EgressDeniedEvent {
  // The run the denials were for; empty when the host did not say.
  string run_id = 1;
  repeated EgressDenial denials = 2;
}

// EgressDenial is one connection a host's firewall refused a workload's run,
// and the layer of its network policy that denied it.
message EgressDenial {
  // The destination refused.
  string address = 1;
  // tcp, udp or other.
  string protocol = 2;
  // 0 for other.
  int32 port = 3;
  // The policy layer that denied it: "operator", "workspace", "environment"
  // or "request".
  string layer = 4;
  // Its rule or default: "rule 2: deny 10.0.0.0/8" or "default deny".
  string entry = 5;
  // Packets refused.
  int64 packets = 6;
  // When the host reported it.
  google.protobuf.Timestamp time = 7;
}

// TriggerResult is the payload of a trigger's events: the trigger, the key
// its event named, the workload it made for the key, the event that caused
// it, the link of the workload's channel once it is ready, why it failed or
// was removed, and the commit it was made from.
message TriggerResult {
  string trigger_id = 1;
  string trigger_name = 2;
  // The key the trigger's event named.
  string key = 3;
  // The workload it made for the key; empty when it made none.
  string workload_id = 4;
  // The event that caused it; empty when none did.
  string event_id = 5;
  // The link of the workload's channel, once it is ready.
  string link = 6;
  // Why it failed or was removed.
  string reason = 7;
  // The commit it was made from.
  string head_sha = 8;
  // The exit code of the sandbox's process, with reason "process_exited"
  // when the sandbox's status has one: 0 is success, -1 a process a signal
  // ended.
  optional int32 exit_code = 9;
  // With reason "process_exited" or "setup_failed", the sandbox's
  // last_error message: the exit code and the end of the command's
  // output. Empty for a process that exited 0.
  string message = 10;
}

// ExecutionEvent is an execution starting or ending.
message ExecutionEvent {
  string execution_id = 1;
  repeated string argv = 2;
  // Set when the execution ended.
  ExecutionExit exit = 3;
}

// EmittedEvent is an event a guest emitted.
message EmittedEvent {
  bytes data = 1;
}

// AgentAnswerEvent is a person's answer to a prompt an agent waited on.
message AgentAnswerEvent {
  // The prompt's id, as the agent gave it.
  string prompt_id = 1;
  // The answer: one of a question's options, a question's free text, or
  // "approved" or "denied" for an approval.
  string answer = 2;
  // The Toshi user id of the person who answered.
  string answered_by = 3;
}

// MailSentEvent is a message a workload's mail binding sent: the mail
// provider accepted it. It names no address.
message MailSentEvent {
  // The mail binding's name.
  string binding = 1;
  // The message's Message-ID header, without its angle brackets.
  string message_id = 2;
  // How many recipients the message named.
  int32 recipients = 3;
  // The id the mail provider gave the message; empty when it gave none.
  string provider_message_id = 4;
}

// AgentPrompt is a question or an approval an agent workload asked that
// nobody has answered yet. AnswerPrompt answers it.
message AgentPrompt {
  // The prompt's id, as the agent gave it; unique among the prompts the
  // workload waits on.
  string id = 1;
  // "agent.question" or "agent.approval": the event that asked it.
  string name = 2;
  // What an approval asks to be let do: plan, push, pull_request, command
  // or domain. Empty for a question.
  string kind = 3;
  string text = 4;
  // The answers a question offers; empty for an approval and for a
  // question answered in free text.
  repeated string options = 5;
  // The event that asked it.
  string event_id = 6;
  google.protobuf.Timestamp asked_at = 7;
}

// ConnectionEvent is an event a connection received.
message ConnectionEvent {
  // What the connection received. A webhook connection's event, named
  // webhook.received, is a JSON object of the sender's type (the body's
  // top-level "type" string), content_type, webhook_id, sent_at and the
  // body as the sender sent it.
  bytes data = 1;
}

// RecordingEvent names a recording, its kind and its artifact, never a
// URL: RecordingService.GetRecording signs one.
message RecordingEvent {
  string recording_id = 1;
  string artifact_id = 2;
  // UNSPECIFIED in an event stored before recordings had a kind: that
  // recording is a strip.
  RecordingKind kind = 3;
}

message ListEventsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every workload.
  string workload_id = 3;
  // From an earlier response's next_page_token or cursor, or an event's
  // cursor: the events after that position. Empty starts at the oldest
  // event the log keeps; a position older than that event fails with
  // OUT_OF_RANGE.
  string page_token = 4;
  // The most events in one page; zero lets the server choose.
  int32 page_size = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  // The position after the last event returned, or the page_token asked
  // for when there were none. WatchEvents from this cursor shows every
  // event after this page.
  string cursor = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

message WatchEventsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every workload.
  string workload_id = 3;
  // Events after this position; empty starts at the oldest event the log
  // keeps. A cursor older than that event fails with OUT_OF_RANGE.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30
  // seconds by default). Without it the stream sends changes only.
  bool keepalive = 5;
}

message WatchEventsResponse {
  Event event = 1;
  // Set on a keepalive, with every other field empty. Only a request
  // with keepalive set gets one.
  Keepalive keepalive = 2;
}

// Keepalive tells a watcher that its stream is open while the watch has
// nothing to send, also while the log gains only events its filter
// leaves out.
message Keepalive {
  // When the server sent it.
  google.protobuf.Timestamp sent_at = 1;
  // The log position the watch has read up to, which can be past events
  // it read and did not send; WatchEvents with workload_id reads only
  // that workload's events. Resuming from it misses nothing the stream
  // would still have sent.
  string cursor = 2;
}

// PreviewShareLinkState is where a share link is in its life.
enum PreviewShareLinkState {
  PREVIEW_SHARE_LINK_STATE_UNSPECIFIED = 0;
  // Minted; no device has opened it yet.
  PREVIEW_SHARE_LINK_STATE_OPEN = 1;
  // A device opened it; it admits that device only.
  PREVIEW_SHARE_LINK_STATE_IN_USE = 2;
  PREVIEW_SHARE_LINK_STATE_REVOKED = 3;
  // Its connections carried its byte cap.
  PREVIEW_SHARE_LINK_STATE_ENDED = 4;
  PREVIEW_SHARE_LINK_STATE_EXPIRED = 5;
}

// PreviewShareLink is one share link of one of a sandbox's previews,
// without the link itself.
message PreviewShareLink {
  // Assigned by the server.
  string id = 1;
  // The sandbox whose preview the link opens.
  string sandbox_id = 2;
  PreviewShareLinkState state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // The most bytes, both ways, its connections may carry.
  int64 max_bytes = 6;
  // The bytes its connections have carried so far.
  int64 used_bytes = 7;
  // Unset until a device opens it.
  google.protobuf.Timestamp opened_at = 8;
  // Unset unless it was revoked.
  google.protobuf.Timestamp revoked_at = 9;
  // Unset unless it ended.
  google.protobuf.Timestamp ended_at = 10;
  // The channel whose preview the link opens: `preview` for the sandbox's
  // own hostname, or another of its http channels.
  string channel = 11;
  // The guest port that channel reaches.
  int32 port = 12;
}

message CreatePreviewShareLinkRequest {
  string project = 1;
  string environment = 2;
  // The sandbox whose preview the link opens.
  string sandbox_id = 3;
  // How long the link stays valid, at most the plan's maximum; unset is
  // 24 hours, or the plan's maximum when that is shorter.
  google.protobuf.Duration expires_in = 4;
  // The most bytes, both ways, its connections may carry, at most the
  // plan's; 0 is the plan's.
  int64 max_bytes = 5;
  // The preview the link opens: one of the sandbox's http channels, by
  // its name or by its guest port. Neither set is the channel `preview`.
  oneof channel_ref {
    string channel = 6;
    int32 port = 7;
  }
}

