syntax = "proto3";

// Package toshi.workspace.v1 is the Workspace API: the one workload resource
// of every kind (job, sandbox, service), the executions and operations under
// it, and the event log every change is written to.
package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/workspace/v1/recordings.proto";

option go_package = "github.com/toshicloud/toshi-api/workspacev1";

// WorkspaceService is the Workspace API. The caller's credential
// names the workspace; every request names the project and the environment
// in its project and environment fields, and a call that leaves either empty
// fails with INVALID_ARGUMENT. The environment is one of the project's
// environments; a project or environment the workspace does not
// have is NOT_FOUND. A workload, execution, operation or event of another
// project or environment is NOT_FOUND.
//
// Every mutating call takes a request_key. A key is bound to the workspace,
// the call and the request's payload: a retry with the same key and the same
// payload returns what the first call returned and starts nothing new; the
// same key with a different payload fails with FAILED_PRECONDITION.
// CreateWorkload requires a key: a create without one fails with
// INVALID_ARGUMENT. For the other calls an empty key means no retry
// protection. CancelWorkload takes none: a repeat of it changes nothing.
//
// A caller over its rate limit gets RESOURCE_EXHAUSTED with a
// google.rpc.RetryInfo detail: the delay before a retry, on every protocol.
// The same whole seconds are in a Retry-After response header on Connect and
// gRPC-Web calls and on gRPC streams, and in the trailing metadata of a gRPC
// unary call.
service WorkspaceService {
  // CreateWorkload creates a workload of the kind its spec names and returns
  // it. With wait_for_end set, a job's call blocks until the job ends or the
  // bound passes. If the job has ended when the call answers, the answer
  // carries its exit status and output without a second read; otherwise it
  // carries the job as it is and no output, and no later call returns it.
  rpc CreateWorkload(CreateWorkloadRequest) returns (CreateWorkloadResponse);

  // GetWorkload returns one workload. An unknown ID fails with NOT_FOUND.
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);

  // ListWorkloads returns the workloads that match every filter that is set,
  // oldest first, a page at a time. A page token from one call stays valid
  // while workloads are created: a later page never repeats or skips a
  // workload of an earlier one.
  rpc ListWorkloads(ListWorkloadsRequest) returns (ListWorkloadsResponse);

  // PatchWorkload changes the fields the mask names and returns the workload.
  // "labels" can be changed on any workload. "sandbox.max_duration" raises a
  // running sandbox's limit and must be the only path: the new limit, in
  // whole minutes from the sandbox's start, above its current one and no
  // longer than the plan's sandbox cap. The response then carries an
  // operation, which completes successfully when the sandbox's host
  // acknowledges the new limit in time and the sandbox still runs with no
  // stop asked for; until then the workload shows the current one. The
  // operation fails with UNAVAILABLE when the host does not acknowledge the
  // limit in time, and with FAILED_PRECONDITION when the sandbox stops
  // first; the limit the control plane records is then unchanged. A host
  // that applied the new limit but whose acknowledgment was lost can keep
  // it until it takes the old limit back or the sandbox stops. A sandbox
  // that is not running, has a stop asked for, has no limit of its own or
  // has a raise pending, or whose host's agent cannot take a new limit,
  // fails with FAILED_PRECONDITION. Another path fails with
  // INVALID_ARGUMENT.
  rpc PatchWorkload(PatchWorkloadRequest) returns (PatchWorkloadResponse);

  // DeleteWorkload ends a workload that has not ended and then removes it.
  // A job is cancelled, a sandbox or service is stopped, and every execution
  // in it is cancelled. It returns an operation that is done once the
  // workload is removed; GetWorkload then fails with NOT_FOUND, and the event
  // log keeps its events.
  rpc DeleteWorkload(DeleteWorkloadRequest) returns (DeleteWorkloadResponse);

  // CancelWorkload cancels a job that has not ended and returns it. The job
  // is kept: it ends with END_REASON_CANCELLED, and GetWorkload and
  // ListWorkloads return it. A job whose command has not started ends at
  // once, and the answer carries the end; a job whose command runs ends
  // once its host has stopped it, and WaitWorkload waits for that end.
  // Every execution in the job is cancelled. A call for a job that has
  // ended changes nothing and returns the job as it is. An unknown ID fails
  // with NOT_FOUND; a sandbox or service fails with INVALID_ARGUMENT, since
  // DeleteWorkload stops one.
  rpc CancelWorkload(CancelWorkloadRequest) returns (CancelWorkloadResponse);

  // WaitWorkload blocks until the workload is in one of the states asked for
  // or the bound passes, whichever is first, and returns the workload as it
  // then is. Passing the bound is not an error: reached is false, and the
  // caller asks again. The server may wait less than the bound asked for.
  rpc WaitWorkload(WaitWorkloadRequest) returns (WaitWorkloadResponse);

  // WatchWorkloads streams each change to a workload as the event log
  // records it, from the position after a cursor, then as changes happen.
  // A cursor from ListWorkloads, ListEvents or an earlier message resumes
  // with no change missed and none repeated, while the log still keeps the
  // events after it; an older cursor fails with OUT_OF_RANGE.
  rpc WatchWorkloads(WatchWorkloadsRequest) returns (stream WatchWorkloadsResponse);

  // WatchOutput streams a job's standard output and error while it runs:
  // the bytes the server holds from the offsets asked for, then each write
  // as it happens, and last how the job ended. A job that has not started
  // yet is waited for. The server holds the first 1 MiB of each stream, as
  // for CreateWorkload's output, and only while the job runs: a job whose
  // output this server no longer holds (it has ended) or never held (its
  // command runs on another server) fails with FAILED_PRECONDITION, and a
  // job that ends while the call is answered is followed to its end. A
  // sandbox or service fails with INVALID_ARGUMENT.
  // A reader never slows or cancels the job: each reads what the server
  // holds at its own pace.
  rpc WatchOutput(WatchOutputRequest) returns (stream WatchOutputResponse);

  // WatchTelemetry streams a sandbox's resource samples as its host reports
  // them, in cursor order: the samples kept after a cursor, then each one as
  // it is stored. Each sample stored takes the next cursor, also one timed
  // before a sample already sent. Last comes an end, once the sandbox has
  // ended and every sample still kept that was stored before it ended has
  // been sent. A host can report a sample after the end: a watch resumed
  // from the last cursor returns it, then ends again. A sandbox that has
  // not started yet is waited for. A job or service fails with
  // INVALID_ARGUMENT.
  rpc WatchTelemetry(WatchTelemetryRequest) returns (stream WatchTelemetryResponse);

  // WatchGuestLog streams what a sandbox's VM writes to its serial console:
  // the bytes its host keeps from a cursor on, then each write as it
  // happens, until the sandbox ends. The host keeps the newest part of the
  // console; bytes it no longer keeps are skipped, and the next chunk's
  // offset shows the gap. A slow reader does not block the VM's console
  // writes; bytes rotated out before it reads them are skipped. A sandbox
  // that has not started yet is waited for, and so is an empty console. A
  // sandbox that has ended, or whose host keeps no console log, fails with
  // FAILED_PRECONDITION. A job or service fails with INVALID_ARGUMENT.
  rpc WatchGuestLog(WatchGuestLogRequest) returns (stream WatchGuestLogResponse);

  // Execute starts a command in a running workload. The first request
  // carries the start message; later requests carry standard input. The
  // stream answers with the execution's ID, then its standard output and
  // error as they are written, and ends with its exit status. A workload
  // that is not running fails with FAILED_PRECONDITION. A server may cancel
  // an execution whose client stops reading its output.
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse);

  // CancelExecution stops an execution. Its Execute stream ends with an exit
  // that says it was cancelled. Cancelling an execution that has ended
  // changes nothing. It returns once the execution has ended, whether or not
  // the Execute stream's client still reads it.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);

  // GetOperation returns one operation. An unknown ID fails with NOT_FOUND.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);

  // WaitOperation blocks until the operation is done or the bound passes,
  // whichever is first, and returns it. Passing the bound is not an error:
  // the operation comes back not done, and the caller asks again. The server
  // may wait less than the bound asked for.
  rpc WaitOperation(WaitOperationRequest) returns (WaitOperationResponse);

  // ListEvents returns the events after a cursor, oldest first, a page at a
  // time, for a client that polls or catches up after downtime.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // WatchEvents streams the events after a cursor, then each new event as
  // it is written, for a client that stays connected.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // CreatePreviewShareLink mints a share link for one of a running
  // sandbox's previews: the channel `preview`, served at the sandbox's own
  // hostname, unless the request names another of its http channels. The
  // link is a signed link that admits one device, the first to open it,
  // until it expires, carries its byte cap or is revoked, and only at that
  // channel's hostname. The link is in this answer only. The sandbox must
  // be running with that preview open, or the call fails with
  // FAILED_PRECONDITION, as it does when the workspace's plan turns share
  // links off. A channel or port the sandbox has no http channel for fails
  // with NOT_FOUND; a channel that is not http, a port outside 1 to 65535,
  // or an expiry or a byte cap above the plan's, with INVALID_ARGUMENT.
  rpc CreatePreviewShareLink(CreatePreviewShareLinkRequest) returns (CreatePreviewShareLinkResponse);

  // ListPreviewShareLinks returns a sandbox's share links, for all of its
  // previews, the oldest first, never with the link itself.
  rpc ListPreviewShareLinks(ListPreviewShareLinksRequest) returns (ListPreviewShareLinksResponse);

  // RevokePreviewShareLink revokes a share link: it admits no device
  // again, and its open connections end within seconds. Revoking a link
  // that was revoked or has ended returns it as it is.
  rpc RevokePreviewShareLink(RevokePreviewShareLinkRequest) returns (RevokePreviewShareLinkResponse);

  // StartService starts a service. An always-on service's workload
  // moves from CREATED to QUEUED and its first run is queued as a job on
  // a host, placed by the service's size; the run's start moves the
  // workload to RUNNING. While the service is started, a run that ends is
  // followed by another. An on-demand service is started asleep: it runs
  // only once WakeService, a hold or a connect on one of its channels
  // wakes it, and sleeps again when it has been idle for its recipe's
  // idle period. Starting a started service returns it as it is. A size
  // that is not a Linux one and a start past the plan's shared services
  // fail with FAILED_PRECONDITION.
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);

  // StopService stops a service: its workload moves back to CREATED and
  // its live run is stopped. Stopping a service that is not started
  // returns it as it is.
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);

  // SetServiceMode sets a service's mode. A started service stays
  // started: set to ON_DEMAND, it sleeps once it is idle; set to
  // ALWAYS_ON while asleep, its next run is queued.
  rpc SetServiceMode(SetServiceModeRequest) returns (SetServiceModeResponse);

  // WakeService wakes a started on-demand service that is asleep: its
  // workload moves from CREATED to QUEUED and a run is queued, placed as a
  // start is. A wake keeps the service awake for its recipe's idle period;
  // waking an awake one extends that. The answer does not wait for the run
  // to be ready: its ServiceRun's ready_at says when it is. Waking a
  // started always-on service returns it as it is; a service that is not
  // started fails with FAILED_PRECONDITION.
  rpc WakeService(WakeServiceRequest) returns (WakeServiceResponse);

  // HoldService takes or renews the caller's hold on a started service:
  // while any hold is live, an on-demand service does not sleep, and a
  // hold on one that is asleep wakes it. Each caller has one hold per
  // service, live until its time to live runs out or ReleaseService drops
  // it. A hold gives no access to the service. A service that is not
  // started fails with FAILED_PRECONDITION, and a time to live above an
  // hour with INVALID_ARGUMENT.
  rpc HoldService(HoldServiceRequest) returns (HoldServiceResponse);

  // ReleaseService drops the caller's hold on a service. Releasing a hold
  // the caller does not have returns the service as it is.
  rpc ReleaseService(ReleaseServiceRequest) returns (ReleaseServiceResponse);

  // ListServiceRuns returns a service's runs, the newest first: each run
  // is a job on a host, of the revision that was current when it was
  // queued.
  rpc ListServiceRuns(ListServiceRunsRequest) returns (ListServiceRunsResponse);
}

// WorkloadKind says how a workload runs and ends.
enum WorkloadKind {
  WORKLOAD_KIND_UNSPECIFIED = 0;
  // Starts, runs its command and ends on its own.
  WORKLOAD_KIND_JOB = 1;
  // Runs until its owner stops it.
  WORKLOAD_KIND_SANDBOX = 2;
  // A long-running service.
  WORKLOAD_KIND_SERVICE = 3;
}

// WorkloadState is where a workload is in its life. Every kind shares it. A
// workload can skip a state: a job cancelled while queued ends without
// running.
enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  // Recorded, not yet waiting for capacity.
  WORKLOAD_STATE_CREATED = 1;
  // Waiting for capacity.
  WORKLOAD_STATE_QUEUED = 2;
  // Its VM is up: a job's command is running, a sandbox or service is
  // serving.
  WORKLOAD_STATE_RUNNING = 3;
  // It ended; the status's end_reason says how. An ended workload does not
  // run again.
  WORKLOAD_STATE_ENDED = 4;
}

// EndReason says how a workload ended.
enum EndReason {
  END_REASON_UNSPECIFIED = 0;
  // A job's command exited; the status's exit_code says with what.
  END_REASON_EXITED = 1;
  // A sandbox or service was stopped.
  END_REASON_STOPPED = 2;
  // A job was cancelled before its command exited.
  END_REASON_CANCELLED = 3;
  // Toshi could not run or keep running it; the status's last_error says
  // why.
  END_REASON_FAILED = 4;
}

// StopReason is why a sandbox was stopped.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // Its owner stopped it: deleted it, or cancelled its job.
  STOP_REASON_OWNER = 1;
  // Its max_duration, or the plan's sandbox cap, passed.
  STOP_REASON_MAX_DURATION = 2;
  // The workspace's spend this month reached its spending cap.
  STOP_REASON_SPEND_CAP = 3;
  // The workspace was suspended.
  STOP_REASON_TENANT_SUSPENDED = 4;
  // The workspace's deletion was scheduled.
  STOP_REASON_TENANT_DELETED = 5;
  // An operator cancelled its job.
  STOP_REASON_OPERATOR = 6;
}

// Workload is one unit of work of any kind.
message Workload {
  // Assigned by the server; unique within the workspace.
  string id = 1;
  // Follows from which spec is set.
  WorkloadKind kind = 2;
  // The kind-specific spec, as created.
  oneof spec {
    JobSpec job = 3;
    SandboxSpec sandbox = 4;
    ServiceSpec service = 5;
  }
  WorkloadStatus status = 6;
  string project = 7;
  string environment = 8;
  // Free-form labels, set at create and changed by PatchWorkload.
  map<string, string> labels = 9;
  // What it records of its runs, fixed at create: never UNSPECIFIED.
  RecordingPolicy recording = 10;
}

// RecordingPolicy is what a workload records of its runs.
enum RecordingPolicy {
  // At create: the workspace plan's default for a job, and OFF for another
  // kind.
  RECORDING_POLICY_UNSPECIFIED = 0;
  // No capture. A file the run uploads as its test framework's recording
  // is still one of its recordings.
  RECORDING_POLICY_OFF = 1;
  // A screenshot strip of each run (RecordingService), unless a video or
  // trace the run uploaded as its test framework's recording is ready when
  // its strip is finished, after the run ended: the run then keeps that
  // recording and no strip. A job only: set for another kind it fails with
  // INVALID_ARGUMENT.
  RECORDING_POLICY_STRIP = 2;
  // A video of each run's screen, recorded by its host, on the same terms
  // as STRIP. A host that cannot record a video, because it has no encoder
  // or all its encoders are busy, takes a strip instead, and that
  // recording's reason says why. A job only: set for another kind it
  // fails with INVALID_ARGUMENT.
  RECORDING_POLICY_VIDEO = 3;
}

// JobSpec is a job: one command, run once.
message JobSpec {
  Command command = 1;
  // What in its workspace the job uses. Checked at create
  // against the job's project and environment, and fixed when the job
  // starts; GetWorkloadResponse.bound shows what each was fixed to.
  repeated Binding bindings = 2;
}

// Binding is one binding a workload declares.
message Binding {
  // Names the binding in the workload: a lowercase DNS label, unique in
  // the workload.
  string name = 1;
  // What the binding is to. Set exactly one.
  oneof target {
    // A channel of a service of the workload's project and environment.
    ServiceChannel service = 2;
    // The secret set of the workload's environment.
    EnvironmentSecrets secrets = 3;
  }
}

// ServiceChannel is a channel of a service, by the service's name and the
// channel's name in its recipe, as a recipe's uses names it:
// "<service>.<channel>".
message ServiceChannel {
  string service = 1;
  string channel = 2;
}

// EnvironmentSecrets binds the secret set of the workload's environment,
// with the project's shared keys. The set must grant the workload's kind.
message EnvironmentSecrets {}

// BoundBinding is a binding as it was fixed when its workload started.
// A later change or delete of the target leaves it as it is.
message BoundBinding {
  string name = 1;
  oneof target {
    BoundService service = 2;
    BoundSecrets secrets = 3;
  }
  google.protobuf.Timestamp taken_at = 4;
}

// BoundService is a service channel as it was when the workload started.
message BoundService {
  string service = 1;
  // The service's workload ID.
  string service_id = 2;
  // The service's revision that was current.
  int64 revision = 3;
  string channel = 4;
  // The channel's shape and, for an http channel, its guest port.
  string shape = 5;
  int32 port = 6;
  // What the channel accepts from the caller: "workload_identity", a
  // connect credential signed by the workload identity issuer
  // naming audience and this binding. Minted when the job's command
  // starts, and passed only to that command.
  string credential = 7;
  string audience = 8;
  // The id (jti) of the connect credential minted for this binding. Never
  // the credential.
  string credential_id = 9;
}

// BoundSecrets is the environment's secret set as it was when the
// workload started: which keys, from which set, at which version. Never
// a value.
message BoundSecrets {
  string set_id = 1;
  repeated BoundKey keys = 2;
}

message BoundKey {
  // The set the key is in: the environment's set or the project's shared
  // set.
  string set_id = 1;
  string name = 2;
  int64 version = 3;
}

// SandboxSpec is a sandbox: a VM that runs until its owner
// deletes it or Toshi stops it.
message SandboxSpec {
  // The runner size of its VM, as a job's runs-on label names one, for
  // example "toshi-linux-2x". Required.
  string size = 1;
  // How long it may run, in whole minutes. Unset, it runs until the plan's
  // sandbox cap passes, or until it is stopped when the plan sets none. It
  // cannot be longer than the plan's cap. Its owner can raise it while the
  // sandbox runs (PatchWorkload).
  google.protobuf.Duration max_duration = 2;
  // What in its workspace the sandbox uses: only the secret set
  // of its environment. Checked at create and fixed when the sandbox
  // starts; each Execute gets the fixed values in its command's
  // environment.
  repeated Binding bindings = 3;
  // Create only: the id of a state volume of the sandbox's project to
  // attach to it, which it mounts when it starts. A volume of another
  // project, or one attached or held elsewhere, fails the create with
  // FAILED_PRECONDITION. Answers carry the id the create named, even after
  // a detach; VolumeService answers what a volume is attached to now.
  string state_volume_id = 4;
}

// ServiceSpec is a service. Its fields are set wherever a service's
// workload is answered: every workload and service call's answer, the
// workload events and the webhook deliveries. A create sets name, size,
// mode, recipe, state_volume and bindings and ignores revision and
// template; answers leave recipe, state_volume and bindings empty. An
// event carries the spec as of its own write; an event written before
// events carried it has none.
message ServiceSpec {
  // The runner size its runs are placed by, for example "toshi-linux-2x".
  // Empty in a create takes the configured default size.
  string size = 1;
  // How it runs; set in a create, where UNSPECIFIED is always-on, and
  // with SetServiceMode.
  ServiceMode mode = 2;
  // The number of its current revision: its next run runs that recipe.
  int64 revision = 3;
  // Its name, a lower-case DNS label, unique among the tenant's services
  // that are not deleted, whatever their project or environment. Set in
  // a create; answers carry it.
  string name = 4;
  // The template its recipe starts from: "agent", "mcp-server",
  // "model-server", "database", "browser", "dev-server", "media-server",
  // "proxy" or "custom". Set by the server; ignored in a request.
  string template = 5;
  // Create only: the recipe of revision 1, in TOML. Answers leave it
  // empty.
  string recipe = 6;
  // Create only: a state volume made with the service. Answers leave it
  // unset.
  StateVolumeSpec state_volume = 7;
  // Create only: the service's bindings, secret sets only. Answers leave
  // them empty.
  repeated Binding bindings = 8;
  // Whether a started on-demand service is asleep: no run is live, and
  // nothing keeps it awake. Set by the server; ignored in a request.
  bool sleeping = 9;
  // Until when a started on-demand service stays awake with no hold;
  // unset for an always-on service. Set by the server; ignored in a
  // request.
  google.protobuf.Timestamp awake_until = 10;
}

// StateVolumeSpec is the state volume a service is created with: it is
// named after the service.
message StateVolumeSpec {
  // The volume's size cap, in bytes.
  int64 size_cap_bytes = 1;
}

// ServiceMode is how a service runs.
enum ServiceMode {
  SERVICE_MODE_UNSPECIFIED = 0;
  // Runs while it is started, and runs again after each run ends.
  SERVICE_MODE_ALWAYS_ON = 1;
  // Runs while it is awake: woken by WakeService, a hold or a connect on
  // one of its channels, and asleep again after its recipe's idle period
  // with no hold.
  SERVICE_MODE_ON_DEMAND = 2;
}

// Command is a program to run in a workload's VM. argv is not passed
// through a shell.
message Command {
  // The program and its arguments; argv[0] is looked up on the PATH.
  repeated string argv = 1;
  // Added to the environment the command starts with.
  map<string, string> env = 2;
  // The working directory; empty means the VM's default.
  string cwd = 3;
}

// WorkloadStatus is a workload's state and when it got there.
message WorkloadStatus {
  WorkloadState state = 1;
  // Set once the state is ENDED.
  EndReason end_reason = 2;
  // A job's exit status, set when end_reason is EXITED.
  optional int32 exit_code = 3;
  // The most recent error Toshi met running the workload.
  Error last_error = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp queued_at = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  // When anything in the workload last changed.
  google.protobuf.Timestamp updated_at = 9;
  // Why a sandbox was stopped, set once it has ended: with STOPPED, and
  // with FAILED when it failed after a stop was asked.
  StopReason stop_reason = 10;
  // A running sandbox's previews: one for each of its http channels served
  // at a hostname of its own, the channel `preview` among them. Empty for
  // a job, and while the control plane serves no previews. Making or
  // deleting such a channel changes the workload, so WatchWorkloads sends
  // it again.
  repeated SandboxPreview previews = 11;
}

// SandboxPreview is where a browser opens one http channel of a sandbox.
message SandboxPreview {
  // The channel's name; `preview` for the port the sandbox's image
  // declares.
  string channel = 1;
  // The guest port the channel reaches.
  int32 port = 2;
  // The preview's origin, a scheme and a hostname without a path.
  string url = 3;
}

// Error is a failure carried in a resource rather than returned by a call.
message Error {
  // A Connect error code name, such as "unavailable".
  string code = 1;
  string message = 2;
}

// Output is what a job's command wrote, returned with the call that waited
// for it.
message Output {
  bytes stdout = 1;
  bytes stderr = 2;
  // True when the server kept only the start of a stream.
  bool truncated = 3;
}

message CreateWorkloadRequest {
  string project = 1;
  string environment = 2;
  // Exactly one is set; it names the kind.
  oneof spec {
    JobSpec job = 3;
    SandboxSpec sandbox = 4;
    ServiceSpec service = 5;
  }
  map<string, string> labels = 6;
  // Required: the same key on every retry of this create.
  string request_key = 7;
  // For a job: block until it ends, at most this long. Zero returns at once.
  // Set for another kind it fails with INVALID_ARGUMENT.
  google.protobuf.Duration wait_for_end = 8;
  // What the workload records of its runs. UNSPECIFIED takes the default
  // RecordingPolicy names.
  RecordingPolicy recording = 9;
}

message CreateWorkloadResponse {
  Workload workload = 1;
  // Set when wait_for_end was set and the job had ended when the call
  // answered.
  Output output = 2;
}

message GetWorkloadRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
}

message GetWorkloadResponse {
  Workload workload = 1;
  // The workload's bindings as they were fixed when it started, in name
  // order; empty before it started.
  repeated BoundBinding bound = 2;
}

message ListWorkloadsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every kind.
  repeated WorkloadKind kinds = 3;
  // Empty matches every state.
  repeated WorkloadState states = 4;
  // The most workloads in one page; zero lets the server choose.
  int32 page_size = 5;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 6;
  // Only the workloads that carry every one of these labels, each with
  // exactly this value. A workload without one of the keys never matches,
  // even when the value given is empty. No labels matches every workload.
  map<string, string> labels = 7;
}

message ListWorkloadsResponse {
  repeated Workload workloads = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // The event log's position when the first page was read; every page of
  // the list returns it. WatchWorkloads from this cursor shows every change
  // after the list.
  string cursor = 3;
}

message PatchWorkloadRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // Carries the new values of the fields update_mask names.
  Workload workload = 4;
  google.protobuf.FieldMask update_mask = 5;
  string request_key = 6;
}

message PatchWorkloadResponse {
  Workload workload = 1;
  // Set when the mask names "sandbox.max_duration": completes successfully
  // when the sandbox's host acknowledges the new limit in time.
  Operation operation = 2;
}

message DeleteWorkloadRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  string request_key = 4;
}

message DeleteWorkloadResponse {
  Operation operation = 1;
}

message CancelWorkloadRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
}

message CancelWorkloadResponse {
  Workload workload = 1;
}

message WaitWorkloadRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // Return once the workload is in any of these states; empty means ENDED.
  repeated WorkloadState states = 4;
  // The longest to block.
  google.protobuf.Duration timeout = 5;
}

message WaitWorkloadResponse {
  Workload workload = 1;
  // False when the bound passed first.
  bool reached = 2;
}

message WatchWorkloadsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every kind.
  repeated WorkloadKind kinds = 3;
  // Changes after this position; empty starts at the oldest event the log
  // keeps. A cursor older than that event fails with OUT_OF_RANGE.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30
  // seconds by default). Without it the stream sends changes only.
  bool keepalive = 5;
}

message WatchWorkloadsResponse {
  // The event that recorded the change.
  EventType type = 1;
  // The workload after the change.
  Workload workload = 2;
  // Resume after this change.
  string cursor = 3;
  // Set on a keepalive, with every other field empty. Only a request
  // with keepalive set gets one.
  Keepalive keepalive = 4;
}

message WatchOutputRequest {
  string project = 1;
  string environment = 2;
  // The job's ID.
  string id = 3;
  // Where each stream starts: a byte position in what the server holds of
  // that stream, counted from its first byte, so zero starts at the start.
  // A negative position fails with INVALID_ARGUMENT, and one past the bytes
  // the server holds when the call starts fails with OUT_OF_RANGE; both are
  // checked before anything is sent. A client that reconnects passes how
  // many bytes of each stream it has received.
  int64 stdout_offset = 4;
  int64 stderr_offset = 5;
}

// WatchOutputResponse is one message of a WatchOutput stream. The bytes of
// each stream arrive in order; the order between the two is not kept.
message WatchOutputResponse {
  oneof message {
    bytes stdout = 1;
    bytes stderr = 2;
    // The last message, sent once every byte held has been sent.
    OutputEnd end = 3;
  }
}

// OutputEnd is how a job ended.
message OutputEnd {
  // Unset when the job was cancelled, or failed before its command ran
  // because a binding's target was gone (its status's last_error says so).
  optional int32 exit_code = 1;
  bool cancelled = 2;
  // True when the server kept only the start of a stream.
  bool truncated = 3;
}

message WatchTelemetryRequest {
  string project = 1;
  string environment = 2;
  // The sandbox's ID.
  string id = 3;
  // Samples stored after this position: a cursor from an earlier
  // WatchTelemetry message for the same sandbox; empty starts at the oldest
  // sample kept. A malformed cursor fails with INVALID_ARGUMENT.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30 seconds by
  // default). Without it the stream sends samples and the end only.
  bool keepalive = 5;
}

// WatchTelemetryResponse is one message of a WatchTelemetry stream.
message WatchTelemetryResponse {
  oneof message {
    TelemetrySample sample = 1;
    // Its cursor is that of the last sample sent; before the first, the
    // request's cursor (empty when the request had none).
    Keepalive keepalive = 2;
    // The last message.
    TelemetryEnd end = 3;
  }
}

// TelemetrySample is one window of a sandbox VM's resource use, as its host
// measured it. Every field but cursor, at, window_ms and the memory fields
// is the amount used within the window.
message TelemetrySample {
  // The position to resume after this sample.
  string cursor = 1;
  // The end of the window, on the host's clock.
  google.protobuf.Timestamp at = 2;
  // The window's length in milliseconds.
  int32 window_ms = 3;
  // CPU time the VM used in the window, in milliseconds.
  int64 cpu_ms = 4;
  // Time the VM's threads were ready to run but waited for a host CPU, in
  // milliseconds.
  int64 cpu_wait_ms = 5;
  // Memory in use inside the guest at its highest in the window, in MiB.
  // Unset when the guest does not report it.
  optional int64 guest_memory_mib = 6;
  // Host memory the VM held (resident) at its highest in the window, in MiB.
  int64 host_memory_mib = 7;
  // Bytes the VM read from and wrote to its disks.
  int64 disk_read_bytes = 8;
  int64 disk_write_bytes = 9;
  // Bytes the guest received and sent on its network interfaces. Unset when
  // the guest does not report them.
  optional int64 net_rx_bytes = 10;
  optional int64 net_tx_bytes = 11;
  // Processes the guest kernel's out-of-memory killer killed. Unset when the
  // guest does not report it.
  optional int32 oom_kills = 12;
}

// TelemetryEnd ends a WatchTelemetry stream: the sandbox has ended.
message TelemetryEnd {}

message WatchGuestLogRequest {
  string project = 1;
  string environment = 2;
  // The sandbox's ID.
  string id = 3;
  // Where to start: a cursor from an earlier WatchGuestLog message for the
  // same sandbox; empty starts at the oldest byte the host keeps. A
  // malformed cursor fails with INVALID_ARGUMENT. A cursor from an earlier
  // start of the sandbox's VM starts at the oldest byte of the current
  // start, whatever its offset. A cursor of the current start past the
  // bytes written when the watch reaches the console, after any wait for
  // the sandbox to start, fails with OUT_OF_RANGE. Both errors come before
  // any message.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30 seconds by
  // default). Without it the stream sends chunks and the end only.
  bool keepalive = 5;
}

// WatchGuestLogResponse is one message of a WatchGuestLog stream.
message WatchGuestLogResponse {
  oneof message {
    GuestLogChunk chunk = 1;
    // Its cursor is where the stream would resume: after the last byte
    // sent, or before the first chunk the position it started from, in the
    // VM's current start.
    Keepalive keepalive = 2;
    // The last message.
    GuestLogEnd end = 3;
  }
}

// GuestLogChunk is a run of console bytes in the order the VM wrote them.
message GuestLogChunk {
  // The position of the first byte: the number of bytes the VM wrote to
  // its console before it, in this start. An offset past the end of the
  // previous chunk means the bytes between are no longer kept.
  int64 offset = 1;
  bytes data = 2;
  // Names the VM start the offset counts in. A new start counts from zero
  // again and has a different start.
  string start = 3;
  // The position to resume after this chunk.
  string cursor = 4;
}

// GuestLogEnd ends a WatchGuestLog stream: the sandbox has ended.
message GuestLogEnd {}

message ExecuteRequest {
  oneof message {
    // First and only once.
    ExecuteStart start = 1;
    // Bytes for the command's standard input.
    bytes stdin = 2;
    // Closes the command's standard input.
    bool close_stdin = 3;
  }
}

// ExecuteStart starts an execution.
message ExecuteStart {
  string project = 1;
  string environment = 2;
  string workload_id = 3;
  Command command = 4;
  // A retry with the same key does not start a second command: its stream
  // carries the first execution's started message and, once it has ended,
  // its exit. Output already sent is not sent again.
  string request_key = 5;
}

message ExecuteResponse {
  oneof message {
    // First and only once.
    ExecutionStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    // Last.
    ExecutionExit exit = 4;
  }
}

// ExecutionStarted names an execution.
message ExecutionStarted {
  string execution_id = 1;
}

// ExecutionExit is how an execution ended.
message ExecutionExit {
  // Unset when the execution was cancelled.
  optional int32 exit_code = 1;
  bool cancelled = 2;
}

message CancelExecutionRequest {
  string project = 1;
  string environment = 2;
  string execution_id = 3;
  string request_key = 4;
}

message CancelExecutionResponse {}

// Operation is an action that takes long. Its caller waits on it for a
// bounded time and asks again while it is not done.
message Operation {
  string id = 1;
  // The workload it acts on.
  string workload_id = 2;
  bool done = 3;
  // Set when the operation is done and failed.
  Error error = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp done_at = 6;
}

message GetOperationRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
}

message GetOperationResponse {
  Operation operation = 1;
}

message WaitOperationRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // The longest to block.
  google.protobuf.Duration timeout = 4;
}

message WaitOperationResponse {
  Operation operation = 1;
}

// EventType is the closed set of event types. Built-in event names are
// reserved: job.*, sandbox.*, run.*, service.*, recording.* and agent.*.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  // A workload was created. Name: "<kind>.created".
  EVENT_TYPE_WORKLOAD_CREATED = 1;
  // A workload's state changed. Name: "<kind>.state_changed".
  EVENT_TYPE_WORKLOAD_STATE_CHANGED = 2;
  // A workload's labels changed. Name: "<kind>.updated".
  EVENT_TYPE_WORKLOAD_UPDATED = 3;
  // A workload was removed. Name: "<kind>.deleted".
  EVENT_TYPE_WORKLOAD_DELETED = 4;
  // An execution started. Name: "<kind>.execution_started".
  EVENT_TYPE_EXECUTION_STARTED = 5;
  // An execution ended. Name: "<kind>.execution_ended".
  EVENT_TYPE_EXECUTION_ENDED = 6;
  // An event a guest emitted under its own name, delivered as sent.
  EVENT_TYPE_EMITTED = 7;
  // A run's recording is ready. Name: "recording.ready".
  EVENT_TYPE_RECORDING_READY = 8;
}

// Event is one entry of the event log. Every state change and every event a
// workload emits is written to the durable log before it is delivered. Delivery is
// at least once: a receiver drops a repeat by its id. The events of one
// workload are delivered in the order they were written.
message Event {
  // Unique; the same on every delivery of this event.
  string id = 1;
  EventType type = 2;
  // A built-in name such as "job.state_changed", or the name a guest gave.
  string name = 3;
  string workload_id = 4;
  google.protobuf.Timestamp time = 5;
  // Resume after this event.
  string cursor = 6;
  oneof payload {
    // The workload after the change, for the WORKLOAD_* types.
    Workload workload = 7;
    // For the EXECUTION_* types.
    ExecutionEvent execution = 8;
    // For EMITTED.
    EmittedEvent emitted = 9;
    // For RECORDING_READY.
    RecordingEvent recording = 10;
  }
}

// ExecutionEvent is an execution starting or ending.
message ExecutionEvent {
  string execution_id = 1;
  repeated string argv = 2;
  // Set when the execution ended.
  ExecutionExit exit = 3;
}

// EmittedEvent is an event a guest emitted.
message EmittedEvent {
  bytes data = 1;
}

// RecordingEvent names a recording, its kind and its artifact, never a
// URL: RecordingService.GetRecording signs one.
message RecordingEvent {
  string recording_id = 1;
  string artifact_id = 2;
  // UNSPECIFIED in an event stored before recordings had a kind: that
  // recording is a strip.
  RecordingKind kind = 3;
}

message ListEventsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every workload.
  string workload_id = 3;
  // Events after this position; empty starts at the oldest event the log
  // keeps. A cursor older than that event fails with OUT_OF_RANGE.
  string cursor = 4;
  // The most events in one page; zero lets the server choose.
  int32 page_size = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  // The position after the last event returned, or the cursor asked for
  // when there were none: pass it to the next call.
  string cursor = 2;
}

message WatchEventsRequest {
  string project = 1;
  string environment = 2;
  // Empty matches every workload.
  string workload_id = 3;
  // Events after this position; empty starts at the oldest event the log
  // keeps. A cursor older than that event fails with OUT_OF_RANGE.
  string cursor = 4;
  // Ask for keepalives: a message with only keepalive set whenever the
  // stream has sent nothing for an interval the server sets (30
  // seconds by default). Without it the stream sends changes only.
  bool keepalive = 5;
}

message WatchEventsResponse {
  Event event = 1;
  // Set on a keepalive, with every other field empty. Only a request
  // with keepalive set gets one.
  Keepalive keepalive = 2;
}

// Keepalive tells a watcher that its stream is open while the watch has
// nothing to send, also while the log gains only events its filter
// leaves out.
message Keepalive {
  // When the server sent it.
  google.protobuf.Timestamp sent_at = 1;
  // The log position the watch has read up to, which can be past events
  // it read and did not send; WatchEvents with workload_id reads only
  // that workload's events. Resuming from it misses nothing the stream
  // would still have sent.
  string cursor = 2;
}

// PreviewShareLinkState is where a share link is in its life.
enum PreviewShareLinkState {
  PREVIEW_SHARE_LINK_STATE_UNSPECIFIED = 0;
  // Minted; no device has opened it yet.
  PREVIEW_SHARE_LINK_STATE_OPEN = 1;
  // A device opened it; it admits that device only.
  PREVIEW_SHARE_LINK_STATE_IN_USE = 2;
  PREVIEW_SHARE_LINK_STATE_REVOKED = 3;
  // Its connections carried its byte cap.
  PREVIEW_SHARE_LINK_STATE_ENDED = 4;
  PREVIEW_SHARE_LINK_STATE_EXPIRED = 5;
}

// PreviewShareLink is one share link of one of a sandbox's previews,
// without the link itself.
message PreviewShareLink {
  // Assigned by the server.
  string id = 1;
  string workload_id = 2;
  PreviewShareLinkState state = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // The most bytes, both ways, its connections may carry.
  int64 max_bytes = 6;
  // The bytes its connections have carried so far.
  int64 used_bytes = 7;
  // Unset until a device opens it.
  google.protobuf.Timestamp opened_at = 8;
  // Unset unless it was revoked.
  google.protobuf.Timestamp revoked_at = 9;
  // Unset unless it ended.
  google.protobuf.Timestamp ended_at = 10;
  // The channel whose preview the link opens: `preview` for the sandbox's
  // own hostname, or another of its http channels.
  string channel = 11;
  // The guest port that channel reaches.
  int32 port = 12;
}

message CreatePreviewShareLinkRequest {
  string project = 1;
  string environment = 2;
  // The sandbox whose preview the link opens.
  string workload_id = 3;
  // How long the link stays valid, at most the plan's maximum; unset is
  // 24 hours, or the plan's maximum when that is shorter.
  google.protobuf.Duration expires_in = 4;
  // The most bytes, both ways, its connections may carry, at most the
  // plan's; 0 is the plan's.
  int64 max_bytes = 5;
  // The preview the link opens: one of the sandbox's http channels, by
  // its name or by its guest port. Neither set is the channel `preview`.
  oneof channel_ref {
    string channel = 6;
    int32 port = 7;
  }
}

message CreatePreviewShareLinkResponse {
  PreviewShareLink share_link = 1;
  // The URL to give the viewer: it opens the link's preview and carries
  // the link. It is in this answer only.
  string url = 2;
}

message ListPreviewShareLinksRequest {
  string project = 1;
  string environment = 2;
  string workload_id = 3;
}

message ListPreviewShareLinksResponse {
  repeated PreviewShareLink share_links = 1;
}

message RevokePreviewShareLinkRequest {
  string project = 1;
  string environment = 2;
  string workload_id = 3;
  string share_link_id = 4;
}

message RevokePreviewShareLinkResponse {
  PreviewShareLink share_link = 1;
}

message StartServiceRequest {
  string project = 1;
  string environment = 2;
  // The service's workload id.
  string id = 3;
  string request_key = 4;
}

message StartServiceResponse {
  Workload workload = 1;
}

message StopServiceRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  string request_key = 4;
}

message StopServiceResponse {
  Workload workload = 1;
}

message SetServiceModeRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // Required.
  ServiceMode mode = 4;
  string request_key = 5;
}

message SetServiceModeResponse {
  Workload workload = 1;
}

message WakeServiceRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  string request_key = 4;
}

message WakeServiceResponse {
  Workload workload = 1;
}

message HoldServiceRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // How long the hold stays live, at most an hour; unset is 10 minutes.
  google.protobuf.Duration ttl = 4;
  string request_key = 5;
}

message HoldServiceResponse {
  Workload workload = 1;
  ServiceHold hold = 2;
}

// ServiceHold is one caller's hold on a service.
message ServiceHold {
  // Who holds it: the calling principal.
  string holder = 1;
  // When it stops keeping the service awake, unless renewed.
  google.protobuf.Timestamp expires_at = 2;
}

message ReleaseServiceRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  string request_key = 4;
}

message ReleaseServiceResponse {
  Workload workload = 1;
}

message ListServiceRunsRequest {
  string project = 1;
  string environment = 2;
  string id = 3;
  // How many of the newest runs to return, at most 100; 0 returns 20.
  int32 page_size = 4;
}

message ListServiceRunsResponse {
  repeated ServiceRun runs = 1;
}

// ServiceRun is one run of a service: a job on a host.
message ServiceRun {
  // The run's job id.
  string id = 1;
  // The service revision it runs.
  int64 revision = 2;
  ServiceRunState state = 3;
  // Why a queued run waits, for example "service_quota" past the plan's
  // shared services, "no_own_capacity" while the workspace's own host is
  // full, or "volume_claimed" while the run before it still holds the
  // service's state volume; empty when it does not wait.
  string held = 4;
  google.protobuf.Timestamp queued_at = 5;
  // When its process started; unset before.
  google.protobuf.Timestamp started_at = 6;
  // When its health check last began to pass; unset while it is not
  // ready.
  google.protobuf.Timestamp ready_at = 7;
  // When it ended; unset while it is live.
  google.protobuf.Timestamp ended_at = 8;
  // Its process's exit code, when it exited.
  optional int32 exit_code = 9;
  // Why it ended, for a run that failed or was lost.
  string error = 10;
}

// ServiceRunState is where a service's run is.
enum ServiceRunState {
  SERVICE_RUN_STATE_UNSPECIFIED = 0;
  // Waiting for a host.
  SERVICE_RUN_STATE_QUEUED = 1;
  // Placed on a host, its VM booting.
  SERVICE_RUN_STATE_STARTING = 2;
  SERVICE_RUN_STATE_RUNNING = 3;
  // Asked to stop; its VM is being stopped.
  SERVICE_RUN_STATE_STOPPING = 4;
  // Its process exited 0.
  SERVICE_RUN_STATE_COMPLETED = 5;
  // Its process exited non-zero, or the run was lost with its host.
  SERVICE_RUN_STATE_FAILED = 6;
  // Stopped by a stop of its service or by a new revision.
  SERVICE_RUN_STATE_STOPPED = 7;
  // Stopped because its on-demand service went to sleep; not a failure.
  SERVICE_RUN_STATE_SLEPT = 8;
}
