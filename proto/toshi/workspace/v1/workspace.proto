  // The http channel of the service's recipe whose provided name the link
  // opens.
  string channel = 3;
  PreviewShareLinkState state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // The most bytes, both ways, its connections may carry.
  int64 max_bytes = 7;
  // The bytes its connections have carried so far.
  int64 used_bytes = 8;
  // Unset until a device opens it.
  google.protobuf.Timestamp opened_at = 9;
  // Unset unless it was revoked.
  google.protobuf.Timestamp revoked_at = 10;
  // Unset unless it ended.
  google.protobuf.Timestamp ended_at = 11;
}

