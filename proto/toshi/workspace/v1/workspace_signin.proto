syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// WorkspaceSignInService reads and changes the sign-in provider a workspace
// requires. With one set, a person's dashboard session or access token
// reaches the workspace only when it was signed in through that provider,
// for an identity of the person's own user; membership is checked as
// well, and separately. Any other session or token is refused with
// PERMISSION_DENIED and the reason SIGNIN_REQUIRED in a google.rpc.ErrorInfo
// detail, whose metadata names the provider and the sign_in_url that adds
// the sign-in to the same session. Workspace tokens and workload
// credentials are not people and are not affected.
service WorkspaceSignInService {
  // GetWorkspaceSignIn returns the provider the workspace requires; unset
  // when it requires none.
  rpc GetWorkspaceSignIn(GetWorkspaceSignInRequest) returns (GetWorkspaceSignInResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // SetWorkspaceSignIn makes the workspace require the sign-in provider
  // entry named provider, which must be an OpenID Connect provider the
  // control plane has. The caller must be a person whose own session or
  // token was signed in through that provider, so the provider is known to
  // work before it is enforced; otherwise FAILED_PRECONDITION and the
  // reason SIGNIN_UNTESTED. It answers the members who have no identity at
  // the provider, who lose the workspace until they link one: nothing is
  // deleted. A workspace token cannot set it.
  rpc SetWorkspaceSignIn(SetWorkspaceSignInRequest) returns (SetWorkspaceSignInResponse) {
    option (toshi.permission) = "workspace.signin";
    option (toshi.audit) = {
      action: "workspace_signin.required"
      target: "workspace:workspace"
    };
  }
  // ClearWorkspaceSignIn makes the workspace require no sign-in provider.
  // It asks for no sign-in beyond the one reaching the workspace already
  // takes, and a workspace token holding workspace.signin may make it. When
  // the provider is gone and no person can reach the workspace, the
  // operator clears it (ClearTenantSignIn).
  rpc ClearWorkspaceSignIn(ClearWorkspaceSignInRequest) returns (ClearWorkspaceSignInResponse) {
    option (toshi.permission) = "workspace.signin";
    option (toshi.audit) = {
      action: "workspace_signin.cleared"
      target: "workspace:workspace"
    };
  }
}

// WorkspaceSignIn is the sign-in provider a workspace requires.
message WorkspaceSignIn {
  // The provider entry's name, as GET /auth/providers lists it.
  string provider = 1;
  // The provider's issuer: the identities it signs in are keyed by it, as
  // their Identity.provider, and GET /auth/providers lists it as the
  // entry's identity_provider.
  string issuer = 2;
  // The user who set it, and when.
  string set_by = 3;
  google.protobuf.Timestamp set_at = 4;
}

message GetWorkspaceSignInRequest {}

message GetWorkspaceSignInResponse {
  // Unset when the workspace requires no provider.
  WorkspaceSignIn sign_in = 1;
}

message SetWorkspaceSignInRequest {
  string provider = 1;
}

message SetWorkspaceSignInResponse {
  WorkspaceSignIn sign_in = 1;
  // The user ids of the members with no identity at the provider, sorted.
  repeated string members_without_identity = 2;
}

message ClearWorkspaceSignInRequest {}

message ClearWorkspaceSignInResponse {
  // What the workspace required; unset when it required nothing.
  WorkspaceSignIn cleared = 1;
}
