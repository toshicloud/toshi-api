syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// RoleService manages who may do what in the workspace: its roles, each a
// named set of permissions, and the grants that give a role to a person or
// a token on the whole workspace, one project or one environment. A
// caller's permissions are the union of the roles granted to it; there are
// no deny rules.
//
// Four roles are built in: owner (every permission), admin (every
// permission but billing.write, workspace.delete and workspace.signin),
// member (reads and
// writes of every product and of projects, secrets and tokens, and reads of
// the rest) and viewer (every read). They cannot be changed. A workspace
// adds its own from the permissions docs/api/permissions.md lists.
//
// Nobody makes, changes, deletes, gives or revokes a role with a
// permission they do not hold where the role applies: such a call is
// refused with PERMISSION_DENIED, and a google.rpc.ErrorInfo detail with
// the reason PERMISSION_MISSING names the permission under the key
// "permission". So only an owner gives or revokes owner. A workspace
// always keeps a person who is an owner of the whole workspace.
//
// A token limited to a project or an environment is refused with
// PERMISSION_DENIED: these calls act in the whole workspace. A suspended
// workspace lists its roles and grants, and every other call is refused
// for it with FAILED_PRECONDITION.
service RoleService {
  // ListRoles returns the built-in roles, highest first, then the
  // workspace's own, by name, each with its permissions.
  //
  // A page holds 100 roles when page_size is zero, and 1000 at most.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (toshi.permission) = "members.read";
  }
  // CreateRole adds a role of the workspace's own. A name that a role of
  // the workspace has fails with ALREADY_EXISTS; a built-in role's name,
  // compared without regard to case, an empty name, no permissions, or a
  // permission docs/api/permissions.md does not list, with
  // INVALID_ARGUMENT.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (toshi.permission) = "members.write";
  }
  // UpdateRole sets the name and the permissions of one of the
  // workspace's roles, checked as CreateRole checks them. Its grants keep
  // it, and give the new permissions from then on. A built-in role fails
  // with INVALID_ARGUMENT; an unknown ID with NOT_FOUND.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (toshi.permission) = "members.write";
  }
  // DeleteRole deletes one of the workspace's roles and every grant of
  // it. A built-in role fails with INVALID_ARGUMENT; an unknown ID with
  // NOT_FOUND.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (toshi.permission) = "members.write";
  }
  // ListRoleGrants returns the workspace's grants, ordered by subject,
  // then role, then scope, optionally only those of one subject, or only
  // those on one project or environment.
  //
  // A page holds 100 grants when page_size is zero, and 1000 at most. An
  // unknown project or environment fails with NOT_FOUND.
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }
  // GrantRole gives a role to a person or a token, on the whole workspace
  // or on one project or environment. The role is a built-in role's ID or
  // one of the workspace's. A grant the subject already has fails with
  // ALREADY_EXISTS; an unknown role, project or environment, or a token
  // that is not the workspace's or is revoked, with NOT_FOUND.
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {target: "role:role"};
  }
  // RevokeRole deletes a grant. Revoking the last grant of owner on the
  // whole workspace to a person fails with FAILED_PRECONDITION, and a
  // google.rpc.ErrorInfo detail with the reason LAST_OWNER names that
  // person under the key "person". An unknown ID fails with NOT_FOUND.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.audit) = {target: "role:response.grant.role"};
  }
  // ListMembers returns the workspace's members, oldest first: the people
  // a session opens the workspace for, with how and when each joined. A
  // removed member is not listed. With state MEMBER_STATE_PENDING it
  // returns instead the people waiting for a workspace admin's approval to
  // join, oldest request first.
  //
  // A page holds 100 members when page_size is zero, and 1000 at most.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }
  // RemoveMember ends a person's membership and deletes every grant they
  // hold in the workspace, at once; their sessions lose the workspace at
  // their next call. Removing the workspace's last member fails with
  // FAILED_PRECONDITION and a google.rpc.ErrorInfo detail with the reason
  // LAST_MEMBER, and removing its last person who is an owner of the whole
  // workspace with the reason LAST_OWNER; each names the person under the
  // key "person". A person who is not a member fails with NOT_FOUND.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "member.removed", target: "member:user_id"};
  }
  // ApproveMember makes a person waiting for approval a member, as an
  // accepted invitation does: it grants no role, and makes them an owner
  // only when the workspace has no person who owns the whole of it. A
  // person who is not waiting fails with NOT_FOUND.
  rpc ApproveMember(ApproveMemberRequest) returns (ApproveMemberResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "member.approved", target: "member:user_id"};
  }
  // DeclineMember turns down a person waiting for approval. They may ask
  // again by signing in a day after the decline at the earliest. A person
  // who is not waiting fails with NOT_FOUND.
  rpc DeclineMember(DeclineMemberRequest) returns (DeclineMemberResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "member.declined", target: "member:user_id"};
  }
  // CreateInvitation makes an invitation to join the workspace and returns
  // its code, once: the control plane keeps only its hash. It is valid for
  // ttl, seven days when unset, and 30 days at most. The note is free text,
  // such as whom it is for, and is never matched against anyone.
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
  }
  // ListInvitations returns the workspace's invitations, newest first,
  // accepted, revoked and expired ones included, never their codes.
  //
  // A page holds 100 invitations when page_size is zero, and 1000 at most.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
  }
  // RevokeInvitation ends an open invitation, so its code no longer works.
  // An unknown id fails with NOT_FOUND, and one that is accepted, revoked
  // or expired with FAILED_PRECONDITION.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (toshi.permission) = "members.write";
    option (toshi.scope) = "workspace";
  }

  // AcceptInvitation makes the caller a member of the workspace whose
  // invitation has the code, and an owner of it when the workspace has no
  // person who owns the whole of it; it grants no other role. It is a
  // person's call: a dashboard session or a person's access token makes it,
  // without the Toshi-Workspace header and without any role, since the
  // caller is not yet a member; a workspace token and the operator cannot.
  // The permission named here is not checked. A code with no open
  // invitation fails with NOT_FOUND, whether no invitation has it or it is
  // accepted, revoked or expired; the workspace's audit log records which
  // as invitation.accept_refused. A caller who is already a member fails
  // with ALREADY_EXISTS, leaving the invitation open.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (toshi.permission) = "members.read";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {action: "invitation.accepted", target: "invitation:response.invitation.id"};
  }
}

// Role is a named set of permissions.
message Role {
  // Role id: "owner", "admin", "member" or "viewer" for a built-in role,
  // such as "role-1a2b3c4d5e6f" for one of the workspace's.
  string id = 1;
  string name = 2;
  // The permissions the role gives, sorted, as docs/api/permissions.md
  // names them.
  repeated string permissions = 3;
  // Whether the role is built in, and cannot be changed.
  bool built_in = 4;
}

// SubjectKind says who a grant is given to, or who made it.
enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  // A person, by Toshi user id.
  SUBJECT_KIND_PERSON = 1;
  // One of the workspace's API tokens, by token id.
  SUBJECT_KIND_TOKEN = 2;
  // The control plane itself, as the maker of the grants it writes, such
  // as a workspace's first owner. It is never given a role.
  SUBJECT_KIND_SYSTEM = 3;
}

// Subject is who a grant is given to, or who made it.
message Subject {
  SubjectKind kind = 1;
  // The Toshi user id of a person, such as "usr-0f1e2d3c4b5a69788796a5b4",
  // which a change of login or identity provider keeps; it is opaque, and
  // a person who signed in before user accounts came has their GitHub user
  // id as theirs. The token id of a token, such as "tok-1a2b3c4d5e6f";
  // empty for the system.
  string id = 2;
}

// RoleGrant gives a role to a subject on part of the workspace.
message RoleGrant {
  // Grant id.
  string id = 1;
  Subject subject = 2;
  // The role's id.
  string role = 3;
  // The project the grant applies to, by name. Empty for a grant on the
  // whole workspace.
  string project = 4;
  // The environment of project the grant applies to, by name. Empty for a
  // grant on every environment of project.
  string environment = 5;
  google.protobuf.Timestamp created_at = 6;
  Subject created_by = 7;
}

message ListRolesRequest {
  // The most roles in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListRolesResponse {
  repeated Role roles = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// CreateRoleRequest names the role and what it gives.
message CreateRoleRequest {
  string name = 1;
  // At least one permission, as docs/api/permissions.md names it.
  repeated string permissions = 2;
}

message CreateRoleResponse {
  Role role = 1;
}

// UpdateRoleRequest names the role and its new name and permissions.
message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  // At least one permission; they replace the role's.
  repeated string permissions = 3;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

// DeleteRoleResponse carries the deleted role.
message DeleteRoleResponse {
  Role role = 1;
  // How many grants of the role were deleted with it.
  int32 grants_deleted = 2;
}

// ListRoleGrantsRequest optionally narrows the list.
message ListRoleGrantsRequest {
  // Only this subject's grants, when set.
  Subject subject = 1;
  // Only the grants on this project, by name, when set: on the project as
  // a whole, and on each of its environments unless environment is set.
  string project = 2;
  // Only the grants on this environment of project, by name, when set.
  // Needs project.
  string environment = 3;
  // The most grants in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
}

message ListRoleGrantsResponse {
  repeated RoleGrant grants = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// GrantRoleRequest names the subject, the role and where it applies.
message GrantRoleRequest {
  // A person or a token.
  Subject subject = 1;
  // The role's id.
  string role = 2;
  // Limits the grant to this project of the workspace, by name. Empty
  // gives the role on the whole workspace.
  string project = 3;
  // Limits the grant further to this environment of project, by name.
  // Needs project.
  string environment = 4;
}

message GrantRoleResponse {
  RoleGrant grant = 1;
}

message RevokeRoleRequest {
  // The grant's id.
  string id = 1;
}

// RevokeRoleResponse carries the deleted grant.
message RevokeRoleResponse {
  RoleGrant grant = 1;
}

message ListMembersRequest {
  // The most members in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
  // MEMBER_STATE_PENDING lists the people waiting for approval; unset or
  // MEMBER_STATE_ACTIVE lists the members.
  MemberState state = 3;
}

message ListMembersResponse {
  repeated Member members = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// MemberVia says how a person became a member.
enum MemberVia {
  MEMBER_VIA_UNSPECIFIED = 0;
  // Signing in with GitHub as an administrator of one of the workspace's
  // GitHub App installations.
  MEMBER_VIA_GITHUB_ADMIN = 1;
  // Accepting an invitation.
  MEMBER_VIA_INVITATION = 2;
  // Holding a role in the workspace when members came in.
  MEMBER_VIA_MIGRATION = 3;
  // Signing in with GitHub as a member of the organisation of one of the
  // workspace's GitHub App installations, when the workspace lets such
  // members join.
  MEMBER_VIA_GITHUB_MEMBER = 4;
}

// MemberState says whether a person is a member or waiting to be one.
enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  MEMBER_STATE_ACTIVE = 1;
  // Waiting for a workspace admin to approve them.
  MEMBER_STATE_PENDING = 2;
}

// Member is a person a session opens the workspace for.
message Member {
  // The person's user id, as grants name them.
  string user_id = 1;
  // The name and email address the person's latest sign-in reported;
  // shown, never matched.
  string name = 2;
  string email = 3;
  MemberVia via = 4;
  google.protobuf.Timestamp added_at = 5;
  // Who made the person a member: the inviter for an invitation, the
  // system for a sign-in, the approver for an approved request.
  Subject added_by = 6;
  MemberState state = 7;
  // When a person waiting for approval asked to join; unset for a member.
  google.protobuf.Timestamp requested_at = 8;
}

message RemoveMemberRequest {
  // The person's user id.
  string user_id = 1;
}

message ApproveMemberRequest {
  // The person's user id.
  string user_id = 1;
}

// ApproveMemberResponse carries the new member and whether they became an
// owner.
message ApproveMemberResponse {
  Member member = 1;
  bool owner = 2;
}

message DeclineMemberRequest {
  // The person's user id.
  string user_id = 1;
}

message DeclineMemberResponse {}

// RemoveMemberResponse says how many grants went with the membership.
message RemoveMemberResponse {
  int32 grants_removed = 1;
}

message CreateInvitationRequest {
  // Free text, such as whom the invitation is for; 200 characters at most.
  string note = 1;
  // How long the code is valid: seven days when unset, 30 days at most.
  google.protobuf.Duration ttl = 2;
}

// CreateInvitationResponse carries the invitation and its code, shown
// once.
message CreateInvitationResponse {
  Invitation invitation = 1;
  // The code the invitee accepts; it is not shown again.
  string code = 2;
}

// InvitationState says whether an invitation's code still works.
enum InvitationState {
  INVITATION_STATE_UNSPECIFIED = 0;
  // Its code works until expires_at.
  INVITATION_STATE_OPEN = 1;
  INVITATION_STATE_ACCEPTED = 2;
  INVITATION_STATE_REVOKED = 3;
  INVITATION_STATE_EXPIRED = 4;
}

// Invitation is an invitation to join the workspace, never with its code.
message Invitation {
  // Invitation id, such as "inv-1a2b3c4d5e6f7a8b9c0d1e2f".
  string id = 1;
  string note = 2;
  InvitationState state = 3;
  google.protobuf.Timestamp created_at = 4;
  Subject created_by = 5;
  google.protobuf.Timestamp expires_at = 6;
  // The user id of the person who accepted it, and when; empty until then.
  string accepted_by = 7;
  google.protobuf.Timestamp accepted_at = 8;
  // When it was revoked, and by whom; empty unless revoked.
  google.protobuf.Timestamp revoked_at = 9;
  Subject revoked_by = 10;
}

message ListInvitationsRequest {
  // The most invitations in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message RevokeInvitationRequest {
  // The invitation's id.
  string id = 1;
}

// RevokeInvitationResponse carries the revoked invitation.
message RevokeInvitationResponse {
  Invitation invitation = 1;
}

message AcceptInvitationRequest {
  // The code CreateInvitation returned.
  string code = 1;
}

message AcceptInvitationResponse {
  Invitation invitation = 1;
  // The id of the workspace the caller is now a member of.
  string workspace = 2;
  // Whether the caller was made the workspace's owner.
  bool owner = 3;
}
