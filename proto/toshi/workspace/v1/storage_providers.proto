syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// StorageProviderService manages the buckets the workspace keeps its
// objects in: its own bucket, with a key the control plane wraps, and the
// rows the operator set for it. No call returns a credential or the
// operator's reference to one.
//
// Only a signed-in session may call these: a token is refused with
// PERMISSION_DENIED. The session names one of its workspaces in the
// Toshi-Workspace header. A suspended workspace lists its providers, and so does a
// closed one during its read-only period; every other call is refused for
// a suspended workspace with FAILED_PRECONDITION.
service StorageProviderService {
  // ListStorageProviders returns the workspace's providers, ordered by
  // name. With include_default it also returns the operator's provider the
  // workspace uses while it has none of its own.
  //
  // A page holds 100 providers when page_size is zero, and 1000 at most.
  rpc ListStorageProviders(ListStorageProvidersRequest) returns (ListStorageProvidersResponse) {
    option (toshi.permission) = "storage.read";
  }
  // CreateStorageProvider stores the workspace's own bucket: the control
  // plane wraps the key, checks the bucket with it as CheckStorageProvider
  // does and stores the row only when the check passes, else
  // FAILED_PRECONDITION with the check's error. A workspace has one such
  // provider; a second fails with ALREADY_EXISTS, as does a second provider
  // with the lifecycle capability on the same endpoint and bucket. A bad
  // field fails with INVALID_ARGUMENT.
  rpc CreateStorageProvider(CreateStorageProviderRequest) returns (CreateStorageProviderResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "storage.write";
  }
  // CheckStorageProvider checks a provider's bucket: it heads the bucket,
  // refuses a versioned one, then uploads, heads and deletes a probe
  // object. A check that fails is an answer, not an error: ok is false and
  // error names the failing step.
  //
  // With id it checks a provider the workspace saved, records the result
  // and returns the provider as stored; an unknown ID, and another
  // workspace's, fails with NOT_FOUND, and a row the operator set for the
  // workspace, and the default provider, with PERMISSION_DENIED. With
  // provider it checks one that is not saved, with the key in the request,
  // as CreateStorageProvider would before it stores one; it stores and
  // audits nothing, and a request CreateStorageProvider would refuse fails
  // the same way before any connection.
  rpc CheckStorageProvider(CheckStorageProviderRequest) returns (CheckStorageProviderResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "storage.write";
  }
  // DeleteStorageProvider removes a provider the workspace saved. An
  // unknown ID, and another workspace's, fails with NOT_FOUND; a row the
  // operator set for the workspace, and the default provider, with
  // PERMISSION_DENIED. Removal is refused while artifacts, raw delivery bodies,
  // unfinished deletions or image versions reference it; its objects stay with
  // the provider.
  rpc DeleteStorageProvider(DeleteStorageProviderRequest) returns (DeleteStorageProviderResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "storage.write";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Remove this bucket? Artifacts, raw delivery bodies, unfinished deletions or image versions prevent removal; its objects stay with your provider."};
  }
}

// StorageProvider is one bucket Toshi keeps the workspace's objects in.
message StorageProvider {
  // The provider's id, set by the server.
  string id = 1;
  // The provider's name, unique among its owner's: 1 to 63 lower-case
  // letters, digits and "-".
  string name = 2;
  // "operator", "workspace_bucket" or "local_disk".
  string mode = 3;
  // The bucket's endpoint, as stored: a scheme and a host, with no
  // trailing slash.
  string endpoint = 4;
  // The bucket's region; required.
  string region = 5;
  // The bucket's name; required.
  string bucket = 6;
  // A prefix every key Toshi writes starts with; empty for none.
  string root_prefix = 7;
  // Whether the bucket is addressed in the path, as /bucket/key, instead
  // of the host name.
  bool path_style = 8;
  // Whether the bucket takes lifecycle rules.
  bool cap_lifecycle = 9;
  // Whether a job's VM may send an artifact's bytes to its presigned URL
  // itself.
  bool cap_guest_presign = 10;
  // Whether the bucket is readable in every region the fleet runs in;
  // always false on a workspace's own provider.
  bool cap_global_replication = 11;
  // What one gibibyte leaving the provider costs, in millionths of the
  // operator's currency; 0 is unknown or free, and a workspace's own
  // provider always has 0.
  int64 egress_price_micros_per_gb = 12;
  // Whether the row holds a wrapped key; its value is never sent.
  bool credentials_wrapped = 13;
  // When the provider was last checked; unset when never checked.
  google.protobuf.Timestamp last_check_at = 14;
  // Why the last check failed. For a row the operator set, which may name
  // the operator's own references, only that it failed.
  string last_check_error = 15;
  // When the provider row was created.
  google.protobuf.Timestamp created_at = 16;
  // When the provider row was last changed.
  google.protobuf.Timestamp updated_at = 17;
}

// CreateStorageProviderRequest describes the workspace's own bucket.
message CreateStorageProviderRequest {
  // The provider's name: 1 to 63 lower-case letters, digits and "-".
  string name = 1;
  // An https URL.
  string endpoint = 2;
  // The bucket's region; required.
  string region = 3;
  // The bucket's name; required.
  string bucket = 4;
  // A prefix every key Toshi writes starts with; empty for none.
  string root_prefix = 5;
  // Address the bucket in the path, as /bucket/key, instead of the host
  // name.
  bool path_style = 6;
  // Whether the bucket takes lifecycle rules.
  bool cap_lifecycle = 7;
  // Whether a job's VM may send an artifact's bytes to its presigned URL
  // itself.
  bool cap_guest_presign = 8;
  // The bucket's key. The control plane wraps it before the row exists and
  // never returns, logs or audits it. Required.
  StorageCredential credential = 9;
  // "workspace_bucket", the only mode a workspace stores; empty means it.
  // Another mode fails with INVALID_ARGUMENT.
  string mode = 10;
  // A key that makes the call safe to retry: a retry with the same key and
  // the same request answers with the provider the first call stored.
  string request_key = 11;
}

// StorageCredential is an S3 access key. It is write-only: no response
// carries it.
message StorageCredential {
  // The S3 access key id.
  string access_key_id = 1;
  // The S3 secret access key.
  string secret_access_key = 2;
  // Set for a temporary key.
  string session_token = 3;
}

// CreateStorageProviderResponse carries the provider the call stored.
message CreateStorageProviderResponse {
  // The provider as stored.
  StorageProvider provider = 1;
}

// ListStorageProvidersRequest asks for one page of the workspace's
// providers.
message ListStorageProvidersRequest {
  // Also answer default_provider.
  bool include_default = 1;
  // The most providers in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

// ListStorageProvidersResponse is one page of the workspace's providers.
message ListStorageProvidersResponse {
  // The providers on this page, ordered by name.
  repeated StorageProvider providers = 1;
  // With include_default, the operator's provider that serves the
  // workspace's uploads while it has no workspace_bucket provider; unset when
  // none is configured. Every page holds it.
  StorageProvider default_provider = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// CheckStorageProviderRequest names the provider to check: a saved one by
// id, or one that is not saved, with its key.
message CheckStorageProviderRequest {
  // The provider to check: one is required.
  oneof target {
    // A saved provider's id.
    string id = 1;
    // A provider that is not saved, as CreateStorageProvider would take
    // it, with its key.
    CreateStorageProviderRequest provider = 2;
  }
}

// CheckStorageProviderResponse is the result of a bucket check.
message CheckStorageProviderResponse {
  // The saved provider as stored after the check; unset for one that is
  // not saved.
  StorageProvider provider = 1;
  // Whether every step of the check passed.
  bool ok = 2;
  // Why the check failed, naming the step; empty when ok.
  string error = 3;
  // When the check ran; set by the server.
  google.protobuf.Timestamp checked_at = 4;
}

// DeleteStorageProviderRequest names the provider to remove.
message DeleteStorageProviderRequest {
  // The id of a provider the workspace saved.
  string id = 1;
}

// DeleteStorageProviderResponse is empty.
message DeleteStorageProviderResponse {}
