syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// RecordingService lists a workload's recordings and signs a URL for a
// recording's object. The caller is a workspace's API token or a dashboard
// session, as for ArtifactService. A credential limited to a project or an
// environment sees only its own.
service RecordingService {
  // ListRecordings returns one workload's recordings, oldest first: a
  // run attempt's strip, and each video or trace a run attempt uploaded as
  // its test framework's recording, so an attempt may have several. Never
  // a URL.
  //
  // A page holds 100 recordings when page_size is zero, and 1000 at most.
  rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse) {
    option (toshi.permission) = "recordings.read";
    option (toshi.scope) = "environment";
  }
  // GetRecording returns one recording and, when it is ready, a signed URL
  // for its object that expires. A ready recording whose object's
  // retention has deleted it is FAILED_PRECONDITION.
  rpc GetRecording(GetRecordingRequest) returns (GetRecordingResponse) {
    option (toshi.permission) = "recordings.read";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "artifact.viewed"
      target: "artifact:response.recording.artifact_id"
    };
  }
  // CreateRecordingShareLink mints a share link for a ready recording: a
  // URL that fetches its object without a Toshi sign-in until the link
  // expires, is revoked or has used its byte cap. Each fetch through it
  // counts the object's whole size against the cap, and each fetch and
  // each refusal is in the audit. A recording that is not ready, or whose
  // object's retention has deleted it, is FAILED_PRECONDITION.
  rpc CreateRecordingShareLink(CreateRecordingShareLinkRequest) returns (CreateRecordingShareLinkResponse) {
    option (toshi.permission) = "recordings.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "recording.share_link_issued"
      target: "recording_share_link:response.share_link.id"
    };
  }
  // ListRecordingShareLinks returns a recording's share links, oldest
  // first, without the links themselves.
  //
  // A page holds 100 share links when page_size is zero, and 1000 at most.
  rpc ListRecordingShareLinks(ListRecordingShareLinksRequest) returns (ListRecordingShareLinksResponse) {
    option (toshi.permission) = "recordings.read";
    option (toshi.scope) = "environment";
  }
  // RevokeRecordingShareLink ends a share link before it expires. A link
  // already revoked is returned as it is.
  rpc RevokeRecordingShareLink(RevokeRecordingShareLinkRequest) returns (RevokeRecordingShareLinkResponse) {
    option (toshi.permission) = "recordings.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "recording.share_link_revoked"
      target: "recording_share_link:share_link_id"
    };
  }
}

// RecordingState is where a recording is in its life.
enum RecordingState {
  RECORDING_STATE_UNSPECIFIED = 0;
  // The run attempt may still finish it: its host captures a strip or
  // uploads what it captured, or the run's upload of a video or trace has
  // not completed.
  RECORDING_STATE_CAPTURING = 1;
  // Its object's upload completed. The object is kept for its retention;
  // the recording stays ready after that.
  RECORDING_STATE_READY = 2;
  // A strip ended without its object, and its host said why.
  RECORDING_STATE_UNAVAILABLE = 3;
  // A strip ended without its object and without its host's report, or a
  // video's or trace's upload did not complete before its deadline.
  RECORDING_STATE_LOST = 4;
}

// RecordingKind is what a recording holds.
enum RecordingKind {
  RECORDING_KIND_UNSPECIFIED = 0;
  // A screenshot strip of the run's screen, taken by its host.
  RECORDING_KIND_STRIP = 1;
  // A video of the run's screen, recorded by its host, or one the run's
  // test framework wrote, such as Playwright's or Cypress's, uploaded with
  // ArtifactUploadService.
  RECORDING_KIND_VIDEO = 2;
  // A trace the run's test framework wrote, such as a Playwright trace,
  // uploaded with ArtifactUploadService.
  RECORDING_KIND_TRACE = 3;
}

// Recording is one recording of a run attempt: its screenshot strip or
// video, or a video or trace its test framework wrote. Its record, never a key or a
// URL.
message Recording {
  string id = 1;
  string project_id = 2;
  string environment_id = 3;
  string workload_id = 4;
  RecordingState state = 5;
  // Why it is unavailable or lost, or why a run whose policy asked for a
  // video has a strip.
  string reason = 6;
  // The artifact that holds it: complete when the recording became ready,
  // deleted once its retention has passed.
  string artifact_id = 7;
  // A strip's time between two screenshots; unset for a video or trace.
  google.protobuf.Duration interval = 8;
  // A strip's ticks or the frames of its host's video, and the screenshots
  // left out; 0 for a video or trace the test framework wrote.
  int32 frames = 9;
  int32 dropped = 10;
  // The host's capture of a strip or video stopped at a bound before the
  // run ended.
  bool truncated = 11;
  // The spans a strip or its host's video left out while an input session
  // was open.
  repeated RecordingPause pauses = 12;
  google.protobuf.Timestamp created_at = 13;
  // Set once it is no longer capturing.
  google.protobuf.Timestamp ended_at = 14;
  // What it holds: never UNSPECIFIED.
  RecordingKind kind = 15;
  // A sandbox's strips are numbered from 1 in the order they were taken:
  // each ends at its plan's segment length and the next starts then. 0 for
  // a job's recording, its run's only one.
  int32 sequence = 16;
}

// RecordingPause is a span with no screenshot, while a display session
// with input was open.
message RecordingPause {
  string session_id = 1;
  // person or program.
  string actor = 2;
  // websocket or api.
  string via = 3;
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp end = 5;
}

message ListRecordingsRequest {
  string workload_id = 1;
  // The most recordings in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListRecordingsResponse {
  repeated Recording recordings = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetRecordingRequest {
  string recording_id = 1;
  // How long the strip's URL lives: 0 is the default (300 seconds), and
  // above 3600 fails with INVALID_ARGUMENT.
  int64 ttl_seconds = 2;
}

message GetRecordingResponse {
  Recording recording = 1;
  // A signed GET for its object, set only when the recording is ready. It
  // honours a byte Range, so one frame of a strip can be fetched by its
  // offset in the strip's index.
  string url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// RecordingShareLinkState is where a recording's share link is in its
// life.
enum RecordingShareLinkState {
  RECORDING_SHARE_LINK_STATE_UNSPECIFIED = 0;
  // It fetches the recording's object.
  RECORDING_SHARE_LINK_STATE_ACTIVE = 1;
  RECORDING_SHARE_LINK_STATE_REVOKED = 2;
  RECORDING_SHARE_LINK_STATE_EXPIRED = 3;
  // What is left of its byte cap is less than the object's size.
  RECORDING_SHARE_LINK_STATE_ENDED = 4;
}

// RecordingShareLink is one share link of a recording, without the link
// itself.
message RecordingShareLink {
  // Assigned by the server.
  string id = 1;
  string recording_id = 2;
  // The recording's kind.
  RecordingKind kind = 3;
  RecordingShareLinkState state = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // The most bytes its fetches may take.
  int64 max_bytes = 7;
  // The bytes its fetches have taken so far: the object's size once per
  // fetch.
  int64 used_bytes = 8;
  // Unset unless it was revoked.
  google.protobuf.Timestamp revoked_at = 9;
  // Who minted it: a person's sign-in or an API token, as in the audit.
  string created_by = 10;
}

message CreateRecordingShareLinkRequest {
  string recording_id = 1;
  // How long the link stays valid; unset is the server's default, and
  // more than its maximum is INVALID_ARGUMENT.
  google.protobuf.Duration expires_in = 2;
  // The most bytes its fetches may take; 0 is the server's default, and
  // more than its maximum, or less than the recording's object, is
  // INVALID_ARGUMENT.
  int64 max_bytes = 3;
}

message CreateRecordingShareLinkResponse {
  RecordingShareLink share_link = 1;
  // The URL to give the viewer: a GET of it redirects to a signed URL for
  // the recording's object. It is in this answer only.
  string url = 2;
  // The URL of the link's player page: a GET of it plays the recording in
  // the page and is charged against the link as a GET of url is. It is in
  // this answer only.
  string player_url = 3;
}

message ListRecordingShareLinksRequest {
  string recording_id = 1;
  // The most share links in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListRecordingShareLinksResponse {
  repeated RecordingShareLink share_links = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message RevokeRecordingShareLinkRequest {
  string share_link_id = 1;
}

message RevokeRecordingShareLinkResponse {
  RecordingShareLink share_link = 1;
}
