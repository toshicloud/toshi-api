syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// ConnectionService keeps a workspace's connections: the sources of the
// events it owns. A GitHub App installation is a connection of the kind
// GITHUB, which installing the App creates and removing it deletes; the
// calls here list it and cannot create or delete it. A WEBHOOK connection
// receives events from a sender that signs its requests as Standard
// Webhooks does, with a secret the connection keeps.
//
// The caller's credential names the workspace, as for WorkloadService.
// CreateConnection and RotateConnectionSecret require a request_key, which
// works as WorkloadService's do: a retry with the same key and the same
// request returns what the first call returned and changes nothing. A
// signing secret is shown once, in the answer that made it and an identical
// retry's; no read returns it. A retry after the connection is deleted, or
// after its secret was rotated again, fails with FAILED_PRECONDITION.
service ConnectionService {
  // ListConnections returns the workspace's connections, ordered by id.
  //
  // A page holds 100 connections when page_size is zero, and 1000 at most.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option (toshi.permission) = "connections.read";
    option (toshi.scope) = "workspace";
  }

  // GetConnection returns one connection. One the workspace does not have,
  // or one deleted, is NOT_FOUND.
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse) {
    option (toshi.permission) = "connections.read";
    option (toshi.scope) = "workspace";
  }

  // CreateConnection creates a WEBHOOK connection whose events belong to a
  // project's environment, and returns it with its signing secret. A kind
  // other than WEBHOOK fails with INVALID_ARGUMENT, a name a live
  // connection of the workspace has with ALREADY_EXISTS, and an
  // environment the project does not have with NOT_FOUND.
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse) {
    option (toshi.permission) = "connections.write";
    option (toshi.scope) = "workspace";
  }

  // DeleteConnection deletes a WEBHOOK connection: its events are no longer
  // received. A GITHUB connection fails with FAILED_PRECONDITION, as only
  // removing the GitHub App deletes it, and one the workspace does not have
  // with NOT_FOUND.
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse) {
    option (toshi.permission) = "connections.write";
    option (toshi.scope) = "workspace";
  }

  // RotateConnectionSecret gives a WEBHOOK connection a new signing secret
  // and returns it. For the overlap after the rotation, the previous secret
  // still verifies, so the sender can switch over; with an overlap of zero
  // it stops verifying at once. While a previous secret still verifies, a
  // rotation with an overlap fails with FAILED_PRECONDITION; one with an
  // overlap of zero always runs. An overlap above 7 days or below zero fails
  // with INVALID_ARGUMENT, a GITHUB connection with FAILED_PRECONDITION,
  // and one the workspace does not have with NOT_FOUND.
  rpc RotateConnectionSecret(RotateConnectionSecretRequest) returns (RotateConnectionSecretResponse) {
    option (toshi.permission) = "connections.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "connection.secret_rotated"
    };
  }

  // UpdateConnection sets the fields of connection.id's connection that
  // update_mask names. The one field it sets is target, the URL a WEBHOOK
  // connection's deliveries are posted to in place of the event log: its
  // url and secret, both required, or an empty url to clear it. An unset
  // update_mask names the fields connection carries, an empty one changes
  // nothing, and "*" or a path of another field is INVALID_ARGUMENT. The
  // secret is sealed under the workspace's data key and never returned; a
  // deployment with no keyring refuses it with FAILED_PRECONDITION. A
  // GITHUB connection is FAILED_PRECONDITION, and one the workspace does
  // not have NOT_FOUND.
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse) {
    option (toshi.permission) = "connections.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {target: "connection:connection.id"};
  }

  // ListConnectionDeliveries returns a WEBHOOK connection's deliveries: the
  // messages its sender sent, one for each webhook id, newest received
  // first. A delivery never carries its body. A connection the workspace
  // does not have is NOT_FOUND; a deleted one's deliveries are still
  // listed.
  //
  // A page holds 100 deliveries when page_size is zero, and 1000 at most.
  rpc ListConnectionDeliveries(ListConnectionDeliveriesRequest) returns (ListConnectionDeliveriesResponse) {
    option (toshi.permission) = "connections.read";
    option (toshi.scope) = "workspace";
  }

  // GetConnectionDelivery returns one delivery, without its body, and its
  // runs: each time a worker made it an event, posted it to its
  // connection's target, dropped it or failed it, oldest first. A delivery the workspace does not have is NOT_FOUND.
  rpc GetConnectionDelivery(GetConnectionDeliveryRequest) returns (GetConnectionDeliveryResponse) {
    option (toshi.permission) = "connections.read";
    option (toshi.scope) = "workspace";
  }

  // ReplayConnectionDelivery sends a processed, dropped or failed delivery
  // through its connection again, as a new message under the same webhook
  // id: it goes to the connection's target then, or to the event log when
  // it has none, and its run records the caller. A delivery still received, whose receipt or body
  // expired, or whose connection is deleted is FAILED_PRECONDITION, as is
  // one another replay counted since this call read it. A delivery the
  // workspace does not have is NOT_FOUND.
  //
  // request_key is required: a retry with the same key and the same
  // request returns what the first call returned and replays nothing.
  rpc ReplayConnectionDelivery(ReplayConnectionDeliveryRequest) returns (ReplayConnectionDeliveryResponse) {
    option (toshi.permission) = "connections.write";
    option (toshi.scope) = "workspace";
    option (toshi.audit) = {
      action: "connection.delivery_replay_requested"
      target: "connection:response.delivery.connection_id"
    };
  }
}

// ConnectionKind is the kind of source a connection receives events from.
enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  // A GitHub App installation.
  CONNECTION_KIND_GITHUB = 1;
  // A sender that signs its requests as Standard Webhooks does.
  CONNECTION_KIND_WEBHOOK = 2;
}

// Connection is one source of a workspace's events.
message Connection {
  string id = 1;
  ConnectionKind kind = 2;
  // Unique among the workspace's WEBHOOK connections; for GITHUB, the
  // login of the account the App is installed on.
  string name = 3;
  // The project and environment a WEBHOOK connection's events belong to;
  // empty for GITHUB, whose events belong to their repository's project.
  string project = 4;
  string environment = 5;
  // The GitHub App installation of a GITHUB connection; zero otherwise.
  int64 installation_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // Until when a rotated WEBHOOK connection's previous secret still
  // verifies; unset when there is none.
  google.protobuf.Timestamp previous_secret_expires_at = 8;
  reserved 9;
  reserved "transform_version";
  // Where a WEBHOOK connection's deliveries are posted in place of the
  // event log; unset when they become events.
  ConnectionTarget target = 10;
}

// ConnectionTarget is the URL a WEBHOOK connection's deliveries are posted
// to: each delivery's event, as the event log would hold it, signed as
// Standard Webhooks does with the target's own secret, until the URL
// answers 2xx or the tries run out.
message ConnectionTarget {
  // url is the https URL the events are posted to.
  string url = 1;
  // secret is the signing secret: "whsec_" and the base64 of 24 to 64
  // bytes. Input only: no call returns it.
  string secret = 2;
  // updated_by is who set it last, as the audit log names them.
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListConnectionsRequest {
  // The most connections in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetConnectionRequest {
  string id = 1;
}

message GetConnectionResponse {
  Connection connection = 1;
}

message CreateConnectionRequest {
  // WEBHOOK; no other kind is created here.
  ConnectionKind kind = 1;
  // A lowercase DNS label of at most 63 characters.
  string name = 2;
  string project = 3;
  string environment = 4;
  string request_key = 5;
}

message CreateConnectionResponse {
  Connection connection = 1;
  // The signing secret in its whsec_ form, for the sender to sign its
  // requests with. Shown only in this answer and an identical retry's.
  string secret = 2;
}

message DeleteConnectionRequest {
  string id = 1;
  string request_key = 2;
}

message DeleteConnectionResponse {}

message RotateConnectionSecretRequest {
  string id = 1;
  // How long the previous secret still verifies; unset is 24 hours, zero
  // stops it at once, and 7 days is the most.
  google.protobuf.Duration overlap = 2;
  string request_key = 3;
}

message RotateConnectionSecretResponse {
  Connection connection = 1;
  // The new signing secret in its whsec_ form. Shown only in this answer
  // and an identical retry's.
  string secret = 2;
}

message UpdateConnectionRequest {
  // id names the connection; the fields update_mask names carry the new
  // values.
  Connection connection = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateConnectionResponse {
  Connection connection = 1;
}

// ConnectionDeliveryState is where a WEBHOOK connection's delivery stands.
enum ConnectionDeliveryState {
  CONNECTION_DELIVERY_STATE_UNSPECIFIED = 0;
  // Stored and waiting for a worker, or being run.
  CONNECTION_DELIVERY_STATE_RECEIVED = 1;
  // It became an event, or its connection's target took it.
  CONNECTION_DELIVERY_STATE_PROCESSED = 2;
  // It became no event, for the reason the delivery names.
  CONNECTION_DELIVERY_STATE_DROPPED = 3;
  // The store failed on every try to write its event, or its connection's
  // target took it on no try.
  CONNECTION_DELIVERY_STATE_FAILED = 4;
}

// ConnectionDelivery is one message a WEBHOOK connection's sender sent:
// the tries that carried one webhook id.
message ConnectionDelivery {
  string id = 1;
  string connection_id = 2;
  // The sender's webhook-id header.
  string webhook_id = 3;
  ConnectionDeliveryState state = 4;
  // Why it was dropped or failed, such as delivery_failed or store_error;
  // empty otherwise.
  string reason = 5;
  // The time the sender signed; when the ingress stored it.
  google.protobuf.Timestamp sent_at = 6;
  google.protobuf.Timestamp received_at = 7;
  // When it was processed, dropped or failed; unset while received.
  google.protobuf.Timestamp processed_at = 8;
  // Tries a worker made since it was last received or replayed.
  int32 attempts = 9;
  // The request's Content-Type header.
  string content_type = 10;
  // The hex SHA-256 of the body.
  string body_digest = 11;
  // When the workspace's retention removed the body; unset while it is
  // kept. A delivery without its body is not replayed.
  google.protobuf.Timestamp body_expired_at = 12;
  reserved 13;
  reserved "transform_version";
  // How many times it was replayed.
  int32 replays = 14;
  // Who asked for the latest replay; empty before one.
  string replayed_by = 15;
  // The name of the event the delivery carries, such as
  // github.pull_request.opened for a GitHub connection's; empty when the
  // sender named none, as for a webhook connection's.
  string event_name = 16;
}

// ConnectionDeliveryRun is one time a worker ran a delivery to its end.
message ConnectionDeliveryRun {
  // 1 for the first run, counting up.
  int32 run = 1;
  reserved 2, 3, 6;
  reserved "transform_version", "receipt_version", "reason";
  // event, delivered, delivery_failed, connection_deleted, body_not_json,
  // invalid_event, unnamed or failed.
  string outcome = 4;
  // The event the run wrote or found; empty when it wrote none.
  string event_id = 5;
  // What failed, for a target that took the delivery on no try or a store
  // that failed.
  string error = 7;
  google.protobuf.Duration duration = 8;
  google.protobuf.Timestamp finished_at = 9;
  // Who asked for the replay the run ran; empty for the sender's message.
  string actor = 10;
  // The outbound delivery that posted it to the connection's target, for
  // delivered and delivery_failed.
  string target_delivery_id = 11;
}

message ListConnectionDeliveriesRequest {
  string connection_id = 1;
  // Only the deliveries in this state; unspecified lists every state.
  ConnectionDeliveryState state = 2;
  // The most deliveries in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

message ListConnectionDeliveriesResponse {
  repeated ConnectionDelivery deliveries = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetConnectionDeliveryRequest {
  string id = 1;
}

message GetConnectionDeliveryResponse {
  ConnectionDelivery delivery = 1;
  repeated ConnectionDeliveryRun runs = 2;
}

message ReplayConnectionDeliveryRequest {
  string id = 1;
  string request_key = 2;
}

message ReplayConnectionDeliveryResponse {
  // The delivery as the replay left it: received, its replays counted.
  ConnectionDelivery delivery = 1;
}
