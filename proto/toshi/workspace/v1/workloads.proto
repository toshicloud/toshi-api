syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";
import "toshi/workspace/v1/workspace.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// WorkloadService holds the Workspace API's three resources, Job, Sandbox
// and Service, and the events and operations that span them. The three
// share one state model, one event log and one id space: an id names a job,
// a sandbox or a service, and a call of one type given the id of another
// fails with NOT_FOUND.
//
// The caller's credential names the workspace; every request names the
// project and the environment in its project and environment fields, and a
// call that leaves either empty fails with INVALID_ARGUMENT. The environment
// is one of the project's environments; a project or environment the
// workspace does not have is NOT_FOUND. A job, sandbox, service, execution,
// operation or event of another project or environment is NOT_FOUND.
//
// Calls marked KEY take a request_key. A key is bound to the workspace,
// the call and the request's payload: a retry
// with the same key and the same payload returns what the first call returned
// and starts nothing new; the same key with a different payload fails with
// FAILED_PRECONDITION. Some calls require a key; for the others an empty key
// means no retry protection. Calls marked NATURAL take no request_key.
//
// A caller over its rate limit gets RESOURCE_EXHAUSTED with a
// google.rpc.RetryInfo detail: the delay before a retry, on every protocol.
// The same whole seconds are in a Retry-After response header on Connect and
// gRPC-Web calls and on gRPC streams, and in the trailing metadata of a gRPC
// unary call.
service WorkloadService {
  // CreateJob creates a job and returns it. With wait_for_end set, the call
  // blocks until the job ends or the bound passes. If the job has ended when
  // the call answers, the answer carries its exit status and output without
  // a second read; otherwise it carries the job as it is and no output, and
  // no later call returns it.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "jobs.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
  }

  // GetJob returns one job. An unknown ID fails with NOT_FOUND.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (toshi.permission) = "jobs.read";
    option (toshi.scope) = "environment";
  }

  // ListJobs returns the jobs that match every filter that is set, oldest
  // first, a page at a time. A page token from one call stays valid while
  // jobs are created: a later page never repeats or skips a job of an
  // earlier one.
  //
  // A page holds 50 jobs when page_size is zero, and 500 at most.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (toshi.permission) = "jobs.read";
    option (toshi.scope) = "environment";
  }

  // GetWorkloadUsage returns one job's, sandbox's or service's runtime and
  // counters for a UTC month. The request names exactly one of job_id,
  // sandbox_id and service_id; naming none or more than one fails with
  // INVALID_ARGUMENT, and so does a month that is not YYYY-MM. An empty month
  // is the current UTC month. An unknown workload, or one of another kind
  // than the field naming it, fails with NOT_FOUND.
  //
  // The counts need workloads.read. cost is set only for a caller that also
  // holds billing.read where the workload is; it is an estimate, and the
  // invoice stays authoritative.
  rpc GetWorkloadUsage(GetWorkloadUsageRequest) returns (GetWorkloadUsageResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // ListWorkloadUsages returns the jobs, sandboxes and services of the
  // project and environment that ran any part of a UTC month, a page at a
  // time. month is the UTC month as YYYY-MM, and an empty month is the
  // current one. A page holds 50 workloads when page_size is zero, and 500
  // at most.
  //
  // The runtime and counters need workloads.read. cost is set only for a
  // caller that also holds billing.read where the workload is; it is an
  // estimate, and the invoice stays authoritative.
  rpc ListWorkloadUsages(ListWorkloadUsagesRequest) returns (ListWorkloadUsagesResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // UpdateJob changes the fields the mask names and returns the job. Only
  // "labels" can be changed; another path fails with INVALID_ARGUMENT.
  rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "jobs.write";
    option (toshi.scope) = "environment";
  }

  // DeleteJob cancels a job that has not ended and then removes it; every
  // execution in it is cancelled. It returns an operation that is done once
  // the job is removed; GetJob then fails with NOT_FOUND, and the event log
  // keeps its events.
  rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "jobs.write";
    option (toshi.scope) = "environment";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this job? Its record is deleted and cannot be brought back."};
  }

  // CancelJob cancels a job that has not ended and returns it. The job is
  // kept: it ends with END_REASON_CANCELLED, and GetJob and ListJobs return
  // it. A job whose command has not started ends at once, and the answer
  // carries the end; a job whose command runs ends once its host has stopped
  // it, and WaitJob waits for that end. Every execution in the job is
  // cancelled. A call for a job that has ended changes nothing and returns
  // the job as it is. An unknown ID fails with NOT_FOUND.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "jobs.write";
    option (toshi.scope) = "environment";
  }

  // WaitJob blocks until the job is in one of the states asked for or the
  // bound passes, whichever is first, and returns the job as it then is.
  // Passing the bound is not an error: reached is false, and the caller asks
  // again. The server may wait less than the bound asked for.
  rpc WaitJob(WaitJobRequest) returns (WaitJobResponse) {
    option (toshi.permission) = "jobs.read";
    option (toshi.scope) = "environment";
  }

  // WatchJobs streams each change to a job as the event log records it,
  // from the position after a cursor, then as changes happen. A cursor from
  // a list call, ListEvents or an earlier message resumes with no change
  // missed and none repeated, while the log still keeps the events after it;
  // an older cursor fails with OUT_OF_RANGE.
  rpc WatchJobs(WatchJobsRequest) returns (stream WatchJobsResponse) {
    option (toshi.permission) = "jobs.read";
    option (toshi.scope) = "environment";
  }

  // WatchOutput streams a job's standard output and error while it runs:
  // the bytes the server holds from the offsets asked for, then each write
  // as it happens, and last how the job ended. A job that has not started
  // yet is waited for. The server holds the first 1 MiB of each stream, as
  // for CreateJob's output, and only while the job runs: a job whose output
  // this server no longer holds (it has ended) or never held (its command
  // runs on another server) fails with FAILED_PRECONDITION, and a job that
  // ends while the call is answered is followed to its end. A sandbox or
  // service fails with INVALID_ARGUMENT.
  // A reader never slows or cancels the job: each reads what the server
  // holds at its own pace.
  rpc WatchOutput(WatchOutputRequest) returns (stream WatchOutputResponse) {
    option (toshi.permission) = "jobs.read";
    option (toshi.scope) = "environment";
  }

  // CreateSandbox creates a sandbox and returns it, queued: it runs once a
  // host takes it, and until it is deleted or its time limit passes.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
  }

  // GetSandbox returns one sandbox. An unknown ID fails with NOT_FOUND.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // ListSandboxes returns the sandboxes that match every filter that is
  // set, oldest first, a page at a time, with the page tokens of ListJobs.
  //
  // A page holds 50 sandboxes when page_size is zero, and 500 at most.
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // UpdateSandbox changes the fields the mask names and returns the sandbox.
  // "labels" can be changed on any sandbox. "spec.max_duration" raises a
  // running sandbox's limit and must be the only path: the new limit, in
  // whole minutes from the sandbox's start, above its current one and no
  // longer than the plan's sandbox cap. The response then carries an
  // operation, which completes successfully when the sandbox's host
  // acknowledges the new limit in time and the sandbox still runs with no
  // stop asked for; until then the sandbox shows the current one. The
  // operation fails with UNAVAILABLE when the host does not acknowledge the
  // limit in time, and with FAILED_PRECONDITION when the sandbox stops
  // first; the limit the control plane records is then unchanged. A host
  // that applied the new limit but whose acknowledgment was lost can keep
  // it until it takes the old limit back or the sandbox stops. A sandbox
  // that is not running, has a stop asked for, has no limit of its own or
  // has a raise pending, or whose host's agent cannot take a new limit,
  // fails with FAILED_PRECONDITION. Another path fails with
  // INVALID_ARGUMENT.
  rpc UpdateSandbox(UpdateSandboxRequest) returns (UpdateSandboxResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.scope) = "environment";
  }

  // DeleteSandbox stops a sandbox that has not ended and then removes it;
  // every execution in it is cancelled. It returns an operation that is
  // done once the sandbox is removed; GetSandbox then fails with NOT_FOUND,
  // and the event log keeps its events.
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.scope) = "environment";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this sandbox? Its data is deleted and cannot be brought back."};
  }

  // StopSandbox ends its run and every execution in it and moves it to
  // CREATED with stopped_at. Its state volume is saved and its VM ends,
  // unless the sandbox has keep_vm: then its host keeps the VM. Stopping a
  // stopped sandbox returns it as it is. One that has ended fails with
  // FAILED_PRECONDITION. DeleteSandbox ends a sandbox.
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.scope) = "environment";
  }

  // StartSandbox queues a new run of a stopped sandbox: a new VM booted from
  // its image with its state volume, or its kept VM when it has keep_vm.
  // Starting a queued or running sandbox returns it as it is. One that has
  // ended fails with FAILED_PRECONDITION, as does a start whose state volume
  // or image is gone or out of reach, with the reason in its ErrorInfo.
  rpc StartSandbox(StartSandboxRequest) returns (StartSandboxResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
  }

  // WaitSandbox blocks until the sandbox is in one of the states asked for
  // or the bound passes, as WaitJob does for a job.
  rpc WaitSandbox(WaitSandboxRequest) returns (WaitSandboxResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // WatchSandboxes streams each change to a sandbox as the event log
  // records it, from the position after a cursor, as WatchJobs does for
  // jobs.
  rpc WatchSandboxes(WatchSandboxesRequest) returns (stream WatchSandboxesResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // Execute starts a command in a running workload. The first request
  // carries the start message; later requests carry standard input. The
  // stream answers with the execution's ID, then its standard output and
  // error as they are written, and ends with its exit status. A workload
  // that is not running fails with FAILED_PRECONDITION. A server may cancel
  // an execution whose client stops reading its output.
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "sandbox.executed"
      target: "sandbox:start.sandbox_id"
    };
  }

  // CancelExecution stops an execution. Its Execute stream ends with an exit
  // that says it was cancelled. Cancelling an execution that has ended
  // changes nothing. It returns once the execution has ended, whether or not
  // the Execute stream's client still reads it.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.scope) = "environment";
  }

  // ExecuteCommand runs a command as Execute does, with its standard input
  // closed, for a client that cannot stream a request, such as a browser.
  // The stream answers as Execute's does: the execution's ID, then its
  // output, and last its exit. The execution is one of Execute's:
  // CancelExecution stops it, and a request_key retry of either call
  // replays it.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (stream ExecuteCommandResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "sandboxes.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {action: "sandbox.executed"};
    option (toshi.mcp) = {exclude: true};
  }

  // AnswerPrompt answers a prompt an agent workload waits on, one of its
  // job's, sandbox's or service's waiting, and returns the
  // AGENT_ANSWERED event that records the answer and who gave it. The
  // prompt leaves waiting, and the event reaches the agent through Toshi.
  // Only a person answers: a call that acts for no person, such as a
  // workload's own token, fails with PERMISSION_DENIED. A prompt is
  // answered once: a prompt that is not waiting, answered or ended with
  // the workload's run, fails with FAILED_PRECONDITION. A second answer
  // names the earlier answer's event and time; an ended prompt names its
  // reason. An approval is
  // answered "approved" or "denied", a question with options one of them,
  // and one without options any text of 1 to 4096 bytes; another answer
  // fails with INVALID_ARGUMENT.
  //
  // With for_run set, an approval's answer also holds for the rest of the
  // run: a later approval of the same kind and the same exact act, the
  // same command, domain, repository and branch, is answered without a
  // person, and the answer records the person who made this one. A later
  // answer replaces it, a one-time "denied" removes a decision to approve,
  // and the end of the run clears them. A question, a plan approval and an
  // approval whose payload does not name its act are not answered for the
  // run: the first two fail with INVALID_ARGUMENT, the last with
  // FAILED_PRECONDITION. ListPromptDecisions lists the decisions, and
  // RevokePromptDecision removes one.
  rpc AnswerPrompt(AnswerPromptRequest) returns (AnswerPromptResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "workloads.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "prompt.answered"
      target: "workload:workload_id"
    };
  }

  // ListPromptDecisions returns the approvals a job, sandbox or service
  // answered for the rest of its run, oldest first: the kind of act, the
  // exact act, the decision, the person who made it and when, and the
  // decision ID of the prompt that asked it. A workload that has none, or
  // none left, returns an empty list. It needs workloads.read.
  rpc ListPromptDecisions(ListPromptDecisionsRequest) returns (ListPromptDecisionsResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // RevokePromptDecision removes one of the approvals a job, sandbox or
  // service answered for the rest of its run, so a later approval of the
  // same act asks a person again. It asks nothing of the workload and
  // changes no prompt. An unknown ID fails with NOT_FOUND; a retry with the
  // same request_key returns the first answer. It needs workloads.write,
  // and is audited as prompt_decision.revoked with the workload as its
  // target.
  rpc RevokePromptDecision(RevokePromptDecisionRequest) returns (RevokePromptDecisionResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "workloads.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      target: "workload:workload_id"
    };
  }

  // EmitWorkloadEvent appends an event to a job's, sandbox's or service's
  // event log, as its guest emits one, and returns it: type EMITTED, the
  // name given and data. The workload need not be running. The name is 1
  // to 200 bytes of UTF-8 with no space or control character, and its first
  // dot-separated segment is none Toshi keeps for its own events (job,
  // sandbox, run, service, recording, agent, takeover, spend, egress, host,
  // github, webhook, trigger, mail and endpoint); data is empty or JSON of
  // at most 64 KiB. Another fails with INVALID_ARGUMENT, and an unknown
  // workload with NOT_FOUND.
  rpc EmitWorkloadEvent(EmitWorkloadEventRequest) returns (EmitWorkloadEventResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "workloads.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "workload.event_emitted"
    };
  }

  // WatchTelemetry streams a sandbox's resource samples as its host reports
  // them, in cursor order: the samples kept after a cursor, then each one as
  // it is stored. Each sample stored takes the next cursor, also one timed
  // before a sample already sent. Last comes an end, once the sandbox has
  // ended and every sample still kept that was stored before it ended has
  // been sent. A host can report a sample after the end: a watch resumed
  // from the last cursor returns it, then ends again. A sandbox that has
  // not started yet is waited for. A job or service fails with
  // INVALID_ARGUMENT.
  rpc WatchTelemetry(WatchTelemetryRequest) returns (stream WatchTelemetryResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // WatchGuestLog streams what a sandbox's VM writes to its serial console:
  // the bytes its host keeps from a cursor on, then each write as it
  // happens, until the sandbox ends. The host keeps the newest part of the
  // console; bytes it no longer keeps are skipped, and the next chunk's
  // offset shows the gap. A slow reader does not block the VM's console
  // writes; bytes rotated out before it reads them are skipped. A sandbox
  // that has not started yet is waited for, and so is an empty console. A
  // sandbox that has ended, or whose host keeps no console log, fails with
  // FAILED_PRECONDITION. A job or service fails with INVALID_ARGUMENT.
  rpc WatchGuestLog(WatchGuestLogRequest) returns (stream WatchGuestLogResponse) {
    option (toshi.permission) = "sandboxes.read";
    option (toshi.scope) = "environment";
  }

  // CreatePreviewShareLink mints a share link for one of a running
  // sandbox's previews: the endpoint `preview`, served at the sandbox's own
  // hostname, unless the request names another of its http endpoints. The
  // link is a signed link that admits one device, the first to open it,
  // until it expires, carries its byte cap or is revoked, and only at that
  // endpoint's hostname. The link is in this answer only. The sandbox must
  // be running with that preview open, or the call fails with
  // FAILED_PRECONDITION, as it does when the workspace's plan turns share
  // links off. An endpoint or port the sandbox has no http endpoint for fails
  // with NOT_FOUND; an endpoint that is not http, a port outside 1 to 65535,
  // or an expiry or a byte cap above the plan's, with INVALID_ARGUMENT.
  rpc CreatePreviewShareLink(CreatePreviewShareLinkRequest) returns (CreatePreviewShareLinkResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "previews.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "host_job.preview_share_link_issued"
      target: "none"
    };
  }

  // ListPreviewShareLinks returns a sandbox's share links, for all of its
  // previews, the oldest first, never with the link itself.
  //
  // A page holds 100 share links when page_size is zero, and 1000 at most.
  rpc ListPreviewShareLinks(ListPreviewShareLinksRequest) returns (ListPreviewShareLinksResponse) {
    option (toshi.permission) = "previews.read";
    option (toshi.scope) = "environment";
  }

  // RevokePreviewShareLink revokes a share link: it admits no device
  // again, and its open connections end within seconds. Revoking a link
  // that was revoked or has ended returns it as it is.
  rpc RevokePreviewShareLink(RevokePreviewShareLinkRequest) returns (RevokePreviewShareLinkResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "previews.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "host_job.preview_share_link_revoked"
      target: "none"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Revoke this share link? Anyone using it loses access now."};
  }

  // CreateServiceShareLink mints a share link for one of a service's
  // provided names: its front endpoint's, unless the request names another
  // of its http endpoints. The link admits one device, the first to open
  // it, until it expires, carries its byte cap or is revoked, on whichever
  // run of the service is running, across restarts and redeploys. The link
  // is in this answer only. The call fails with FAILED_PRECONDITION when
  // this server serves no provided names, when the service has none, or
  // when the workspace's plan turns share links off; with NOT_FOUND for an
  // endpoint that is not an http endpoint of the service's current revision;
  // and with INVALID_ARGUMENT for an expiry or a byte cap above the plan's.
  rpc CreateServiceShareLink(CreateServiceShareLinkRequest) returns (CreateServiceShareLinkResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service.share_link_issued"
      target: "none"
    };
  }

  // ListServiceShareLinks returns a service's share links, for all of its
  // endpoints, the oldest first, never with the link itself.
  //
  // A page holds 100 share links when page_size is zero, and 1000 at most.
  rpc ListServiceShareLinks(ListServiceShareLinksRequest) returns (ListServiceShareLinksResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // RevokeServiceShareLink revokes a service's share link: it admits no
  // device again, and its open connections end within seconds. Revoking a
  // link that was revoked or has ended returns it as it is.
  rpc RevokeServiceShareLink(RevokeServiceShareLinkRequest) returns (RevokeServiceShareLinkResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service.share_link_revoked"
      target: "none"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Revoke this share link? Anyone using it loses access now."};
  }

  // CreateService creates a service with its recipe as revision 1 and
  // returns it, created and not started: StartService starts it.
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
  }

  // GetService returns one service. An unknown ID fails with NOT_FOUND.
  rpc GetService(GetServiceRequest) returns (GetServiceResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // ListServices returns the services that match every filter that is set,
  // oldest first, a page at a time, with the page tokens of ListJobs.
  //
  // A page holds 50 services when page_size is zero, and 500 at most.
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // UpdateService changes the field the mask names and returns the
  // service. The mask names one path: "labels", or "spec.recipe", which
  // deploys service.spec.recipe as the service's next revision and selects
  // it. A deploy stops a live run of another revision, so a started
  // service's next run runs the new recipe; a stopped service runs it once
  // started. On a started service the deploy opens the revision's upgrade
  // window (ServiceRevision.upgrade): a run of the revision that fails in
  // it, or one not ready when it ends, rolls the service back to the
  // revision it replaced and restores the state volume's version saved at
  // the deploy. A recipe that does not parse, or of another template,
  // fails with INVALID_ARGUMENT, as does another path. "spec.visitors"
  // sets who the service's verified customer domains admit: OPEN serves a
  // visitor with neither a session nor a share link, with empty identity
  // headers, on its customer domains only, and a plan whose
  // domains.open_requests_per_minute is 0 refuses it with
  // FAILED_PRECONDITION. Setting the value the service has changes
  // nothing. "spec.host_kinds" sets the kinds of host its runs may use, in
  // order (ServiceSpec.host_kinds), its still-queued runs included; an empty
  // list takes any kind, and a repeated or unspecified kind fails with
  // INVALID_ARGUMENT.
  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {destructive: true};
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Deploy this recipe? It replaces the running recipe, and the running revision is not kept."};
  }

  // DeleteService stops a service that has not ended and then removes it.
  // It returns an operation that is done once the service is removed;
  // GetService then fails with NOT_FOUND, and the event log keeps its
  // events.
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this service? Its running revision and its data are deleted."};
  }

  // WaitService blocks until the service is in one of the states asked for
  // or the bound passes, as WaitJob does for a job.
  rpc WaitService(WaitServiceRequest) returns (WaitServiceResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // WatchServices streams each change to a service as the event log
  // records it, from the position after a cursor, as WatchJobs does for
  // jobs.
  rpc WatchServices(WatchServicesRequest) returns (stream WatchServicesResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // StartService starts a service. An always-on service's workload
  // moves from CREATED to QUEUED and its first run is queued as a job on
  // a host, placed by the service's size; the run's start moves the
  // workload to RUNNING. While the service is started, a run that ends is
  // followed by another. An on-demand service is started asleep: it runs
  // only once WakeService, a hold or a connect on one of its endpoints
  // wakes it, and sleeps again when it has been idle for its recipe's
  // idle period. Starting a started service returns it as it is. A size
  // that is not a Linux one and a start past the plan's shared services
  // fail with FAILED_PRECONDITION.
  rpc StartService(StartServiceRequest) returns (StartServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
  }

  // StopService stops a service: its workload moves back to CREATED and
  // its live run is stopped. Stopping a service that is not started
  // returns it as it is.
  rpc StopService(StopServiceRequest) returns (StopServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
  }

  // SetServiceMode sets a service's mode. A started service stays
  // started: set to ON_DEMAND, it sleeps once it is idle; set to
  // ALWAYS_ON while asleep, its next run is queued.
  rpc SetServiceMode(SetServiceModeRequest) returns (SetServiceModeResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {action: "service.mode_set"};
  }

  // WakeService wakes a started on-demand service that is asleep: its
  // workload moves from CREATED to QUEUED and a run is queued, placed as a
  // start is. A wake keeps the service awake for its recipe's idle period;
  // waking an awake one extends that. The answer does not wait for the run
  // to be ready: its ServiceRun's ready_at says when it is. Waking a
  // started always-on service returns it as it is; a service that is not
  // started fails with FAILED_PRECONDITION.
  rpc WakeService(WakeServiceRequest) returns (WakeServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
  }

  // HoldWorkload places an operator hold on a sandbox or service. Only an
  // operator may call it; another caller is refused with PERMISSION_DENIED.
  // The operator's reason header is required. A running workload is stopped
  // with reason POLICY and cause OPERATOR; a stopped one only gets the hold.
  // A job cannot be held; cancel it instead.
  rpc HoldWorkload(HoldWorkloadRequest) returns (HoldWorkloadResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
  }

  // ReleaseWorkload lifts an operator hold and starts nothing. Only an
  // operator may call it; another caller is refused with PERMISSION_DENIED.
  // The operator's reason header is required.
  rpc ReleaseWorkload(ReleaseWorkloadRequest) returns (ReleaseWorkloadResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
  }

  // KeepServiceAwake takes or renews the caller's hold on a started
  // service: while any hold is live, an on-demand service does not sleep,
  // and a hold on one that is asleep wakes it. Each caller has one hold per
  // service, live until its time to live runs out or ReleaseServiceAwake
  // drops it. A hold gives no access to the service. A service that is not
  // started fails with FAILED_PRECONDITION, and a time to live above an
  // hour with INVALID_ARGUMENT.
  rpc KeepServiceAwake(KeepServiceAwakeRequest) returns (KeepServiceAwakeResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service.held"
    };
  }

  // ReleaseServiceAwake drops the caller's hold on a service. Releasing a
  // hold the caller does not have returns the service as it is.
  rpc ReleaseServiceAwake(ReleaseServiceAwakeRequest) returns (ReleaseServiceAwakeResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service.released"
    };
  }

  // PutServiceAlarm creates or replaces the service's alarm with this name
  // and returns it. At each instant of its schedule an alarm publishes its
  // event, with its data, on one of the service's event endpoints. Replacing
  // an alarm raises its generation and schedules it again from now. A
  // schedule, zone, endpoint, event or data that is not valid fails with
  // INVALID_ARGUMENT, as does an event name under a prefix Toshi keeps for
  // its own events; an endpoint the service does not declare fails with
  // NOT_FOUND; a service holding 100 alarms refuses another with
  // RESOURCE_EXHAUSTED.
  rpc PutServiceAlarm(PutServiceAlarmRequest) returns (PutServiceAlarmResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service_alarm.set"
      target: "service:service_id"
    };
  }

  // GetServiceAlarm returns one alarm and its most recent occurrences,
  // newest first. An unknown name fails with NOT_FOUND.
  rpc GetServiceAlarm(GetServiceAlarmRequest) returns (GetServiceAlarmResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // ListServiceAlarms returns the service's alarms by name, in pages.
  //
  // A page holds 100 alarms when page_size is zero, and 1000 at most.
  rpc ListServiceAlarms(ListServiceAlarmsRequest) returns (ListServiceAlarmsResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // DeleteServiceAlarm removes an alarm and its occurrences. Messages it
  // already published stay on the endpoint.
  rpc DeleteServiceAlarm(DeleteServiceAlarmRequest) returns (DeleteServiceAlarmResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      target: "service:service_id"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Delete this alarm? It stops raising now."};
  }

  // PauseServiceAlarm stops an alarm publishing until it is resumed.
  // Pausing a paused alarm changes nothing.
  rpc PauseServiceAlarm(PauseServiceAlarmRequest) returns (PauseServiceAlarmResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service_alarm.paused"
      target: "service:service_id"
    };
  }

  // UnpauseServiceAlarm starts a paused alarm again from the next instant
  // of its schedule; instants that passed while it was paused are not
  // published. An alarm with a single instant that has passed stays
  // without a next instant. Unpausing an alarm that is not paused changes
  // nothing.
  rpc UnpauseServiceAlarm(UnpauseServiceAlarmRequest) returns (UnpauseServiceAlarmResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service_alarm.resumed"
      target: "service:service_id"
    };
  }

  // RunServiceAlarmNow publishes the alarm's event once, now, paused or
  // not, and returns the occurrence. It does not move the alarm's next
  // instant.
  rpc RunServiceAlarmNow(RunServiceAlarmNowRequest) returns (RunServiceAlarmNowResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service_alarm.ran"
      target: "service:service_id"
    };
  }

  // StartServiceSignIn runs one of the service's recipe's sign_in programs
  // and streams what it writes until it ends: the started message names
  // the sign-in and when it is stopped, the output messages carry its
  // stdout and stderr, a prompt message carries the URL and code its
  // recipe's patterns read from them, and the ended message says how it
  // ended. A sign-in may run for 15 minutes; past that the command is
  // cancelled and the sign-in ends TIMED_OUT. Only one sign-in of a program runs at a time:
  // a second fails with FAILED_PRECONDITION while the first is under way.
  // The output is streamed only and never stored.
  //
  // A sign-in is answered with AnswerServiceSignIn and ends early with
  // CancelServiceSignIn; its stream ending for another reason, as a client
  // that leaves, also ends it, cancelled. An unknown service or a program
  // its recipe does not declare fails with NOT_FOUND; a service that is
  // not running fails with FAILED_PRECONDITION.
  rpc StartServiceSignIn(StartServiceSignInRequest) returns (stream StartServiceSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.audit) = {action: "service.sign_in_started"};
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {idempotent: false, exclude: true};
  }

  // AnswerServiceSignIn writes one line to a running sign-in's standard
  // input or sends a browser's loopback redirect to its open port. Set
  // exactly one of text and redirect_url. A text answer is at most 4 KiB
  // and has no newline; a redirect is at most 8 KiB, uses http and a
  // loopback host, and names the port the sign-in opened. Only the starter
  // may send a redirect. The answer is never stored. An unknown sign-in is
  // NOT_FOUND; an invalid answer is INVALID_ARGUMENT; a redirect before the
  // program listens is FAILED_PRECONDITION.
  rpc AnswerServiceSignIn(AnswerServiceSignInRequest) returns (AnswerServiceSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.audit) = {action: "service.sign_in_answered"};
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }

  // CancelServiceSignIn ends a running sign-in: its program is cancelled
  // and its stream ends CANCELLED. It returns once the cancel is asked
  // for, not once the sign-in has ended, and works from any control plane
  // process. Cancelling a sign-in that is not under way fails with
  // NOT_FOUND; one that has ended changes nothing.
  rpc CancelServiceSignIn(CancelServiceSignInRequest) returns (CancelServiceSignInResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.audit) = {action: "service.sign_in_cancelled"};
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }

  // GetServiceSignInStatus runs the status commands of the service's
  // recipe and reports, for each sign_in program, whether it is signed in
  // and what its status command wrote. program names one program; empty
  // asks for every program the recipe declares, in its order. Each command
  // runs for 30 seconds at most, past which it is not signed in. An output
  // is cut at 4 KiB, ending with "[cut]". The status is not stored.
  //
  // An unknown service or a program its recipe does not declare fails with
  // NOT_FOUND; a service that is not running fails with
  // FAILED_PRECONDITION.
  rpc GetServiceSignInStatus(GetServiceSignInStatusRequest) returns (GetServiceSignInStatusResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }

  // SignOutService runs the sign-out command of one of the service's
  // recipe's sign_in programs on the service's run: the program's own
  // logout, such as `gh auth logout`. Toshi does not read, copy or delete
  // what the program keeps. The command runs for 30 seconds at most, past
  // which exit_code is -1; its output is cut at 4 KiB, ending with "[cut]".
  //
  // An unknown service or a program its recipe does not declare fails with
  // NOT_FOUND; a service that is not running, a program whose recipe
  // declares no sign_out command, or a sign-in of the program under way
  // fails with FAILED_PRECONDITION.
  rpc SignOutService(SignOutServiceRequest) returns (SignOutServiceResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "services.write";
    option (toshi.audit) = {action: "service.sign_out"};
    option (toshi.scope) = "environment";
    option (toshi.mcp) = {exclude: true};
  }

  // ListServiceRevisions returns a service's revisions, newest first, a
  // page at a time. An unknown ID fails with NOT_FOUND.
  rpc ListServiceRevisions(ListServiceRevisionsRequest) returns (ListServiceRevisionsResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // GetServiceRevision returns one revision of a service. An unknown ID or
  // number fails with NOT_FOUND.
  rpc GetServiceRevision(GetServiceRevisionRequest) returns (GetServiceRevisionResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // RollbackService selects revision, a revision the service already has,
  // as its current one, and stops its live run, so the next run starts on
  // it: the recipe comes back, and the mode, size, state volume and secret
  // values do not change. No revision is made. expected_revision, when
  // set, must be the selected revision, else FAILED_PRECONDITION naming
  // the selected one; so is a revision already selected, and a revision
  // outside the window (ServiceRevision.eligible), with its reason. An
  // unknown revision is NOT_FOUND. Before anything is selected, the
  // registry of the revision's container image is asked whether it still
  // serves the revision's digest, with the recipe's registry login; the
  // answer is stored on the revision (ServiceRevision.image_check). A
  // registry that answers it does not is FAILED_PRECONDITION with
  // ErrorInfo reason IMAGE_NOT_SERVED and the registry's status; one that
  // cannot be reached, refuses the login or fails is FAILED_PRECONDITION
  // with reason IMAGE_CHECK_FAILED and its answer. A revision with a
  // container image but no stored digest is FAILED_PRECONDITION with
  // reason IMAGE_NOT_PINNED and the revision in the metadata. The next run pulls the
  // revision's image by its digest: nothing is resolved again or built.
  // The answer carries the activation, whose outcome follows the
  // revision's next run (ListServiceActivations).
  rpc RollbackService(RollbackServiceRequest) returns (RollbackServiceResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "services.write";
    option (toshi.mcp) = {open_world: true};
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "service.activation_requested"
    };
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Roll back to this recipe? It replaces the running recipe and stops the live run."};
  }

  // ListServiceActivations returns each time a revision of the service was
  // selected, by its create, a deploy or a rollback, newest first, a page
  // at a time, with what came of it.
  rpc ListServiceActivations(ListServiceActivationsRequest) returns (ListServiceActivationsResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // ListServiceRuns returns a service's runs, the newest first: each run
  // is a job on a host, of the revision that was current when it was
  // queued.
  //
  // A page holds 20 runs when page_size is zero, and 100 at most.
  rpc ListServiceRuns(ListServiceRunsRequest) returns (ListServiceRunsResponse) {
    option (toshi.permission) = "services.read";
    option (toshi.scope) = "environment";
  }

  // ListEvents returns the events after a cursor, oldest first, a page at a
  // time, for a client that polls or catches up after downtime.
  // A kept VM discarded for an image change has type KEPT_VM_DISCARDED,
  // with its run and reason under kept_vm_discarded.
  //
  // A page holds 50 events when page_size is zero, and 500 at most.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // ExportEvents streams the selected events as JSON lines, oldest first,
  // without a row cap. The first line is {"header":{"since":...,"until":...,
  // "retention_boundary":...|null,"crossed":true|false}}, followed by one
  // Event per line. The plan must include event export or the call fails with
  // PERMISSION_DENIED. Project and environment are required as in ListEvents.
  //
  // Since is required; until defaults to now. Since must be before until,
  // else INVALID_ARGUMENT. A cursor from a previous response resumes after
  // its last row, sending the header again. A malformed cursor or one from
  // another range or filter fails with INVALID_ARGUMENT; a resume cursor at
  // or behind the retention boundary fails with OUT_OF_RANGE. When resuming
  // without an until, the cursor keeps the original range's until.
  rpc ExportEvents(ExportEventsRequest) returns (stream ExportEventsResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
    option (toshi.audit) = {
      action: "workload_events.exported"
      target: "workspace:workspace"
    };
  }

  // WatchEvents streams the events after a cursor, then each new event as
  // it is written, for a client that stays connected.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // GetOperation returns one operation. An unknown ID fails with NOT_FOUND.
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }

  // WaitOperation blocks until the operation is done or the bound passes,
  // whichever is first, and returns it. Passing the bound is not an error:
  // the operation comes back not done, and the caller asks again. The server
  // may wait less than the bound asked for.
  rpc WaitOperation(WaitOperationRequest) returns (WaitOperationResponse) {
    option (toshi.permission) = "workloads.read";
    option (toshi.scope) = "environment";
  }
}

// AnswerPromptRequest is a call of AnswerPrompt.
message AnswerPromptRequest {
  // The workload's project.
  string project = 1;
  // The workload's environment.
  string environment = 2;
  // The job, sandbox or service whose prompt is answered.
  string workload_id = 3;
  // The prompt's id, as its waiting entry gives it.
  string prompt_id = 4;
  // The answer: "approved" or "denied", one of a question's options, or
  // 1 to 4096 bytes of text.
  string answer = 5;
  // When set, must match the waiting prompt's decision_id.
  string decision_id = 6 [json_name = "decision_id"];
  // A key for retrying this answer without answering twice; empty for none.
  string request_key = 7 [json_name = "request_key"];
  // Answer an approval for the rest of the run: a later approval of the
  // same kind and exact act is answered without a person. Only an approval
  // may carry it; a question, a plan and an approval whose payload does not
  // name its act are refused.
  bool for_run = 8;
}

// AnswerPromptResponse is the answer to AnswerPrompt.
message AnswerPromptResponse {
  // The AGENT_ANSWERED event.
  Event event = 1;
}

// ListPromptDecisionsRequest is a call of ListPromptDecisions.
message ListPromptDecisionsRequest {
  // The workload's project.
  string project = 1;
  // The workload's environment.
  string environment = 2;
  // The job, sandbox or service whose decisions for the run are listed.
  string workload_id = 3;
}

// ListPromptDecisionsResponse is the answer to ListPromptDecisions.
message ListPromptDecisionsResponse {
  // The decisions, oldest first.
  repeated PromptDecision decisions = 1;
}

// PromptDecision is an approval a job, sandbox or service answered for the
// rest of its run.
message PromptDecision {
  // The decision's opaque ID, which RevokePromptDecision takes.
  string id = 1;
  // What the approval asked to be let do: push, pull_request, command or
  // domain.
  string kind = 2;
  // The exact act it answers: the argv as a JSON array or the command
  // string, the lower-case host, or the repository and branch.
  string subject = 3;
  // "approved" or "denied".
  string decision = 4;
  // The Toshi user ID of the person who decided.
  string decided_by = 5;
  // When the person decided.
  google.protobuf.Timestamp decided_at = 6;
  // The decision ID of the prompt that asked the act.
  string decision_id = 7;
}

// RevokePromptDecisionRequest is a call of RevokePromptDecision.
message RevokePromptDecisionRequest {
  // The workload's project.
  string project = 1;
  // The workload's environment.
  string environment = 2;
  // The job, sandbox or service whose decision is revoked.
  string workload_id = 3;
  // The decision's ID, as ListPromptDecisions gives it.
  string id = 4;
  // A key for retrying this revoke without revoking twice; empty for none.
  string request_key = 5;
}

// RevokePromptDecisionResponse is the answer to RevokePromptDecision: it
// carries nothing.
message RevokePromptDecisionResponse {}

// EmitWorkloadEventRequest is a call of EmitWorkloadEvent.
message EmitWorkloadEventRequest {
  // The workload's project.
  string project = 1;
  // The workload's environment.
  string environment = 2;
  // The job, sandbox or service the event is about.
  string workload_id = 3;
  // The event's name: 1 to 200 bytes of UTF-8, with no space or control
  // character, and a first segment Toshi does not keep.
  string name = 4;
  // JSON, at most 64 KiB; empty for none.
  bytes data = 5;
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the first answer; a different request with the
  // same key is refused. Keys are kept for 30 days by default.
  string request_key = 6;
}

// EmitWorkloadEventResponse is the answer to EmitWorkloadEvent.
message EmitWorkloadEventResponse {
  // The EMITTED event as stored.
  Event event = 1;
}

// ExportEventsRequest is a call of ExportEvents.
message ExportEventsRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // Only this workload's events; empty for every workload of the project
  // and environment.
  string workload_id = 3;
  // The start of the range; required.
  google.protobuf.Timestamp since = 4;
  // The end of the range; unset means now.
  google.protobuf.Timestamp until = 5;
  // Resume after the last row of an earlier response; empty for the first.
  string cursor = 6;
}

// ExportEventsResponse is one message of ExportEvents' stream.
message ExportEventsResponse {
  // Complete JSON lines: the header line first, then Events, up to 256
  // KiB.
  bytes data = 1;
  // Resume after this message's last row, or the cursor given when it has
  // no rows.
  string cursor = 2;
}

// CreateJobRequest is a call of CreateJob.
message CreateJobRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // The job's spec: its command, bindings, size and image.
  JobSpec spec = 3;
  // The job's labels; a key starting with "toshi." is refused with
  // INVALID_ARGUMENT.
  map<string, string> labels = 4;
  // Required: the same key on every retry of this create.
  string request_key = 5;
  // What the job records of its runs. UNSPECIFIED takes the default
  // RecordingPolicy names.
  RecordingPolicy recording = 6;
  // Block until the job ends, at most this long. Zero returns at once.
  google.protobuf.Duration wait_for_end = 7;
}

// CreateJobResponse is the answer to CreateJob.
message CreateJobResponse {
  // The job as it was created.
  Job job = 1;
  // Set when wait_for_end was set and the job had ended when the call
  // answered.
  Output output = 2;
}

// GetJobRequest is a call of GetJob.
message GetJobRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // The job's ID.
  string id = 3;
}

// GetJobResponse is the answer to GetJob.
message GetJobResponse {
  // The job.
  Job job = 1;
  // The job's bindings as they were fixed when it started, in name order;
  // empty before it started.
  repeated BoundBinding bound = 2;
  // The job's attempts, oldest first: one for each assignment to a
  // runner, the current one last while the job holds it.
  repeated JobAttempt attempts = 3;
}

// ListJobsRequest is a call of ListJobs.
message ListJobsRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // Empty matches every state.
  repeated JobState states = 3;
  // The most jobs in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
  // Only the jobs that carry every one of these labels, each with exactly
  // this value. A job without one of the keys never matches, even when the
  // value given is empty. No labels matches every job.
  map<string, string> labels = 6;
}

// ListJobsResponse is the answer to ListJobs.
message ListJobsResponse {
  // The page's jobs, oldest first.
  repeated Job jobs = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // The event log's position when the first page was read; every page of
  // the list returns it. WatchJobs from this cursor shows every change
  // after the list.
  string cursor = 3;
}

// GetWorkloadUsageRequest is a call of GetWorkloadUsage.
message GetWorkloadUsageRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // Exactly one of job_id, sandbox_id and service_id names the workload.
  string job_id = 3;
  // The sandbox's ID.
  string sandbox_id = 4;
  // The service's ID.
  string service_id = 5;
  // The UTC month as YYYY-MM; empty is the current UTC month.
  string month = 6;
  // A grant the caller's workspace received, to act on the owner's sandbox
  // through it (docs/grants.md); project and environment are then left
  // empty, and sandbox_id names its workload.
  string grant = 7;
}

// GetWorkloadUsageResponse is the answer to GetWorkloadUsage.
message GetWorkloadUsageResponse {
  // The workload's usage for the month.
  WorkloadUsage usage = 1;
}

// WorkloadUsage is one workload's runtime, counters and, for a caller that
// holds billing.read, an estimate of its share of the month's bill.
message WorkloadUsage {
  // The job's, sandbox's or service's id.
  string workload_id = 1;
  // "job", "sandbox" or "service".
  string kind = 2;
  // The UTC month, as YYYY-MM.
  string month = 3;
  // Whole seconds it ran in the month.
  int64 running_seconds_month = 4;
  // Whole seconds it has run since its first start.
  int64 running_seconds_life = 5;
  // The CPU milliseconds its runs used, over its life.
  int64 cpu_millis = 6;
  // The executions it ran, over its life.
  int64 executions = 7;
  // The bytes it sent off its hosts, over its life.
  uint64 egress_bytes = 8;
  // The bytes it sent to the exempt destinations, over its life.
  uint64 exempt_egress_bytes = 9;
  // Always 0 today: paid starts are counted once start windows exist.
  int64 paid_starts = 10;
  // When its runtime was read.
  google.protobuf.Timestamp running_read_at = 11;
  // When its counters were read.
  google.protobuf.Timestamp counters_read_at = 12;
  // When its egress was read. The three reads are separate, not one
  // snapshot.
  google.protobuf.Timestamp egress_read_at = 13;
  // An estimate of the workload's share of the month's bill. Set only for
  // a caller that holds billing.read where the workload is; the invoice
  // stays authoritative.
  WorkloadCost cost = 14;
  // Model relay requests reported in the selected month.
  AIRequests ai_requests = 15;
  // Model relay requests reported over the workload's life.
  AIRequests ai_requests_total = 16;
}

// AIRequests counts the model requests a workload's runs made through the
// host relay.
message AIRequests {
  // The requests the relay injected a credential into.
  int64 injected = 1;
  // The requests the relay refused.
  int64 refused = 2;
  // The same counts by provider and credential source, ordered by provider
  // and then source.
  repeated AIProviderRequests by_provider = 3;
}

// AIProviderRequests counts requests for one provider and credential source.
message AIProviderRequests {
  // The model provider's name.
  string provider = 1;
  // "key" or "subscription".
  string source = 2;
  // The requests the relay injected a credential into.
  int64 injected = 3;
  // The requests the relay refused.
  int64 refused = 4;
}

// WorkloadCost is an estimate of one workload's share of its invoice. The
// invoice the provider bills stays authoritative.
message WorkloadCost {
  // The cost of the runs that have finished in the month, in cents.
  int64 current_cents = 1;
  // current_cents with the open run, if any, priced as if it ended at the
  // read time.
  int64 estimated_cents = 2;
  // The amounts' currency, such as "usd"; empty when unknown.
  string currency = 3;
  // Always true today: a per-workload share is an estimate, not an invoice.
  bool estimate = 4;
}

// ListWorkloadUsagesRequest is a call of ListWorkloadUsages.
message ListWorkloadUsagesRequest {
  // The project's name.
  string project = 1;
  // The environment's name.
  string environment = 2;
  // The UTC month as YYYY-MM; empty is the current UTC month.
  string month = 3;
  // The most workloads in one page; zero lets the server choose.
  int32 page_size = 4;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 5;
}

// ListWorkloadUsagesResponse is the answer to ListWorkloadUsages.
message ListWorkloadUsagesResponse {
  // The page's workloads.
  repeated WorkloadUsage usages = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

