syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// VolumeService keeps a workspace's volumes: each belongs to one project,
// and a state volume attaches to one service or sandbox of that project at
// a time. A state volume is mounted by one VM at a time, whichever run of
// its workload holds it.
//
// The caller's credential names the workspace, as for WorkloadService.
// Every request names a project; an empty one is the default project. A
// project the workspace does not have is NOT_FOUND, and so is a volume of
// another project or workspace and a workload of another workspace. With a
// token limited to one project, any other project is PERMISSION_DENIED,
// whether the workspace has it or not, and a workload of another project
// is NOT_FOUND.
//
// The calls take no request_key: attaching a volume to the workload it is
// attached to, while no run holds it, and detaching a detached volume
// return it as it is. RestoreVolume sent twice records two versions, each
// a copy of the one it names.
service VolumeService {
  // ListVolumes returns the project's volumes that are not deleted,
  // ordered by name.
  //
  // A page holds 100 volumes when page_size is zero, and 1000 at most.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse) {
    option (toshi.permission) = "volumes.read";
    option (toshi.scope) = "project";
  }

  // GetVolume returns one of the project's volumes that is not deleted.
  rpc GetVolume(GetVolumeRequest) returns (GetVolumeResponse) {
    option (toshi.permission) = "volumes.read";
    option (toshi.scope) = "project";
  }

  // AttachVolume attaches a state volume to a service or sandbox: the
  // service's next run mounts it, and a sandbox mounts it when it starts.
  // A workload has at most one volume, and a volume at most one workload.
  // A volume that is not a state volume, a workload that is not a service
  // or a sandbox, or a workload of another project fails with
  // FAILED_PRECONDITION, as does a volume attached to another workload, a
  // workload with a volume already, a volume a run still holds, a service
  // with a live run and a sandbox whose job is no longer queued. A sandbox
  // leaves the queue within moments, so name its volume in the sandbox's
  // create (SandboxSpec.state_volume_id).
  rpc AttachVolume(AttachVolumeRequest) returns (AttachVolumeResponse) {
    option (toshi.permission) = "volumes.write";
    option (toshi.scope) = "project";
  }

  // DetachVolume clears a volume's attachment and keeps the volume and its
  // data. A volume a run still holds, one of a service with a live run and
  // one of a sandbox whose job has been assigned and has not ended fail
  // with FAILED_PRECONDITION. Deleting a sandbox detaches its volume, and
  // so does deleting a service, which is refused while a run holds the
  // volume; neither deletes the volume.
  rpc DetachVolume(DetachVolumeRequest) returns (DetachVolumeResponse) {
    option (toshi.permission) = "volumes.write";
    option (toshi.scope) = "project";
  }

  // ListVolumeVersions returns a state volume's saved versions, newest
  // first. A run that releases the volume saves its data as the next
  // version when the workspace has object storage. The volume keeps its
  // newest five versions and the one a run holding it started from; the
  // others expire and are not listed.
  //
  // A page holds 100 versions when page_size is zero, and 1000 at most.
  rpc ListVolumeVersions(ListVolumeVersionsRequest) returns (ListVolumeVersionsResponse) {
    option (toshi.permission) = "volumes.read";
    option (toshi.scope) = "project";
  }

  // RestoreVolume copies one of a state volume's versions as its next
  // version, so the next run that mounts the volume starts from that data.
  // The new version names the version it was copied from. A volume a run
  // holds fails with FAILED_PRECONDITION, as do a volume that is not a
  // state volume and an expired version. A version the volume does not
  // have is NOT_FOUND.
  rpc RestoreVolume(RestoreVolumeRequest) returns (RestoreVolumeResponse) {
    option (toshi.permission) = "volumes.write";
    option (toshi.scope) = "project";
    option (toshi.audit) = {action: "volume.restored"};
  }
}

// VolumeMode is what a volume holds and how runs use it.
enum VolumeMode {
  VOLUME_MODE_UNSPECIFIED = 0;
  // A package or build cache: every run gets an overlay of it, and a
  // trusted success makes the next generation.
  VOLUME_MODE_CACHE = 1;
  // Data every run gets an overlay of; nothing a run writes is kept.
  VOLUME_MODE_SEED = 2;
  // Mounted read-write by one VM at a time; what a run writes is kept
  // for the next.
  VOLUME_MODE_STATE = 3;
  // Written once and read anywhere.
  VOLUME_MODE_ARTIFACT = 4;
}

// Volume is a disk of a project.
message Volume {
  string id = 1;
  // Its name, unique among the project's volumes that are not deleted.
  string name = 2;
  // The name of the project it belongs to.
  string project = 3;
  // The id of the project it belongs to.
  string project_id = 4;
  VolumeMode mode = 5;
  // The most it holds, in bytes.
  int64 size_cap_bytes = 6;
  google.protobuf.Timestamp create_time = 7;
  // The service or sandbox it is attached to; empty when it is attached to
  // none.
  string attached_workload_id = 8;
  // The number of its newest saved version; zero when it has none.
  int64 latest_version = 9;
  // When its newest version was saved; unset when it has none.
  google.protobuf.Timestamp latest_version_time = 10;
  // When it was lost: it had no saved version when the host that held its
  // only copy was removed, and no run mounts it again. Unset while it is
  // not lost.
  google.protobuf.Timestamp lost_time = 11;
  // What its newest version's data can be trusted for; unspecified when it
  // has none.
  VolumeConsistency latest_version_consistency = 12;
  // How often a service that mounts it snapshots it while the service's
  // VM runs: its workspace's interval. Unset for a volume that is not a
  // state volume, for one kept as a directory, which is never snapshotted,
  // and when the workspace takes no snapshots or saves no versions.
  google.protobuf.Duration snapshot_interval = 13;
  // Why its newest failed save or snapshot saved no version: a pre_save
  // hook that failed, or a copy its host could not take or upload. Empty
  // when none failed. A later version does not clear it: compare
  // last_save_failure_time with latest_version_time.
  string last_save_failure = 14;
  // When that save or snapshot failed; unset when none failed.
  google.protobuf.Timestamp last_save_failure_time = 15;
  // How hosts keep a state volume, fixed by the first run that mounts it:
  // a disk on the VM tiers, a directory on the container tier. Later runs
  // go only to hosts that keep it the same way. Unspecified until a run
  // mounted it, and for a volume that is not a state volume.
  VolumeFormat format = 16;
}

// VolumeFormat is how hosts keep a state volume, and so what its saved
// versions hold.
enum VolumeFormat {
  VOLUME_FORMAT_UNSPECIFIED = 0;
  // A disk image a VM attaches. A version holds the image.
  VOLUME_FORMAT_DISK = 1;
  // A directory a container mounts. A version holds a tar of it.
  VOLUME_FORMAT_DIRECTORY = 2;
}

// VolumeVersion is a saved copy of a state volume's data.
message VolumeVersion {
  // One higher than the volume's previous version; the first is 1.
  int64 number = 1;
  google.protobuf.Timestamp create_time = 2;
  // The length of the saved disk image, in bytes.
  int64 size_bytes = 3;
  // The hex SHA-256 of the saved disk image.
  string sha256 = 4;
  // The version RestoreVolume copied this one from; zero for one a run
  // saved.
  int64 restored_from = 5;
  // Whether a run saved it when it ended or snapshotted it while it ran.
  VolumeVersionKind kind = 6;
  // What its data can be trusted for.
  VolumeConsistency consistency = 7;
}

// VolumeVersionKind is how a run made a volume version.
enum VolumeVersionKind {
  VOLUME_VERSION_KIND_UNSPECIFIED = 0;
  // Saved when the run that mounted the volume ended, or restored from
  // such a version.
  VOLUME_VERSION_KIND_SAVE = 1;
  // Taken while the run's VM ran. A run keeps only its newest snapshot,
  // and its save replaces it.
  VOLUME_VERSION_KIND_SNAPSHOT = 2;
}

// VolumeConsistency is what a volume version's data can be trusted for.
enum VolumeConsistency {
  VOLUME_CONSISTENCY_UNSPECIFIED = 0;
  // The data as a power cut would leave it: a file system recovers it, an
  // application may need to repair what it was writing.
  VOLUME_CONSISTENCY_CRASH = 1;
  // The application settled it first: the service's pre_snapshot hook
  // exited 0 before the snapshot, or the guest unmounted the volume
  // cleanly before the save.
  VOLUME_CONSISTENCY_APPLICATION = 2;
}

message ListVolumesRequest {
  string project = 1;
  // The most volumes in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListVolumesResponse {
  repeated Volume volumes = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetVolumeRequest {
  string project = 1;
  string volume_id = 2;
}

message GetVolumeResponse {
  Volume volume = 1;
}

message AttachVolumeRequest {
  string project = 1;
  string volume_id = 2;
  // The service's or sandbox's workload id.
  string workload_id = 3;
}

message AttachVolumeResponse {
  Volume volume = 1;
}

message DetachVolumeRequest {
  string project = 1;
  string volume_id = 2;
}

message DetachVolumeResponse {
  Volume volume = 1;
}

message ListVolumeVersionsRequest {
  string project = 1;
  string volume_id = 2;
  // The most versions in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

message ListVolumeVersionsResponse {
  repeated VolumeVersion versions = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message RestoreVolumeRequest {
  string project = 1;
  string volume_id = 2;
  // The number of the version to copy.
  int64 version = 3;
}

message RestoreVolumeResponse {
  // The version the restore recorded.
  VolumeVersion version = 1;
  Volume volume = 2;
}
