syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";
import "toshi/workspace/v1/discovery.proto";
import "toshi/workspace/v1/endpoints.proto";
import "toshi/workspace/v1/hosts.proto";
import "toshi/workspace/v1/model_credentials.proto";
import "toshi/workspace/v1/roles.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// WorkspaceService reads and sets the caller's workspace: its settings, its
// billing and usage, and the plans it may buy.
//
// A workspace's API token acts on its own workspace; a dashboard session
// names one of its workspaces in the Toshi-Workspace header. ListWorkspaces
// needs no header. A token limited to a project or an environment is
// refused with PERMISSION_DENIED. A suspended workspace keeps its reads,
// and every other call is refused for it with FAILED_PRECONDITION. A closed
// workspace keeps GetWorkspace, ListWorkspaces, GetUsage,
// GetWorkspaceStatement and GetVersion during its read-only period.
service WorkspaceService {
  // GetWorkspace returns the caller's workspace.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // UpdateWorkspace changes the fields of the caller's workspace that
  // update_mask names and returns the workspace as stored. The paths are
  // "name" and "settings.<field>" for a field of WorkspaceSettings. An
  // omitted update_mask means the fields the request populates, and an
  // empty one, an omitted one with no field populated, "*" or another
  // path fails with INVALID_ARGUMENT. The call needs no permission of its
  // own: each path needs its field group's, workspace.signin for
  // settings.sign_in, billing.write for the spending limits,
  // model_credentials.write for settings.model_credential_defaults,
  // endpoints.write for settings.endpoint_defaults and workspace.write for
  // the others, and a mask that names nothing needs any
  // one of them. A caller that lacks one is refused with PERMISSION_DENIED
  // naming it, and nothing is written.
  //
  // The workspace's settings are checked as a whole after the change, and a
  // value they refuse fails with INVALID_ARGUMENT; the fields the mask names
  // are also checked against the plan and the caller, as their
  // descriptions say. A workspace.etag that differs from the workspace's
  // fails with ABORTED and changes nothing; without one the last write wins.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "workspace.write";
    option (toshi.by_field) = true;
  }
  // ListWorkspaces returns the workspaces of the caller, ordered by ID: a
  // session's workspaces, or a token's one.
  //
  // A page holds 100 workspaces when page_size is zero, and 1000 at most.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetWorkspaceBilling returns the workspace's billing customer,
  // subscription and its status, the usage reported to the billing provider
  // per month and runner size, and the events that failed. months outside
  // 0 to 12 fails with INVALID_ARGUMENT.
  rpc GetWorkspaceBilling(GetWorkspaceBillingRequest) returns (GetWorkspaceBillingResponse) {
    option (toshi.permission) = "billing.read";
  }
  // GetWorkspaceStatement returns the workspace's usage statement for one
  // UTC month: minutes by runner size and OS of the jobs that finished in
  // it, the minutes metered to the billing provider by size with their
  // estimated cost at the plan's prices, the starter credit applied in it,
  // and held time by reason. A month not in YYYY-MM form fails with
  // INVALID_ARGUMENT.
  rpc GetWorkspaceStatement(GetWorkspaceStatementRequest) returns (GetWorkspaceStatementResponse) {
    option (toshi.permission) = "billing.read";
  }
  // GetWorkspaceUpcomingInvoice returns the billing provider's preview of
  // the workspace's next invoice, and the current UTC month's cost so far
  // per project with a straight-line estimate to the month's end. The cost
  // comes from the same usage and prices as GetWorkspaceStatement, and the
  // projects' cost so far sums to its estimated_cents. Meter events reach
  // the provider asynchronously, so the preview can lag the usage; the
  // invoice is what is billed, and no estimate here changes it. A workspace
  // with no billing customer gets a preview with available false.
  rpc GetWorkspaceUpcomingInvoice(GetWorkspaceUpcomingInvoiceRequest) returns (GetWorkspaceUpcomingInvoiceResponse) {
    option (toshi.permission) = "billing.read";
  }
  // ListSeats returns the desktop seats the workspace held in one UTC
  // month, oldest assigned first, in pages: the seats live at some time in
  // it, removed ones included. A person assigned a seat may open a display
  // on Windows that Toshi licenses; each seat is billed for every month it
  // touches. A month not in YYYY-MM form fails with INVALID_ARGUMENT.
  //
  // A page holds 100 seats when page_size is zero, and 1000 at most.
  rpc ListSeats(ListSeatsRequest) returns (ListSeatsResponse) {
    option (toshi.permission) = "seats.read";
  }
  // AssignSeat assigns a desktop seat to a member of the workspace. A
  // person who holds a live seat fails with ALREADY_EXISTS, and one who is
  // not a member with NOT_FOUND. A seat removed this month stays billed for
  // it, so assigning a seat to another person in its place is a second
  // seat.
  rpc AssignSeat(AssignSeatRequest) returns (AssignSeatResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "seats.write";
    option (toshi.audit) = {action: "seat.assigned", target: "seat:response.seat.id"};
  }
  // RemoveSeat removes a live seat: its person may open no display on
  // Windows that Toshi licenses from then on, and the seat stays billed for
  // the months it touched. A seat the workspace does not have, or one
  // already removed, fails with NOT_FOUND. A member's removal from the
  // workspace removes their seat too.
  rpc RemoveSeat(RemoveSeatRequest) returns (RemoveSeatResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "seats.write";
    option (toshi.audit) = {action: "seat.removed"};
    option (toshi.surface) = {asks: ASKS_ALWAYS question: "Remove this seat? The person loses their seat now."};
  }
  // ListEgressIPs returns the public addresses the workspace's jobs may
  // reach the internet from: the egress addresses of the hosts its jobs can
  // land on, its own hosts and, unless it runs on its own hosts only, the
  // shared hosts its plan's operating systems run on.
  //
  // A page holds 100 hosts when page_size is zero, and 1000 at most.
  rpc ListEgressIPs(ListEgressIPsRequest) returns (ListEgressIPsResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetUsage returns the workspace's job counts and billable minutes per UTC
  // day, conclusion, outcome and kind, for the jobs whose queued_at is in
  // the window. Filler jobs, and jobs cancelled before a host held them,
  // are left out. The window defaults to the last 7 days. A window whose
  // from is not before its to fails with INVALID_ARGUMENT.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetQueueTimes returns a queue-time summary (percentiles, maximum and
  // warm share) for the workspace's jobs that reached running in the
  // window, where a job is in the window by its queued_at. The window
  // defaults to the last 7 days. A window whose from is not before its to
  // fails with INVALID_ARGUMENT.
  rpc GetQueueTimes(GetQueueTimesRequest) returns (GetQueueTimesResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetStartWindows returns the workspace's start windows as admission counts
  // them: for the minute, hour and day windows, the starts its plan includes,
  // the starts used in the window now, how many of those are paid, the
  // ceiling past which a start is refused, and when the window resets. A
  // start is a job assigned to a shared host; jobs on the workspace's own
  // hosts are not counted. The counts are the ones CreateSandbox is refused
  // on, so a window at its ceiling here is a window that refuses a create now.
  // The read is a snapshot and counts nothing itself.
  rpc GetStartWindows(GetStartWindowsRequest) returns (GetStartWindowsResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetWorkspaceLimits returns the workspace's start windows, capacity and
  // storage limits, paid-start setting, and sampled storage usage. Spending
  // and the monthly cost estimate are returned only with billing.read. The
  // counts are a snapshot and this read changes nothing.
  rpc GetWorkspaceLimits(GetWorkspaceLimitsRequest) returns (GetWorkspaceLimitsResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetVolumeCaps returns the workspace's volume size-cap ceiling and what is
  // counted against it: the sum of the size caps of its volumes that are not
  // deleted, in bytes, in total and per project, with the ceilings the
  // refusals of CreateVolume and UpdateVolume use. A ceiling of 0 is no limit.
  // warn_level is 100 when in_use_bytes has reached a finite ceiling, 80 from
  // 80 percent of it, and 0 otherwise. The read is a snapshot and changes
  // nothing.
  rpc GetVolumeCaps(GetVolumeCapsRequest) returns (GetVolumeCapsResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // GetWorkflowUsage returns, per repository and workflow name, the jobs
  // GetUsage counts: their billable minutes, failed jobs and run-time
  // percentiles. A job is in the window by its queued_at. The window
  // defaults to the last 7 days. A window whose from is not before its to
  // fails with INVALID_ARGUMENT.
  rpc GetWorkflowUsage(GetWorkflowUsageRequest) returns (GetWorkflowUsageResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // ListPlans returns the configured plans sorted by name.
  //
  // A page holds 100 plans when page_size is zero, and 1000 at most.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse) {
    option (toshi.permission) = "billing.read";
  }
  // CreateCheckoutSession returns a Stripe Checkout URL that subscribes the
  // workspace to plan, first creating and linking a billing customer for a
  // workspace without one. An empty plan, a plan the configuration does not
  // define, or an empty return_url or one outside the allowed origins fails
  // with INVALID_ARGUMENT; self-serve billing off, a plan that is not sold or
  // maps to several lookup keys, a price missing in Stripe, or a workspace
  // that already has a subscription fails with FAILED_PRECONDITION; a
  // billing provider failure fails with UNAVAILABLE.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "billing.write";
    option (toshi.audit) = {
      action: "billing.checkout_opened"
      target: "workspace:workspace"
    };
  }
  // CreateBillingPortalSession returns a Stripe Customer Portal URL where
  // the workspace manages its card and subscription. An empty return_url or
  // one outside the allowed origins fails with INVALID_ARGUMENT; self-serve
  // billing not configured, or a workspace with no billing customer, fails with
  // FAILED_PRECONDITION; a billing provider failure fails with UNAVAILABLE.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse) {
    option (toshi.key_mode) = KEY;
    option (toshi.permission) = "billing.write";
    option (toshi.audit) = {
      action: "billing.portal_opened"
      target: "workspace:workspace"
    };
  }
  // GetVersion returns the control plane's version, commit and commit
  // date, and the oldest agent release it admits.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (toshi.permission) = "workspace.read";
  }
  // DeleteWorkspace schedules the caller's workspace's deletion: the
  // workspace is suspended until purge_after, the deployment's default
  // grace from now, after which its data is purged from the control plane
  // and every host. confirm must equal the workspace's name as
  // GetWorkspace returns it, else the call fails with INVALID_ARGUMENT. A
  // workspace that is not active (suspended, deletion scheduled, deleting or
  // deleted) fails with FAILED_PRECONDITION, with the state as the
  // google.rpc.ErrorInfo reason. The answer carries the workspace with
  // purge_after and deletion_by "owner".
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "workspace.delete";
    option (toshi.audit) = {action: "workspace.deletion_scheduled"};
  }
  // CancelWorkspaceDeletion cancels a deletion an Owner scheduled while its
  // purge_after is in the future, and returns the workspace to active; held
  // jobs run at the next scheduler pass. It is the one call other than the
  // reads a workspace with a scheduled deletion takes. A workspace with no
  // scheduled deletion, one the operator scheduled, or one whose
  // purge_after has passed fails with FAILED_PRECONDITION, with the reason
  // in a google.rpc.ErrorInfo.
  rpc CancelWorkspaceDeletion(CancelWorkspaceDeletionRequest) returns (CancelWorkspaceDeletionResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "workspace.delete";
    option (toshi.audit) = {action: "workspace.resumed"};
  }
}

// GetWorkspaceRequest has no fields: the call reads the caller's workspace.
message GetWorkspaceRequest {}

// GetWorkspaceResponse carries the caller's workspace.
message GetWorkspaceResponse {
  // The workspace.
  Workspace workspace = 1;
}

// DeleteWorkspaceRequest confirms and gives the reason for a workspace's
// scheduled deletion.
message DeleteWorkspaceRequest {
  // The workspace's name, as GetWorkspace returns it.
  string confirm = 1;
  // Why the workspace is deleted; kept as its state_reason.
  string reason = 2;
}

// DeleteWorkspaceResponse carries the workspace with its deletion
// scheduled.
message DeleteWorkspaceResponse {
  // The workspace with purge_after and deletion_by set.
  Workspace workspace = 1;
}

// CancelWorkspaceDeletionRequest has no fields: the call acts on the
// caller's workspace.
message CancelWorkspaceDeletionRequest {}

// CancelWorkspaceDeletionResponse carries the workspace, active again.
message CancelWorkspaceDeletionResponse {
  // The workspace returned to active.
  Workspace workspace = 1;
}

// UpdateWorkspaceRequest carries the workspace values to set and the fields
// to change.
message UpdateWorkspaceRequest {
  // Carries the new values of the fields update_mask names, and the etag
  // the caller read, when it wants the change refused if another landed
  // since.
  Workspace workspace = 1;
  // The paths to change: "name" and "settings.<field>"; omitted means the
  // fields the request populates.
  google.protobuf.FieldMask update_mask = 2;
}

// UpdateWorkspaceResponse carries the workspace as stored.
message UpdateWorkspaceResponse {
  // The workspace as stored.
  Workspace workspace = 1;
}

// ListWorkspacesRequest selects a page of the caller's workspaces.
message ListWorkspacesRequest {
  // The most workspaces in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListWorkspacesResponse is one page of the caller's workspaces.
message ListWorkspacesResponse {
  // The workspaces, ordered by ID.
  repeated Workspace workspaces = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// GetWorkspaceBillingRequest selects how many months of billing usage to
// return.
message GetWorkspaceBillingRequest {
  // How many UTC months of usage to return, the current one included.
  // 0 means 2; at most 12.
  int32 months = 1;
}

// GetWorkspaceBillingResponse carries the workspace's billing.
message GetWorkspaceBillingResponse {
  // The workspace's billing.
  WorkspaceBilling billing = 1;
}

// GetWorkspaceStatementRequest selects the UTC month of the statement.
message GetWorkspaceStatementRequest {
  // The UTC month as YYYY-MM. Empty: the current month.
  string month = 1;
  // Also return the statement as CSV.
  bool csv = 2;
}

// GetWorkspaceStatementResponse carries the statement, and its CSV when the
// request asked for it.
message GetWorkspaceStatementResponse {
  // The month's statement.
  WorkspaceStatement statement = 1;
  // The statement as CSV with a header row, when the request asked for it.
  string csv = 2;
}

// GetWorkspaceUpcomingInvoiceRequest has no fields: the call reads the
// caller's own workspace.
message GetWorkspaceUpcomingInvoiceRequest {}

// GetWorkspaceUpcomingInvoiceResponse carries the provider's preview of the
// next invoice and the current month's cost per project.
message GetWorkspaceUpcomingInvoiceResponse {
  // The billing provider's preview of the next invoice.
  UpcomingInvoice invoice = 1;
  // The current UTC month's cost per project, highest cost so far first.
  // The row with an empty project_id holds what no project accounts for.
  repeated ProjectCost projects = 2;
  // The sums of the projects' month_so_far_cents and estimated_month_cents.
  // month_so_far_cents equals the current month's statement estimated_cents.
  int64 month_so_far_cents = 3;
  // The sum of the projects' estimated_month_cents: the month's cost so far
  // carried in a straight line to its end.
  int64 estimated_month_cents = 4;
  // The currency of the project costs, as the statement gives it; empty
  // while no price is known.
  string currency = 5;
}

// UpcomingInvoice is the billing provider's preview of a workspace's next
// invoice.
message UpcomingInvoice {
  // The amount due, in the currency's minor unit, after the customer
  // balance (such as a starter credit) is applied.
  int64 amount_cents = 1;
  // The ISO currency code in lower case, such as "usd".
  string currency = 2;
  // The period the invoice covers.
  google.protobuf.Timestamp period_start = 3;
  // When the period the invoice covers ends.
  google.protobuf.Timestamp period_end = 4;
  // When the usage behind this answer was read. Meter events reach the
  // provider asynchronously, so the preview may not yet include usage
  // read at this time.
  google.protobuf.Timestamp meters_read_at = 5;
  // False when the workspace has no billing customer, or the provider has
  // no upcoming invoice for it: the other fields are then empty.
  bool available = 6;
}

// ProjectCost is one project's cost in the current UTC month.
message ProjectCost {
  // The project's id and name. An empty project_id is the cost no project
  // accounts for: the own-host fee, storage, desktop seats, and minutes of
  // jobs with no project, a deleted project, or that history retention
  // already removed.
  string project_id = 1;
  // The project's name; empty when project_id is.
  string project_name = 2;
  // The cost of the month so far, in the currency's minor unit.
  int64 month_so_far_cents = 3;
  // month_so_far_cents carried in a straight line to the month's end: so
  // far times the month's length over the time elapsed. Desktop seats are
  // a whole-month charge and are not carried forward.
  int64 estimated_month_cents = 4;
}

// Seat is one assignment of a desktop seat to a person.
message Seat {
  // The seat's id, such as "seat-0f1e2d3c4b5a69788796a5b4".
  string id = 1;
  // The Toshi user id of the person it is assigned to.
  string user_id = 2;
  // When the seat was assigned.
  google.protobuf.Timestamp assigned_at = 3;
  // Who assigned it: a person, or the system for an operator's
  // reassignment.
  Subject assigned_by = 4;
  // When it was removed; unset while the seat is live.
  google.protobuf.Timestamp removed_at = 5;
  // Who removed it; unset while the seat is live.
  Subject removed_by = 6;
  // The seat this one replaces when an operator moved a seat to this
  // person within a month, and why: "hardware_failure" or
  // "temporary_absence". Both are empty for an assigned seat, and the two
  // seats are billed as one for that month.
  string replaces = 7;
  // Why an operator moved the seat: "hardware_failure" or
  // "temporary_absence"; empty unless replaces is set.
  string replace_reason = 8;
}

// ListSeatsRequest selects the UTC month whose seats to list.
message ListSeatsRequest {
  // The UTC month as YYYY-MM. Empty: the current month.
  string month = 1;
  // The most seats in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

// ListSeatsResponse is the seats the workspace held in the month.
message ListSeatsResponse {
  // The seats on this page, oldest assigned first.
  repeated Seat seats = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// AssignSeatRequest names the member to assign a desktop seat to.
message AssignSeatRequest {
  // The Toshi user id of the member to assign a seat to.
  string user_id = 1;
}

// AssignSeatResponse carries the seat that was assigned.
message AssignSeatResponse {
  // The seat as assigned.
  Seat seat = 1;
}

// RemoveSeatRequest names the seat to remove.
message RemoveSeatRequest {
  // The id of the seat to remove.
  string seat_id = 1;
}

// RemoveSeatResponse carries the seat as removed.
message RemoveSeatResponse {
  // The seat as removed.
  Seat seat = 1;
}

// ListEgressIPsRequest selects a page of the hosts to list the egress
// addresses of.
message ListEgressIPsRequest {
  // The most hosts in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListEgressIPsResponse lists the addresses to allowlist and the hosts they
// come from.
message ListEgressIPsResponse {
  // Every address of the hosts of every page with known addresses, sorted
  // and without repeats. Every page holds all of them.
  repeated string ips = 1;
  // The hosts the workspace's jobs can land on, ordered by kind (own hosts
  // first) and ID.
  repeated EgressHost hosts = 2;
  // False when some host of any page has addresses that are unknown or
  // change per job, so ips may not cover every job.
  bool complete = 3;
  // Empty on the last page.
  string next_page_token = 4;
}

// GetUsageRequest selects the jobs to count. A job is in the window when its
// queued_at is at or after from and before to.
message GetUsageRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
}

// GetUsageResponse is the job counts and minutes of the window, with the
// filler and storage figures beside them.
message GetUsageResponse {
  // Ordered by day, then conclusion, then outcome, then kind. A
  // window with neither matching jobs nor reserved hours has no rows.
  repeated UsageRow rows = 1;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 2;
  // The end of the window used, exclusive.
  google.protobuf.Timestamp to = 3;
  // The filler jobs that finished in the window. They are not billed and
  // not in rows. Unset when there were none.
  FillerUsage filler = 4;
  // Stored data per UTC day and kind in the window, ordered by day, then
  // kind. A day with no sampled hour has no rows.
  repeated StorageUsageRow storage = 5;
}

// GetQueueTimesRequest selects the jobs to summarize. A job is in the window
// when its queued_at is at or after from and before to.
message GetQueueTimesRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
}

// GetQueueTimesResponse is the queue times of the jobs that reached running
// in the window.
message GetQueueTimesResponse {
  // Jobs in the window that reached running (have a started_at).
  int64 jobs = 1;
  // Nearest-rank percentiles and maximum of started_at - queued_at, in whole
  // milliseconds. All 0 when jobs is 0.
  int64 p50_ms = 2;
  // The nearest-rank 95th percentile of the start delays, in whole
  // milliseconds; 0 when jobs is 0.
  int64 p95_ms = 3;
  // The longest start delay, in whole milliseconds; 0 when jobs is 0.
  int64 max_ms = 4;
  // Share of those jobs assigned to a warm instance, from 0 to 1.
  double warm_share = 5;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 6;
  // The end of the window used, exclusive.
  google.protobuf.Timestamp to = 7;
  // Time held, from first held to assigned, of the jobs the scheduler held, by
  // the latest reason it held each one. A job never held is in none of them.
  // A reason with only jobs held now has jobs 0.
  repeated HoldTimes held = 8;
}

// GetStartWindowsRequest has no fields: the call reads the caller's own
// workspace.
message GetStartWindowsRequest {}

// GetStartWindowsResponse is the workspace's start windows as admission
// counts them. A job start past the included count is a paid start when paid
// starts are on; at the ceiling it waits for the window to move on.
message GetStartWindowsResponse {
  // False when no start is counted for the workspace: its plan sets no start
  // window, or it uses its own hosts only. Every window is then not counted.
  bool applies = 1;
  // The minute, hour and day windows, in that order, always all three.
  repeated StartWindow windows = 2;
  // The earliest time every window at its ceiling has room again, which is
  // the next_at a refused CreateSandbox names; unset when no window is
  // at its ceiling.
  google.protobuf.Timestamp next_at = 3;
}

// GetWorkspaceLimitsRequest reads the caller's own workspace.
message GetWorkspaceLimitsRequest {}

// GetWorkspaceLimitsResponse describes the workspace's limits and usage.
message GetWorkspaceLimitsResponse {
  // False when no start is counted, as in GetStartWindows.
  bool applies = 1;
  // The same minute, hour and day windows, in order, as GetStartWindows.
  repeated StartWindow windows = 2;
  // When every full start window has room; unset when none is full.
  google.protobuf.Timestamp next_at = 3;
  // The shared-host concurrent job limit.
  WorkspaceLimitRow running_at_once = 4;
  // The shared-host vCPU limit.
  WorkspaceLimitRow vcpu = 5;
  // Spending against the monthly cap; unset without billing.read.
  WorkspaceSpendLimit spend = 6;
  // The paid-start setting and the plan's ceiling.
  WorkspacePaidStarts paid_starts = 7;
  // Storage limits and sampled usage.
  WorkspaceStorageLimits storage = 8;
  // The current month's projected cost; unset without billing.read or when
  // billing is not configured.
  WorkspaceMonthEstimate month_estimate = 9;
}

// WorkspaceLimitRow is one plan and effective capacity limit.
message WorkspaceLimitRow {
  // The entitlement key, or the plan field max_vcpu, which has no key.
  string key = 1;
  // The plan's value; 0 means no cap.
  int64 plan_value = 2;
  // The value in force after workspace overrides; 0 means no cap. An
  // operator override may also raise the plan's value.
  int64 effective_value = 3;
  // "workspace" when a workspace override makes the effective cap lower
  // than the plan's, otherwise "plan". A finite cap is lower than no cap.
  string cause = 4;
  // The capacity held by assigned, starting, running and debugging jobs on
  // shared hosts. For jobs.concurrency_max this excludes filler and open-source
  // jobs; for max_vcpu it sums the vCPUs of jobs whose runner sizes are known,
  // including filler and open-source jobs. Unset for other limits or when
  // unavailable.
  optional int64 in_use = 5;
}

// WorkspaceSpendLimit is the estimated metered spend against a monthly cap.
message WorkspaceSpendLimit {
  // The cap in the currency's minor unit; 0 means no cap.
  int64 spend_cap_cents = 1;
  // Estimated metered spend this UTC month in the currency's minor unit;
  // meaningful only when spend_known is true.
  int64 spend_cents = 2;
  // The share of the cap reached: 0, 80 or 100 percent.
  int32 spend_level = 3;
  // Whether the prices needed to estimate spend are known.
  bool spend_known = 4;
  // The plan prices' lower-case ISO currency code; empty when unknown.
  string currency = 5;
  // The warning threshold as a percentage of the cap.
  int32 warn_percent = 6;
  // The cap threshold as a percentage of the cap.
  int32 cap_percent = 7;
}

// WorkspacePaidStarts describes the workspace's paid-start setting.
message WorkspacePaidStarts {
  // Whether the workspace permits paid starts.
  bool enabled = 1;
  // The plan's ceiling as a percentage of each window's included starts.
  int32 ceiling_percent = 2;
}

// WorkspaceStorageLimits describes the plan's storage and volume limits.
message WorkspaceStorageLimits {
  // The default ceiling entitlement for the sum of volume size caps, in
  // decimal GB, before the workspace setting and the maximum are applied.
  WorkspaceLimitRow volume_size_cap_total_gb = 1;
  // The maximum ceiling entitlement for the sum of volume size caps, in
  // decimal GB.
  WorkspaceLimitRow volume_size_cap_total_max_gb = 2;
  // The ceiling in force in bytes, as in GetVolumeCaps; 0 means no limit.
  // Unset when the deployment has no entitlement resolver.
  optional int64 volume_ceiling_bytes = 3;
  // What set volume_ceiling_bytes: plan, workspace or override; empty
  // when the ceiling is unset.
  string volume_ceiling_source = 4;
  // The plan's hard cap on new stored data in decimal GB; 0 when the hard
  // cap is off. When the hard cap is on, 0 GB means no new stored data.
  int64 storage_hard_cap_gb = 5;
  // Whether the plan sets a hard cap on new stored data. Volume saves
  // still pass the hard cap.
  bool storage_hard_cap = 6;
  // The same last seven days of sampled storage as GetUsage: each row's
  // bytes are from that day's last sampled hour for its kind, not live bytes.
  repeated StorageUsageRow usage = 7;
  // The plan's configured per-host actions/cache size in MiB. When a host
  // cache is assigned, this value is rounded up to whole GiB. 0 leaves
  // actions/cache on GitHub's service. The cache is not in the usage rows.
  int64 actions_cache_mib = 8;
}

// WorkspaceMonthEstimate is the projected cost of the current UTC month.
message WorkspaceMonthEstimate {
  // The month's cost projected to its end in the currency's minor unit, as
  // in GetWorkspaceUpcomingInvoice; meaningful only when known is true.
  int64 estimated_month_cents = 1;
  // Whether the prices needed for the estimate are known.
  bool known = 2;
  // The lower-case ISO currency code; empty when unknown.
  string currency = 3;
}

// GetVolumeCapsRequest has no fields: the call reads the caller's own
// workspace.
message GetVolumeCapsRequest {}

// GetVolumeCapsResponse is the workspace's volume size-cap ceiling and what
// is counted against it.
message GetVolumeCapsResponse {
  // The sum of the size caps, in bytes, of the workspace's volumes that are
  // not deleted.
  int64 in_use_bytes = 1;
  // The ceiling in force, in bytes: the workspace's own setting when it has
  // one, else the plan's default, never above max_ceiling_bytes. 0 is no
  // limit, the result when the plan sets none; it is not the setting's 0,
  // which follows the plan (WorkspaceSettings.volume_size_cap_total_gb).
  int64 ceiling_bytes = 2;
  // The ceiling the workspace gets with no setting of its own, in bytes; 0 is
  // no limit.
  int64 default_ceiling_bytes = 3;
  // The most the workspace may set its ceiling to, in bytes; 0 is no limit.
  int64 max_ceiling_bytes = 4;
  // What set ceiling_bytes: "plan" (the plan's default), "workspace" (the
  // workspace's own setting) or "override" (an operator override of the
  // plan's value).
  string source = 5;
  // 0, 80 or 100: the share of a finite ceiling in_use_bytes has reached.
  int32 warn_level = 6;
  // The projects of the workspace, by name, with their own totals.
  repeated VolumeCapsProject projects = 7;
}

// VolumeCapsProject is one project's share of the volume caps.
message VolumeCapsProject {
  // The project's id.
  string project_id = 1;
  // The project's name.
  string name = 2;
  // The sum of the size caps, in bytes, of the project's volumes that are not
  // deleted.
  int64 in_use_bytes = 3;
  // The project's own ceiling in bytes; 0 when its rules set none, so the
  // workspace's ceiling bounds it.
  int64 ceiling_bytes = 4;
}

// StartWindow is one start window of the workspace's plan. Each window is
// rolling: it counts the starts of the last minute, hour or day, so there is
// no fixed reset; resets_at is when the oldest counted start leaves it.
message StartWindow {
  // The plan key the window comes from: starts_per_minute, starts_per_hour or
  // starts_per_day.
  string key = 1;
  // False when the plan leaves the window at 0, or no start is counted for
  // the workspace: the window counts nothing and the fields below are 0 or
  // unset.
  bool counted = 2;
  // The starts the plan includes in the window.
  int64 included = 3;
  // The most starts the window allows: a start past included, up to the
  // ceiling, is paid, and one at the ceiling is refused. The workspace's own
  // max_jobs_per_hour lowers the hour window's ceiling.
  int64 ceiling = 4;
  // The starts counted in the window: those assigned to a shared host in it
  // plus the sandboxes queued for a host and not placed yet, which is what
  // CreateSandbox is refused on. The scheduler counts only the assigned
  // starts, so a job it holds can pass a window that already refuses a
  // sandbox create.
  int64 used = 5;
  // The part of used that is queued sandboxes not placed yet.
  int64 queued = 6;
  // The part of used past included: the starts that are paid.
  int64 paid = 7;
  // When the oldest counted start leaves the window and used first drops;
  // unset while no start placed on a host is counted.
  google.protobuf.Timestamp resets_at = 8;
  // When the window has room for one more start; unset while used is below
  // ceiling.
  google.protobuf.Timestamp next_at = 9;
}

// GetWorkflowUsageRequest selects the jobs to count. A job is in the window
// when its queued_at is at or after from and before to.
message GetWorkflowUsageRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
}

// GetWorkflowUsageResponse is the jobs of the window per repository and
// workflow.
message GetWorkflowUsageResponse {
  // Ordered by minutes, then own_host_minutes, then jobs, each descending,
  // then by repository and workflow, byte by byte. A window with no
  // jobs has no rows.
  repeated WorkflowUsageRow rows = 1;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 2;
  // The end of the window used, exclusive.
  google.protobuf.Timestamp to = 3;
}

// ListPlansRequest selects a page of plans.
message ListPlansRequest {
  // The most plans in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

// ListPlansResponse is one page of plans.
message ListPlansResponse {
  // The plans, sorted by name.
  repeated Plan plans = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// CreateCheckoutSessionRequest selects the plan to buy and where the
// browser returns to.
message CreateCheckoutSessionRequest {
  // The plan to subscribe to; empty, or one the configuration does not
  // define, fails with INVALID_ARGUMENT.
  string plan = 1;
  // Where the browser goes back to when checkout finishes or is cancelled.
  // The workspace id rides on it as the workspace query parameter, and billing
  // as checkout-done or checkout-cancelled; its own query is kept. return_url
  // is required and must be on the origin of a redirect URI of a
  // registered client, whether declared in the configuration or registered.
  string return_url = 2;
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the same session URL until the session expires,
  // for at most 24 hours. A changed request is refused. Changed provider
  // inputs on retry, an ended session or a passed retry window is refused
  // with REQUEST_KEY_TARGET_GONE. Use a new key; the old key never opens a
  // second session while kept.
  string request_key = 3;
}

// CreateCheckoutSessionResponse carries the Checkout URL.
message CreateCheckoutSessionResponse {
  // The provider's hosted Checkout URL to send the browser to.
  string url = 1;
}

// CreateBillingPortalSessionRequest says where the browser returns to from
// the portal.
message CreateBillingPortalSessionRequest {
  // Where the browser goes back to from the portal, with the workspace id as
  // the workspace query parameter; its own query is kept. return_url is required
  // and must be on the origin of a redirect URI of a registered client,
  // whether declared in the configuration or registered.
  string return_url = 1;
  // A key of the caller's choice, 1 to 200 printable ASCII bytes. The same
  // key and request return the same session URL for five minutes from its
  // creation. A changed request is refused. Changed provider inputs on retry
  // or a retry after five minutes is refused with REQUEST_KEY_TARGET_GONE.
  // Use a new key; the old key never opens a second session while kept.
  string request_key = 2;
}

// CreateBillingPortalSessionResponse carries the Customer Portal URL.
message CreateBillingPortalSessionResponse {
  // The provider's hosted Customer Portal URL to send the browser to.
  string url = 1;
}

// GetVersionRequest has no fields.
message GetVersionRequest {}

// GetVersionResponse is the control plane's build and the oldest agent
// release it admits.
message GetVersionResponse {
  // The build's version; "dev" for a build without one.
  string version = 1;
  // The build's VCS revision, or "unknown".
  string commit = 2;
  // The build's VCS commit time, or "unknown".
  string date = 3;
  // The oldest agent release this control plane process admits when the
  // workspace's own hosts register; empty when unset, which admits every
  // agent. Each process reads its own configuration.
  string minimum_agent_version = 4;
}

// Workspace owns a plan, an optional concurrency override, and its GitHub
// App installations.
message Workspace {
  // The workspace's id: "ws-" and 24 hex digits.
  string id = 1;
  // The workspace's name; not unique among workspaces.
  string name = 2;
  // The jobs.concurrency_max override; unset when none is set. 0 is unlimited.
  optional int32 concurrency_cap = 3;
  // When the workspace was created.
  google.protobuf.Timestamp created_at = 4;
  // The name of the plan the workspace follows; empty when it has none, so
  // the default plan applies.
  string plan = 5;
  // The cap the scheduler enforces; 0 means unlimited.
  int32 effective_concurrency = 6;
  // active or closed.
  string status = 7;
  // The limit the scheduler enforces: the lower of the workspace's and the
  // plan's; 0 means none.
  int32 effective_max_jobs_per_hour = 11;
  // The starter credit granted when the workspace was created; 0 when none.
  int64 starter_credit_cents = 12;
  // When the starter credit was granted; unset when none was.
  google.protobuf.Timestamp starter_credit_granted_at = 13;
  // The workspace's effective reservations on shared hosts, ordered
  // by size: its own rows, and its plan's entries where it has none.
  repeated Reservation reservations = 16;
  // Lifecycle state: "active"; "suspended", where new and queued jobs are
  // held, running jobs finish and the workspace is read-only; "deleting", once
  // purge_after has passed and while the purge runs; or "deleted", when the
  // purge is done, its sessions ended and its tokens revoked.
  string state = 17;
  // Why the operator suspended the workspace, or why it is deleted; empty
  // when active.
  string state_reason = 18;
  // When the workspace entered its state; unset for a workspace always active.
  google.protobuf.Timestamp state_since = 19;
  // When a scheduled deletion purges the workspace; unset when none.
  google.protobuf.Timestamp purge_after = 20;
  // Who scheduled the deletion: "owner" for one of the workspace's Owners,
  // which an Owner may cancel with CancelWorkspaceDeletion, or "operator";
  // empty when none is scheduled.
  string deletion_by = 39;
  // The period the retention pass uses: the workspace's value when set, else
  // its plan's.
  int32 job_retention_days_effective = 22;
  // The secrets.sets_max override; unset when none is set. 0 is no cap.
  optional int32 secret_max_sets = 24;
  // The secrets.keys_max override; unset when none is set. 0 is no cap.
  optional int32 secret_max_keys = 25;
  // The secrets.size_max_bytes override, in bytes; unset when none is set. 0
  // is no cap.
  optional int64 secret_max_bytes = 26;
  // The previews.ports_max override; unset when none is set. 0 is no cap.
  optional int32 preview_max_ports = 27;
  // The resolved secrets.sets_max; 0 is no cap.
  int32 secret_max_sets_effective = 28;
  // The resolved secrets.keys_max; 0 is no cap.
  int32 secret_max_keys_effective = 29;
  // The resolved secrets.size_max_bytes, in bytes; 0 is no cap.
  int64 secret_max_bytes_effective = 30;
  // The resolved previews.ports_max; 0 is no cap.
  int32 preview_max_ports_effective = 31;
  // What the workspace's members choose; UpdateWorkspace changes it.
  WorkspaceSettings settings = 33;
  // A hash of the name and the settings, which changes whenever they do.
  // UpdateWorkspace refuses a workspace that carries another one.
  string etag = 34;
  // The wildcard certificate of its services' provided names; unset when
  // it never hosted one.
  HostingCertificate hosting_certificate = 35;
  // How many kept VMs the workspace may hold at once on its own hosts: its
  // plan's keep_vm.max, or the operator's override. 0 means keep_vm is
  // refused.
  int32 keep_vm_max_effective = 36;
  // Where keep_vm_max_effective comes from: the operator's override for the
  // workspace, its plan's keep_vm.max, or the default, 0, when the plan sets
  // none.
  FeatureSource keep_vm_max_source = 41;
  // The workspace's kept VMs.
  int32 keep_vm_count = 37;
  // How many of the workspace's kept VMs have been stopped for over 30 days.
  int32 keep_vm_stopped_long_count = 38 [(toshi.bound) = {name: "keep_vm_stopped_long_after", unit: UNIT_SECONDS, threshold: 2592000}];
  // Who last changed settings.recording, and when; unset while it was never
  // changed. Set by Toshi.
  WorkspaceSettingChange recording_changed = 40;
  // Who last changed settings.recording_human_spans, and when; unset while it
  // was never changed. Set by Toshi.
  WorkspaceSettingChange recording_human_spans_changed = 42;
  // When the workspace closed; unset while status is active.
  google.protobuf.Timestamp closed_at = 43;
  // When a closed workspace's read-only period ends: closed_at plus 30 days.
  // Set while that period lasts, for a caller the closed workspace stays
  // open to; unset otherwise.
  google.protobuf.Timestamp read_only_expires_at = 44;

  reserved 8, 9, 10, 14, 15, 21, 23, 32;
  reserved "own_hosts_only", "spend_cap_cents", "max_jobs_per_hour", "allow_overflow", "allow_cache_warm", "history_days", "cancel_run_on_vm_death", "member_join";
}

// HostingCertificate is a workspace's wildcard certificate for its
// services' provided names. Toshi orders it when the workspace first
// hosts a service with an http endpoint and renews it before it expires.
message HostingCertificate {
  // The wildcard name, *.<workspace id>.svc.<domain>.
  string name = 1;
  // Where the certificate is in its issue and renewal.
  HostingCertificateState state = 2;
  // When the certificate in use expires; unset before the first one.
  google.protobuf.Timestamp not_after = 3;
  // When Toshi renews it; unset before the first one.
  google.protobuf.Timestamp renew_at = 4;
  // When Toshi tries again after a failure or a rate limit; unset when
  // nothing failed.
  google.protobuf.Timestamp retry_at = 5;
  // Why the last order or renewal failed; empty when the last one
  // succeeded.
  string error = 6;
}

enum HostingCertificateState {
  // No certificate state is recorded.
  HOSTING_CERTIFICATE_STATE_UNSPECIFIED = 0;
  // The first certificate is being ordered; until it is, provided names
  // refuse connections.
  HOSTING_CERTIFICATE_STATE_ISSUING = 1;
  // The authority refused an order for its rate limits; Toshi tries again
  // at retry_at.
  HOSTING_CERTIFICATE_STATE_RATE_LIMITED = 2;
  // The certificate is issued and serves until not_after; Toshi renews it
  // at renew_at.
  HOSTING_CERTIFICATE_STATE_VALID = 3;
  // A renewal failed; the current certificate serves until not_after.
  HOSTING_CERTIFICATE_STATE_RENEWAL_FAILING = 4;
  // The control plane signed the certificate itself, as [hosting] dev = true
  // does for test stacks; clients do not trust it.
  HOSTING_CERTIFICATE_STATE_SELF_SIGNED = 5;
}

// WorkspaceSettings is everything a workspace's members choose about it,
// each a field UpdateWorkspace names as "settings.<field>".
message WorkspaceSettings {
  // Who may join the workspace through its GitHub App installation on an
  // organisation without an invitation: "off", nobody (the default);
  // "approve", a member of the organisation who signs in waits for a
  // workspace admin to approve them; "open", such a member joins at once.
  // Joining grants no role. Another value fails with INVALID_ARGUMENT.
  // Turning it off removes no member and leaves the people waiting for
  // approval listed and approvable.
  string member_join = 1;
  // The sign-in provider the workspace requires of its people; unset when it
  // requires none. Setting it names an OpenID Connect provider entry the
  // control plane has and needs a person
  // whose own session or token was signed in through it, so it is known to
  // work before it is enforced; otherwise FAILED_PRECONDITION with the
  // reason SIGNIN_UNTESTED. A name the control plane does not have fails
  // with INVALID_ARGUMENT. A workspace token can only clear it, by naming
  // the path with no provider; one that sets it fails with
  // PERMISSION_DENIED. Members with no identity at the provider
  // lose the workspace until they link one; nothing is deleted.
  WorkspaceSignIn sign_in = 2 [(toshi.field_permission) = "workspace.signin"];
  // Days of finished job history the workspace keeps; unset when the plan's
  // applies, and 0 keeps forever. A member may set it from 1 up to the
  // plan's period, and 0 only on a plan that keeps forever; a longer one
  // fails with INVALID_ARGUMENT. Naming it in the update mask with no value
  // clears it, so the plan's applies again. The maximum is the plan's.
  optional int32 job_retention_days = 3 [(toshi.bound) = {name: "workspace_job_retention_days", unit: UNIT_COUNT, min: 1}];
  // The workspace's jobs wait for its own hosts and never run on shared ones.
  bool own_hosts_only = 4;
  // Shared overflow hosts may take the workspace's jobs; its own overflow
  // hosts always may.
  bool allow_overflow = 5;
  // Whether the workspace's dispatch fillers, its cache-warming workflows,
  // run on idle capacity. Off by default.
  bool allow_cache_warm = 6;
  // Whether Toshi cancels the workflow run of a job whose VM is gone, so
  // GitHub shows it within seconds as cancelled; off keeps GitHub's own
  // failure, about 10 minutes later. On by default.
  bool cancel_run_on_vm_death = 7;
  // Monthly spending cap in the smallest unit of the billing currency; 0
  // means none. At most 2^50; a new cap while billing is off, or on a
  // workspace with no billing customer, fails with FAILED_PRECONDITION.
  int64 spend_cap_cents = 8 [(toshi.field_permission) = "billing.write"];
  // The workspace's own jobs-per-hour limit; 0 means the plan's applies. It
  // may only lower the plan's limit: a higher one fails with
  // INVALID_ARGUMENT.
  int32 max_jobs_per_hour = 9 [(toshi.field_permission) = "billing.write"];
  // Whether the workspace's services and sandboxes may set keep_vm, which
  // keeps a workload's VM on one of the workspace's own hosts across its
  // stops and sleeps. Off by default; keep_vm_max_effective must be above 0
  // too.
  bool keep_vm = 10;
  // Whether the workspace's hosts record its jobs' screens; left out is on.
  // While it is off, a job create that names a strip or a video fails with
  // FAILED_PRECONDITION, one that names none records nothing, and
  // RECORDING_POLICY_OFF is always accepted. Switching it off stops every
  // strip and video of the workspace being captured, within one of its
  // host's heartbeats: each becomes ready, truncated, with the reason
  // "recording was switched off for the workspace", when its run ends, and
  // no new one starts. Switching it on applies to jobs created after it. It
  // does not cover the recordings a run uploads itself.
  optional bool recording = 11;
  // Whether a sandbox's strips keep the screenshots of a person's control
  // through a viewer with input; left out is off, and a person's span is left
  // out of the strip as a gap. Switching it applies to the person's next
  // control, and switching it off stops an open span's screenshots within one
  // interval.
  optional bool recording_human_spans = 12;
  // The workspace's default model credential per provider (ModelCredentialDefault).
  // A default applies where its credential's key serves the workload's
  // project and environment. Setting it needs model_credentials.write.
  repeated ModelCredentialDefault model_credential_defaults = 13 [(toshi.field_permission) = "model_credentials.write"];
  // Whether the workspace makes paid starts; left out is on. Off, a start
  // past the included starts of any start window is treated as one at the
  // window's ceiling: a job waits with the reason start_rate, and a
  // CreateSandbox is refused with RESOURCE_EXHAUSTED, so no paid start is
  // made and GetStartWindows reports each ceiling as its included starts.
  // Setting it needs the permission that sets the spending cap.
  optional bool paid_starts = 14 [(toshi.field_permission) = "billing.write"];
  // The ceiling on the sum of the size caps of the workspace's volumes that
  // are not deleted, in decimal GB. Empty or 0 follows the plan's default.
  // The ceiling in force is then the plan's, which is no limit when the plan
  // sets none (GetVolumeCaps reports that as ceiling_bytes 0). It may be at
  // most the plan's maximum, and a higher one fails with INVALID_ARGUMENT, as
  // does a negative one. Lowering is always allowed; a cap applies to new
  // volumes and to raising a volume's cap. It may go below what the
  // workspace's volumes use now, and 0 is allowed there too.
  int64 volume_size_cap_total_gb = 15 [(toshi.field_permission) = "billing.write"];

  // What to do when inbound mail reaches the plan's daily cap. Unspecified
  // accepts mail; a plan can refuse overage regardless of this setting.
  InboundMailPastCap inbound_mail_past_cap = 16;
  // At most one default per workload kind and endpoint shape; an event
  // default is for a service only. The settings.endpoint_defaults mask path
  // replaces the whole list, clearing a pair left out. When a new endpoint
  // is made, each policy field left unset by its call or recipe takes this
  // default's value, then Toshi's built defaults. Changing a default changes
  // no existing endpoint. Setting it needs endpoints.write.
  repeated EndpointDefault endpoint_defaults = 17 [(toshi.field_permission) = "endpoints.write"];
  // The workspace's own stopped-sandbox keep in days, at least 1 and no
  // more than its entitlement (from the plan or an operator's override).
  // Unset when the workspace has no setting, so the entitlement applies.
  // Naming it in the update mask with no value clears it; setting it to 0
  // fails with INVALID_ARGUMENT. An unlimited entitlement does not allow a
  // workspace setting.
  optional int64 sandbox_stopped_keep_days = 18;
}

// InboundMailPastCap chooses whether to accept mail beyond the daily cap.
enum InboundMailPastCap {
  // Unset; mail past the daily cap is accepted.
  INBOUND_MAIL_PAST_CAP_UNSPECIFIED = 0;
  // Accept mail past the daily cap and charge for it.
  INBOUND_MAIL_PAST_CAP_ACCEPT_AND_CHARGE = 1;
  // Refuse mail past the daily cap.
  INBOUND_MAIL_PAST_CAP_REFUSE = 2;
}

// WorkspaceSettingChange is who last changed one of a workspace's settings,
// and when.
message WorkspaceSettingChange {
  // Who changed the setting: a person, or the system.
  Subject changed_by = 1;
  // When it changed.
  google.protobuf.Timestamp changed_at = 2;
}

// WorkspaceSignIn is the sign-in provider a workspace requires.
message WorkspaceSignIn {
  // The configured provider entry's name.
  string provider = 1;
  // The provider's issuer: the identities it signs in are keyed by it, as
  // their Identity.provider. Set by Toshi.
  string issuer = 2;
  // The user who set it, and when. Set by Toshi.
  string set_by = 3;
  // When it was set.
  google.protobuf.Timestamp set_at = 4;
}

// Reservation is a workspace's floor of slots jobs of one runner size on shared
// hosts, warm of them on warm VMs.
message Reservation {
  // A runner size, as a runs-on label.
  string size = 1;
  // How many slots are reserved; at least 1.
  int32 slots = 2;
  // How many of the slots are kept on warm VMs; 0 when none.
  int32 warm = 3;
  // "workspace" when the workspace's own row set it, "plan" when its plan did.
  string source = 4;
}

// WorkspaceBilling is the workspace's billing link, its subscription's
// status and the usage reported to the billing provider.
message WorkspaceBilling {
  // Empty when the workspace is not linked to a customer.
  string customer_id = 1;
  // Empty when no subscription has set the plan.
  string subscription_id = 2;
  // When billable usage begins; unset when the workspace is not billed.
  google.protobuf.Timestamp billing_started_at = 3;
  // The provider's status of the subscription from the last event applied,
  // such as active or past_due; empty when no event has been applied.
  string subscription_status = 4;
  // When the subscription entered subscription_status.
  google.protobuf.Timestamp subscription_status_since = 5;
  // Meter events per UTC month and runner size, newest month first.
  repeated BillingTotals totals = 6;
  // The workspace's failed meter events, most recently failed first, at
  // most 50.
  repeated BillingEventFailure failed_events = 7;
  // Minutes of the workspace's jobs that finished this UTC calendar month, as
  // its statement counts them. The free allowance counts these, with or
  // without a billing customer.
  int64 minutes_this_month = 8;
  // The free minutes per UTC calendar month of the workspace's plan; 0 when the
  // plan has none.
  int64 free_minutes_per_month = 9;
  // Whether the billing customer has a payment method.
  bool card_verified = 10;
  // When Toshi first saw a payment method on the billing customer; unset
  // without one.
  google.protobuf.Timestamp card_verified_at = 11;
  // The spending cap; 0 when none.
  int64 spend_cap_cents = 12;
  // Estimated metered spend this UTC month, rounded up: finished jobs plus
  // what running ones have run so far, at the plan's current prices.
  int64 spend_cents = 13;
  // 0, 80 or 100: the share of the cap spend_cents has reached.
  int32 spend_level = 14;
  // The currency of the plan's prices, lower case; empty when unknown.
  string currency = 15;
  // False when the billing provider's prices are not known yet, so
  // spend_cents means nothing.
  bool spend_known = 16;
  // Starter credit granted, and an estimate of what is left: the credit
  // less the metered spend since billing started.
  int64 starter_credit_cents = 17;
  // The estimate of the credit left: the credit less the metered spend
  // since billing started.
  int64 starter_credit_left_cents = 18;
  // When the credit reached the billing customer; unset before.
  google.protobuf.Timestamp starter_credit_applied_at = 19;
  // True when a billing provider is configured; false means nothing is metered or charged.
  bool billing_enabled = 20;
  // The workspace's jobs held now, by reason, in the order GetQueueTimes lists
  // the reasons.
  repeated HeldJobs held_now = 21;
  // The workspace's jobs that count against its plan concurrency now: assigned,
  // starting, running or debugging, on Toshi's hosts rather than its own, and
  // neither a dispatch filler's job nor an open-source job. This is the count
  // the scheduler checks against the workspace's limit,
  // Workspace.effective_concurrency.
  int64 concurrency_used = 22;
  // The price of one desktop seat a month on the workspace's plan, in the
  // smallest unit of currency; unset while the billing provider has no price
  // for it.
  optional int64 desktop_seat_price_cents = 26;
  // HeldJobs counts the jobs held now for one reason.
  message HeldJobs {
    // One of the job hold reasons (see Job.hold_reason).
    string reason = 23;
    // The jobs held for the reason now.
    int64 jobs = 24;
    // Since when the longest-held of them has been held.
    google.protobuf.Timestamp since = 25;
    // For reason start_rate: the earliest time every start window of the
    // workspace has room again. Unset otherwise.
    google.protobuf.Timestamp next_at = 26;
  }
}

// BillingTotals counts one month's meter events of one runner size by
// delivery state. A month or size without events is left out.
message BillingTotals {
  // The UTC month the jobs finished in, as YYYY-MM.
  string month = 1;
  // The runner size; empty for events recorded before sizes were.
  string size = 2;
  // Events the provider accepted.
  int64 sent_events = 3;
  // The minutes of sent_events.
  int64 sent_minutes = 4;
  // Events not sent to the provider yet.
  int64 pending_events = 5;
  // The minutes of pending_events.
  int64 pending_minutes = 6;
  // Events the provider refused, which Toshi no longer sends.
  int64 failed_events = 7;
  // The minutes of failed_events.
  int64 failed_minutes = 8;
}

// BillingEventFailure is a meter event the provider will not be sent again.
message BillingEventFailure {
  // The id of the job the event metered.
  string job_id = 1;
  // The runner size; empty for events recorded before sizes were.
  string size = 2;
  // The meter event's name.
  string event_name = 3;
  // The job's metered minutes.
  int64 minutes = 4;
  // When the job finished.
  google.protobuf.Timestamp occurred_at = 5;
  // When the provider last refused the event.
  google.protobuf.Timestamp failed_at = 6;
  // The number of times Toshi sent the event.
  int32 attempts = 7;
  // The provider's error for the last attempt.
  string last_error = 8;
}

// WorkspaceStatement is one UTC month's usage and charges with their
// estimated cost.
message WorkspaceStatement {
  // The month as YYYY-MM, and its bounds: from inclusive, to exclusive.
  string month = 1;
  // Start of the month, inclusive.
  google.protobuf.Timestamp from = 2;
  // End of the month, exclusive.
  google.protobuf.Timestamp to = 3;
  // The plans the month's metered minutes were recorded at, comma-separated;
  // the workspace's plan today when no minute has a recorded price.
  string plan = 4;
  // The jobs that finished in the month, by runner size and OS, counted as
  // GetUsage counts them.
  repeated StatementUsage usage = 5;
  // The sum of usage; its size and os are empty.
  StatementUsage total = 6;
  // The minutes metered to the billing provider for the month, by the size
  // they were recorded under, with their estimated cost.
  repeated StatementCharge charges = 7;
  // The estimated cost of every charge, rounded up once, in the smallest
  // unit of currency: each job at the price recorded for it when it
  // finished, and minutes with none at today's prices. Leaves out the
  // plan's own price and any credit.
  int64 estimated_cents = 8;
  // Empty when the prices are unknown.
  string currency = 9;
  // False when some minutes have no recorded price and the billing
  // provider's prices have not been read: those minutes' amounts are 0.
  bool estimate_known = 10;
  // The starter credit put on the customer's balance in the month; 0 and
  // unset when it was not applied in it.
  int64 starter_credit_applied_cents = 11;
  // When the credit was applied; unset when it was not.
  google.protobuf.Timestamp starter_credit_applied_at = 12;
  // Held time, from first held to assigned, of the jobs queued in the month
  // that reached running, by the latest reason each was held.
  repeated HoldTimes held = 13;
  // The metered minutes with no recorded price, estimated at today's
  // prices: finished jobs not yet in the usage outbox, and usage from
  // before prices were recorded.
  int64 current_price_minutes = 14;
  // The workspace's filler jobs that finished in the month: not billed, not in
  // usage or charges. Unset when there were none.
  FillerUsage filler = 15;
  // True when a billing provider is configured; false means nothing is metered or charged.
  bool billing_enabled = 16;
  // When the month's estimated spend first reached the workspace's spending
  // cap; unset when it did not.
  google.protobuf.Timestamp spend_cap_reached_at = 17;
  // The cap that was reached, in the smallest unit of currency; 0 when it
  // was not.
  int64 spend_cap_reached_cents = 18;
  // The workspace's spending cap when the statement was built; 0 when none.
  int64 spend_cap_cents = 19;
  // The own-server fee of the month; included in estimated_cents.
  OwnHostFee own_host_fee = 20;
  // The month's service runs billed by the VM-second, by size; included in
  // estimated_cents.
  repeated Awake awake = 21;
  // The month's stored data; its cost is included in estimated_cents.
  Storage storage = 22;
  // The month's desktop seats; unset when there were none. Their cost is
  // included in estimated_cents.
  DesktopSeats desktop_seats = 23;
  // The month's paid starts; unset when there were none. Their cost is
  // included in estimated_cents.
  PaidStarts paid_starts = 24;
}

// DesktopSeats is the month's desktop seats: every seat the workspace held
// at some time in the month, from its billing start, and what they cost. A
// person's seats in one month are billed as one seat, and so are a seat and
// the one an operator moved it to; a second person is a second seat.
message DesktopSeats {
  // The seats billed for the month.
  int64 billed_seats = 1;
  // One seat's price for a month at the plan's price today, in the smallest
  // unit of currency; 0 when unpriced.
  int64 seat_price_cents = 2;
  // True when the plan has no price for desktop seats yet: the seats are
  // listed and cost nothing.
  bool unpriced = 3;
  // billed_seats at seat_price_cents; included in estimated_cents.
  int64 estimated_cents = 4;
  // The seats, oldest assigned first.
  repeated StatementSeat seats = 5;
}

// PaidStarts is the month's paid starts: the starts past the plan's included
// starts, within its ceiling, and what they cost.
message PaidStarts {
  // The starts billed for the month.
  int64 count = 1;
  // count at the plan's price today, in the smallest unit of currency;
  // included in estimated_cents.
  int64 estimated_cents = 2;
}

// StatementSeat is one desktop seat on a statement.
message StatementSeat {
  // The seat's id.
  string seat_id = 1;
  // The Toshi user id of the person it was assigned to, and their name.
  string user_id = 2;
  // The person's name.
  string name = 3;
  // When the seat was assigned.
  google.protobuf.Timestamp assigned_at = 4;
  // Unset while the seat is live.
  google.protobuf.Timestamp removed_at = 5;
  // The seat an operator moved to this one, when it replaces one.
  string replaces = 6;
  // True when the seat carries a month's charge; false when it is billed
  // with an older seat of the month: the same person's, or the one an
  // operator moved to it.
  bool billed = 7;
}

// OwnHostFee is the month's own-server fee: the run time of the workspace's
// billed jobs on its own hosts, less the plan's free seconds, rounded up once
// to whole seconds.
message OwnHostFee {
  // The exact run time, in seconds, from the workspace's billing start.
  double seconds = 1;
  // The plan's free seconds a month.
  int64 free_seconds = 2;
  // seconds past free_seconds, rounded up once.
  int64 billed_seconds = 3;
  // billed_seconds at the plan's price today, rounded up, in the smallest
  // unit of currency; 0 when the plan has no price for the fee.
  int64 estimated_cents = 4;
}

// Awake is the month's service runs of one runner size billed by the
// VM-second: each run's time from first ready to release, summed and rounded
// up once to whole seconds.
message Awake {
  // A runner size, as a runs-on label.
  string size = 1;
  // The number of service runs of the size in the month.
  int64 runs = 2;
  // The exact awake time, in seconds, from the workspace's billing start.
  double seconds = 3;
  // The part of seconds after the last demand before the run was put to
  // sleep.
  double idle_seconds = 4;
  // seconds rounded up once.
  int64 billed_seconds = 5;
  // billed_seconds at the plan's price today, rounded up, in the smallest
  // unit of currency; 0 when the plan has no price for the size.
  int64 estimated_cents = 6;
}

// Storage is the month's stored data: images, volume versions, artifacts
// and recordings, sampled once an hour. Each hour's total past the plan's
// included GB is billed, summed over the month in GB-months.
message Storage {
  // Each kind's figures, ordered by kind.
  repeated StoredKind kinds = 1;
  // The plan's included GB in each hour.
  int64 included_gb = 2;
  // Every kind's GB summed over the sampled hours, from the workspace's
  // billing start.
  double gb_hours = 3;
  // The part of gb_hours past included_gb in each hour.
  double excess_gb_hours = 4;
  // excess_gb_hours in GB-months, rounded up once to a thousandth.
  double billed_gb_months = 5;
  // billed_gb_months at the plan's price today, rounded up, in the smallest
  // unit of currency; 0 when the plan has no price for storage.
  int64 estimated_cents = 6;
}

// StoredKind is one kind of stored data in a month: images, volume_versions,
// artifacts, recordings, held_disks or service_snapshots.
message StoredKind {
  // The kind: images, volume_versions, artifacts, recordings, held_disks or
  // service_snapshots.
  string kind = 1;
  // The bytes the last sampled hour held.
  int64 bytes = 2;
  // The kind's GB summed over the sampled hours.
  double gb_hours = 3;
}

// StorageUsageRow is one kind of stored data on one UTC day.
message StorageUsageRow {
  // The day's first hour, UTC, as YYYY-MM-DD.
  string day = 1;
  // The kind: images, volume_versions, artifacts, recordings, held_disks or
  // service_snapshots.
  string kind = 2;
  // The kind's GB summed over the day's sampled hours.
  double gb_hours = 3;
  // The bytes the day's last sampled hour held.
  int64 bytes = 4;
}

// StatementUsage is one runner size and OS on a statement, with its jobs
// and minutes.
message StatementUsage {
  // A runner size, as a runs-on label; empty for the total row.
  string size = 1;
  // The operating system, such as "linux" or "windows"; empty for the total
  // row.
  string os = 2;
  // The number of jobs in this entry.
  int64 jobs = 3;
  // Billable minutes on shared hosts, rounded up per job.
  int64 minutes = 4;
  // Minutes on the workspace's own hosts, which are not billed by the
  // minute; their exact run time carries the own-server fee.
  int64 own_host_minutes = 5;
  // The part of minutes and own_host_minutes spent in debug sessions.
  int64 debug_minutes = 6;
  // The part of minutes that ran on overflow hosts.
  int64 overflow_minutes = 7;
  // Reserved slot-hours the workspace held for this size in the statement's
  // window. A size with reserved hours but no finished job still
  // gets a row, with zero minutes.
  int64 reserved_slot_hours = 8;
  // Toshi's own word for the jobs in this entry when Toshi ended them
  // itself (the values of Job.outcome); empty for every other entry.
  string outcome = 9;
  // The exact run time behind minutes and own_host_minutes, in seconds.
  double seconds = 10;
  // The exact run time behind own_host_minutes, in seconds.
  double own_host_seconds = 11;
}

// StatementCharge is one line of a statement's charges: the metered minutes
// or seconds of one runner size and their estimated cost.
message StatementCharge {
  // Empty for usage recorded without a size, priced at the plan's highest
  // per-minute price.
  string size = 1;
  // The metered minutes of a size billed by the minute; 0 on a line of
  // seconds.
  int64 minutes = 2;
  // The minutes at their recorded prices, or today's for minutes with none,
  // or the seconds at today's per-second price, rounded up.
  int64 estimated_cents = 3;
  // The billed running seconds of a size billed by the second, its
  // month's seconds summed and rounded up once; 0 on a line of minutes.
  int64 seconds = 4;
}

// HoldTimes is the held time of the jobs held for one reason in a window.
message HoldTimes {
  // One of the job hold reasons (see Job.hold_reason), as the
  // toshi_jobs_held metric labels them.
  string reason = 1;
  // The jobs held for this reason whose hold ended (they were assigned and started), and their held time in milliseconds (nearest-rank).
  int64 jobs = 2;
  // The nearest-rank 50th percentile of the held times, in whole
  // milliseconds; 0 when jobs is 0.
  int64 p50_ms = 3;
  // The nearest-rank 95th percentile of the held times, in whole
  // milliseconds; 0 when jobs is 0.
  int64 p95_ms = 4;
  // The longest held time, in whole milliseconds; 0 when jobs is 0.
  int64 max_ms = 5;
  // The jobs held for this reason now, whenever they were queued. 0 when
  // the window ends before now.
  int64 open_jobs = 6;
  // Since when the longest-held of them has been held; unset when
  // open_jobs is 0.
  google.protobuf.Timestamp open_since = 7;
}

// FillerUsage counts one workspace's filler jobs: runs its dispatch fillers
// started on shared room. Not billed; a plan's filler_minutes_per_day bounds
// them per UTC day.
message FillerUsage {
  // The number of filler jobs that finished in the window.
  int64 jobs = 1;
  // Each job's duration rounded up to whole minutes, on any host.
  int64 minutes = 2;
}

// UsageRow counts the jobs of one UTC day, conclusion, outcome and kind.
message UsageRow {
  // The UTC date of the job's queued_at, as YYYY-MM-DD.
  string day = 1;
  // The job's conclusion as stored, such as "success". Empty for a job with
  // no conclusion yet.
  string conclusion = 2;
  // Number of jobs in this row.
  int64 jobs = 3;
  // Billable minutes of those jobs that did not run on a host their workspace
  // owns: each job that started and finished adds its duration rounded up to
  // whole minutes; other jobs add 0.
  int64 minutes = 4;
  // Minutes of the row's jobs that ran on hosts their workspace owns,
  // rounded as minutes.
  int64 own_host_minutes = 5;
  // The part of minutes and own_host_minutes spent in debug sessions: each
  // job that had one adds its minutes less the minutes up to its session's
  // start, both rounded up, so a job's run and debug parts add up
  // to its minutes.
  int64 debug_minutes = 6;
  // The part of minutes that ran on overflow hosts.
  int64 overflow_minutes = 7;
  // Reserved slot-hours the workspace held in the row's window, on the rows
  // with a conclusion: 0. The reserved hours themselves are in the row with
  // an empty conclusion added for each UTC day that has them.
  int64 reserved_slot_hours = 8;
  // Toshi's own word for the jobs in this row when Toshi ended them itself
  // (the values of Job.outcome); empty for every other row.
  string outcome = 9;
  // The kind of the row's jobs: "job", "sandbox" or "service". Empty on a
  // reserved-hours row.
  string kind = 10;
  // The exact run time behind minutes and own_host_minutes, in seconds, not
  // rounded.
  double seconds = 11;
  // The exact run time behind own_host_minutes, in seconds, not rounded.
  double own_host_seconds = 12;
  // The exact time service runs were awake, from first ready to release,
  // and the idle part of it before they were put to sleep, in seconds.
  double awake_seconds = 13;
  // The idle part of awake_seconds: the time after the last demand before
  // the run was put to sleep.
  double idle_seconds = 14;
}

// WorkflowUsageRow counts the jobs of one repository and workflow.
// Its jobs are the ones GetUsage counts, and their minutes are counted as
// in UsageRow.
message WorkflowUsageRow {
  // The repository, as owner/name.
  string repository = 1;
  // The workflow's name from the job's workflow_job webhook. Empty for jobs
  // stored without one.
  string workflow = 2;
  // Number of jobs in this row.
  int64 jobs = 3;
  // Billable minutes, as UsageRow.minutes.
  int64 minutes = 4;
  // Minutes on hosts the workspace owns, as UsageRow.own_host_minutes.
  int64 own_host_minutes = 5;
  // Jobs whose conclusion is "failure" or whose outcome is "failed".
  int64 failed_jobs = 6;
  // Jobs that started and finished: the ones the percentiles are over.
  int64 timed_jobs = 7;
  // Nearest-rank percentiles of those jobs' run times, from started_at to
  // the stop request, or to finished_at when there was none, each rounded
  // up to a whole second. Both 0 when timed_jobs is 0.
  int64 p50_seconds = 8;
  // The nearest-rank 95th percentile of the run times, in whole seconds; 0
  // when timed_jobs is 0.
  int64 p95_seconds = 9;
}

// Plan is one configured plan and the limits a workspace on it follows.
message Plan {
  // The plan's name; unique among the configured plans.
  string name = 1;
  // The jobs a workspace on the plan may run at once; 0 means unlimited.
  int32 concurrency = 2;
  // The longest a job may run, in minutes; 0 means unlimited.
  int32 max_job_minutes = 3;
  // True for the deployment's default plan, which a workspace follows when
  // its own is empty or unknown.
  bool is_default = 4;
  // Whether a workspace can buy this plan through Checkout: self-serve billing
  // is on and exactly one lookup key in billing.plan_map maps to the plan.
  bool self_serve = 5;
  // Operating systems the plan allows; empty means every OS.
  repeated string allowed_os = 6;
  // Largest runner size the plan allows, as a runs-on label; empty means any
  // size.
  string max_size = 7;
  // vCPUs a workspace may have in assigned, starting or running jobs at once; 0
  // means no cap.
  int32 max_vcpu = 8;
  // Minutes a workspace may run each UTC calendar month without a verified
  // card; 0 means the plan has no allowance.
  int32 free_minutes_per_month = 9;
  // Runs-on labels the plan admits under allowed_os, max_size and max_vcpu.
  // A size whose OS is in card_required_for also needs a verified card.
  repeated string sizes = 10;
  // OSes that require a verified payment card; empty when billing is off.
  repeated string card_required_for = 11;
  // Jobs on shared hosts a workspace may start per 60 minutes; 0 means no
  // limit.
  int32 max_jobs_per_hour = 12;
  // Queued jobs of one workflow run that may wait for a host at once; the
  // rest wait as burst_guard. 0 means off.
  int32 burst_guard_jobs = 13;
  // Credit a new workspace on this plan gets once, in the smallest currency
  // unit; 0 means none.
  int64 starter_credit_cents = 14;
  // Days of finished job history workspaces on this plan keep; 0 keeps forever.
  // Left out of configuration, 90.
  int32 job_retention_days = 15;
  // Longest debug session, in minutes, a failed job on this plan may ask
  // for with a toshi-debug-<n> label; 0 means the plan has no debug
  // sessions.
  int32 debug_minutes = 16;
  // Hosts a workspace on this plan may own at once, cloud hosts included; 0
  // means no limit. Left out of configuration, 20.
  int32 max_own_hosts = 17;
  // Whether the plan is the open-source tier: its workspaces' jobs
  // pass the open-source gate.
  bool open_source = 18;
  // The name to show for the plan; the plan's name, its id, when the
  // deployment sets no display name. Never empty.
  string display_name = 19;
  // The plan's place on the ladder a refusal names a plan from, lowest
  // first; a plan at 0 is not on the ladder, and no refusal names it. Two
  // plans at one rank are ordered by name. ListPlans sorts by name: a
  // client that shows the ladder orders by rank.
  int32 rank = 20;
  // The size in MiB of the disk that keeps each of the workspace's caches
  // for one guest OS, rounded up to whole GiB when the disk is made; 0
  // means the plan gives no cache disk.
  int32 cache_mib = 21;
  // The most, in MiB, the workspace keeps in a host's actions/cache store;
  // 0 leaves the workspace on GitHub's cache.
  int32 actions_cache_mib = 22;
}

// EgressHost is one host a workspace's jobs can land on.
message EgressHost {
  // The host's id and name; empty for a shared host.
  string host_id = 1;
  // The host's name; empty for a shared host.
  string name = 2;
  // The host is shared between workspaces rather than the workspace's own.
  bool shared = 3;
  // The host's egress addresses.
  HostEgress egress = 4;
  // For an EGRESS_SOURCE_PER_JOB host: the addresses its jobs ran from in
  // the last 7 days, sorted.
  repeated string recent_ips = 5;
  // The host's cloud ("aws"), empty for a host with an agent.
  string cloud = 6;
  // For a cloud host: "public" or "nat".
  string cloud_egress = 7;
  // For a "nat" cloud host: a job echoed one of the host's addresses in the
  // last 7 days. Until then the response is not complete, and recent_ips
  // shows what jobs echoed.
  bool confirmed = 8;
}
