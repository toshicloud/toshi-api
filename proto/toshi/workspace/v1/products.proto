syntax = "proto3";

package toshi.workspace.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "toshi/permission.proto";
import "toshi/workspace/v1/discovery.proto";

option go_package = "go.toshicloud.io/api/workspacev1";

// ProductService reads and changes the workspace's settings of its
// products. A product, such as Runners, declares features: typed keys such
// as "runners.enabled", the product's own switch, or a limit such as
// "previews.max_count". The workspace's entitlement to each feature comes
// from its plan and the operator's overrides, and it cannot change it. Its
// settings are its own choices within the entitlement: they only narrow it,
// turning a product or a feature off or setting a lower limit.
//
// The caller's credential names the workspace, as for WorkloadService.
service ProductService {
  // ListProducts returns the products the deployment includes, by id, each
  // with its features: the entitlement, the workspace's
  // setting if it has one, the effective value, and who changed the
  // setting last and when.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option (toshi.permission) = "settings.read";
  }
  // UpdateProduct changes the workspace's settings of one product in one
  // call: it turns the product on or off, and sets or clears its features,
  // as its update_mask names them. The caller and the time of the call are
  // recorded with each setting it sets. A setting only narrows the
  // workspace's entitlement: a value wider than the entitlement, a key the
  // product does not declare or that the workspace cannot narrow, or a
  // value of another type than the key's is INVALID_ARGUMENT naming the
  // key, and nothing is changed. A product the deployment does not include
  // is NOT_FOUND.
  //
  // The product's calls follow the change from the next call on.
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse) {
    option (toshi.key_mode) = NATURAL;
    option (toshi.permission) = "settings.write";
  }
}

// ListProductsRequest has no fields: the call's credential names the
// workspace.
message ListProductsRequest {}

// ListProductsResponse is every product the deployment includes, as the
// workspace has it.
message ListProductsResponse {
  // products are the products the deployment includes, by id.
  repeated ProductSettings products = 1;
}

// UpdateProductRequest is one change of one product's settings: its
// switch, and the features to set or clear.
message UpdateProductRequest {
  // id names the product, such as "runners".
  string id = 1;
  // enabled turns the product on or off for the workspace: it sets the
  // product's own switch, the feature "<id>.enabled". It changes when
  // update_mask names "enabled", or when it is set and there is no mask.
  // Turning on a product the workspace's entitlements leave off is
  // INVALID_ARGUMENT.
  optional bool enabled = 2;
  // settings are the features to change, by key ("<id>.<name>"): an entry
  // with a value sets the feature to that value of its type, and an entry
  // whose FeatureValue carries no value clears the setting, so the
  // entitlement applies again. Keys the map leaves out are unchanged. The
  // map changes when update_mask names "settings", or when it is nonempty
  // and there is no mask.
  map<string, FeatureValue> settings = 3;
  reserved 4;
  reserved "clear";
  reserved 5, 6;
  reserved "accepted_access", "version";
  // update_mask names the fields to change: "enabled" and "settings". Each
  // named field must be set: the "enabled" path with enabled unset, and the
  // "settings" path with an empty map, are INVALID_ARGUMENT. An empty mask,
  // another field, and no mask with neither field set are INVALID_ARGUMENT.
  google.protobuf.FieldMask update_mask = 7;
}

// UpdateProductResponse is the product as the workspace has it after the
// change.
message UpdateProductResponse {
  // product is the product as the workspace has it after the change.
  ProductSettings product = 1;
  reserved 2, 3;
  reserved "installation_token", "warning";
}

// ProductSettings is one product as the workspace has it.
message ProductSettings {
  // id names the product, such as "runners": its config section, the
  // prefix of its features and its permissions.
  string id = 1;
  reserved 2;
  reserved "switch";
  // features are the product's features, in the order the product
  // declares them.
  repeated FeatureSetting features = 3;
  // state is where the product is in the deployment's lifecycle, as
  // DiscoveryService.Discover reports it: a product the deployment's config
  // turns off is winding down (no new work, draining) until its work ends,
  // then stopped.
  ProductState state = 4;
  reserved 5;
  reserved "installation";
  // surfaces are what the product adds to Toshi: the path its API is
  // served at.
  ProductSurfaces surfaces = 6;
  // name is the product's name as people read it, such as "Runners", or
  // its id when it names none.
  string name = 7;
  // stability is how mature the product is in this build.
  ProductStability stability = 8;
  // removal_version is the version a deprecated product is removed in;
  // empty for the other stabilities.
  string removal_version = 9;
}

// ProductSurfaces are what a product adds to Toshi, empty when it adds none.
message ProductSurfaces {
  // api is the path the control plane serves the product's API at, such
  // as "/runners/".
  string api = 1;
  reserved 2, 3, 4;
  reserved "cli", "dashboard", "sdk";
}

// FeatureSetting is one feature of a product as the workspace has it.
message FeatureSetting {
  // key is "<product id>.<name>".
  string key = 1;
  // narrowable reports whether the workspace's settings may narrow the
  // feature. UpdateProduct refuses a setting of a feature that is not.
  bool narrowable = 2;
  // entitlement is the most the workspace may choose: the operator's
  // override for the workspace, else its plan's value, else the value of
  // the plan key it falls back to, else the feature's default (source).
  FeatureValue entitlement = 3;
  // setting is the workspace's own choice; unset when it has none. A
  // setting its entitlement no longer contains, after the plan or an
  // override lowered it, is kept and not applied.
  FeatureValue setting = 4;
  // effective is the value the product uses while it is on: the setting
  // when the entitlement contains it, else the entitlement.
  FeatureValue effective = 5;
  // changed_by names who made the setting, as the audit log names an
  // actor, and changed_at when; both unset when the workspace has no
  // setting.
  string changed_by = 6;
  // changed_at is when the setting was made; unset when the workspace has
  // no setting.
  google.protobuf.Timestamp changed_at = 7;
  // source says where the entitlement comes from.
  FeatureSource source = 8;
  // plan_key names the plan key the feature falls back to, empty for none.
  string plan_key = 9;
}
