syntax = "proto3";

package toshi;

import "google/protobuf/descriptor.proto";

option go_package = "go.toshicloud.io/api/toshipb";

extend google.protobuf.MethodOptions {
  // permission names what a caller needs to make the call: an area and a
  // level. "<area>.read" sees what the area holds and "<area>.write" changes
  // it, where the area is a product, such as "sandboxes", or a part of the
  // workspace, such as "secrets". A call that needs more than its area's
  // level names a permission of its own, such as "debug.connect" for the key
  // into a host job's debug session.
  //
  // Every Workspace API method carries it, and a method without it fails the
  // build: the control plane's check table and the permissions page are
  // generated from it. A workspace that is suspended keeps the calls whose
  // level is "read".
  string permission = 51000;

  // scope names what a call acts in: "workspace", the default when the
  // option is absent, or "project" or "environment" for a call that names a
  // project or an environment of the workspace, or a resource that belongs
  // to one. A token limited to a project, or to one of its environments,
  // makes only the calls whose scope is "project" or "environment".
  //
  // A method whose request has a project or environment field (project,
  // project_id, environment, environment_id) names its scope, and the build
  // checks it against that field: "environment" when the request has an
  // environment field, "project" when it has only a project field, or
  // "workspace" when the field is not where the call acts, such as the
  // project a new token is limited to.
  string scope = 51001;

  // audit names the audit event a call records when its action or target
  // is not the one its name gives. Every call that changes something
  // records one event: on the Workspace API a call whose permission's level
  // is not "read", on the operator API a call whose verb is not a read
  // (Get, List, Watch, Wait, Summarise, Suggest, Export, Discover). A read
  // whose option names an action records one too. The GitHub product and
  // core APIs use the same verb rule to check options; their events are
  // recorded elsewhere.
  Audit audit = 51002;

  // by_field marks an update call that needs no permission of its own: each
  // field its mask names needs its field group's permission, the field's
  // field_permission or, for a field without one, the method's permission.
  // The caller needs at least one of them to make the call, and the
  // handler checks each field the mask names before it writes; a mask that
  // names nothing needs any one.
  bool by_field = 51004;

  // mcp sets how the call appears as a tool of the MCP server, where the
  // rules its generator applies give the wrong answer. Without it a read is
  // read-only and idempotent, a naturally idempotent change is idempotent,
  // a call whose name begins with Delete, Cancel, Revoke, Remove, Stop or
  // Rollback is destructive, and no call reaches outside the workspace.
  MCP mcp = 51005;

  // own marks a call a member may make for what is their own with
  // membership alone. A caller who holds a role in the workspace but not the
  // method's permission is admitted for their own resources only: the
  // handler refuses any other resource, as the permission check would, with
  // PERMISSION_MISSING, and a list holds only the caller's own. A caller
  // with the permission is admitted as usual. A call that acts for no
  // person needs the permission.
  bool own = 51006;

  // key_mode marks how a changing Workspace or Operator API call is retried.
  // KEY uses a request key; NATURAL needs no key. Reads carry no mark.
  KeyMode key_mode = 51010;

  // deprecation announces that a call will be removed. The release that
  // carries the notice still serves the call, and the release named in
  // removal_version removes it.
  Deprecation deprecation = 51011;

  // surface says who asks before the call is made and what the question is.
  // A call without it is made without a question.
  Surface surface = 51007;
}

// KeyMode describes the retry mode of a changing call.
enum KeyMode {
  KEY_MODE_UNSPECIFIED = 0;
  KEY = 1;
  NATURAL = 2;
}

// Surface is how a call is shown to the people who make it.
message Surface {
  // asks says who asks before the call: the command line and the dashboard
  // for ALWAYS, the dashboard alone for ONE_CLICK. Unset, nobody asks.
  Asks asks = 1;

  // question is the question asked before the call, stating what ends and
  // what is kept. It is required with ASKS_ALWAYS.
  string question = 2;

  // answer is the word the person types to go on. Unset, it is "yes".
  string answer = 3;
}

// Asks says who asks before a call.
enum Asks {
  // Nobody asks: the call ends a run or can be undone.
  ASKS_UNSPECIFIED = 0;
  // The command line and the dashboard ask: the call deletes stored data,
  // deletes or replaces a credential, ends a person's, a token's or a
  // link's access, or replaces the recipe a service runs, with no undo.
  ASKS_ALWAYS = 1;
  // The dashboard alone asks: the call starts billed work from one control
  // with no form before it. The command line is typed, so it does not ask.
  ASKS_ONE_CLICK = 2;
}

// Deprecation is the notice that a call will be removed.
message Deprecation {
  // notice_version is the release that first carries the notice, as
  // MAJOR.MINOR.PATCH, such as "0.9.0".
  string notice_version = 1;

  // removal_version is the release that removes the call, as
  // MAJOR.MINOR.PATCH. It is at least one release after notice_version.
  string removal_version = 2;

  // replaced_by is the full procedure name of the call that replaces this
  // one, such as "/toshi.workspace.v1.XService/Y", or empty when nothing
  // replaces it.
  string replaced_by = 3;

  // docs is the path of the documentation page that describes the removal,
  // such as "docs/api/foo.md#section".
  string docs = 4;

  // sunset is the date the removal release is scheduled for, as
  // YYYY-MM-DD. It is empty until the removal release is scheduled.
  string sunset = 5;
}

extend google.protobuf.FieldOptions {
  // field_permission names what a caller needs to change the field through
  // the mask of an update call marked by_field: a field group of its own,
  // such as "billing.write" for a workspace's spending limits. A field
  // without it needs the method's permission. The build checks the name's
  // shape, and the permissions page lists the field groups.
  string field_permission = 51003;
}

// Audit is the audit event a call records.
message Audit {
  // action is "<noun>.<verb>" with the verb in the past tense. Unset, it is
  // the method's name: CreateSandbox records "sandbox.created". The build
  // fails a method whose verb it cannot put in the past tense, or whose name
  // gives the action this field names. "none" records nothing and requires
  // a reason.
  string action = 1;

  // target is what the call acts on, as "<kind>:<source>", or "none". Unset,
  // the kind is the action's noun and the source the response's id for a
  // call that creates (Create, Reserve, Open) and the request's id
  // otherwise: "id" or "<kind>_id", or for a create "<kind>.id" of the
  // response. A source is a request field path, such as "job_id" or
  // "start.workload_id", a response field path after "response.", such as
  // "response.endpoint.id", "workspace" for the call's workspace, or
  // "project" for the project the call resolved.
  string target = 2;

  // reason explains why an action of "none" records nothing. It is only
  // allowed with that action.
  string reason = 3;
}

// MCP is how a call appears as a tool of the MCP server: each hint that is
// set replaces the one the generator's rules give, and exclude leaves the
// call out of the tool list.
message MCP {
  // read_only is the tool's readOnlyHint: the call changes nothing.
  optional bool read_only = 1;

  // destructive is the tool's destructiveHint: the call may end or remove
  // something it cannot bring back.
  optional bool destructive = 2;

  // idempotent is the tool's idempotentHint: a second call with the same
  // input changes nothing more.
  optional bool idempotent = 3;

  // open_world is the tool's openWorldHint: the call reaches past the
  // workspace, such as a workload that reaches what its network policy
  // allows.
  optional bool open_world = 4;

  // exclude leaves the call out, for a call that makes no sense as a tool,
  // such as one only a workload's own token may make.
  bool exclude = 5;
}

extend google.protobuf.FieldOptions {
  // bound states a fixed number the server applies to the field: the same
  // for every deployment. Clients read it as a generated constant instead of
  // copying it; the field's comment states it in words too, and the
  // generator fails when the two differ. A reference sets no other
  // semantically present fields; an implicit-presence scalar at its default,
  // such as an empty name or UNIT_UNSPECIFIED, counts as absent.
  Bound bound = 51009;
}

// Bound declares fixed values and their units, or refers to a declaration.
message Bound {
  // name is a snake_case name unique across the API, set on a declaration.
  string name = 1;
  // unit is the unit of each value.
  Unit unit = 2;
  // default is the value used when none is set, before a lower plan or
  // deployment limit applies.
  optional int64 default = 3;
  // min and max are fixed input bounds; a tighter limit may also apply.
  optional int64 min = 4;
  optional int64 max = 5;
  // threshold is a fixed span or count applied by the server.
  optional int64 threshold = 6;
  // http_hosts lists the hosts allowed over http for an origins field;
  // https is allowed on any host.
  repeated string http_hosts = 7;
  // pattern is a regular expression, in RE2 and JavaScript syntax, the whole
  // value must match. The server's own check may be stricter.
  optional string pattern = 8;
  // ref names an existing bound. The referenced values and field checks
  // apply to this field too.
  string ref = 9;
  // deprecated_aliases on a declaration names old contract constants.
  // Each alias is a unique snake_case name and refers to the declared values.
  repeated string deprecated_aliases = 10;

  // Unit identifies the unit of a bound's values.
  enum Unit {
    UNIT_UNSPECIFIED = 0;
    UNIT_SECONDS = 1;
    UNIT_BYTES = 2;
    UNIT_COUNT = 3;
  }
}
