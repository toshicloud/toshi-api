syntax = "proto3";

// Package toshi.operator.v1 is the API that people who run Toshi, and their
// tools, use to inspect jobs and hosts and to drain hosts.
package toshi.operator.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.toshicloud.io/api/operatorv1";

// OperatorService is served by the control plane. Every call carries the
// operator token in the HTTP Authorization header as "Bearer <token>".
// A workspace token or a dashboard session is refused with
// PERMISSION_DENIED: a member makes its calls on the Workspace API
// (toshi.workspace.v1), whose member services run these calls for the
// member's workspace, and the refusal names the call to make there.
service OperatorService {
  // ListJobs returns the jobs that match every filter field that is set,
  // oldest queued first.
  //
  // A page holds 100 jobs when page_size is zero, and 1000 at most.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // ListAuditEvents returns the audit log, newest first, with every filter.
  // A member reads its own workspace's with the Workspace API's
  // AuditEventService.ListAuditEvents.
  //
  // A page holds 100 events when page_size is zero, and 1000 at most.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // GetJob returns one job. An unknown ID fails with NOT_FOUND.
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // GetJobTelemetry returns the resource samples of one job's VM and their
  // summary. A member reads its own workspace's jobs with the Workspace
  // API's HostJobService.GetHostJobTelemetry. An unknown ID fails with
  // NOT_FOUND; a job without samples returns none.
  rpc GetJobTelemetry(GetJobTelemetryRequest) returns (GetJobTelemetryResponse);

  // SummariseJobTelemetry sums up the telemetry of the jobs queued in a
  // range that started and finished, by OS and runner size: peak
  // memory, CPU utilisation, CPU wait, out-of-memory kills and the jobs that
  // came near their memory limit. Filler jobs are left out. Operator only.
  rpc SummariseJobTelemetry(SummariseJobTelemetryRequest) returns (SummariseJobTelemetryResponse);

  // ListHosts returns the hosts that match the filter, ordered by ID.
  //
  // A page holds 100 hosts when page_size is zero, and 1000 at most.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);

  // ListHostStorage returns the volumes a host holds, ordered by volume ID:
  // those it keeps the warm copy of, and those a job assigned to it has
  // claimed. A workspace's caller sees only its own hosts and its own volumes.
  // An unknown host fails with NOT_FOUND.
  //
  // A page holds 100 volumes when page_size is zero, and 1000 at most.
  rpc ListHostStorage(ListHostStorageRequest) returns (ListHostStorageResponse);

  // SetHostState drains a host or puts it back in service. Only
  // HOST_STATE_DRAINING and HOST_STATE_ONLINE are accepted. An unknown ID
  // fails with NOT_FOUND.
  rpc SetHostState(SetHostStateRequest) returns (SetHostStateResponse);

  // SetHostOverflow sets whether a host is an overflow host and returns it as
  // stored: an overflow host takes a job only when no other host the job may
  // use has room and the job has queued for its plan's overflow_after.
  // Operators only. An unknown ID fails with NOT_FOUND.
  rpc SetHostOverflow(SetHostOverflowRequest) returns (SetHostOverflowResponse);

  // RetireHost removes a host that holds no assigned, starting or running
  // job; otherwise it fails with FailedPrecondition (drain it first). Its
  // agent, if still running, registers again with its enrollment token.
  rpc RetireHost(RetireHostRequest) returns (RetireHostResponse);

  // RevokeHost revokes a host at once: its
  // host token and any Register under its ID fail with Unauthenticated
  // "host revoked", its assignment streams end, and every job it has not
  // finished fails with the error host_revoked and is not queued again.
  // The host keeps its row, shown with revoked_at. Revoking a revoked host
  // changes nothing and returns revoked false. Operators only. An unknown
  // ID fails with NOT_FOUND, a cloud host with FailedPrecondition.
  rpc RevokeHost(RevokeHostRequest) returns (RevokeHostResponse);

  // RetireOfflineHosts lists the hosts whose state is offline and whose last
  // heartbeat is older than offline_longer_than, oldest first, and with apply
  // set removes each one that holds no assigned, starting or running job.
  // Without apply nothing changes: the response says what a call with apply
  // would do. A host a workspace owns is skipped unless include_owned is set.
  // Each removal records one host.retired audit event. Operators only.
  rpc RetireOfflineHosts(RetireOfflineHostsRequest) returns (RetireOfflineHostsResponse);

  // CreateCloudHost registers a workspace-owned cloud host the control plane
  // drives in the workspace's AWS account, for any workspace; a member adds
  // its own with the Workspace API's HostService.CreateCloudHost. When
  // cloud hosts are not configured on the control plane the call fails with
  // FAILED_PRECONDITION.
  rpc CreateCloudHost(CreateCloudHostRequest) returns (CreateCloudHostResponse);

  // CreateWorkspace makes a workspace that has no GitHub installation and
  // returns it with its new id. It is on plan when one is given and on the
  // control plane's default_plan otherwise, as an installed workspace is,
  // with that plan's starter credit. An empty name, or a plan the
  // configuration does not define, fails with INVALID_ARGUMENT. Names are not
  // unique: two workspaces may share one. Only the operator may call it.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  // GetWorkspace returns one workspace. An empty ID fails with
  // INVALID_ARGUMENT; an unknown ID fails with NOT_FOUND.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);

  // ListTenants returns every workspace, ordered by ID.
  //
  // A page holds 100 workspaces when page_size is zero, and 1000 at most.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  // SetTenantCap sets a workspace's concurrency cap override and returns the
  // workspace as stored; a cap of 0 clears the override, so the workspace's plan
  // applies. An empty ID or a negative cap fails with INVALID_ARGUMENT; an
  // unknown ID fails with NOT_FOUND.
  rpc SetTenantCap(SetTenantCapRequest) returns (SetTenantCapResponse);

  // SetTenantHistory sets a workspace's job history retention override and
  // returns the workspace as stored; omitting history_days clears the override,
  // so the workspace's plan applies. 0 keeps history forever. An empty workspace
  // or a negative history_days fails with INVALID_ARGUMENT; an unknown workspace
  // fails with NOT_FOUND.
  rpc SetTenantHistory(SetTenantHistoryRequest) returns (SetTenantHistoryResponse);

  // SetTenantLimits sets or clears a workspace's own secret and preview limits,
  // which replace its plan's values, higher or lower, and returns the workspace
  // as stored. A limit set in the request becomes the workspace's value, 0 for
  // no cap; a limit named in clear goes back to the plan's; any other keeps
  // its current value. A negative limit, secret_max_kib above 1073741824, an
  // unknown name in clear, a limit both set and cleared, or a request that
  // sets and clears nothing fails with INVALID_ARGUMENT; an unknown workspace
  // fails with NOT_FOUND. A workspace's own token cannot call it.
  rpc SetTenantLimits(SetTenantLimitsRequest) returns (SetTenantLimitsResponse);

  // ListPlans returns configured plans sorted by name.
  //
  // A page holds 100 plans when page_size is zero, and 1000 at most.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);

  // GetVersion returns the control plane's version, commit and commit date.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // SetTenantPlan sets a workspace's plan and returns the workspace. An empty ID or
  // plan, or a plan the configuration does not define, fails with
  // INVALID_ARGUMENT; an unknown workspace fails with NOT_FOUND.
  rpc SetTenantPlan(SetTenantPlanRequest) returns (SetTenantPlanResponse);

  // SetTenantOwnHostsOnly sets whether the workspace's jobs wait for its own
  // hosts and never run on shared ones, and returns the workspace as stored. An
  // empty ID fails with INVALID_ARGUMENT; an unknown ID fails with NOT_FOUND.
  rpc SetTenantOwnHostsOnly(SetTenantOwnHostsOnlyRequest) returns (SetTenantOwnHostsOnlyResponse);

  // SetTenantAllowOverflow sets whether shared overflow hosts may take the
  // workspace's jobs and returns the workspace as stored; its own
  // overflow hosts always may. An empty ID fails with INVALID_ARGUMENT; an
  // unknown ID fails with NOT_FOUND.
  rpc SetTenantAllowOverflow(SetTenantAllowOverflowRequest) returns (SetTenantAllowOverflowResponse);

  // SuspendTenant suspends an active workspace: its new and queued jobs are
  // held with hold reason tenant_suspended, its running jobs finish, and its
  // users keep read-only access. A suspended workspace is returned unchanged. An
  // empty ID or reason fails with INVALID_ARGUMENT, an unknown ID with
  // NOT_FOUND, and a workspace that is deleting or deleted with
  // FAILED_PRECONDITION. Operator only.
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse);
  // ResumeTenant returns a suspended workspace to active and cancels a
  // scheduled deletion; held jobs run at the next scheduler pass. An active
  // workspace is returned unchanged. An empty ID fails with INVALID_ARGUMENT,
  // an unknown ID with NOT_FOUND, and a workspace that is deleting or deleted
  // with FAILED_PRECONDITION. Operator only.
  rpc ResumeTenant(ResumeTenantRequest) returns (ResumeTenantResponse);
  // DeleteTenant suspends a workspace until purge_after, after which its data
  // is purged from the control plane and every host. grace_seconds of 0
  // means the default of 30 days; now purges as soon as the workspace has no
  // running job. A negative grace_seconds, or now with grace_seconds, fails
  // with INVALID_ARGUMENT, an unknown ID with NOT_FOUND, and a workspace that is
  // deleting or deleted with FAILED_PRECONDITION. Operator only.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // SetTenantReservation sets or clears a workspace's reservation of N slots of
  // one runner size for shared hosts, and returns the workspace's effective
  // reservations. slots of 0 removes the workspace's own reservation
  // for the size, so its plan's applies again. An empty ID, an unknown size,
  // a negative slots, or a warm outside 0..slots fails with INVALID_ARGUMENT;
  // an unknown workspace fails with NOT_FOUND. Operator only.
  rpc SetTenantReservation(SetTenantReservationRequest) returns (SetTenantReservationResponse);

  // GetCapacity returns the reserved-capacity view of the last scheduler
  // pass: per runner size the slots free and reserved, and per reservation
  // the slots in use, earmarked and short. Operator only. It
  // fails with FAILED_PRECONDITION when no pass has run yet.
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);

  // SetTenantSpendLimits sets a workspace's monthly spending cap and its own
  // jobs-per-hour limit, and returns the workspace as stored; an unset field is
  // left as it is. An empty ID, a negative value, or a
  // max_jobs_per_hour above the plan's fails with INVALID_ARGUMENT; a
  // spending cap while billing is off fails with FAILED_PRECONDITION; an
  // unknown ID fails with NOT_FOUND.
  rpc SetTenantSpendLimits(SetTenantSpendLimitsRequest) returns (SetTenantSpendLimitsResponse);

  // GetUsage returns job counts and billable minutes per workspace, UTC day,
  // conclusion, outcome and kind, for the jobs whose queued_at is in the
  // window. The window defaults to the last 7 days. A window whose from is not before its
  // to fails with INVALID_ARGUMENT.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // GetQueueTimes returns a queue-time summary (percentiles, maximum and warm
  // share) for the jobs that reached running in the window, where a job is in
  // the window by its queued_at. The window defaults to the last 7 days. A
  // window whose from is not before its to fails with INVALID_ARGUMENT.
  rpc GetQueueTimes(GetQueueTimesRequest) returns (GetQueueTimesResponse);

  // GetWorkflowUsage returns, per workspace, repository and workflow name, the
  // jobs GetUsage counts: their billable minutes, failed jobs and run-time
  // percentiles. A job is in the window by its queued_at. The window
  // defaults to the last 7 days. A window whose from is not before its to
  // fails with INVALID_ARGUMENT.
  rpc GetWorkflowUsage(GetWorkflowUsageRequest) returns (GetWorkflowUsageResponse);

  // GetTenantBilling returns a workspace's billing customer, subscription and
  // its status, the usage reported to the billing provider per month and
  // runner size, and the events that failed. An empty ID, or months outside 0
  // to 12, fails with INVALID_ARGUMENT; an unknown workspace fails with
  // NOT_FOUND.
  rpc GetTenantBilling(GetTenantBillingRequest) returns (GetTenantBillingResponse);

  // GetTenantStatement returns a workspace's usage statement for one UTC month:
  // minutes by runner size and OS of the jobs that finished in it, the
  // minutes metered to the billing provider by size with their estimated
  // cost at the plan's prices, the starter credit applied in it, and held
  // time by reason. An empty ID or a month not in YYYY-MM form fails with
  // INVALID_ARGUMENT; an unknown workspace fails with NOT_FOUND. A member
  // reads its own workspace's with the Workspace API's
  // WorkspaceService.GetWorkspaceStatement.
  rpc GetTenantStatement(GetTenantStatementRequest) returns (GetTenantStatementResponse);

  // SetTenantBillingCustomer links or clears a workspace's billing customer id and
  // returns the workspace's billing state. An empty ID, or a customer_id longer
  // than 255 bytes or holding anything but printable ASCII without spaces,
  // fails with INVALID_ARGUMENT; an unknown workspace fails with NOT_FOUND; a
  // customer id held by another workspace fails with ALREADY_EXISTS.
  rpc SetTenantBillingCustomer(SetTenantBillingCustomerRequest) returns (SetTenantBillingCustomerResponse);

  // CreateCheckoutSession returns a Stripe Checkout URL that subscribes the
  // workspace to plan, first creating and linking a billing customer for a
  // workspace without one. An empty ID, an empty plan, or a plan the
  // configuration does not define fails with INVALID_ARGUMENT; an unknown
  // workspace fails with NOT_FOUND; self-serve billing off, a plan that is not
  // sold or maps to several lookup keys, a price missing in Stripe, or a
  // workspace that already has a subscription fails with FAILED_PRECONDITION; a
  // billing provider failure fails with UNAVAILABLE. A member calls the
  // Workspace API's WorkspaceService.CreateCheckoutSession for its own
  // workspace.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);

  // CreateBillingPortalSession returns a Stripe Customer Portal URL where the
  // workspace manages its card and subscription. An empty ID fails with
  // INVALID_ARGUMENT; an unknown workspace fails with NOT_FOUND; self-serve
  // billing not configured or a workspace with no billing customer fails with
  // FAILED_PRECONDITION; a billing provider failure fails with UNAVAILABLE.
  // A member calls the Workspace API's
  // WorkspaceService.CreateBillingPortalSession for its own workspace.
  rpc CreateBillingPortalSession(CreateBillingPortalSessionRequest) returns (CreateBillingPortalSessionResponse);

  // CancelJob cancels a queued job at once. An assigned, starting or running
  // job moves to JOB_STATE_STOPPING: its host stops the runner after a grace
  // period, destroys the VM and reports the job JOB_STATE_CANCELLED.
  // A stopping job is returned unchanged; a finished job fails
  // with FailedPrecondition.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // StopJobDebug ends a job's debug session before its expiry:
  // the job moves to JOB_STATE_STOPPING with stop_reason debug_ended, its
  // host destroys the kept VM and the job finishes completed with its
  // conclusion unchanged. A job that is not debugging fails with
  // FailedPrecondition; one already stopping is returned unchanged.
  rpc StopJobDebug(StopJobDebugRequest) returns (StopJobDebugResponse);

  // GetJobDebugAccess returns the key that opens a debugging job's guest
  // ssh through the control plane's relay. The job's host makes
  // the key and gives it out once per session; the control plane does not
  // keep it. A job that is not debugging fails with
  // FAILED_PRECONDITION, a key already issued with ALREADY_EXISTS, and a
  // host that does not answer with UNAVAILABLE.
  rpc GetJobDebugAccess(GetJobDebugAccessRequest) returns (GetJobDebugAccessResponse);

  // ListTokens returns the operator and enrollment tokens the control plane
  // knows, oldest first, without their values.
  //
  // A page holds 100 tokens when page_size is zero, and 1000 at most.
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);

  // RotateToken makes a new operator or enrollment token, accepted at once,
  // and returns it; it is not stored and cannot be shown again. The kind's
  // other active tokens keep working until the grace period ends.
  rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse);

  // RevokeToken stops a token working at once. Revoking an enrollment token
  // also signs out the hosts that registered with it, and those whose
  // enrollment token is not recorded: each registers again with the
  // enrollment token it now holds and keeps its jobs. Revoking a workspace's
  // enrollment token signs out only the hosts that registered with it.
  // Revoking the only active operator token fails with FailedPrecondition.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // CreateEnrollmentToken makes an enrollment token for one workspace and
  // returns it with its value; a host that registers with it is owned by that
  // workspace. The token does not expire and the other tokens are untouched. An
  // unknown workspace fails with NOT_FOUND; a closed workspace fails with
  // FailedPrecondition.
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);

  // CreateTenantToken makes an API token for one workspace that authenticates
  // the Workspace API as that workspace, with a dashboard session's scope, and
  // returns it with its value. An unknown workspace fails with NOT_FOUND; a
  // closed workspace fails with FailedPrecondition.
  rpc CreateTenantToken(CreateTenantTokenRequest) returns (CreateTenantTokenResponse);

  // CreateProductToken makes a token a product's adapter authenticates to
  // the core with. Operator only. It expires within 90 days, and a product
  // has at most two tokens that work at once, so that one can replace the
  // other.
  rpc CreateProductToken(CreateProductTokenRequest) returns (CreateProductTokenResponse);

  // ListOperatorAlerts returns the operator alerts raised and not yet
  // cleared, one per kind, ordered by kind. They are kept in the store, so a
  // restarted control plane still returns them. Operators only.
  //
  // A page holds 100 alerts when page_size is zero, and 1000 at most.
  rpc ListOperatorAlerts(ListOperatorAlertsRequest) returns (ListOperatorAlertsResponse);

  // ListHostAlerts returns the active alerts of hosts that workspaces own:
  // memory_held, egress_changed and agent_version_skew, one per workspace and
  // kind, ordered by workspace, then kind. A workspace caller gets those of its
  // own workspaces; an operator gets every workspace's, or one workspace's with the
  // filter.
  //
  // A page holds 100 alerts when page_size is zero, and 1000 at most.
  rpc ListHostAlerts(ListHostAlertsRequest) returns (ListHostAlertsResponse);

  // ListEgressIPs returns the public addresses a workspace's jobs may reach the
  // internet from: the egress addresses of the hosts its jobs can land on,
  // its own hosts and, unless it runs on its own hosts only, the shared hosts
  // its plan's operating systems run on. A member asks for its own
  // workspace with the Workspace API's WorkspaceService.ListEgressIPs. An
  // empty workspace fails with INVALID_ARGUMENT; an unknown workspace fails
  // with NOT_FOUND.
  //
  // A page holds 100 hosts when page_size is zero, and 1000 at most.
  rpc ListEgressIPs(ListEgressIPsRequest) returns (ListEgressIPsResponse);

  // CheckCloudHost checks a cloud host's AWS setup without launching
  // anything: the role can be assumed, the AMI is visible, the subnet routes
  // to the internet, and the role's policy allows each action Toshi calls,
  // through dry-run calls. A member checks its own workspace's hosts with
  // the Workspace API's HostService.CheckCloudHost. A host that is not a
  // cloud host fails with NOT_FOUND; cloud hosts not configured on the
  // control plane fails with FAILED_PRECONDITION.
  rpc CheckCloudHost(CheckCloudHostRequest) returns (CheckCloudHostResponse);
  // ListFillers returns the fillers, ordered by name, then workspace, each
  // with its latest run, and the filler minutes per host over the last 24
  // hours. A workspace caller sees only its own dispatch fillers and no host
  // minutes.
  //
  // A page holds 100 fillers when page_size is zero, and 1000 at most.
  rpc ListFillers(ListFillersRequest) returns (ListFillersResponse);

  // PutFiller adds a filler or replaces the one with the same name and
  // returns it as stored. A filler from the control plane's [[filler]]
  // configuration cannot be replaced (FailedPrecondition). A workspace caller
  // may put only dispatch fillers for its own workspace and repositories.
  // A bad field fails with INVALID_ARGUMENT.
  rpc PutFiller(PutFillerRequest) returns (PutFillerResponse);

  // DeleteFiller removes a filler and stops its running run. A configured
  // filler cannot be removed (FailedPrecondition); an unknown name fails
  // with NOT_FOUND. A workspace caller may remove only its own.
  rpc DeleteFiller(DeleteFillerRequest) returns (DeleteFillerResponse);

  // SetFillerEnabled turns a filler on or off and returns it. Turning it off
  // stops its running run. An unknown name fails with NOT_FOUND.
  rpc SetFillerEnabled(SetFillerEnabledRequest) returns (SetFillerEnabledResponse);

  // ListFillerRuns returns filler runs, newest first. A workspace caller sees
  // only its own dispatch fillers' runs.
  //
  // A page holds 50 runs when page_size is zero, and 500 at most.
  rpc ListFillerRuns(ListFillerRunsRequest) returns (ListFillerRunsResponse);

  // SetTenantAllowCacheWarm sets whether the workspace's dispatch fillers run
  // and returns the workspace as stored. Off by default. An empty
  // ID fails with INVALID_ARGUMENT; an unknown ID fails with NOT_FOUND.
  rpc SetTenantAllowCacheWarm(SetTenantAllowCacheWarmRequest) returns (SetTenantAllowCacheWarmResponse);

  // SetTenantCancelRunOnVmDeath sets whether Toshi cancels the workflow run
  // of the workspace's job when the job's VM is gone and returns the
  // workspace as stored. On by default. An empty ID fails with
  // INVALID_ARGUMENT; an unknown ID fails with NOT_FOUND.
  rpc SetTenantCancelRunOnVmDeath(SetTenantCancelRunOnVmDeathRequest) returns (SetTenantCancelRunOnVmDeathResponse);

  // GetJobFailure says why a job ended the way it did and what to do next,
  // from what Toshi stored; GitHubService.GetJobFailure gives what GitHub
  // says, which the CLI and the dashboard compose into it. A workspace caller
  // sees only its own jobs. An empty ID fails with INVALID_ARGUMENT; an
  // unknown ID fails with NOT_FOUND.
  rpc GetJobFailure(GetJobFailureRequest) returns (GetJobFailureResponse);

  // GetSecretDelivery returns the switch for delivering secrets to CI jobs
  // and the hosts that keep it from turning on. The
  // operator token only.
  rpc GetSecretDelivery(GetSecretDeliveryRequest) returns (GetSecretDeliveryResponse);

  // SetSecretDelivery turns delivery of secrets to CI jobs on or off and
  // records the change with an audit event in the same transaction. On is
  // refused with FAILED_PRECONDITION, naming the hosts, while a host that
  // is not revoked is not ready for it; off does not depend on the hosts.
  // Setting the value the switch has changes and records nothing. The
  // operator token only.
  rpc SetSecretDelivery(SetSecretDeliveryRequest) returns (SetSecretDeliveryResponse);

  // ListUtilisation returns the shared hosts' utilisation roll-ups in a
  // range, summed by OS pool or by host and by hour, day or week, with the
  // rows of the hour in progress read from memory. Operator
  // only.
  //
  // A page holds 1000 rows when page_size is zero, and 5000 at most.
  rpc ListUtilisation(ListUtilisationRequest) returns (ListUtilisationResponse);

  // SuggestPools replays the store's finished jobs queued in the last days
  // against the hosts as registered, with the warm targets their agents
  // report, and suggests each size's warm target, as `toshi replay
  // suggest-pools` does on an export. A run reads the
  // newest max_jobs jobs of the window, stops after timeout, and runs in the
  // background, one at a time in each control plane process, which keeps its
  // own result. A call returns the last result for the window; it starts a
  // run when no run is in progress and there is no result for the window
  // from the current UTC day, or force is set. A result, failed or not, is
  // kept in memory until the next run replaces it; a restart loses it.
  // Operator only. A `days` value outside 0 to max_days fails with
  // INVALID_ARGUMENT.
  rpc SuggestPools(SuggestPoolsRequest) returns (SuggestPoolsResponse);

  // CreateStorageProvider registers a bucket Toshi may keep recordings and
  // artifacts in. An empty tenant_id registers the operator's
  // own provider, shared by every workspace; it takes a credentials file
  // reference. A request with a credential stores a workspace's own
  // tenant_bucket provider instead: the control plane wraps the key, checks
  // the bucket with it as CheckStorageProvider does and stores the row only
  // when the check passes, else FAILED_PRECONDITION with the check's error.
  // A workspace has one such provider; a second fails with ALREADY_EXISTS, and
  // a suspended or deleting workspace with FAILED_PRECONDITION. A bad field
  // fails with INVALID_ARGUMENT, a duplicate name for the same owner with
  // ALREADY_EXISTS, and a second provider with the lifecycle capability on
  // the same endpoint and bucket with ALREADY_EXISTS. A member stores its
  // own workspace's, with a credential and no file, role or replication
  // fields, with the Workspace API's
  // StorageProviderService.CreateStorageProvider.
  rpc CreateStorageProvider(CreateStorageProviderRequest) returns (CreateStorageProviderResponse);

  // ListStorageProviders returns the operator's providers when tenant_id
  // is empty and that workspace's otherwise, ordered by name. With
  // include_default it also returns the operator's provider a workspace
  // without one of its own uses, whether or not this workspace has one. A
  // member lists its own workspace's with the Workspace API's
  // StorageProviderService.ListStorageProviders, and gets every row
  // without its credential references (credentials_file,
  // credentials_profile, role_arn and external_id empty).
  //
  // A page holds 100 providers when page_size is zero, and 1000 at most.
  rpc ListStorageProviders(ListStorageProvidersRequest) returns (ListStorageProvidersResponse);

  // CheckStorageProvider checks a provider's bucket: it heads the bucket,
  // refuses a versioned one, then uploads, heads and deletes a probe
  // object. A check that fails is an answer, not an error: ok is false and
  // error names the failing step.
  //
  // With id it checks a saved provider, records the result and returns
  // the provider as stored. With provider it checks one that is not saved,
  // with the credential in the request, as CreateStorageProvider would
  // before it stores one; it stores and audits nothing, and a request
  // CreateStorageProvider would refuse fails the same way before any
  // connection. A member checks a row its workspace saved (one with a
  // wrapped credential and no role), and gets last_check_error, or one not
  // saved for its own workspace, with the Workspace API's
  // StorageProviderService.CheckStorageProvider.
  rpc CheckStorageProvider(CheckStorageProviderRequest) returns (CheckStorageProviderResponse);

  // DeleteStorageProvider removes a provider. An unknown ID fails with
  // NOT_FOUND. A member deletes a row its workspace saved with the
  // Workspace API's StorageProviderService.DeleteStorageProvider; a row the
  // operator set for the workspace is PERMISSION_DENIED to it there.
  rpc DeleteStorageProvider(DeleteStorageProviderRequest) returns (DeleteStorageProviderResponse);
}

// JobState is where a job is in its life cycle.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // Waiting for a host.
  JOB_STATE_QUEUED = 1;
  // Assigned to a host that has not started its VM yet.
  JOB_STATE_ASSIGNED = 2;
  // The host is starting the VM.
  JOB_STATE_STARTING = 3;
  // The runner in the VM is running the job.
  JOB_STATE_RUNNING = 4;
  // The job finished; conclusion says how.
  JOB_STATE_COMPLETED = 5;
  // Toshi could not run the job; error says why.
  JOB_STATE_FAILED = 6;
  // The job was cancelled before it finished.
  JOB_STATE_CANCELLED = 7;
  // The job is being stopped: its host destroys the VM after a grace period.
  JOB_STATE_STOPPING = 8;
  // GitHub concluded the job failed and its host keeps the VM for a debug
  // session until debug_until. It counts as running.
  JOB_STATE_DEBUGGING = 9;
}

// JobKind is a job's workload kind.
enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  // A job: it ends when its runner exits or at its time limit.
  JOB_KIND_JOB = 1;
  // A Workspace API sandbox's job: it runs until its owner stops it or
  // Toshi stops it. Its workload_id is the sandbox.
  JOB_KIND_SANDBOX = 2;
  // A run of a Workspace API service: it runs until it exits
  // or its service stops it. Its workload_id is the service.
  JOB_KIND_SERVICE = 3;
}

// HostState says whether a host takes new jobs.
enum HostState {
  HOST_STATE_UNSPECIFIED = 0;
  // The host takes new jobs.
  HOST_STATE_ONLINE = 1;
  // The host finishes the jobs it has and takes no new ones.
  HOST_STATE_DRAINING = 2;
  // The host is not reachable.
  HOST_STATE_OFFLINE = 3;
}

// AgentVersionStatus says whether a host's agent matches the control plane's
// version promise.
enum AgentVersionStatus {
  AGENT_VERSION_STATUS_UNSPECIFIED = 0;
  // Either side is not a release (snapshot, dev, or empty).
  AGENT_VERSION_STATUS_UNKNOWN = 1;
  // The agent version is inside the promise.
  AGENT_VERSION_STATUS_OK = 2;
  // The agent version is outside the promise.
  AGENT_VERSION_STATUS_SKEW = 3;
  // The agent version is below the minimum the control plane admits
  // (agent_auth.minimum_agent_version), or is not a release while
  // a minimum is set: the host is refused at its next Register. It outranks
  // the other statuses. A revoked host never has it, nor does a cloud host,
  // which has no agent: its driver runs in the control plane.
  AGENT_VERSION_STATUS_BELOW_MINIMUM = 4;
}

// Job is one GitHub Actions workflow job that Toshi runs on a VM. A
// timestamp the job has not reached yet is unset.
message Job {
  string id = 1;
  string tenant = 2;
  // The repository as "owner/name".
  string repository = 3;
  int64 workflow_job_id = 4;
  int64 run_id = 5;
  // The GitHub App installation that the job came from.
  int64 installation_id = 6;
  // The runs-on labels.
  repeated string labels = 7;
  string os = 8;
  string size = 9;
  JobState state = 10;
  // The host the job is assigned to; empty while it is queued.
  string host_id = 11;
  // The VM the job runs in; empty until the host starts one.
  string instance_id = 12;
  google.protobuf.Timestamp queued_at = 13;
  google.protobuf.Timestamp assigned_at = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp finished_at = 16;
  // GitHub's conclusion for a completed job, such as "success".
  string conclusion = 17;
  // Why Toshi could not run the job, for a failed job.
  string error = 18;
  // Why the job was stopped: github_cancelled, max_duration, operator,
  // github_completed, runner_not_started, runner_unconfirmed, debug_ended,
  // ran_elsewhere, or for a sandbox spend_cap, tenant_suspended or
  // tenant_deleted. Empty if it never was.
  string stop_reason = 19;
  // When the control plane asked the host to stop the job. Unset if it
  // never did.
  google.protobuf.Timestamp stop_requested_at = 20;
  // Why the scheduler last held the job while it was queued:
  // tenant_suspended, tenant_cap, tenant_vcpu, free_allowance, spend_cap,
  // jobs_per_hour, burst_guard, plan_os, installation_suspended,
  // overflow_wait, no_own_capacity or no_capacity. Empty when the job was
  // never held. It is kept after the job starts.
  string hold_reason = 21;
  // Whether the job was placed on a host its workspace owns. Such a job sends no
  // meter event.
  bool own_host = 22;
  // The debug session the job asked for with a toshi-debug-<minutes> label,
  // in minutes; 0 when it asked for none.
  int32 debug_requested_minutes = 23;
  // The minutes the plan granted: the request clamped to the plan's
  // debug_minutes; 0 when none.
  int32 debug_minutes = 24;
  // Why a request was ignored or clamped; empty otherwise.
  string debug_note = 25;
  // When the debug session started and when it expires; unset for a job
  // that never had one.
  google.protobuf.Timestamp debug_started_at = 26;
  google.protobuf.Timestamp debug_until = 27;
  // What the job's resource samples add up to; unset when it has none.
  JobTelemetrySummary telemetry = 28;
  // Why the latest runner started for the job exited without running it,
  // as its listener's log says: "listener exit code 0: Acknowledge returned
  // job-not-found ...". Empty when none did or its guest did not say.
  string runner_exit_reason = 29;
  // The job is assigned to, or ran on, an overflow host.
  bool overflow = 30;
  // Since when the control plane has been waiting for GitHub to answer the
  // request for this job's runner. Unset when no request is in
  // flight. Kept in memory: unset after a restart of the control plane.
  google.protobuf.Timestamp runner_request_since = 31;
  // Toshi's own word for a job Toshi ended itself: time_limit,
  // cancelled_by_tenant, cancelled_by_operator, cancelled_by_uninstall,
  // cancelled or failed. Empty for every other job. The conclusion stays
  // GitHub's word.
  string outcome = 32;
  // The kind of the job's host when it is not a host agent's machine: "cloud"
  // for a cloud host or a cloud pool. Empty otherwise,
  // and for a job without a host.
  string host_kind = 33;
  // The cloud pool's name when the job started on a warm instance of the
  // pool's previous image or runner, because the cloud refused a launch on
  // the current one. Empty otherwise. Set by GetJob only.
  string previous_pool_image = 34;
  // The whole minutes the job counts in the usage report: from started_at
  // to stop_requested_at when the job was asked to stop, else to
  // finished_at, rounded up. 0 for a job that has not ended or never started,
  // a job on its workspace's own host and a dispatch filler's job, which are not
  // billed.
  int64 billable_minutes = 35;
  // The job's page on GitHub, on the configured GitHub web URL. Empty when
  // the job has no repository, run or workflow job id.
  string github_url = 36;
  // The name of the job's workflow, from the workflow_job webhook Toshi
  // made the job from. Empty when the webhook did not carry it, for a job
  // Toshi did not make from a webhook, and for one stored before the name
  // was recorded.
  string workflow_name = 37;
  // What the job's cache disk did, as its host reported it.
  // Unset when the host reported nothing, as for a job without a cache.
  JobCache cache = 38;
  // When the host reported that the job's runner exited before GitHub
  // reported the job in progress; the job then waits for GitHub.
  // Unset when the runner exited after that, or has not exited.
  google.protobuf.Timestamp runner_exited_at = 39;
  // The conclusion the host reported with that exit, such as "success".
  // Set only with runner_exited_at. Kept in memory: empty after a restart
  // of the control plane.
  string runner_conclusion = 40;
  // The tier of the host the job was assigned to: "container"
  // for a container tier host, empty for a VM. The job keeps it after its
  // host is removed; a requeue clears it.
  string tier = 41;
  // The memory limit the job's host gave it in MiB, when that is not its
  // runner size's memory: on a container tier host, its share of the host by
  // CPUs: the host's memory less the agent's memory reserve, times the size's
  // CPUs over the host's CPUs. A host that reports no CPUs, or no more memory
  // than that reserve, keeps each size's configured memory. 0 means the
  // size's memory, and for a tier job that its host has not reported the
  // limit yet.
  int64 memory_limit_mib = 42;
  // The tier in one line, as the dashboard's job page, `toshi host-job
  // explain` and `toshi workspace host-job explain` show it, such as "ran on
  // a container tier host, which isolates less than a VM (the job shares the
  // host's kernel); memory limit 6971 MiB". Empty for a job that ran in a VM.
  string tier_line = 43;
  // The job's kind: JOB_KIND_SANDBOX for a Workspace API sandbox's job,
  // JOB_KIND_SERVICE for a run of a Workspace API service, JOB_KIND_JOB
  // for every other. Set when the job is made; it never changes.
  JobKind kind = 44;
  // The Workspace API workload the job runs: a sandbox's or a service's
  // id, or the id of a job workload run on a host. Empty for a
  // CI job.
  string workload_id = 45;
  // The project the job belongs to, by name: the project that
  // claimed the job's repository when the job was stored, else the
  // workspace's default project; a Workspace API job's is its workload's.
  // Empty for a job stored before projects.
  string project = 46;
  // The job's environment, by name. A CI job's is empty until the job's
  // assignment mints a workload token or receives secrets, and a new
  // assignment re-resolves it; a Workspace API job's is its
  // workload's.
  string environment = 47;
}

// JobCache is what a job's cache disk did.
message JobCache {
  // "attached", or "not_attached" when the disk never reached the job's VM
  // and the job ran without it.
  string attach = 1;
  // The generation the disk was attached from; 0 is the blank disk.
  int64 base_generation = 2;
  // "committed" or "skipped"; empty until the host reports the write-back,
  // after the job's VM is gone, and when the disk was not attached.
  string write_back = 3;
  // Why the write-back was skipped: "untrusted", "failed", "job_failed",
  // "no_result", "unclean", "stale", "size_cap", "host_disk" or "error",
  // or a reason this control plane does not know, from a newer agent, as
  // the agent sent it.
  string skip_reason = 4;
  // The size of the committed generation in bytes, and how long the
  // write-back took in milliseconds.
  int64 generation_bytes = 5;
  int64 write_back_ms = 6;
  // The fields above in one line, as the dashboard's job page,
  // `toshi host-job explain` and `toshi workspace host-job explain` show it,
  // such as "warm from generation 3 on host h1; wrote generation 4 (1.2 GiB
  // in 14 s)".
  string line = 7;
}

// JobTelemetrySummary sums up a job VM's resource samples.
message JobTelemetrySummary {
  // Whether the guest kernel's out-of-memory killer killed a process
  // during the job.
  bool oom_killed = 1;
  // How long the VM's threads waited for a host CPU, as a percentage of the
  // CPU time they used plus that wait. 0 when they never waited.
  double cpu_throttled_pct = 2;
  // The most memory in use inside the guest, in MiB; the host's resident
  // memory of the VM when the guest does not report it.
  int64 peak_memory_mib = 3;
  // CPU time used as a percentage of the VM's vCPUs over the sampled time.
  double cpu_utilisation_pct = 4;
  // How many samples the job has.
  int32 samples = 5;
  // The job's memory limit in MiB: the memory its runner size gives its VM,
  // or on a container tier host the limit the host gave it, its share of
  // the host; 0 when neither is known.
  int64 memory_limit_mib = 6;
  // The CPU time the VM used, in milliseconds: the sum of the job's stored
  // samples.
  int64 cpu_ms = 7;
  // Why the job ran out of memory, when it ended without succeeding and its
  // samples counted a kill: "out of memory (peak X MiB of limit Y MiB)",
  // without the limit when the size is unknown. Empty otherwise.
  string oom_reason = 8;
  // Whether the runner size suited the job: "fits", "too big", "too small",
  // "throttled" or "out of memory". Empty for a job that has not ended, and
  // for a size this release does not know unless the job ran out of memory
  // or was throttled.
  string verdict = 9;
  // The verdict in one sentence with its numbers, such as "used 20 % of 4
  // vCPUs and 4 GiB of 16 GiB: a size smaller, toshi-linux-2x, would fit".
  // Empty when the verdict is.
  string verdict_reason = 10;
}

message GetJobTelemetryRequest {
  string job_id = 1;
}

message GetJobTelemetryResponse {
  // The job's runner size and its VM's vCPUs and memory, to scale the
  // samples by.
  string size = 1;
  int32 vcpus = 2;
  int64 memory_mib = 3;
  // Unset when the job has no samples.
  JobTelemetrySummary summary = 4;
  // Oldest first.
  repeated JobTelemetrySample samples = 5;
}

// JobTelemetrySample is the same as toshi.agent.v1.TelemetrySample: one
// window of a job VM's resource use.
message JobTelemetrySample {
  google.protobuf.Timestamp at = 1;
  int32 window_ms = 2;
  int64 cpu_ms = 3;
  int64 cpu_wait_ms = 4;
  optional int64 guest_memory_mib = 5;
  int64 host_memory_mib = 6;
  int64 disk_read_bytes = 7;
  int64 disk_write_bytes = 8;
  optional int64 net_rx_bytes = 9;
  optional int64 net_tx_bytes = 10;
  optional int32 oom_kills = 11;
}

message SummariseJobTelemetryRequest {
  // The jobs queued at or after from and before to. To is the control
  // plane's now when unset. The range may span at most 31 days.
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}

message SummariseJobTelemetryResponse {
  // One row per OS and runner size with a job in the range, ordered by OS
  // and then size.
  repeated JobTelemetrySizeRow rows = 1;
  // The range summed.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// JobTelemetrySizeRow sums up the telemetry of one OS and runner size's
// jobs. Every figure but jobs_unsampled is over the jobs with samples.
message JobTelemetrySizeRow {
  string os = 1;
  string size = 2;
  // The size's vCPUs and memory; 0 when the size is unknown.
  int32 vcpus = 3;
  int64 memory_mib = 4;
  // The jobs with samples.
  int32 jobs = 5;
  // The jobs without samples.
  int32 jobs_unsampled = 6;
  // Each job's peak memory: guest memory, or host memory when the guest
  // gave none.
  TelemetryPercentiles peak_memory_mib = 7;
  // Each job's peak host memory: what its VM held on the host.
  TelemetryPercentiles peak_host_memory_mib = 8;
  // Each job's peak memory as a percentage of its memory limit (its host's
  // limit on a container tier host, else the size's memory), over the jobs
  // whose limit is known.
  TelemetryPercentiles peak_memory_pct = 9;
  // Each job's CPU time as a percentage of the size's vCPUs over its
  // sampled time, over the jobs whose size is known.
  TelemetryPercentiles cpu_utilisation_pct = 10;
  // The CPU wait of these jobs together as a percentage of their CPU time
  // plus that wait.
  double cpu_throttled_pct = 11;
  // The jobs that counted an out-of-memory kill.
  int32 oom_killed = 12;
  // The jobs whose peak memory reached 90 % of their memory limit or more.
  int32 near_memory_limit = 13;
}

// TelemetryPercentiles is the median, 95th percentile and highest of a set
// of values, each percentile the nearest rank; all 0 for an empty set.
message TelemetryPercentiles {
  double p50 = 1;
  double p95 = 2;
  double max = 3;
}

// HeldRefill is one warm pool whose refill a host holds.
message HeldRefill {
  string size = 1;
  // "memory" or "cpus".
  string reason = 2;
}

// Host is a machine that runs VMs for Toshi.
message Host {
  string id = 1;
  string name = 2;
  // The guest operating systems the host can run.
  repeated string os = 3;
  int32 cpus = 4;
  int32 memory_mib = 5;
  map<string, string> labels = 6;
  HostState state = 7;
  // When the host's agent last reported in; unset if it never did.
  google.protobuf.Timestamp last_seen_at = 8;
  // Memory not used by VMs, in MiB, from the host's last heartbeat.
  int64 free_memory_mib = 9;
  // Warm pools whose refill the host holds, from its last heartbeat.
  repeated HeldRefill held_refills = 10;
  // Workspace that owns the host and is the only one whose jobs it runs; empty
  // for a shared host.
  string owner_tenant = 11;
  // The host's agent is draining before a stop: it takes no new jobs. On an
  // offline host: the host was draining when it went offline.
  bool stopping = 12;
  // The cloud the host runs in when it is a cloud host ("aws"); empty
  // otherwise.
  string cloud = 13;
  // An overflow host takes a job only when no other host the job may use has
  // room and the job has queued for its plan's overflow_after.
  bool overflow = 14;
  // The host's public egress addresses.
  HostEgress egress = 15;
  // The version the host's agent reported when it last registered; empty when unknown.
  string agent_version = 16;
  // Whether agent_version is inside the promise between this control plane and its agents.
  AgentVersionStatus agent_version_status = 17;
  // Why agent_version is outside the promise; empty unless agent_version_status is SKEW.
  string agent_version_skew = 18;
  // True when the host is offline and its last heartbeat is older than the
  // control plane's reaper.long_offline_after.
  bool long_offline = 19;
  // Why the control plane refused the host's last heartbeat: the field that
  // was refused, with its size and the limit when it was over one, or that
  // it holds a control character. Empty once a
  // heartbeat of the host is taken. ListHosts sets it. The control plane
  // keeps it in memory: after its restart the field is empty until the
  // host's next heartbeat.
  string heartbeat_refusal = 20;
  // When that heartbeat was refused; unset when heartbeat_refusal is empty.
  google.protobuf.Timestamp heartbeat_refused_at = 21;
  // The host's tier: "container" for a container tier host,
  // which runs its owner's jobs in Sysbox containers that share its kernel;
  // empty for a host that runs each job in a VM.
  string tier = 22;
  // When the operator revoked the host; unset for a host that is
  // not revoked. A revoked host is offline for good and never registers
  // again under its ID.
  google.protobuf.Timestamp revoked_at = 23;
  // The memory limit, in MiB, the host's agent reported at its last answered
  // heartbeat (toshi.agent.v1.MemoryLimit). 0 when it reports none or a
  // limit of 0, as an agent without a limit, one whose cgroup stopped
  // limiting, or one that predates the report does.
  int64 memory_limit_mib = 24;
  // Where that limit comes from: "memory_limit_mib" when the operator set it
  // in the agent configuration, or "cgroup:<dir>" for the cgroup memory.max
  // the agent discovered. Empty when memory_limit_mib is 0.
  string memory_limit_source = 25;
  // The minimum agent release the control plane admits when
  // agent_version_status is BELOW_MINIMUM; empty otherwise.
  string agent_version_minimum = 26;
}

// HostEgress is the public addresses a host's jobs reach the internet from.
message HostEgress {
  // IPv4 or IPv6 addresses or CIDR prefixes, sorted; empty unless source is
  // EGRESS_SOURCE_CONFIGURED or EGRESS_SOURCE_DISCOVERED.
  repeated string ips = 1;
  EgressSource source = 2;
  // When the addresses last changed; unset when they never did.
  google.protobuf.Timestamp changed_at = 3;
}

// EgressSource says where a host's egress addresses come from.
enum EgressSource {
  // The host never reported them: its agent predates egress reporting.
  EGRESS_SOURCE_UNSPECIFIED = 0;
  // Set by the operator: network.egress_ips on the agent, or egress_ips on
  // a cloud host.
  EGRESS_SOURCE_CONFIGURED = 1;
  // Found by the agent through an HTTPS echo service, re-checked hourly.
  EGRESS_SOURCE_DISCOVERED = 2;
  // The agent has neither addresses set nor an echo service that answered.
  EGRESS_SOURCE_UNKNOWN = 3;
  // A cloud host without egress_ips: each job's instance has its own public
  // address.
  EGRESS_SOURCE_PER_JOB = 4;
}

message ListJobsRequest {
  // Jobs in any of these states; empty matches every state.
  repeated JobState states = 1;
  // Empty matches every workspace.
  string tenant = 2;
  // The repository as "owner/name"; empty matches every repository.
  string repository = 3;
  // The most jobs in one page; zero lets the server choose.
  int32 page_size = 4;
  // Only the job of this Workspace API workload. Within one workspace a workload
  // has at most one job, and a service workload has none. The job is returned
  // whatever its state, unless states excludes it.
  string workload_id = 5;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 6;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetJobRequest {
  string id = 1;
}

message GetJobResponse {
  Job job = 1;
}

// AuditEvent is one append-only audit log entry.
message AuditEvent {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // operator, session, system or webhook.
  string actor_kind = 3;
  // The operator or enrollment token's id (never its value), the session's
  // GitHub login, or a system or webhook source name.
  string actor_id = 4;
  // Empty when the event is not tied to a workspace.
  string tenant = 5;
  string action = 6;
  // A "<kind>:<id>" string such as job:..., host:..., token:..., plan:...,
  // workspace:... or installation:....
  string target = 7;
  // A JSON object whose keys depend on the action.
  string details_json = 8;
  string request_id = 9;
}

// ListAuditEventsRequest selects the audit events to return.
message ListAuditEventsRequest {
  // Only this workspace's events; empty matches every workspace.
  string tenant = 1;
  // Only this action; empty matches every action.
  string action = 2;
  // Only events at or after this time; unset is unbounded.
  google.protobuf.Timestamp since = 3;
  // The most events in one page; zero lets the server choose.
  int32 page_size = 4;
  reserved 5;
  reserved "before_id";
  // Only events whose actor_id is exactly this: the id without the kind (a
  // token id, a GitHub login or user id, a source name). Empty matches
  // every actor.
  string actor = 6;
  // Only events whose action is one of these; empty matches every action.
  // Setting both action and actions fails with INVALID_ARGUMENT, and so do
  // an empty entry and more than 100 entries.
  repeated string actions = 7;
  // Only events whose target is exactly this, in full: "<kind>:<id>", for
  // example "job:<id>". Empty matches every target.
  string target = 8;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 9;
}

message ListAuditEventsResponse {
  // Newest first.
  repeated AuditEvent events = 1;
  reserved 2;
  reserved "next_before_id";
  // Empty on the last page.
  string next_page_token = 3;
}

message ListHostsRequest {
  // Hosts in any of these states; empty matches every state.
  repeated HostState states = 1;
  // Leave out revoked hosts.
  bool exclude_revoked = 2;
  // The most hosts in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

message ListHostsResponse {
  repeated Host hosts = 1;
  // The control plane's reaper.long_offline_after: a host whose last heartbeat
  // is older, and that is offline, has long_offline set.
  google.protobuf.Duration long_offline_after = 2;
  // The minimum agent release (agent_auth.minimum_agent_version)
  // of the control plane process that answered, which it compared the
  // hosts' agent_version_status with; empty when unset. Operators only.
  string minimum_agent_version = 3;
  // Empty on the last page.
  string next_page_token = 4;
}

message ListHostStorageRequest {
  // The host whose volumes to list.
  string host_id = 1;
  // The most volumes in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListHostStorageResponse {
  repeated HostVolume volumes = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// HostVolume is one volume a host holds.
message HostVolume {
  // The volume's id.
  string volume_id = 1;
  // The volume's workspace.
  string tenant = 2;
  // The name of the project the volume belongs to.
  string project = 3;
  // The id of the project the volume belongs to.
  string project_id = 4;
  // The volume's name.
  string name = 5;
  // The volume's mode name: cache, seed, state or artifact.
  string mode = 6;
  // The most the volume holds, in bytes.
  int64 size_cap_bytes = 7;
  // The host keeps the volume's warm copy.
  bool warm_copy = 8;
  // The open claim of a job on this host; empty when none.
  string claim_id = 9;
  // The claiming job.
  string job_id = 10;
  // When the claim was taken.
  google.protobuf.Timestamp claimed_at = 11;
}

message SetHostStateRequest {
  string id = 1;
  // HOST_STATE_DRAINING or HOST_STATE_ONLINE.
  HostState state = 2;
}

message SetHostStateResponse {
  // The host as stored after the change.
  Host host = 1;
}

message SetHostOverflowRequest {
  string host_id = 1;
  bool overflow = 2;
}

message SetHostOverflowResponse {
  // The host as stored after the change.
  Host host = 1;
}

message RetireHostRequest {
  string id = 1;
}

message RetireHostResponse {}

message RevokeHostRequest {
  string id = 1;
}

message RevokeHostResponse {
  // The host as stored after the call.
  Host host = 1;
  // False when the host was already revoked: the first revocation stands.
  bool revoked = 2;
  // The IDs of the jobs this call failed with host_revoked.
  repeated string ended_job_ids = 3;
}

// OfflineHostOutcome says what RetireOfflineHosts did or would do for one host.
enum OfflineHostOutcome {
  OFFLINE_HOST_OUTCOME_UNSPECIFIED = 0;
  // Removed when apply was set, otherwise would be removed.
  OFFLINE_HOST_OUTCOME_RETIRE = 1;
  // Kept: a job is still assigned to it, starting or running on it.
  OFFLINE_HOST_OUTCOME_SKIPPED_JOB = 2;
  // Kept: a workspace owns it and include_owned is not set.
  OFFLINE_HOST_OUTCOME_SKIPPED_OWNED = 3;
}

message RetireOfflineHostsRequest {
  // offline_longer_than is required and must be positive.
  google.protobuf.Duration offline_longer_than = 1;
  bool include_owned = 2;
  bool apply = 3;
}

message RetireOfflineHostsResponse {
  // The host with the oldest last heartbeat first.
  repeated OfflineHostResult hosts = 1;
}

message OfflineHostResult {
  Host host = 1;
  OfflineHostOutcome outcome = 2;
}

// CloudHost is the AWS account behind a workspace-owned host the control plane
// drives.
message CloudHost {
  // The host row this cloud host belongs to.
  string host_id = 1;
  // The workspace that owns the host.
  string tenant = 2;
  // The cloud provider: "aws" or "gcp".
  string cloud = 3;
  // The region the instances run in; on GCP the zone's region.
  string region = 4;
  // The role in the workspace's account the control plane assumes (AWS).
  string role_arn = 5;
  // The external ID the role's trust policy requires (AWS), or the project
  // metadata must name (GCP); generated by Toshi.
  string external_id = 6;
  // The image the instances boot: an AMI, or a GCE image path.
  string image = 7;
  // The subnet (AWS) or subnetwork (GCP) to launch into; empty means a
  // default subnet or the default network.
  string subnet_id = 8;
  // The security groups of the instances; empty means the VPC default.
  repeated string security_group_ids = 9;
  // Maps a runner size to an instance type, overriding the defaults.
  map<string, string> instance_types = 10;
  // The most vCPUs the host runs at once.
  int32 max_vcpus = 11;
  google.protobuf.Timestamp created_at = 12;
  // Launches spot instances, moving an interrupted job onto on demand once.
  bool spot = 13;
  // The most instances the host runs at once; 0 means no limit.
  int32 max_instances = 14;
  // The most instance-minutes the host runs per UTC day; 0 means no limit.
  int32 max_instance_minutes_per_day = 15;
  // The GCP project and zone the instances run in.
  string project = 16;
  string zone = 17;
  // The workspace's service account the control plane impersonates (GCP).
  string service_account = 18;
  // Where the instances reach the internet: "public" (each gets its own
  // public address) or "nat" (none: the workspace's NAT carries the traffic).
  string egress = 19;
}

// CreateCloudHostRequest names the workspace and the cloud host to register.
message CreateCloudHostRequest {
  // The workspace that owns the host.
  string tenant = 1;
  // The host name; it becomes the host id the same way enrollment does.
  string name = 2;
  // The cloud provider: "aws" (the default) or "gcp".
  string cloud = 3;
  // The AWS region the instances run in (AWS).
  string region = 4;
  // The role in the workspace's account the control plane assumes (AWS).
  string role_arn = 5;
  // The image the instances boot: an AMI (AWS), or a GCE image or family
  // (an image name, family/NAME, or a projects/... path).
  string image = 6;
  // The subnet (AWS) or subnetwork (GCP, a name in the zone's region or
  // regions/R/subnetworks/S) to launch into; empty means a default subnet
  // or the default network.
  string subnet_id = 7;
  // The security groups of the instances; empty means the VPC default.
  repeated string security_group_ids = 8;
  // Maps a runner size to an instance type, overriding the defaults.
  map<string, string> instance_types = 9;
  // The most vCPUs the host runs at once; 0 means 64.
  int32 max_vcpus = 10;
  // Launches spot instances, moving an interrupted job onto on demand once.
  bool spot = 11;
  // The most instances the host runs at once; 0 means no limit.
  int32 max_instances = 12;
  // The most instance-minutes the host runs per UTC day; 0 means no limit.
  int32 max_instance_minutes_per_day = 13;
  // The public addresses the host's instances reach the internet from, when
  // the subnet sends their traffic through fixed ones (a NAT gateway's
  // Elastic IP); empty means each instance's own public address.
  repeated string egress_ips = 14;
  // Register the host as an ordinary own host instead of an overflow host:
  // it then takes the workspace's jobs without waiting for the plan's
  // overflow_after. False, the default, makes an overflow host.
  bool no_overflow = 15;
  // The GCP project and zone the instances run in (GCP).
  string project = 16;
  string zone = 17;
  // The workspace's service account the control plane impersonates (GCP).
  string service_account = 18;
  // Where the instances reach the internet: "public" (the default: each
  // instance gets its own public address) or "nat" (no public address; the
  // subnet routes through the workspace's NAT gateway or Cloud NAT, whose
  // addresses become the host's egress set).
  string egress = 19;
}

// CreateCloudHostResponse carries the host, the trust external id and the
// principal the role must allow.
message CreateCloudHostResponse {
  Host host = 1;
  // The external ID the role's trust policy requires.
  string external_id = 2;
  // The AWS principal the workspace's role must trust (AWS).
  string principal_arn = 3;
  CloudHost cloud_host = 4;
  // The Google principal the workspace's service account must let create
  // tokens for it, with roles/iam.serviceAccountTokenCreator (GCP).
  string gcp_principal = 5;
}

// Workspace owns a plan, an optional concurrency override, and one or more GitHub
// App installations.
message Tenant {
  string id = 1;
  string name = 2;
  // The override; unset when none is set.
  optional int32 concurrency_cap = 3;
  google.protobuf.Timestamp created_at = 4;
  string plan = 5;
  // The cap the scheduler enforces; 0 means unlimited.
  int32 effective_concurrency = 6;
  // active or closed.
  string status = 7;
  // The workspace's jobs wait for its own hosts and never run on shared ones.
  bool own_hosts_only = 8;
  // Monthly spending cap in the smallest unit of the billing currency; 0
  // means none.
  int64 spend_cap_cents = 9;
  // The workspace's own jobs-per-hour limit; 0 means the plan's applies.
  int32 max_jobs_per_hour = 10;
  // The limit the scheduler enforces: the lower of the workspace's and the
  // plan's; 0 means none.
  int32 effective_max_jobs_per_hour = 11;
  // The starter credit granted when the workspace was created; 0 when none.
  int64 starter_credit_cents = 12;
  google.protobuf.Timestamp starter_credit_granted_at = 13;
  // Shared overflow hosts may take the workspace's jobs; its own overflow hosts
  // always may.
  bool allow_overflow = 14;
  // Whether the workspace's dispatch fillers, its cache-warming workflows,
  // run on idle capacity.
  bool allow_cache_warm = 15;
  // The workspace's effective reservations on shared hosts, ordered
  // by size: its own rows, and its plan's entries where it has none.
  repeated Reservation reservations = 16;
  // Lifecycle state: "active"; "suspended", where new and queued jobs are
  // held, running jobs finish and the workspace is read-only; "deleting", once
  // purge_after has passed and while the purge runs; or "deleted", when the
  // purge is done, its sessions ended and its tokens revoked.
  string state = 17;
  // Why the operator suspended or deleted the workspace; empty when active.
  string state_reason = 18;
  // When the workspace entered its state; unset for a workspace always active.
  google.protobuf.Timestamp state_since = 19;
  // When a scheduled deletion purges the workspace; unset when none.
  google.protobuf.Timestamp purge_after = 20;
  // Days of finished job history the workspace keeps; unset when the plan's
  // applies. 0 keeps forever.
  optional int32 history_days = 21;
  // The period the retention pass uses: the workspace's value when set, else
  // its plan's.
  int32 history_days_effective = 22;
  // Whether Toshi cancels the workflow run of a job whose VM is gone, so
  // GitHub shows it within seconds as cancelled; off keeps GitHub's own
  // failure, about 10 minutes later.
  bool cancel_run_on_vm_death = 23;
  // The workspace's own limits; unset when its plan's applies. 0 is no cap.
  optional int32 secret_max_sets = 24;
  optional int32 secret_max_keys = 25;
  optional int64 secret_max_kib = 26;
  optional int32 preview_max_ports = 27;
  // The limits Toshi enforces: the workspace's own value when set, else its
  // plan's. 0 is no cap.
  int32 secret_max_sets_effective = 28;
  int32 secret_max_keys_effective = 29;
  int64 secret_max_kib_effective = 30;
  int32 preview_max_ports_effective = 31;
}

// Reservation is a workspace's floor of slots jobs of one runner size on shared
// hosts, warm of them on warm VMs.
message Reservation {
  // A runner size, as a runs-on label.
  string size = 1;
  // How many slots are reserved; at least 1.
  int32 slots = 2;
  // How many of the slots are kept on warm VMs; 0 when none.
  int32 warm = 3;
  // "tenant" when the workspace's own row set it, "plan" when its plan did.
  string source = 4;
}

message CreateWorkspaceRequest {
  // The workspace's name, as ListTenants shows it; surrounding spaces are
  // dropped.
  string name = 1;
  // The plan; empty for the control plane's default_plan.
  string plan = 2;
}

message CreateWorkspaceResponse {
  Tenant workspace = 1;
}

message GetWorkspaceRequest {
  string id = 1;
}

message GetWorkspaceResponse {
  Tenant workspace = 1;
}

message ListTenantsRequest {
  // The most workspaces in one page; zero lets the server choose.
