message SetTenantLimitsRequest {
  string tenant = 1;
  optional int32 secret_max_sets = 2;
  optional int32 secret_max_keys = 3;
  optional int64 secret_max_kib = 4;
  optional int32 preview_max_ports = 5;
  // Limits to clear, by name ("secret_max_sets", "secret_max_keys",
