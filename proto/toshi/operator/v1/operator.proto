message SetTenantOwnHostsOnlyRequest {
  string id = 1;
  bool own_hosts_only = 2;
}

message SetTenantOwnHostsOnlyResponse {
  Tenant tenant = 1;
}

message SetTenantAllowOverflowRequest {
  string id = 1;
  bool allow_overflow = 2;
}

message SetTenantAllowOverflowResponse {
  Tenant tenant = 1;
}

message SuspendTenantRequest {
  string id = 1;
  string reason = 2;
}

message SuspendTenantResponse {
  Tenant tenant = 1;
}

message ResumeTenantRequest {
  string id = 1;
  string reason = 2;
}

message ResumeTenantResponse {
  Tenant tenant = 1;
}

message DeleteTenantRequest {
  string id = 1;
  string reason = 2;
  int64 grace_seconds = 3;
  bool now = 4;
