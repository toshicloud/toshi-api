}

message SetTenantSpendLimitsResponse {
  Tenant tenant = 1;
}

message Plan {
  string name = 1;
  int32 concurrency = 2;
  int32 max_job_minutes = 3;
  bool is_default = 4;
  // Whether a workspace can buy this plan through Checkout: self-serve billing
  // is on and exactly one lookup key in billing.plan_map maps to the plan.
  bool self_serve = 5;
  // Operating systems the plan allows; empty means every OS.
  repeated string allowed_os = 6;
  // Largest runner size the plan allows, as a runs-on label; empty means any
  // size.
  string max_size = 7;
  // vCPUs a workspace may have in assigned, starting or running jobs at once; 0
  // means no cap.
  int32 max_vcpu = 8;
  // Minutes a workspace may run each UTC calendar month without a verified card;
  // 0 means the plan has no allowance.
  int32 free_minutes_per_month = 9;
  // Runs-on labels the plan admits under allowed_os, max_size and max_vcpu.
  // A size whose OS is in card_required_for also needs a verified card.
  repeated string sizes = 10;
  // OSes that require a verified payment card; empty when billing is off.
  repeated string card_required_for = 11;
  // Jobs on shared hosts a workspace may start per 60 minutes; 0 means no
  // limit.
  int32 max_jobs_per_hour = 12;
  // Queued jobs of one workflow run that may wait for a host at once; the
  // rest wait as burst_guard. 0 means off.
  int32 burst_guard_jobs = 13;
  // Credit a new workspace on this plan gets once, in the smallest currency
  // unit; 0 means none.
  int64 starter_credit_cents = 14;
  // Days of finished job history workspaces on this plan keep; 0 keeps forever.
  // Left out of configuration, 90.
  int32 history_days = 15;
  // Longest debug session, in minutes, a failed job on this plan may ask
  // for with a toshi-debug-<n> label; 0 means the plan has no debug
  // sessions.
  int32 debug_minutes = 16;
  // Hosts a workspace on this plan may own at once, cloud hosts included; 0
  // means no limit. Left out of configuration, 20.
  int32 max_own_hosts = 17;
  // Whether the plan is the open-source tier: its workspaces' jobs
  // pass the open-source gate.
  bool open_source = 18;
}

message ListOperatorAlertsRequest {
  // The most alerts in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListOperatorAlertsResponse {
  repeated OperatorAlert alerts = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message ListHostAlertsRequest {
  // Optional: only this workspace.
  string tenant = 1;
  // The most alerts in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

message ListHostAlertsResponse {
  repeated OperatorAlert alerts = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// OperatorAlert is one raised operator alert.
message OperatorAlert {
  // kind is the alert, such as "runner_exits_without_job".
  string kind = 1;
  // raised_at is when it was raised; since is the first event it counts.
  google.protobuf.Timestamp raised_at = 2;
  google.protobuf.Timestamp since = 3;
  // count is the events counted from since, and reasons the same events by
  // reason; top_reason has the most.
  int64 count = 4;
  map<string, int64> reasons = 5;
  string top_reason = 6;
  // message says the same in one line.
  string message = 7;
  // The workspace whose own hosts raised the alert. Empty for an operator alert.
  string tenant = 8;
}

message ListPlansRequest {
  // The most plans in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListPlansResponse {
  repeated Plan plans = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string commit = 2;
  string date = 3;
  // The oldest agent release this control plane process admits at Register
  // (agent_auth.minimum_agent_version); empty when unset, which
  // admits every agent. Each process reads its own configuration.
  string minimum_agent_version = 4;
}

message SetTenantPlanRequest {
  string id = 1;
  string plan = 2;
}

message SetTenantPlanResponse {
  Tenant tenant = 1;
}

// GetUsageRequest selects the jobs to count. A job is in the window when its
// queued_at is at or after from and before to.
message GetUsageRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
  // Only this workspace's jobs. Empty matches every workspace.
  string tenant = 3;
}

message GetUsageResponse {
  // Ordered by workspace, then day, then conclusion, then outcome, then kind. A
  // window with neither matching jobs nor reserved hours has no rows.
  repeated UsageRow rows = 1;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Filler jobs that finished in the window, by workspace. They are
  // not billed and not in rows.
  repeated FillerUsage filler = 4;
}

// FillerUsage counts one workspace's filler jobs: runs its dispatch fillers
// started on shared room. Not billed; a plan's filler_minutes_per_day bounds
// them per UTC day.
message FillerUsage {
  string tenant = 1;
  int64 jobs = 2;
  // Each job's duration rounded up to whole minutes, on any host.
  int64 minutes = 3;
}

// UsageRow counts the jobs of one workspace, UTC day, conclusion, outcome and
// kind.
message UsageRow {
  string tenant = 1;
  // The UTC date of the job's queued_at, as YYYY-MM-DD.
  string day = 2;
  // The job's conclusion as stored, such as "success". Empty for a job with
  // no conclusion yet.
  string conclusion = 3;
  // Number of jobs in this row.
  int64 jobs = 4;
  // Billable minutes of those jobs that did not run on a host their workspace
  // owns: each job that started and finished adds its duration rounded up to
  // whole minutes; other jobs add 0.
  int64 minutes = 5;
  // Minutes of the row's jobs that ran on hosts their workspace owns, rounded as
  // minutes.
  int64 own_host_minutes = 6;
  // The part of minutes and own_host_minutes spent in debug sessions: each
  // job that had one adds its minutes less the minutes up to its session's
  // start, both rounded up, so a job's run and debug parts add up
  // to its minutes.
  int64 debug_minutes = 7;
  // The part of minutes that ran on overflow hosts.
  int64 overflow_minutes = 8;
  // Reserved slot-hours the workspace held in the row's window, on the rows
  // with a conclusion: 0. The reserved hours themselves are in the row with
  // an empty conclusion added for each UTC day that has them.
  int64 reserved_slot_hours = 9;
  // Toshi's own word for the jobs in this row when Toshi ended them itself
  // (the values of Job.outcome); empty for every other row.
  string outcome = 10;
  // The kind of the row's jobs: "job", "sandbox" or "service". Empty on a
  // reserved-hours row.
  string kind = 11;
}

// GetQueueTimesRequest selects the jobs to summarize. A job is in the window
// when its queued_at is at or after from and before to.
message GetQueueTimesRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
  // Only this workspace's jobs. Empty matches every workspace.
  string tenant = 3;
}

message GetQueueTimesResponse {
  // Jobs in the window that reached running (have a started_at).
  int64 jobs = 1;
  // Nearest-rank percentiles and maximum of started_at - queued_at, in whole
  // milliseconds. All 0 when jobs is 0.
  int64 p50_ms = 2;
  int64 p90_ms = 3;
  int64 max_ms = 4;
  // Share of those jobs assigned to a warm instance, from 0 to 1.
  double warm_share = 5;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
  // Time held, from first held to assigned, of the jobs the scheduler held, by
  // the latest reason it held each one. A job never held is in none of them.
  // A reason with only jobs held now has jobs 0.
  repeated HoldTimes held = 8;
}

message HoldTimes {
  // One of the job hold reasons (see Job.hold_reason), as the
  // toshi_jobs_held metric labels them.
  string reason = 1;
  // The jobs held for this reason whose hold ended (they were assigned and started), and their held time in milliseconds (nearest-rank).
  int64 jobs = 2;
  int64 p50_ms = 3;
  int64 p90_ms = 4;
  int64 max_ms = 5;
  // The jobs held for this reason now, whenever they were queued. 0 when
  // the window ends before now.
  int64 open_jobs = 6;
  // Since when the longest-held of them has been held; unset when
  // open_jobs is 0.
  google.protobuf.Timestamp open_since = 7;
}

// GetWorkflowUsageRequest selects the jobs to count. A job is in the window
// when its queued_at is at or after from and before to.
message GetWorkflowUsageRequest {
  // Start of the window, inclusive. Unset: to minus 7 days.
  google.protobuf.Timestamp from = 1;
  // End of the window, exclusive. Unset: now.
  google.protobuf.Timestamp to = 2;
  // Only this workspace's jobs. Empty matches every workspace.
  string tenant = 3;
}

message GetWorkflowUsageResponse {
  // Ordered by minutes, then own_host_minutes, then jobs, each descending,
  // then by workspace, repository and workflow, byte by byte. A window with no
  // jobs has no rows.
  repeated WorkflowUsageRow rows = 1;
  // The window used, with the defaults filled in.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

// WorkflowUsageRow counts the jobs of one workspace, repository and workflow.
// Its jobs are the ones GetUsage counts, and their minutes are counted as
// in UsageRow.
message WorkflowUsageRow {
  string tenant = 1;
  // The repository, as owner/name.
  string repository = 2;
  // The workflow's name from the job's workflow_job webhook. Empty for jobs
  // stored without one.
  string workflow = 3;
  // Number of jobs in this row.
  int64 jobs = 4;
  // Billable minutes, as UsageRow.minutes.
  int64 minutes = 5;
  // Minutes on hosts the workspace owns, as UsageRow.own_host_minutes.
  int64 own_host_minutes = 6;
  // Jobs whose conclusion is "failure" or whose outcome is "failed".
  int64 failed_jobs = 7;
  // Jobs that started and finished: the ones the percentiles are over.
  int64 timed_jobs = 8;
  // Nearest-rank percentiles of those jobs' run times, from started_at to
  // the stop request, or to finished_at when there was none, each rounded
  // up to a whole second. Both 0 when timed_jobs is 0.
  int64 p50_seconds = 9;
  int64 p95_seconds = 10;
}

message GetCapacityRequest {}

message GetCapacityResponse {
  // One row per runner size that has a pool, free slots or a reservation,
  // ordered by size. Slots free count shared regular hosts, reserved capacity
  // excluded.
  repeated CapacitySize sizes = 1;
  // One row per reservation, ordered by workspace then size.
  repeated CapacityReservation reservations = 2;
  // When the scheduler pass that left this view ran.
  google.protobuf.Timestamp observed_at = 3;
}

message CapacitySize {
  string size = 1;
  // Slots shared regular hosts could still start jobs of this size.
  int32 free_slots = 2;
  // Slots reserved for workspaces of this size; free_slots excludes them.
  int32 reserved_slots = 3;
  // Reserved slots the workspaces' own jobs of the size hold.
  int32 in_use = 4;
  // Reserved slots kept free at the end of the pass.
  int32 earmarked = 5;
  // Reserved slots the fleet had no room for.
  int32 short = 6;
  // Warm VMs of this size ready for a job on online hosts, as their last
  // heartbeats reported; reserved ones included.
  int32 warm = 7;
}

message CapacityReservation {
  string tenant = 1;
  string size = 2;
  // The reservation.
  int32 slots = 3;
  int32 warm = 4;
  // The workspace's jobs of the size on shared regular hosts.
  int32 in_use = 5;
  // Slots kept free at the end of the pass, warm_earmarked of them on warm
  // VMs.
  int32 earmarked = 6;
  int32 warm_earmarked = 7;
  // Slots the fleet had no room for.
  int32 short = 8;
}

message GetTenantBillingRequest {
  string id = 1;
  // How many UTC months of usage to return, the current one included.
  // 0 means 2; at most 12.
  int32 months = 2;
}

message GetTenantBillingResponse {
  TenantBilling billing = 1;
}

message GetTenantStatementRequest {
  string id = 1;
  // The UTC month as YYYY-MM. Empty: the current month.
  string month = 2;
  // Also return the statement as CSV, as `toshi workspace statement get
  // --csv` writes it.
  bool csv = 3;
}

message GetTenantStatementResponse {
  TenantStatement statement = 1;
  // The statement as CSV with a header row, when the request asked for it.
  string csv = 2;
}

message TenantStatement {
  string tenant = 1;
  // The month as YYYY-MM, and its bounds: from inclusive, to exclusive.
  string month = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // The plans the month's metered minutes were recorded at, comma-separated;
  // the workspace's plan today when no minute has a recorded price.
  string plan = 5;
  // The jobs that finished in the month, by runner size and OS, counted as
  // GetUsage counts them.
  repeated StatementUsage usage = 6;
  // The sum of usage; its size and os are empty.
  StatementUsage total = 7;
  // The minutes metered to the billing provider for the month, by the size
  // they were recorded under, with their estimated cost.
  repeated StatementCharge charges = 8;
  // The estimated cost of every charge, rounded up once, in the smallest
  // unit of currency: each job at the price recorded for it when it
  // finished, and minutes with none at today's prices. Leaves out the
  // plan's own price and any credit.
  int64 estimated_cents = 9;
  // Empty when the prices are unknown.
  string currency = 10;
  // False when some minutes have no recorded price and the billing
  // provider's prices have not been read: those minutes' amounts are 0.
  bool estimate_known = 11;
  // The starter credit put on the customer's balance in the month; 0 and
  // unset when it was not applied in it.
  int64 starter_credit_applied_cents = 12;
  google.protobuf.Timestamp starter_credit_applied_at = 13;
  // Held time, from first held to assigned, of the jobs queued in the month
  // that reached running, by the latest reason each was held.
  repeated HoldTimes held = 14;
  // The metered minutes with no recorded price, estimated at today's
  // prices: finished jobs not yet in the usage outbox, and usage from
  // before prices were recorded.
  int64 current_price_minutes = 15;
  // The workspace's filler jobs that finished in the month: not billed, not in
  // usage or charges. Unset when there were none.
  FillerUsage filler = 16;
  // True when a billing provider is configured; false means nothing is metered or charged.
  bool billing_enabled = 17;
  // When the month's estimated spend first reached the workspace's spending
  // cap; unset when it did not.
  google.protobuf.Timestamp spend_cap_reached_at = 18;
  // The cap that was reached, in the smallest unit of currency; 0 when it
  // was not.
  int64 spend_cap_reached_cents = 19;
  // The workspace's spending cap when the statement was built; 0 when none.
  int64 spend_cap_cents = 20;
}

message StatementUsage {
  string size = 1;
  string os = 2;
  int64 jobs = 3;
  // Billable minutes on shared hosts, rounded up per job.
  int64 minutes = 4;
  // Minutes on the workspace's own hosts, which are not billed.
  int64 own_host_minutes = 5;
  // The part of minutes and own_host_minutes spent in debug sessions.
  int64 debug_minutes = 6;
  // The part of minutes that ran on overflow hosts.
  int64 overflow_minutes = 7;
  // Reserved slot-hours the workspace held for this size in the statement's
  // window. A size with reserved hours but no finished job still
  // gets a row, with zero minutes.
  int64 reserved_slot_hours = 8;
  // Toshi's own word for the jobs in this entry when Toshi ended them
  // itself (the values of Job.outcome); empty for every other entry.
  string outcome = 9;
}

message StatementCharge {
  // Empty for usage recorded without a size, priced at the plan's highest
  // per-minute price.
  string size = 1;
  int64 minutes = 2;
  // The minutes at their recorded prices, or today's for minutes with none,
  // rounded up.
  int64 estimated_cents = 3;
}

message SetTenantBillingCustomerRequest {
  string id = 1;
  // Empty clears the customer id and billing start.
  string customer_id = 2;
}

message SetTenantBillingCustomerResponse {
  TenantBilling billing = 1;
}

message CreateCheckoutSessionRequest {
  string id = 1;
  string plan = 2;
}

message CreateCheckoutSessionResponse {
  // The provider's hosted Checkout URL to send the browser to.
  string url = 1;
}

message CreateBillingPortalSessionRequest {
  string id = 1;
}

message CreateBillingPortalSessionResponse {
  // The provider's hosted Customer Portal URL to send the browser to.
  string url = 1;
}

// CancelJobRequest names the job to cancel.
message CancelJobRequest {
  // Toshi's job id.
  string job_id = 1;
}

// CancelJobResponse carries the job after the cancel.
message CancelJobResponse {
  Job job = 1;
}

// StopJobDebugRequest names the job whose debug session ends.
message StopJobDebugRequest {
  // Toshi's job id.
  string job_id = 1;
}

// StopJobDebugResponse carries the job after the stop.
message StopJobDebugResponse {
  Job job = 1;
}

// GetJobDebugAccessRequest names the debugging job.
message GetJobDebugAccessRequest {
  // Toshi's job id.
  string job_id = 1;
}

// GetJobDebugAccessResponse is the way into a debugging job's guest.
message GetJobDebugAccessResponse {
  // The guest's login user.
  string user = 1;
  // The session's ed25519 private key in OpenSSH format. It is returned
  // only here, once per session.
  bytes private_key = 2;
  // The relay's path on the control plane, "/debug/<job id>/ssh". A GET
  // with "Connection: Upgrade" and "Upgrade: toshi-debug-ssh", carrying
  // the same credentials as this call, becomes a byte stream to the
  // guest's ssh server.
  string relay_path = 3;
  // When the session ends.
  google.protobuf.Timestamp expires_at = 4;
}

// TenantBilling is a workspace's billing link, its subscription's status and the
// usage reported to the billing provider.
message TenantBilling {
  // Empty when the workspace is not linked to a customer.
  string customer_id = 1;
  // Empty when no subscription has set the plan.
  string subscription_id = 2;
  // When billable usage begins; unset when the workspace is not billed.
  google.protobuf.Timestamp billing_started_at = 3;
  // Always unset: the hourly export ledger is no longer read. Usage is in
  // totals and failed_events.
  BillingExport last_export = 4 [deprecated = true];
  // The provider's status of the subscription from the last event applied,
  // such as active or past_due; empty when no event has been applied.
  string subscription_status = 5;
  // When the subscription entered subscription_status.
  google.protobuf.Timestamp subscription_status_since = 6;
  // Meter events per UTC month and runner size, newest month first.
  repeated BillingTotals totals = 7;
  // The workspace's failed meter events, most recently failed first, at most 50.
  repeated BillingEventFailure failed_events = 8;
  // Minutes of the workspace's jobs that finished this UTC calendar month, as
  // its statement counts them. The free allowance counts these, with or
  // without a billing customer.
  int64 minutes_this_month = 9;
  // The free minutes per UTC calendar month of the workspace's plan; 0 when the
  // plan has none.
  int64 free_minutes_per_month = 10;
  // Whether the billing customer has a payment method.
  bool card_verified = 11;
  // When Toshi first saw a payment method on the billing customer; unset
  // without one.
  google.protobuf.Timestamp card_verified_at = 12;
  // The spending cap; 0 when none.
  int64 spend_cap_cents = 13;
  // Estimated metered spend this UTC month, rounded up: finished jobs plus
  // what running ones have run so far, at the plan's current prices.
  int64 spend_cents = 14;
  // 0, 80 or 100: the share of the cap spend_cents has reached.
  int32 spend_level = 15;
  // The currency of the plan's prices, lower case; empty when unknown.
  string currency = 16;
  // False when the billing provider's prices are not known yet, so
  // spend_cents means nothing.
  bool spend_known = 17;
  // Starter credit granted, and an estimate of what is left: the credit
  // less the metered spend since billing started.
  int64 starter_credit_cents = 18;
  int64 starter_credit_left_cents = 19;
  // When the credit reached the billing customer; unset before.
  google.protobuf.Timestamp starter_credit_applied_at = 20;
  // True when a billing provider is configured; false means nothing is metered or charged.
  bool billing_enabled = 21;
  // The workspace's jobs held now, by reason, in the order GetQueueTimes lists
  // the reasons.
  repeated HeldJobs held_now = 22;
  // The workspace's jobs that count against its plan concurrency now: assigned,
  // starting, running or debugging, on Toshi's hosts rather than its own, and
  // neither a dispatch filler's job nor an open-source job. This is the count
  // the scheduler checks against the workspace's limit,
  // Tenant.effective_concurrency.
  int64 concurrency_used = 23;
  // HeldJobs counts the jobs held now for one reason.
  message HeldJobs {
    // One of the job hold reasons (see Job.hold_reason).
    string reason = 1;
    int64 jobs = 2;
    // Since when the longest-held of them has been held.
    google.protobuf.Timestamp since = 3;
  }
}

// BillingTotals counts one month's meter events of one runner size by
// delivery state. A month or size without events is left out.
message BillingTotals {
  // The UTC month the jobs finished in, as YYYY-MM.
  string month = 1;
  // The runner size; empty for events recorded before sizes were.
  string size = 2;
  int64 sent_events = 3;
  int64 sent_minutes = 4;
  int64 pending_events = 5;
  int64 pending_minutes = 6;
  int64 failed_events = 7;
  int64 failed_minutes = 8;
}

// BillingEventFailure is a meter event the provider will not be sent again.
message BillingEventFailure {
  string job_id = 1;
  string size = 2;
  string event_name = 3;
  int64 minutes = 4;
  // When the job finished.
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Timestamp failed_at = 6;
  int32 attempts = 7;
  string last_error = 8;
}

// BillingExport is one exported billing period in the ledger.
message BillingExport {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  int64 minutes = 3;
  // Empty when no meter event was sent for the period.
  string provider_event_id = 4;
  google.protobuf.Timestamp exported_at = 5;
}

// TokenKind says what a token grants.
enum TokenKind {
  TOKEN_KIND_UNSPECIFIED = 0;
  // The operator token: the operator API and /metrics.
  TOKEN_KIND_OPERATOR = 1;
  // The enrollment token: registering a host.
  TOKEN_KIND_ENROLLMENT = 2;
  // A workspace API token: the operator API as one workspace.
  TOKEN_KIND_TENANT = 3;
  // A product token: a product's adapter calling the core.
  TOKEN_KIND_PRODUCT = 4;
}

// Token is an operator, enrollment, workspace or product token, without its
// value.
message Token {
  // Token id, such as "tok-1a2b3c4d5e6f".
  string id = 1;
  TokenKind kind = 2;
  // "file" for a token read from the control plane's token file, "rotate"
  // for one made by RotateToken, "tenant" for one made by
  // CreateEnrollmentToken, "session" for a workspace token minted from a
  // dashboard session.
  string source = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset when the token does not expire.
  google.protobuf.Timestamp expires_at = 5;
  // Unset when the token is not revoked.
  google.protobuf.Timestamp revoked_at = 6;
  // Whether the token is accepted now.
  bool active = 7;
  // Workspace the token is scoped to; also set for workspace tokens.
  string tenant = 8;
  // The label the workspace chose; empty for other kinds.
  string name = 9;
  // The project the token is limited to, by name. Empty for a token that
  // acts in the whole workspace.
  string project = 10;
  // The environment of project the token is limited to, by name. Empty
  // when the token acts in every environment of its project.
  string environment = 11;
  // The product a product token is for; empty for other kinds.
  string product = 12;
}

// ListTokensRequest optionally narrows the list to one kind and one workspace.
message ListTokensRequest {
  // TOKEN_KIND_UNSPECIFIED lists every kind.
  TokenKind kind = 1;
  // Only this workspace's tokens; empty lists every token.
  string tenant = 2;
  // The most tokens in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

// ListTokensResponse carries the tokens, oldest first.
message ListTokensResponse {
  repeated Token tokens = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

// RotateTokenRequest names the kind to rotate and how long the old tokens
// keep working.
message RotateTokenRequest {
  TokenKind kind = 1;
  // Seconds the kind's other active tokens keep working, at most 30 days.
  // Unset means 24 hours; 0 ends them at once.
  optional int64 grace_seconds = 2;
}

// RotateTokenResponse carries the new token and its value.
message RotateTokenResponse {
  Token token = 1;
  // The new token. It is returned only here.
  string value = 2;
}

// RevokeTokenRequest names the token to revoke.
message RevokeTokenRequest {
  string id = 1;
}

// RevokeTokenResponse carries the revoked token.
message RevokeTokenResponse {
  Token token = 1;
  // How many hosts were signed out and must register again.
  int32 hosts_signed_out = 2;
}

// CreateEnrollmentTokenRequest names the workspace to enroll hosts for.
message CreateEnrollmentTokenRequest {
  string tenant = 1;
  // Hosts that enroll with the token register as overflow hosts.
  bool overflow = 2;
}

// CreateEnrollmentTokenResponse carries the new token and its value.
message CreateEnrollmentTokenResponse {
  Token token = 1;
  // The new token. It is returned only here.
  string value = 2;
}

message CreateTenantTokenRequest {
  string tenant = 1;
  string name = 2;
  // Unset means the token never expires.
  google.protobuf.Timestamp expires_at = 3;
  // Limits the token to this project of the workspace, by name. Empty makes
  // a token for the whole workspace.
  string project = 4;
  // Limits the token further to this environment of project, by name.
  // Needs project.
  string environment = 5;
}

message CreateTenantTokenResponse {
  Token token = 1;
  // The new token. It is returned only here.
  string value = 2;
}

message CreateProductTokenRequest {
  string product = 1;
  // Unset means 90 days from now.
  google.protobuf.Timestamp expires_at = 2;
}

message CreateProductTokenResponse {
  Token token = 1; // The new token. It is returned only here.
  string value = 2;
}

message ListEgressIPsRequest {
  string tenant = 1;
  // The most hosts in one page; zero lets the server choose.
  int32 page_size = 2;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 3;
}

// ListEgressIPsResponse lists the addresses to allowlist and the hosts they
// come from.
message ListEgressIPsResponse {
  // Every address of the hosts of every page with known addresses, sorted
  // and without repeats. Every page holds all of them.
  repeated string ips = 1;
  // The hosts the workspace's jobs can land on, ordered by kind (own hosts
  // first) and ID.
  repeated EgressHost hosts = 2;
  // False when some host of any page has addresses that are unknown or
  // change per job, so ips may not cover every job.
  bool complete = 3;
  // Empty on the last page.
  string next_page_token = 4;
}

// EgressHost is one host a workspace's jobs can land on.
message EgressHost {
  // The host's id and name. A member's answer, from the Workspace API,
  // leaves them empty for a shared host.
  string host_id = 1;
  string name = 2;
  // The host is shared between workspaces rather than the workspace's own.
  bool shared = 3;
  HostEgress egress = 4;
  // For an EGRESS_SOURCE_PER_JOB host: the addresses its jobs ran from in
  // the last 7 days, sorted.
  repeated string recent_ips = 5;
  // The host's cloud ("aws"), empty for a host with an agent.
  string cloud = 6;
  // For a cloud host: "public" or "nat".
  string cloud_egress = 7;
  // For a "nat" cloud host: a job echoed one of the host's addresses in the
  // last 7 days. Until then the response is not complete, and recent_ips
  // shows what jobs echoed.
  bool confirmed = 8;
}

message CheckCloudHostRequest {
  string host_id = 1;
}

message CheckCloudHostResponse {
  // One row per check, in the order they ran.
  repeated CloudHostCheck checks = 1;
}

// CloudHostCheck is the outcome of one cloud host check.
message CloudHostCheck {
  // What was checked, for example "assume role" or "ec2:RunInstances".
  string name = 1;
  CloudHostCheckStatus status = 2;
  // What was found, or what to fix. It never holds credentials.
  string detail = 3;
}

// CloudHostCheckStatus is how a cloud host check came out.
enum CloudHostCheckStatus {
  CLOUD_HOST_CHECK_STATUS_UNSPECIFIED = 0;
  CLOUD_HOST_CHECK_STATUS_OK = 1;
  // Works, but something deserves a look.
  CLOUD_HOST_CHECK_STATUS_WARN = 2;
  // Fails: jobs on the host would fail too.
  CLOUD_HOST_CHECK_STATUS_FAIL = 3;
  // Not run, because an earlier check failed or nothing could be tested.
  CLOUD_HOST_CHECK_STATUS_SKIPPED = 4;
}

// Filler is low-priority work Toshi runs only on capacity above the warm
// pool targets, and stops the moment a job needs the room.
message Filler {
  // Unique among the fillers with the same workspace; lowercase letters, digits
  // and dashes, at most 40 characters, starting with a letter or digit.
  string name = 1;
  // "command": a command in a VM; "dispatch": a workflow_dispatch of a
  // workspace's workflow, run as a filler job.
  string kind = 2;
  // The runner size of the VM.
  string size = 3;
  // Run only on hosts whose pool for the size has nested KVM.
  bool nested_kvm = 4;
  // command: the command the guest runs, as argv.
  repeated string command = 5;
  // command: the name of the agents' [filler] shares entry mounted in the
  // guest at /mnt/toshi-share. Empty: none.
  string share = 6;
  // dispatch: the workspace whose installation dispatches the workflow. With
  // the name it is the filler's key; a command filler has no workspace.
  string tenant = 7;
  // dispatch: the repository, as "owner/name".
  string repository = 8;
  // dispatch: the workflow's file name, for example "warm-cache.yml".
  string workflow = 9;
  // dispatch: the branch or tag to run it on. Empty: the repository's
  // default branch.
  string ref = 10;
  // How long after a run completes or fails the next may start. Default
  // 24 hours.
  google.protobuf.Duration every = 11;
  // The longest one run may take. Default 2 hours.
  google.protobuf.Duration max_duration = 12;
  bool enabled = 13;
  // Where the filler comes from: "config", "operator" or "tenant".
  string source = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // The filler's newest run. Not set before its first.
  FillerRun last_run = 17;
  // Why the scheduler dispatches nothing for this dispatch filler, as the
  // last filler pass that read its states found it: tenant_suspended,
  // tenant_deleting, tenant_deleted, tenant_closed, installation_removed,
  // installation_suspended, installation_ambiguous, budget_spent (the
  // workspace's filler minutes for the UTC day are spent) or budget_off (its
  // plan gives none). Empty: no pause found,
  // or a filler the pass does not evaluate (a disabled one, for example).
  // Set by ListFillers only.
  // Kept in the control plane's memory: empty after a restart until a pass
  // reads the states again.
  string pause_reason = 18;
  // When a filler pass first found the pause. Unset with an empty
  // pause_reason.
  google.protobuf.Timestamp paused_since = 19;
  // When a filler pass last read the filler's states and found
  // pause_reason; unset without one.
  google.protobuf.Timestamp pause_as_of = 20;
}

// FillerRun is one run of a filler.
message FillerRun {
  string id = 1;
  string filler = 2;
  string kind = 3;
  // dispatch: the filler's workspace.
  string tenant = 4;
  // The host the run went to. Empty while a dispatch run waits for its job.
  string host_id = 5;
  // "dispatched", "assigned", "running", "completed", "failed",
  // "preempted", "rejected" or "lost".
  string state = 6;
  // dispatch: Toshi's job ID of the filler job, once its webhook arrived.
  string job_id = 7;
  // dispatch: GitHub's workflow run ID.
  int64 run_id = 8;
  // command: the command's exit code, once completed.
  int32 exit_code = 9;
  string error = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
}

// FillerHostMinutes is one host's filler minutes.
message FillerHostMinutes {
  string host_id = 1;
  double minutes = 2;
}

message ListFillersRequest {
  // The most fillers in one page; zero lets the server choose.
  int32 page_size = 1;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 2;
}

message ListFillersResponse {
  repeated Filler fillers = 1;
  // Minutes of filler runs per host that finished in the last 24 hours.
  // Every page holds all of them.
  repeated FillerHostMinutes host_minutes = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

message PutFillerRequest {
  // source, created_at, updated_at, last_run, pause_reason, paused_since and
  // pause_as_of are ignored.
  Filler filler = 1;
}

message PutFillerResponse {
  Filler filler = 1;
}

message DeleteFillerRequest {
  string name = 1;
  // The workspace of a dispatch filler. Empty: a command filler.
  string tenant = 2;
}

message DeleteFillerResponse {}

message SetFillerEnabledRequest {
  string name = 1;
  bool enabled = 2;
  // The workspace of a dispatch filler. Empty: a command filler.
  string tenant = 3;
}

message SetFillerEnabledResponse {
  Filler filler = 1;
}

message ListFillerRunsRequest {
  // Only this filler's runs. Empty: every filler's.
  string filler = 1;
  // The most runs in one page; zero lets the server choose.
  int32 page_size = 2;
  // With filler: the workspace of a dispatch filler. Empty: a command filler.
  string tenant = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

message ListFillerRunsResponse {
  repeated FillerRun runs = 1;
  // The paused dispatch fillers among those the request covers; see
  // Filler.pause_reason. Every page holds all of them.
  repeated FillerPause pauses = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// FillerPause is one paused dispatch filler; see Filler.pause_reason.
message FillerPause {
  string filler = 1;
  // The filler's workspace.
  string tenant = 2;
  // tenant_suspended, tenant_deleting, tenant_deleted, tenant_closed,
  // installation_removed, installation_suspended, installation_ambiguous,
  // budget_spent or budget_off.
  string reason = 3;
  // When a filler pass first found the pause.
  google.protobuf.Timestamp since = 4;
  // When a filler pass last read the states; see Filler.pause_as_of.
  google.protobuf.Timestamp as_of = 5;
}

message SetTenantAllowCacheWarmRequest {
  string id = 1;
  bool allow_cache_warm = 2;
}

message SetTenantAllowCacheWarmResponse {
  Tenant tenant = 1;
}

message SetTenantCancelRunOnVmDeathRequest {
  string id = 1;
  bool cancel_run_on_vm_death = 2;
}

message SetTenantCancelRunOnVmDeathResponse {
  Tenant tenant = 1;
}

message GetJobFailureRequest {
  string job_id = 1;
}

message GetJobFailureResponse {
  string job_id = 1;
  // Toshi's cause in one word, such as "out_of_memory", "time_limit",
  // "vm_died" or "step_failed"; "none" for a job that succeeded and
  // "not_ended" for one that has not ended. The full list: "none",
  // "not_ended", "out_of_memory", "refused", "time_limit", "cancelled",
  // "cancelled_by_tenant", "cancelled_by_operator", "cancelled_by_uninstall",
  // "vm_died", "host_lost", "host_revoked", "stop_unconfirmed",
  // "runner_not_started", "runner_exited", "failed", "too_small",
  // "throttled", "step_failed", "timed_out", "cancelled_on_github" and
  // "unknown".
  string cause = 2;
  // The cause in one sentence. Where the dashboard's Jobs table shows why
  // the job ended, this is the same text. A job that ran out of time with a
  // cold cache or without its cache disk gets a second sentence saying so.
  string explanation = 3;
  // GitHub's conclusion for the job, such as "success" or "failure". Empty
  // when GitHub has not concluded it.
  string conclusion = 4;
  // The same as JobTelemetrySummary.verdict and verdict_reason.
  string verdict = 5;
  string verdict_reason = 6;
  // GitHub's failing step, annotations and note are
  // GitHubService.GetJobFailure's.
  reserved 7, 8, 12;
  reserved "failing_step", "annotations", "github_note";
  // One line on what to do next.
  string what_to_do = 9;
  // The job's page on GitHub, and its page on the dashboard. Each is empty
  // when Toshi does not know it.
  string github_url = 10;
  string dashboard_url = 11;
  // How earlier failures of the same job went when they were re-run on
  // GitHub. Unset for a job that succeeded, has not ended or
  // was refused, and for a job without a name.
  JobFailureHistory history = 13;
  // The job's cache line, as Job.cache.line. Empty when the job's host
  // reported nothing about a cache disk.
  string cache = 14;
  // The job's tier line, as Job.tier_line. Empty for a job that ran in a
  // VM.
  string tier_line = 15;
}

// JobFailureHistory counts the failures of the jobs with the same
// repository and job name, in the last `days` days, whose re-run on
// GitHub passed or failed again. A failure that passed on any re-run
// counts as passed; one with a failed re-run and none passed counts as
// failed again. Toshi re-runs and hides nothing for it.
message JobFailureHistory {
  int32 days = 1;
  int32 passed_on_rerun = 2;
  int32 failed_again = 3;
  // The job's failing step, and the counts of the failures at a step of
  // the same name. Empty and 0 when Toshi knows no failing step.
  string step = 4;
  int32 step_passed_on_rerun = 5;
  int32 step_failed_again = 6;
  // The counts in a sentence or two; it says the failure is likely a
  // flake only when the job failed on its own and passed on re-run at
  // least twice. Empty when every count is 0.
  string sentence = 7;
}

message GetSecretDeliveryRequest {}

message GetSecretDeliveryResponse {
  SecretDelivery delivery = 1;
}

message SetSecretDeliveryRequest {
  bool enabled = 1;
}

message SetSecretDeliveryResponse {
  SecretDelivery delivery = 1;
  // False when the switch already had the value asked for.
  bool changed = 2;
}

// SecretDelivery is the switch for delivering secrets to CI jobs. While it is
// off no CI job is given secrets; while it is on every CI job goes only to
// a ready host, whose agent asks for the job's secrets before its runner
// starts. Grants to workloads work either way.
message SecretDelivery {
  bool enabled = 1;
  // Who last changed the switch, as an audit actor kind and id, and when;
  // empty and unset when it was never changed.
  string changed_by_kind = 2;
  string changed_by_id = 3;
  google.protobuf.Timestamp changed_at = 4;
  // The hosts not revoked whose agent's last registration is not ready for
  // delivery, by id and sorted: the agent did not send the job_start_hook
  // feature, holds CI runners started without the hook, or did not say.
  // On is refused while any is listed.
  repeated string hosts_not_ready = 5;
}

message ListUtilisationRequest {
  // The range's start, moved back to the start of its bucket; required.
  google.protobuf.Timestamp from = 1;
  // The range's end, not included; unset means now. A range of more than
  // 31 days by hour, or 400 days by day or week, fails with
  // INVALID_ARGUMENT.
  google.protobuf.Timestamp to = 2;
  // "pool" (the default) sums each OS pool's shared hosts, overflow hosts
  // left out of the VM-seconds and their jobs counted; "host"
  // gives one series per host and OS.
  string group_by = 3;
  // "hour" (the default), "day" or "week": UTC days, and weeks that start
  // on Monday.
  string bucket = 4;
  // The most rows in one page; zero lets the server choose.
  int32 page_size = 5;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 6;
}

message ListUtilisationResponse {
  // One row per series and bucket that has a stored or counted hour,
  // ordered by bucket start, then OS, then host id.
  repeated UtilisationRow rows = 1;
  // The operator's target band from [utilisation] in the control plane's
  // configuration; unset when not configured.
  UtilisationTarget target = 2;
  // When the rows of the hour in progress were read.
  google.protobuf.Timestamp as_of = 3;
  // The warm VMs' host memory per series, size and bucket that has any,
  // ordered by bucket start, then OS, then size, then host id, all on the
  // first page. A control plane from before this field sends none.
  repeated WarmMemoryRow warm_memory = 4;
  // Empty on the last page.
  string next_page_token = 5;
}

// WarmMemoryRow is the host memory one size's warm VMs held in a bucket,
// by warm path. Grouped by pool, overflow hosts' warm VMs are counted.
message WarmMemoryRow {
  // The bucket's start.
  google.protobuf.Timestamp start = 1;
  // The OS pool: linux, windows or macos.
  string os = 2;
  // The runner size.
  string size = 3;
  // The host, for group_by "host"; empty for "pool".
  string host_id = 4;
  // Whether the bucket holds the hour in progress.
  bool partial = 5;
  // The VMs booted to warm, and those restored from a snapshot.
  WarmPathSummary booted = 6;
  WarmPathSummary restored = 7;
}

// WarmPathSummary is one warm path's VMs in a bucket.
message WarmPathSummary {
  // Warm VM-seconds whose host memory was read; 0 when the path had none.
  int64 vm_seconds = 1;
  // Host memory times time, in MiB-seconds.
  int64 mib_seconds = 2;
  // mib_seconds over vm_seconds, rounded and at most max_mib: the host
  // memory of an average warm VM; 0 without VM-seconds.
  int64 average_mib = 3;
  // The largest host memory one warm VM held in a heartbeat of the
  // bucket.
  int64 max_mib = 4;
}

message UtilisationRow {
  // The bucket's start.
  google.protobuf.Timestamp start = 1;
  // The OS pool: linux, windows or macos.
  string os = 2;
  // The host, for group_by "host"; empty for "pool".
  string host_id = 3;
  // The host's name when its latest hour in the bucket was counted.
  string host_name = 4;
  // Whether the host was an overflow host in its latest hour in the
  // bucket; false for "pool".
  bool overflow = 5;
  // VM-seconds in the bucket: running a job, warm or warming, neither,
  // and the most VMs the hosts could run.
  int64 busy_vm_seconds = 6;
  int64 ready_vm_seconds = 7;
  int64 idle_vm_seconds = 8;
  int64 capacity_vm_seconds = 9;
  // busy_vm_seconds over capacity_vm_seconds; 0 when there is no
  // capacity.
  double utilisation = 10;
  // Jobs that started running, dispatch fillers left out, and those of
  // them assigned as overflow jobs.
  int64 jobs_started = 11;
  int64 overflow_jobs = 12;
  // Whether the bucket holds the hour in progress, so its figures will
  // still grow.
  bool partial = 13;
}

message UtilisationTarget {
  // The band's ends, as fractions of capacity.
  double low = 1;
  double high = 2;
}

message SuggestPoolsRequest {
  // The trace window in days up to now; 0 for 28.
  int32 days = 1;
  // Run again although the window has a result from the current UTC day.
  bool force = 2;
}

message SuggestPoolsResponse {
  // Whether a run is in progress, for which window and since when. A call
  // made during a run starts none.
  bool running = 1;
  int32 running_days = 2;
  google.protobuf.Timestamp running_since = 3;
  // The last run for the window asked; unset when there is none.
  PoolSuggestion last = 4;
  // The bounds every run keeps.
  int32 max_jobs = 5;
  google.protobuf.Duration timeout = 6;
  int32 max_days = 7;
  // The operator's utilisation target band from [utilisation] in the
  // control plane's configuration; unset when not configured.
  UtilisationTarget target = 8;
  // The suggestion kept in the store for the window asked, with its run's
  // times. Set when last is unset, failed or older than it: after a restart,
  // after a run that failed or timed out, or when another control plane
  // process kept a newer one.
  PoolSuggestion kept = 9;
}

// PoolSuggestion is one run's result.
message PoolSuggestion {
  int32 days = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  // Why the run gave no suggestion: it timed out, the window has no
  // finished job, or no host is registered. Empty when it gave one.
  string error = 4;
  // The trace: the finished jobs queued in [from, to). cut is set when the
  // window held more than max_jobs jobs, so from is the oldest kept job's
  // queue time.
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  int32 jobs = 7;
  bool cut = 8;
  // The registered hosts replayed, and those whose agent reports no warm
  // target; the replay reads their pools as 0 warm VMs.
  int32 hosts = 9;
  int32 unreported_hosts = 10;
  // False when no host reports a target: today is then replayed with
  // baseline warm VMs on every pool.
  bool baseline_from_hosts = 11;
  int32 baseline = 12;
  // The search's budget: the p99 start delay every size should meet.
  google.protobuf.Duration budget = 13;
  // Whether every size meets the budget with the suggestion; unmet says
  // why not for each size that does not.
  bool met = 14;
  repeated PoolSuggestionUnmet unmet = 15;
  // The boot and restore delays replayed, per OS.
  repeated PoolSuggestionDelay boot_delays = 16;
  repeated PoolSuggestionDelay restore_delays = 17;
  // One row per size with a job in the trace.
  repeated PoolSuggestionSize sizes = 18;
  // The sizes a host reports a target for and no job in the trace used.
  repeated PoolSuggestionTarget not_in_trace = 19;
}

message PoolSuggestionSize {
  string size = 1;
  int32 jobs = 2;
  // The warm target the hosts that can run the size report, summed: each
  // agent's configured target, not its pool's state. current_reported is
  // false when none of them reports one; unreported_hosts counts those that
  // do not.
  int32 current = 3;
  bool current_reported = 4;
  int32 unreported_hosts = 5;
  // The suggested target, summed over the hosts.
  int32 suggested = 6;
  // The replay's prediction with today's targets and with the suggested.
  PoolSuggestionOutcome today = 7;
  PoolSuggestionOutcome with_suggested = 8;
}

message PoolSuggestionOutcome {
  // The jobs' start delay, queued to running.
  double p50_seconds = 1;
  double p95_seconds = 2;
  // The size's VM time that ran jobs: run time over run time plus idle
  // warm time, as a fraction. Boot and restore time are in neither.
  double utilisation = 3;
}

message PoolSuggestionTarget {
  string size = 1;
  int32 current = 2;
}

message PoolSuggestionUnmet {
  string size = 1;
  string reason = 2;
}

message PoolSuggestionDelay {
  string os = 1;
  double seconds = 2;
  // "measured from N jobs" or "default".
  string source = 3;
}

// StorageProvider is one bucket Toshi keeps objects in. The
// credentials are a reference: an operator row names a file and profile, and
// a workspace row may hold a secret the control plane wrapped, which the API
// reports only as its presence.
message StorageProvider {
  string id = 1;
  // Empty for the operator's own provider.
  string tenant_id = 2;
  string name = 3;
  // "operator", "tenant_bucket" or "local_disk".
  string mode = 4;
  string endpoint = 5;
  string region = 6;
  string bucket = 7;
  string root_prefix = 8;
  bool path_style = 9;
  bool cap_lifecycle = 10;
  bool cap_guest_presign = 11;
  bool cap_global_replication = 12;
  int64 egress_price_micros_per_gb = 13;
  // The shared credentials file and its profile, when that is the
  // reference.
  string credentials_file = 14;
  string credentials_profile = 15;
  // Whether the row holds a wrapped credential; its value is never sent.
  bool credentials_wrapped = 16;
  string role_arn = 17;
  string external_id = 18;
  google.protobuf.Timestamp last_check_at = 19;
  string last_check_error = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

message CreateStorageProviderRequest {
  // Empty registers the operator's own provider.
  string tenant_id = 1;
  string name = 2;
  string mode = 3;
  string endpoint = 4;
  string region = 5;
  string bucket = 6;
  string root_prefix = 7;
  bool path_style = 8;
  bool cap_lifecycle = 9;
  bool cap_guest_presign = 10;
  bool cap_global_replication = 11;
  int64 egress_price_micros_per_gb = 12;
  string credentials_file = 13;
  string credentials_profile = 14;
  string role_arn = 15;
  string external_id = 16;
  // The key of a workspace's own bucket. The control plane wraps it before
  // the row exists and never returns, logs or audits it. Set only with a
  // tenant_id, mode "tenant_bucket" and no credentials_file.
  StorageCredential credential = 17;
}

// StorageCredential is an S3 access key. It is write-only: no response
// carries it.
message StorageCredential {
  string access_key_id = 1;
  string secret_access_key = 2;
  // Set for a temporary key.
  string session_token = 3;
}

message CreateStorageProviderResponse {
  StorageProvider provider = 1;
}

message ListStorageProvidersRequest {
  // Empty lists the operator's providers; otherwise this workspace's.
  string tenant_id = 1;
  // With tenant_id, also answer default_provider.
  bool include_default = 2;
  // The most providers in one page; zero lets the server choose.
  int32 page_size = 3;
  // From an earlier response's next_page_token; empty for the first page.
  string page_token = 4;
}

message ListStorageProvidersResponse {
  repeated StorageProvider providers = 1;
  // With include_default, the operator's provider that serves the workspace's
  // uploads while it has no tenant_bucket provider (the control plane's
  // storage.default_provider); unset when none is configured. Every page
  // holds it.
  StorageProvider default_provider = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

message CheckStorageProviderRequest {
  // The provider to check: one is required.
  oneof target {
    // A saved provider's id.
    string id = 1;
    // A provider that is not saved, as CreateStorageProvider would take
    // it, with its credential.
    CreateStorageProviderRequest provider = 2;
  }
}

message CheckStorageProviderResponse {
  // The saved provider as stored after the check; unset for one that is
  // not saved.
  StorageProvider provider = 1;
  // Whether every step of the check passed.
  bool ok = 2;
  // Why the check failed, naming the step; empty when ok.
  string error = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message DeleteStorageProviderRequest {
  string id = 1;
}

message DeleteStorageProviderResponse {}
